# SonarCloud project configuration for ansible.oci
# Complete documentation: https://docs.sonarsource.com/sonarqube-cloud/

sonar.projectKey=ansible-collections_ansible.oci
sonar.organization=ansible-collections
sonar.projectName=ansible.oci

sonar.sources=.
sonar.tests=tests/unit
sonar.test.inclusions=tests/unit/**
sonar.python.version=3.12
sonar.python.coverage.reportPaths=coverage.xml
sonar.newCode.referenceBranch=main

sonar.exclusions=tests/**,.tox/**,.nox/**

# rules to ignore
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6
# dont require literals when creating empty lists, or dicts
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S7498
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.py

# dont require literals when creating empty sets
sonar.issue.ignore.multicriteria.e2.ruleKey=python:S7496
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.py

# Ignore dependency installation rules in these two CI workflows.
# These exclusions do not correct dependency risks.
sonar.issue.ignore.multicriteria.e3.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.e3.resourceKey=.github/workflows/sonarcloud.yml

sonar.issue.ignore.multicriteria.e4.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.e4.resourceKey=.github/workflows/sonarcloud.yml

sonar.issue.ignore.multicriteria.e5.ruleKey=githubactions:S8541
sonar.issue.ignore.multicriteria.e5.resourceKey=.github/workflows/extra-docs-linting.yml

sonar.issue.ignore.multicriteria.e6.ruleKey=githubactions:S8544
sonar.issue.ignore.multicriteria.e6.resourceKey=.github/workflows/extra-docs-linting.yml
