# SonarCloud project configuration for oracle.oci
# Complete documentation: https://docs.sonarsource.com/sonarqube-cloud/

sonar.projectKey=ansible-collections_oracle.oci
sonar.organization=ansible-collections
sonar.projectName=oracle.oci

sonar.sources=.
sonar.python.version=3.12
sonar.newCode.referenceBranch=main

sonar.exclusions=tests/**,.tox/**,.nox/**

# rules to ignore
sonar.issue.ignore.multicriteria=e1
# Don't require literals when creating empty sets, lists, or dicts.
sonar.issue.ignore.multicriteria.e1.ruleKey=python:S7498
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.py
