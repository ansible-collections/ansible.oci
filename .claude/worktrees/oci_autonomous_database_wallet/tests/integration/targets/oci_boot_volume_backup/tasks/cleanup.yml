---
- name: Run boot volume backup cleanup with shared OCI auth defaults
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Delete leaked duplicate boot volume backup during cleanup
      ansible.oci.oci_boot_volume_backup:
        state: absent
        boot_volume_backup_id: "{{ oci_boot_volume_backup_duplicate_id }}"
      when: oci_boot_volume_backup_duplicate_id | default('') | length > 0
      register: oci_cleanup_duplicate_boot_volume_backup
      retries: 3
      ignore_errors: true

    - name: Delete leaked boot volume backup during cleanup
      ansible.oci.oci_boot_volume_backup:
        state: absent
        boot_volume_backup_id: "{{ oci_boot_volume_backup_id }}"
      when: oci_boot_volume_backup_id | default('') | length > 0
      register: oci_cleanup_boot_volume_backup
      retries: 3
      ignore_errors: true

    - name: Delete leaked compute instance during cleanup
      ansible.oci.oci_instance:
        state: absent
        instance_id: "{{ oci_boot_volume_backup_instance_id }}"
      when: oci_boot_volume_backup_instance_id | default('') | length > 0
      register: oci_cleanup_compute_instance
      retries: 3
      ignore_errors: true

    - name: Delete leaked subnet during cleanup
      ansible.oci.oci_network_subnet:
        state: absent
        subnet_id: "{{ oci_boot_volume_backup_subnet_create.resource.id }}"
      when: oci_boot_volume_backup_subnet_create.resource.id | default('') | length > 0
      register: oci_cleanup_subnet
      retries: 3
      ignore_errors: true

    - name: Delete leaked VCN during cleanup
      ansible.oci.oci_network_vcn:
        state: absent
        vcn_id: "{{ oci_boot_volume_backup_vcn_create.resource.id }}"
      when: oci_boot_volume_backup_vcn_create.resource.id | default('') | length > 0
      register: oci_cleanup_vcn
      retries: 3
      ignore_errors: true

    - name: Verify resource cleanup succeeded
      ansible.builtin.assert:
        that:
          - oci_cleanup_duplicate_boot_volume_backup is not failed
          - oci_cleanup_boot_volume_backup is not failed
          - oci_cleanup_compute_instance is not failed
          - oci_cleanup_subnet is not failed
          - oci_cleanup_vcn is not failed
        fail_msg: Resource cleanup failed after 3 retries; see the failed cleanup tasks above.
