---
- name: Exercise health checker lifecycle
  block:
    - name: Prepare the parent load balancer
      ansible.builtin.include_role:
        name: prepare_oci_loadbalancer_subresources

    - name: Create the prerequisite backend set
      ansible.oci.oci_loadbalancer_backend_set:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
        policy: round_robin
        health_checker:
          protocol: tcp
          port: 8080
          return_code: 200
          retries: 3
          timeout_in_millis: 3000
          interval_in_millis: 10000
          response_body_regex: .*

    - name: Read state before health checker update
      ansible.oci.oci_loadbalancer_health_checker_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
      register: oci_lb_before

    - name: Predict health checker update
      ansible.oci.oci_loadbalancer_health_checker:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
        protocol: tcp
        port: 8080
        return_code: 200
        retries: 4
        timeout_in_millis: 3000
        interval_in_millis: 12000
        response_body_regex: .*
      check_mode: true
      register: oci_lb_prediction

    - name: Assert change predicted
      ansible.builtin.assert:
        that:
          - oci_lb_prediction.changed | bool

    - name: Read state after check mode
      ansible.oci.oci_loadbalancer_health_checker_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
      register: oci_lb_after_check

    - name: Assert check mode preserved OCI state
      ansible.builtin.assert:
        that:
          - oci_lb_before.health_checkers == oci_lb_after_check.health_checkers

    - name: Apply health checker update
      ansible.oci.oci_loadbalancer_health_checker:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
        protocol: tcp
        port: 8080
        return_code: 200
        retries: 4
        timeout_in_millis: 3000
        interval_in_millis: 12000
        response_body_regex: .*
      register: oci_lb_applied

    - name: Assert operation changed OCI state
      ansible.builtin.assert:
        that:
          - oci_lb_applied.changed | bool

    - name: Read resulting state
      ansible.oci.oci_loadbalancer_health_checker_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
      register: oci_lb_after

    - name: Assert resource configuration
      ansible.builtin.assert:
        that:
          - oci_lb_after.health_checkers | length == 1
          - oci_lb_after.health_checkers[0].protocol == 'TCP'
          - oci_lb_after.health_checkers[0].port == 8080
          - oci_lb_after.health_checkers[0].return_code == 200
          - oci_lb_after.health_checkers[0].retries == 4
          - oci_lb_after.health_checkers[0].timeout_in_millis == 3000
          - oci_lb_after.health_checkers[0].interval_in_millis == 12000
          - oci_lb_after.health_checkers[0].response_body_regex == '.*'

    - name: Test health checker update idempotency
      ansible.oci.oci_loadbalancer_health_checker:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
        protocol: tcp
        port: 8080
        return_code: 200
        retries: 4
        timeout_in_millis: 3000
        interval_in_millis: 12000
        response_body_regex: .*
      register: oci_lb_repeat

    - name: Test health checker update idempotency in check mode
      ansible.oci.oci_loadbalancer_health_checker:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
        protocol: tcp
        port: 8080
        return_code: 200
        retries: 4
        timeout_in_millis: 3000
        interval_in_millis: 12000
        response_body_regex: .*
      check_mode: true
      register: oci_lb_repeat_check

    - name: Assert idempotency in normal and check mode
      ansible.builtin.assert:
        that:
          - not oci_lb_repeat.changed | bool
          - not oci_lb_repeat_check.changed | bool

    - name: Read remote state after idempotency tests
      ansible.oci.oci_loadbalancer_health_checker_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
      register: oci_lb_final

    - name: Assert idempotency tests preserved remote state
      ansible.builtin.assert:
        that:
          - oci_lb_final.health_checkers == oci_lb_after.health_checkers

    - name: Read backend set after health checker update
      ansible.oci.oci_loadbalancer_backend_set_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
      register: oci_lb_updated_set

    - name: Assert standalone health update changed backend set configuration
      ansible.builtin.assert:
        that:
          - oci_lb_updated_set.backend_sets[0].health_checker.retries == 4
          - oci_lb_updated_set.backend_sets[0].health_checker.interval_in_millis == 12000
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: '{{ oci_integration_config_file_location }}'
      config_profile_name: '{{ oci_integration_config_profile_name }}'
  vars:
    oci_lb_test_suffix: health-checker

  always:
    - name: Clean up test-owned resources
      ansible.builtin.include_role:
        name: prepare_oci_loadbalancer_subresources
        tasks_from: cleanup
