---
- name: Run volume group cleanup with shared OCI auth defaults
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Delete leaked volume group during cleanup
      ansible.oci.oci_volume_group:
        state: absent
        volume_group_id: "{{ oci_volume_group_id }}"
      when: oci_volume_group_id | default('') | length > 0
      register: oci_cleanup_volume_group
      retries: 3
      ignore_errors: true

    - name: Delete leaked member volumes during cleanup
      ansible.oci.oci_blockstorage_volume:
        state: absent
        volume_id: "{{ item }}"
      loop: "{{ oci_volume_group_integration_volume_ids | default([]) }}"
      when: item | default('') | length > 0
      register: oci_cleanup_member_volumes
      retries: 3
      ignore_errors: true

    - name: Verify resource cleanup succeeded
      ansible.builtin.assert:
        that:
          - oci_cleanup_volume_group is not failed
          - oci_cleanup_member_volumes is not failed
        fail_msg: Resource cleanup failed after 3 retries; see the failed cleanup tasks above.
