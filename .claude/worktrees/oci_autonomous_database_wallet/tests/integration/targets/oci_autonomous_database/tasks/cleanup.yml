---
- name: Run autonomous database cleanup with shared OCI auth defaults
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Delete leaked autonomous database by id during cleanup
      ansible.oci.oci_autonomous_database:
        state: absent
        autonomous_database_id: "{{ oci_adb_id }}"
      when: oci_adb_id | default('') | length > 0
      register: oci_cleanup_adb_by_id
      retries: 3
      ignore_errors: true

    - name: Find leaked autonomous database by unique name when id is unavailable
      ansible.oci.oci_autonomous_database_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_adb_integration_display_name }}"
      when: oci_adb_id | default('') | length == 0
      register: oci_cleanup_adb_lookup
      ignore_errors: true

    - name: Delete leaked autonomous database found by name during cleanup
      ansible.oci.oci_autonomous_database:
        state: absent
        autonomous_database_id: "{{ item.id }}"
      loop: "{{ oci_cleanup_adb_lookup.autonomous_databases | default([]) }}"
      when: oci_adb_id | default('') | length == 0
      register: oci_cleanup_adb_by_name
      retries: 3
      ignore_errors: true

    - name: Verify resource cleanup succeeded
      ansible.builtin.assert:
        that:
          - oci_cleanup_adb_by_id is not failed
          - oci_cleanup_adb_by_name is not failed
        fail_msg: Resource cleanup failed after 3 retries; see the failed cleanup task above.
