---
- name: Validate required OCI integration variables
  ansible.builtin.assert:
    that:
      - oci_integration_compartment_id | default('', true) | length > 0
    fail_msg: >-
      OCI autonomous database integration tests require oci_integration_compartment_id to be defined in tests/integration/integration_config.yml.

- name: Compute unique resource names for this run
  ansible.builtin.set_fact:
    oci_adb_integration_display_name: "{{ oci_adb_integration_display_name }}-{{ oci_integration_rpfx }}"
    # db_name must be alphanumeric, start with a letter, and be <= 30 chars.
    oci_adb_integration_db_name: >-
      {{ (oci_adb_integration_db_name_prefix ~ oci_integration_rpfx) | regex_replace('[^a-zA-Z0-9]', '') | truncate(30, true, '') }}

- name: Exercise autonomous database module lifecycle
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Define autonomous database create parameters
      ansible.builtin.set_fact:
        oci_adb_create_params:
          state: present
          compartment_id: "{{ oci_integration_compartment_id }}"
          name: "{{ oci_adb_integration_display_name }}"
          db_name: "{{ oci_adb_integration_db_name }}"
          admin_password: "{{ oci_adb_integration_admin_password }}"
          db_workload: "{{ oci_adb_integration_db_workload }}"
          compute_model: "{{ oci_adb_integration_compute_model }}"
          compute_count: "{{ oci_adb_integration_create_compute_count }}"
          data_storage_size_in_tbs: "{{ oci_adb_integration_data_storage_size_in_tbs }}"
          freeform_tags: "{{ oci_adb_integration_create_tags }}"
        oci_adb_delete_params:
          state: absent
          autonomous_database_id: ""

    - name: Create autonomous database in check mode
      ansible.oci.oci_autonomous_database: &oci_adb_create_module_options
        state: "{{ oci_adb_create_params.state }}"
        compartment_id: "{{ oci_adb_create_params.compartment_id }}"
        name: "{{ oci_adb_create_params.name }}"
        db_name: "{{ oci_adb_create_params.db_name }}"
        admin_password: "{{ oci_adb_create_params.admin_password }}"
        db_workload: "{{ oci_adb_create_params.db_workload }}"
        compute_model: "{{ oci_adb_create_params.compute_model }}"
        compute_count: "{{ oci_adb_create_params.compute_count }}"
        data_storage_size_in_tbs: "{{ oci_adb_create_params.data_storage_size_in_tbs }}"
        freeform_tags: "{{ oci_adb_create_params.freeform_tags }}"
      check_mode: true
      register: oci_adb_create_check

    - name: Assert create check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_adb_create_check.changed | bool

    - name: Read autonomous database after create check mode
      ansible.oci.oci_autonomous_database_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_adb_integration_display_name }}"
      register: oci_adb_create_check_probe

    - name: Assert autonomous database is still absent after create check mode
      ansible.builtin.assert:
        that:
          - oci_adb_create_check_probe.autonomous_databases | length == 0

    - name: Create autonomous database
      ansible.oci.oci_autonomous_database:
        <<: *oci_adb_create_module_options
      register: oci_adb_create

    - name: Capture autonomous database id and define update parameters
      ansible.builtin.set_fact:
        oci_adb_id: "{{ oci_adb_create.resource.id }}"
        oci_adb_update_params:
          state: present
          autonomous_database_id: "{{ oci_adb_create.resource.id }}"
          compute_count: "{{ oci_adb_integration_update_compute_count }}"
          freeform_tags: "{{ oci_adb_integration_update_tags }}"
        oci_adb_delete_params:
          state: absent
          autonomous_database_id: "{{ oci_adb_create.resource.id }}"

    - name: Assert create reported a change
      ansible.builtin.assert:
        that:
          - oci_adb_create.changed | bool
          - oci_adb_create.resource.lifecycle_state == "AVAILABLE"
          - oci_adb_create.resource.name == oci_adb_integration_display_name
          - oci_adb_create.resource.db_name == oci_adb_integration_db_name

    - name: Read autonomous database by id
      ansible.oci.oci_autonomous_database_info:
        autonomous_database_id: "{{ oci_adb_id }}"
      register: oci_adb_info_by_id

    - name: Assert autonomous database info by id returned the created database
      ansible.builtin.assert:
        that:
          - oci_adb_info_by_id.autonomous_databases | length == 1
          - oci_adb_info_by_id.autonomous_databases[0].id == oci_adb_id
          - oci_adb_info_by_id.autonomous_databases[0].name == oci_adb_integration_display_name
          - oci_adb_info_by_id.autonomous_databases[0].lifecycle_state == "AVAILABLE"
          - oci_adb_info_by_id.autonomous_databases[0].compute_count | int == oci_adb_integration_create_compute_count | int

    - name: List available autonomous database by name
      ansible.oci.oci_autonomous_database_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_adb_integration_display_name }}"
        lifecycle_state: AVAILABLE
      register: oci_adb_info_list

    - name: Assert autonomous database info list returned the created database
      ansible.builtin.assert:
        that:
          - oci_adb_info_list.autonomous_databases | selectattr('id', 'equalto', oci_adb_id) | list | length == 1

    - name: Create temporary directory for the autonomous database wallet
      ansible.builtin.tempfile:
        state: directory
        suffix: oci_adb_wallet
      register: oci_adb_wallet_dir

    - name: Define autonomous database wallet parameters
      ansible.builtin.set_fact:
        oci_adb_wallet_dest: "{{ oci_adb_wallet_dir.path }}/wallet.zip"

    - name: Download autonomous database wallet in check mode
      ansible.oci.oci_autonomous_database_wallet: &oci_adb_wallet_module_options
        autonomous_database_id: "{{ oci_adb_id }}"
        dest: "{{ oci_adb_wallet_dest }}"
        password: "{{ oci_adb_integration_wallet_password }}"
      check_mode: true
      register: oci_adb_wallet_check

    - name: Read wallet file after download check mode
      ansible.builtin.stat:
        path: "{{ oci_adb_wallet_dest }}"
      register: oci_adb_wallet_check_stat

    - name: Assert download check mode reported a change without writing the wallet
      ansible.builtin.assert:
        that:
          - oci_adb_wallet_check.changed | bool
          - not oci_adb_wallet_check_stat.stat.exists

    - name: Download autonomous database wallet
      ansible.oci.oci_autonomous_database_wallet:
        <<: *oci_adb_wallet_module_options
      register: oci_adb_wallet_download

    - name: Read wallet file after download
      ansible.builtin.stat:
        path: "{{ oci_adb_wallet_dest }}"
        checksum_algorithm: sha256
      register: oci_adb_wallet_download_stat

    - name: Assert download wrote a private wallet file
      ansible.builtin.assert:
        that:
          - oci_adb_wallet_download.changed | bool
          - oci_adb_wallet_download.dest == oci_adb_wallet_dest
          - oci_adb_wallet_download_stat.stat.exists
          - oci_adb_wallet_download_stat.stat.size > 0
          - oci_adb_wallet_download_stat.stat.mode == "0600"

    - name: Rerun wallet download
      ansible.oci.oci_autonomous_database_wallet:
        <<: *oci_adb_wallet_module_options
      register: oci_adb_wallet_rerun

    - name: Rerun wallet download in check mode
      ansible.oci.oci_autonomous_database_wallet:
        <<: *oci_adb_wallet_module_options
      check_mode: true
      register: oci_adb_wallet_rerun_check

    - name: Read wallet file after reruns
      ansible.builtin.stat:
        path: "{{ oci_adb_wallet_dest }}"
        checksum_algorithm: sha256
      register: oci_adb_wallet_rerun_stat

    - name: Assert wallet download reruns are no-ops
      ansible.builtin.assert:
        that:
          - not oci_adb_wallet_rerun.changed | bool
          - not oci_adb_wallet_rerun_check.changed | bool
          - oci_adb_wallet_rerun_stat.stat.checksum == oci_adb_wallet_download_stat.stat.checksum

    - name: Force wallet download in check mode
      ansible.oci.oci_autonomous_database_wallet:
        <<: *oci_adb_wallet_module_options
        force: true
      check_mode: true
      register: oci_adb_wallet_force_check

    - name: Read wallet file after forced download check mode
      ansible.builtin.stat:
        path: "{{ oci_adb_wallet_dest }}"
        checksum_algorithm: sha256
      register: oci_adb_wallet_force_check_stat

    - name: Assert forced download check mode reported a change without replacing the wallet
      ansible.builtin.assert:
        that:
          - oci_adb_wallet_force_check.changed | bool
          - oci_adb_wallet_force_check_stat.stat.checksum == oci_adb_wallet_download_stat.stat.checksum

    - name: Force wallet download
      ansible.oci.oci_autonomous_database_wallet:
        <<: *oci_adb_wallet_module_options
        force: true
      register: oci_adb_wallet_force

    - name: Read wallet file after forced download
      ansible.builtin.stat:
        path: "{{ oci_adb_wallet_dest }}"
        checksum_algorithm: sha256
      register: oci_adb_wallet_force_stat

    - name: Assert forced download replaced the wallet
      ansible.builtin.assert:
        that:
          - oci_adb_wallet_force.changed | bool
          - oci_adb_wallet_force_stat.stat.checksum != oci_adb_wallet_download_stat.stat.checksum
          - oci_adb_wallet_force_stat.stat.mode == "0600"

    - name: Assert created autonomous database is a no-op on rerun with unique name
      ansible.oci.oci_autonomous_database:
        <<: *oci_adb_create_module_options
      register: oci_adb_create_rerun_by_name

    - name: Verify rerun with unique name is a no-op
      ansible.builtin.assert:
        that:
          - not oci_adb_create_rerun_by_name.changed | bool
          - oci_adb_create_rerun_by_name.resource.id == oci_adb_id

    - name: Assert created autonomous database is a no-op on rerun with returned id
      ansible.oci.oci_autonomous_database:
        <<: *oci_adb_create_module_options
        autonomous_database_id: "{{ oci_adb_id }}"
      register: oci_adb_create_rerun

    - name: Verify rerun with returned id is a no-op
      ansible.builtin.assert:
        that:
          - not oci_adb_create_rerun.changed | bool

    - name: Update autonomous database in check mode
      ansible.oci.oci_autonomous_database: &oci_adb_update_module_options
        state: "{{ oci_adb_update_params.state }}"
        autonomous_database_id: "{{ oci_adb_update_params.autonomous_database_id }}"
        compute_count: "{{ oci_adb_update_params.compute_count }}"
        freeform_tags: "{{ oci_adb_update_params.freeform_tags }}"
      check_mode: true
      register: oci_adb_update_check

    - name: Assert update check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_adb_update_check.changed | bool

    - name: Read autonomous database after update check mode
      ansible.oci.oci_autonomous_database_info:
        autonomous_database_id: "{{ oci_adb_id }}"
      register: oci_adb_update_check_probe

    - name: Assert update check mode did not mutate cloud state
      ansible.builtin.assert:
        that:
          - oci_adb_update_check_probe.autonomous_databases | length == 1
          - oci_adb_update_check_probe.autonomous_databases[0].compute_count | int == oci_adb_integration_create_compute_count | int
          - oci_adb_update_check_probe.autonomous_databases[0].freeform_tags.phase == "create"

    - name: Update autonomous database
      ansible.oci.oci_autonomous_database:
        <<: *oci_adb_update_module_options
      register: oci_adb_update

    - name: Assert update reported a change
      ansible.builtin.assert:
        that:
          - oci_adb_update.changed | bool

    - name: Read updated autonomous database by id
      ansible.oci.oci_autonomous_database_info:
        autonomous_database_id: "{{ oci_adb_id }}"
      register: oci_adb_info_updated

    - name: Assert autonomous database info reflects the update
      ansible.builtin.assert:
        that:
          - oci_adb_info_updated.autonomous_databases | length == 1
          - oci_adb_info_updated.autonomous_databases[0].compute_count | int == oci_adb_integration_update_compute_count | int
          - oci_adb_info_updated.autonomous_databases[0].freeform_tags.phase == "update"

    - name: Assert update is idempotent on rerun
      ansible.oci.oci_autonomous_database:
        <<: *oci_adb_update_module_options
      register: oci_adb_update_rerun

    - name: Verify update rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_adb_update_rerun.changed | bool

    - name: Stop autonomous database in check mode
      ansible.oci.oci_autonomous_database: &oci_adb_stop_module_options
        state: stopped
        autonomous_database_id: "{{ oci_adb_id }}"
      check_mode: true
      register: oci_adb_stop_check

    - name: Assert stop check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_adb_stop_check.changed | bool

    - name: Read autonomous database after stop check mode
      ansible.oci.oci_autonomous_database_info:
        autonomous_database_id: "{{ oci_adb_id }}"
      register: oci_adb_stop_check_probe

    - name: Assert stop check mode did not stop the database
      ansible.builtin.assert:
        that:
          - oci_adb_stop_check_probe.autonomous_databases[0].lifecycle_state == "AVAILABLE"

    - name: Stop autonomous database
      ansible.oci.oci_autonomous_database:
        <<: *oci_adb_stop_module_options
      register: oci_adb_stop

    - name: Assert stop reported a change and the database is stopped
      ansible.builtin.assert:
        that:
          - oci_adb_stop.changed | bool
          - oci_adb_stop.resource.lifecycle_state == "STOPPED"

    - name: Assert stop is idempotent on rerun
      ansible.oci.oci_autonomous_database:
        <<: *oci_adb_stop_module_options
      register: oci_adb_stop_rerun

    - name: Verify stop rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_adb_stop_rerun.changed | bool

    - name: Start autonomous database
      ansible.oci.oci_autonomous_database: &oci_adb_start_module_options
        state: running
        autonomous_database_id: "{{ oci_adb_id }}"
      register: oci_adb_start

    - name: Assert start reported a change and the database is available
      ansible.builtin.assert:
        that:
          - oci_adb_start.changed | bool
          - oci_adb_start.resource.lifecycle_state == "AVAILABLE"

    - name: Assert start is idempotent on rerun
      ansible.oci.oci_autonomous_database:
        <<: *oci_adb_start_module_options
      register: oci_adb_start_rerun

    - name: Verify start rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_adb_start_rerun.changed | bool

    - name: Delete autonomous database in check mode
      ansible.oci.oci_autonomous_database: &oci_adb_delete_module_options
        state: "{{ oci_adb_delete_params.state }}"
        autonomous_database_id: "{{ oci_adb_delete_params.autonomous_database_id }}"
      check_mode: true
      register: oci_adb_delete_check

    - name: Assert delete check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_adb_delete_check.changed | bool

    - name: Read autonomous database after delete check mode
      ansible.oci.oci_autonomous_database_info:
        autonomous_database_id: "{{ oci_adb_id }}"
      register: oci_adb_delete_check_probe

    - name: Assert autonomous database still exists after delete check mode
      ansible.builtin.assert:
        that:
          - oci_adb_delete_check_probe.autonomous_databases | length == 1

    - name: Delete autonomous database
      ansible.oci.oci_autonomous_database:
        <<: *oci_adb_delete_module_options
      register: oci_adb_delete

    - name: Assert delete reported a change
      ansible.builtin.assert:
        that:
          - oci_adb_delete.changed | bool

    - name: Assert delete is idempotent on rerun
      ansible.oci.oci_autonomous_database:
        <<: *oci_adb_delete_module_options
      register: oci_adb_delete_rerun

    - name: Verify delete rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_adb_delete_rerun.changed | bool

    - name: Clear autonomous database id after successful delete
      ansible.builtin.set_fact:
        oci_adb_id: ""

  always:
    - name: Remove temporary autonomous database wallet directory
      ansible.builtin.file:
        path: "{{ oci_adb_wallet_dir.path }}"
        state: absent
      when: oci_adb_wallet_dir.path is defined

    - name: Run autonomous database cleanup
      ansible.builtin.include_tasks: cleanup.yml
