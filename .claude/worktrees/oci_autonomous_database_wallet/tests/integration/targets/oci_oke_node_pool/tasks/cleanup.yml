---
- name: Run OKE node pool cleanup with shared OCI auth defaults
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Delete leaked node pools during cleanup
      ansible.oci.oci_oke_node_pool:
        state: absent
        node_pool_id: "{{ item }}"
      loop: "{{ oci_oke_np_cleanup_ids | default([]) | unique | list }}"
      when: item | default('') | length > 0
      register: oci_cleanup_node_pools
      until: oci_cleanup_node_pools is succeeded
      retries: 10
      delay: 30
      ignore_errors: true

    - name: Delete leaked cluster during cleanup
      ansible.oci.oci_oke_cluster:
        state: absent
        cluster_id: "{{ oci_oke_np_cluster_id }}"
      when: oci_oke_np_cluster_id | default('') | length > 0
      register: oci_cleanup_cluster
      until: oci_cleanup_cluster is succeeded
      retries: 10
      delay: 30
      ignore_errors: true

    # The node pool's worker instances, and the cluster's endpoint VNIC, can
    # take a bit longer to fully release from the subnet than their own delete
    # work requests take to report success, so poll past that window instead
    # of failing on the first attempt.
    - name: Delete leaked subnet during cleanup
      ansible.oci.oci_network_subnet:
        state: absent
        subnet_id: "{{ oci_oke_np_subnet_id }}"
      when: oci_oke_np_subnet_id | default('') | length > 0
      register: oci_cleanup_subnet
      until: oci_cleanup_subnet is succeeded
      retries: 10
      delay: 30
      ignore_errors: true

    - name: Delete leaked route table during cleanup
      ansible.oci.oci_network_route_table:
        state: absent
        route_table_id: "{{ oci_oke_np_route_table_id }}"
      when: oci_oke_np_route_table_id | default('') | length > 0
      register: oci_cleanup_route_table
      until: oci_cleanup_route_table is succeeded
      retries: 10
      delay: 30
      ignore_errors: true

    - name: Delete leaked security list during cleanup
      ansible.oci.oci_network_security_list:
        state: absent
        security_list_id: "{{ oci_oke_np_security_list_id }}"
      when: oci_oke_np_security_list_id | default('') | length > 0
      register: oci_cleanup_security_list
      until: oci_cleanup_security_list is succeeded
      retries: 10
      delay: 30
      ignore_errors: true

    - name: Delete leaked internet gateway during cleanup
      ansible.oci.oci_network_internet_gateway:
        state: absent
        internet_gateway_id: "{{ oci_oke_np_igw_id }}"
      when: oci_oke_np_igw_id | default('') | length > 0
      register: oci_cleanup_igw
      until: oci_cleanup_igw is succeeded
      retries: 10
      delay: 30
      ignore_errors: true

    - name: Delete leaked VCN during cleanup
      ansible.oci.oci_network_vcn:
        state: absent
        vcn_id: "{{ oci_oke_np_vcn_id }}"
      when: oci_oke_np_vcn_id | default('') | length > 0
      register: oci_cleanup_vcn
      until: oci_cleanup_vcn is succeeded
      retries: 10
      delay: 30
      ignore_errors: true

    - name: Verify resource cleanup succeeded
      ansible.builtin.assert:
        that:
          - oci_cleanup_node_pools is not failed
          - oci_cleanup_cluster is not failed
          - oci_cleanup_subnet is not failed
          - oci_cleanup_route_table is not failed
          - oci_cleanup_security_list is not failed
          - oci_cleanup_igw is not failed
          - oci_cleanup_vcn is not failed
        fail_msg: Resource cleanup failed after 3 retries; see the failed cleanup tasks above.
