---
- name: Clean up the temporary identity policy
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Delete leaked policy by id
      ansible.oci.oci_identity_policy:
        state: absent
        policy_id: "{{ oci_identity_policy_cleanup_id }}"
      when: oci_identity_policy_cleanup_id | default('') | length > 0
      register: oci_cleanup_policy_by_id
      retries: 3
      ignore_errors: true

    - name: Delete leaked policy by exact scoped name when no id was captured
      ansible.oci.oci_identity_policy:
        state: absent
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_identity_policy_cleanup_name }}"
      when:
        - oci_identity_policy_cleanup_id | default('') | length == 0
        - oci_identity_policy_cleanup_name | default('') | length > 0
      register: oci_cleanup_policy_by_name
      retries: 3
      ignore_errors: true

    - name: Verify policy cleanup succeeded
      ansible.builtin.assert:
        that:
          - oci_cleanup_policy_by_id is not failed
          - oci_cleanup_policy_by_name is not failed
        fail_msg: Policy cleanup failed after 3 retries; see the failed cleanup tasks above.
