---
- name: Run internet gateway cleanup with shared OCI auth defaults
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Delete leaked internet gateway during cleanup
      ansible.oci.oci_network_internet_gateway:
        state: absent
        internet_gateway_id: "{{ oci_internet_gateway_id }}"
      when: oci_internet_gateway_id | default('') | length > 0
      register: oci_cleanup_internet_gateway
      retries: 3
      ignore_errors: true

    - name: Delete leaked VCN during cleanup
      ansible.oci.oci_network_vcn:
        state: absent
        vcn_id: "{{ oci_internet_gateway_integration_network.vcn_id }}"
      when: oci_internet_gateway_integration_network.vcn_id | default('') | length > 0
      register: oci_cleanup_vcn
      retries: 3
      ignore_errors: true

    - name: Verify resource cleanup succeeded
      ansible.builtin.assert:
        that:
          - oci_cleanup_internet_gateway is not failed
          - oci_cleanup_vcn is not failed
        fail_msg: Resource cleanup failed after 3 retries; see the failed cleanup tasks above.
