---
- name: Run security list cleanup with shared OCI auth defaults
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Delete leaked duplicate security list during cleanup
      ansible.oci.oci_network_security_list:
        state: absent
        security_list_id: "{{ oci_security_list_duplicate_id }}"
      when: oci_security_list_duplicate_id | default('') | length > 0
      register: oci_cleanup_duplicate_security_list
      retries: 3
      ignore_errors: true

    - name: Delete leaked security list during cleanup
      ansible.oci.oci_network_security_list:
        state: absent
        security_list_id: "{{ oci_security_list_id }}"
      when: oci_security_list_id | default('') | length > 0
      register: oci_cleanup_security_list
      retries: 3
      ignore_errors: true

    - name: Delete leaked VCN during cleanup
      ansible.oci.oci_network_vcn:
        state: absent
        vcn_id: "{{ oci_security_list_vcn_create.resource.id }}"
      when: oci_security_list_vcn_create.resource.id | default('') | length > 0
      register: oci_cleanup_vcn
      retries: 3
      ignore_errors: true

    - name: Verify resource cleanup succeeded
      ansible.builtin.assert:
        that:
          - oci_cleanup_duplicate_security_list is not failed
          - oci_cleanup_security_list is not failed
          - oci_cleanup_vcn is not failed
        fail_msg: Resource cleanup failed after 3 retries; see the failed cleanup tasks above.
