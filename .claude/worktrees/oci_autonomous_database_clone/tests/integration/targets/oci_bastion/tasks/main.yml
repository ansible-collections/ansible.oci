---
- name: Validate required OCI integration variables
  ansible.builtin.assert:
    that:
      - oci_integration_compartment_id | default('', true) | length > 0
    fail_msg: >-
      OCI bastion integration tests require oci_integration_compartment_id to be defined in tests/integration/integration_config.yml.

- name: Compute unique resource names for this run
  ansible.builtin.set_fact:
    oci_bastion_integration_vcn_name: "{{ oci_bastion_integration_vcn_name }}-{{ oci_integration_rpfx }}"
    oci_bastion_integration_subnet_name: "{{ oci_bastion_integration_subnet_name }}-{{ oci_integration_rpfx }}"
    oci_bastion_integration_bastion_name: "{{ oci_bastion_integration_bastion_name }}-{{ oci_integration_rpfx }}"
    oci_bastion_integration_vcn_dns_label: "vcn{{ oci_integration_rpfx }}"
    oci_bastion_integration_subnet_dns_label: "sub{{ oci_integration_rpfx }}"

- name: Exercise bastion module lifecycle
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Create test VCN for bastion integration
      ansible.oci.oci_network_vcn:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_bastion_integration_vcn_name }}"
        cidr_blocks:
          - "{{ oci_bastion_integration_vcn_cidr_block }}"
        dns_label: "{{ oci_bastion_integration_vcn_dns_label }}"
      register: oci_bastion_vcn_create

    - name: Create test subnet for bastion integration
      ansible.oci.oci_network_subnet:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        vcn_id: "{{ oci_bastion_vcn_create.resource.id }}"
        cidr_block: "{{ oci_bastion_integration_subnet_cidr_block }}"
        name: "{{ oci_bastion_integration_subnet_name }}"
        dns_label: "{{ oci_bastion_integration_subnet_dns_label }}"
      register: oci_bastion_subnet_create

    - name: Capture created network ids
      ansible.builtin.set_fact:
        oci_bastion_integration_network:
          vcn_id: "{{ oci_bastion_vcn_create.resource.id }}"
          subnet_id: "{{ oci_bastion_subnet_create.resource.id }}"

    - name: Define bastion create and delete parameters
      ansible.builtin.set_fact:
        oci_bastion_create_params:
          state: present
          compartment_id: "{{ oci_integration_compartment_id }}"
          name: "{{ oci_bastion_integration_bastion_name }}"
          target_subnet_id: "{{ oci_bastion_integration_network.subnet_id }}"
          client_cidr_block_allow_list: "{{ oci_bastion_integration_client_cidr_block_allow_list }}"
          max_session_ttl_in_seconds: "{{ oci_bastion_integration_create_max_session_ttl_in_seconds }}"
          freeform_tags: "{{ oci_bastion_integration_create_tags }}"
        oci_bastion_delete_params:
          state: absent
          bastion_id: ""

    - name: Create bastion in check mode
      ansible.oci.oci_bastion: &oci_bastion_create_module_options
        state: "{{ oci_bastion_create_params.state }}"
        compartment_id: "{{ oci_bastion_create_params.compartment_id }}"
        name: "{{ oci_bastion_create_params.name }}"
        target_subnet_id: "{{ oci_bastion_create_params.target_subnet_id }}"
        client_cidr_block_allow_list: "{{ oci_bastion_create_params.client_cidr_block_allow_list }}"
        max_session_ttl_in_seconds: "{{ oci_bastion_create_params.max_session_ttl_in_seconds }}"
        freeform_tags: "{{ oci_bastion_create_params.freeform_tags }}"
      check_mode: true
      register: oci_bastion_create_check

    - name: Assert create check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_bastion_create_check.changed | bool

    - name: Read bastion after create check mode
      ansible.oci.oci_bastion_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_bastion_integration_bastion_name }}"
      register: oci_bastion_create_check_probe

    - name: Assert bastion is still absent after create check mode
      ansible.builtin.assert:
        that:
          - oci_bastion_create_check_probe.bastions | length == 0

    - name: Create bastion
      ansible.oci.oci_bastion:
        <<: *oci_bastion_create_module_options
      register: oci_bastion_create

    - name: Capture bastion id and define update parameters
      ansible.builtin.set_fact:
        oci_bastion_id: "{{ oci_bastion_create.resource.id }}"
        oci_bastion_update_params:
          state: present
          bastion_id: "{{ oci_bastion_create.resource.id }}"
          max_session_ttl_in_seconds: "{{ oci_bastion_integration_update_max_session_ttl_in_seconds }}"
          freeform_tags: "{{ oci_bastion_integration_update_tags }}"
        oci_bastion_delete_params:
          state: absent
          bastion_id: "{{ oci_bastion_create.resource.id }}"

    - name: Assert create reported a change
      ansible.builtin.assert:
        that:
          - oci_bastion_create.changed | bool
          - oci_bastion_create.resource.lifecycle_state == "ACTIVE"
          - oci_bastion_create.resource.name == oci_bastion_integration_bastion_name

    - name: Read bastion by id
      ansible.oci.oci_bastion_info:
        bastion_id: "{{ oci_bastion_id }}"
      register: oci_bastion_info_by_id

    - name: Assert bastion info by id returned the created bastion
      ansible.builtin.assert:
        that:
          - oci_bastion_info_by_id.bastions | length == 1
          - oci_bastion_info_by_id.bastions[0].id == oci_bastion_id
          - oci_bastion_info_by_id.bastions[0].name == oci_bastion_integration_bastion_name
          - oci_bastion_info_by_id.bastions[0].target_subnet_id == oci_bastion_integration_network.subnet_id
          - oci_bastion_info_by_id.bastions[0].lifecycle_state == "ACTIVE"
          - oci_bastion_info_by_id.bastions[0].max_session_ttl_in_seconds == oci_bastion_integration_create_max_session_ttl_in_seconds

    - name: List active bastion by name
      ansible.oci.oci_bastion_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_bastion_integration_bastion_name }}"
        bastion_lifecycle_state: ACTIVE
      register: oci_bastion_info_list

    - name: Assert bastion info list returned the created bastion
      ansible.builtin.assert:
        that:
          - oci_bastion_info_list.bastions | selectattr('id', 'equalto', oci_bastion_id) | list | length == 1

    - name: Assert created bastion is a no-op on rerun with unique name
      ansible.oci.oci_bastion:
        <<: *oci_bastion_create_module_options
      register: oci_bastion_create_rerun_by_name

    - name: Verify bastion rerun with unique name is a no-op
      ansible.builtin.assert:
        that:
          - not oci_bastion_create_rerun_by_name.changed | bool
          - oci_bastion_create_rerun_by_name.resource.id == oci_bastion_id

    - name: Assert created bastion is a no-op on rerun with returned id
      ansible.oci.oci_bastion:
        <<: *oci_bastion_create_module_options
        bastion_id: "{{ oci_bastion_id }}"
      register: oci_bastion_create_rerun

    - name: Verify rerun with returned id is a no-op
      ansible.builtin.assert:
        that:
          - not oci_bastion_create_rerun.changed | bool

    - name: Update bastion in check mode
      ansible.oci.oci_bastion: &oci_bastion_update_module_options
        state: "{{ oci_bastion_update_params.state }}"
        bastion_id: "{{ oci_bastion_update_params.bastion_id }}"
        max_session_ttl_in_seconds: "{{ oci_bastion_update_params.max_session_ttl_in_seconds }}"
        freeform_tags: "{{ oci_bastion_update_params.freeform_tags }}"
      check_mode: true
      register: oci_bastion_update_check

    - name: Assert update check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_bastion_update_check.changed | bool

    - name: Read bastion after update check mode
      ansible.oci.oci_bastion_info:
        bastion_id: "{{ oci_bastion_id }}"
      register: oci_bastion_update_check_probe

    - name: Assert update check mode did not mutate cloud state
      ansible.builtin.assert:
        that:
          - oci_bastion_update_check_probe.bastions | length == 1
          - oci_bastion_update_check_probe.bastions[0].max_session_ttl_in_seconds == oci_bastion_integration_create_max_session_ttl_in_seconds
          - oci_bastion_update_check_probe.bastions[0].freeform_tags.phase == "create"

    - name: Update bastion
      ansible.oci.oci_bastion:
        <<: *oci_bastion_update_module_options
      register: oci_bastion_update

    - name: Assert update reported a change
      ansible.builtin.assert:
        that:
          - oci_bastion_update.changed | bool

    - name: Read updated bastion by id
      ansible.oci.oci_bastion_info:
        bastion_id: "{{ oci_bastion_id }}"
      register: oci_bastion_info_updated

    - name: Assert bastion info reflects updated bastion
      ansible.builtin.assert:
        that:
          - oci_bastion_info_updated.bastions | length == 1
          - oci_bastion_info_updated.bastions[0].max_session_ttl_in_seconds == oci_bastion_integration_update_max_session_ttl_in_seconds
          - oci_bastion_info_updated.bastions[0].freeform_tags.phase == "update"

    - name: Assert update is idempotent on rerun
      ansible.oci.oci_bastion:
        <<: *oci_bastion_update_module_options
      register: oci_bastion_update_rerun

    - name: Verify update rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_bastion_update_rerun.changed | bool

    - name: Delete bastion in check mode
      ansible.oci.oci_bastion: &oci_bastion_delete_module_options
        state: "{{ oci_bastion_delete_params.state }}"
        bastion_id: "{{ oci_bastion_delete_params.bastion_id }}"
      check_mode: true
      register: oci_bastion_delete_check

    - name: Assert delete check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_bastion_delete_check.changed | bool

    - name: Read bastion after delete check mode
      ansible.oci.oci_bastion_info:
        bastion_id: "{{ oci_bastion_id }}"
      register: oci_bastion_delete_check_probe

    - name: Assert bastion still exists after delete check mode
      ansible.builtin.assert:
        that:
          - oci_bastion_delete_check_probe.bastions | length == 1

    - name: Delete bastion
      ansible.oci.oci_bastion:
        <<: *oci_bastion_delete_module_options
      register: oci_bastion_delete

    - name: Assert delete reported a change
      ansible.builtin.assert:
        that:
          - oci_bastion_delete.changed | bool

    - name: Assert delete is idempotent on rerun
      ansible.oci.oci_bastion:
        <<: *oci_bastion_delete_module_options
      register: oci_bastion_delete_rerun

    - name: Verify delete rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_bastion_delete_rerun.changed | bool

    - name: Clear bastion id after successful delete
      ansible.builtin.set_fact:
        oci_bastion_id: ""

  always:
    - name: Run bastion cleanup
      ansible.builtin.include_tasks: cleanup.yml
