---
- name: Clean up volume backup policy assignment integration resources
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Remove policy assignment during cleanup
      ansible.oci.oci_volume_backup_policy_assignment:
        state: absent
        asset_id: "{{ oci_volume_backup_policy_assignment_volume_id }}"
      when: oci_volume_backup_policy_assignment_volume_id | default('') | length > 0
      register: oci_cleanup_policy_assignment
      retries: 3
      ignore_errors: true

    - name: Remove block volume during cleanup
      ansible.oci.oci_blockstorage_volume:
        state: absent
        volume_id: "{{ oci_volume_backup_policy_assignment_volume_id }}"
      when: oci_volume_backup_policy_assignment_volume_id | default('') | length > 0
      register: oci_cleanup_block_volume
      retries: 3
      ignore_errors: true

    - name: Remove second backup policy during cleanup
      ansible.oci.oci_volume_backup_policy:
        state: absent
        volume_backup_policy_id: "{{ oci_volume_backup_policy_assignment_second_policy_id }}"
      when: oci_volume_backup_policy_assignment_second_policy_id | default('') | length > 0
      register: oci_cleanup_second_backup_policy
      retries: 3
      ignore_errors: true

    - name: Remove first backup policy during cleanup
      ansible.oci.oci_volume_backup_policy:
        state: absent
        volume_backup_policy_id: "{{ oci_volume_backup_policy_assignment_first_policy_id }}"
      when: oci_volume_backup_policy_assignment_first_policy_id | default('') | length > 0
      register: oci_cleanup_first_backup_policy
      retries: 3
      ignore_errors: true

    - name: Verify resource cleanup succeeded
      ansible.builtin.assert:
        that:
          - oci_cleanup_policy_assignment is not failed
          - oci_cleanup_block_volume is not failed
          - oci_cleanup_second_backup_policy is not failed
          - oci_cleanup_first_backup_policy is not failed
        fail_msg: Resource cleanup failed after 3 retries; see the failed cleanup tasks above.
