---
# Restore needs a source boot volume. This target launches a throwaway
# instance so the attached boot volume can be backed up and restored.
# Availability domain and image are discovered at run time in tasks/main.yml.
oci_boot_volume_integration_operating_system: "Oracle Linux"
oci_boot_volume_integration_operating_system_version: "9"
oci_boot_volume_integration_shape: "VM.Standard.E4.Flex"
oci_boot_volume_integration_shape_config:
  ocpus: 1
  memory_in_gbs: 16
oci_boot_volume_integration_vcn_name: "oci-boot-volume-integration-vcn"
oci_boot_volume_integration_subnet_name: "oci-boot-volume-integration-subnet"
oci_boot_volume_integration_instance_name: "oci-boot-volume-integration-instance"
oci_boot_volume_integration_vcn_cidr_block: "10.252.0.0/16"
oci_boot_volume_integration_subnet_cidr_block: "10.252.1.0/24"
oci_boot_volume_integration_backup_name: "oci-boot-volume-integration-backup"
oci_boot_volume_integration_restore_name: "oci-boot-volume-integration-restored"
oci_boot_volume_integration_updated_restore_name: "oci-boot-volume-integration-restored-updated"
oci_boot_volume_integration_backup_type: "full"
oci_boot_volume_integration_create_tags:
  phase: create
  role: integration
oci_boot_volume_integration_update_tags:
  phase: update
  role: integration
