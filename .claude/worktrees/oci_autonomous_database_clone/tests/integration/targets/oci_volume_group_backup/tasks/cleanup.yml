---
- name: Run volume group backup cleanup with shared OCI auth defaults
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Delete leaked volume group backup during cleanup
      ansible.oci.oci_volume_group_backup:
        state: absent
        volume_group_backup_id: "{{ oci_volume_group_backup_id }}"
      when: oci_volume_group_backup_id | default('') | length > 0
      register: oci_cleanup_volume_group_backup
      retries: 3
      ignore_errors: true

    - name: Delete leaked volume group during cleanup
      ansible.oci.oci_volume_group:
        state: absent
        volume_group_id: "{{ oci_volume_group_backup_integration_volume_group_id }}"
      when: oci_volume_group_backup_integration_volume_group_id | default('') | length > 0
      register: oci_cleanup_volume_group
      retries: 3
      ignore_errors: true

    - name: Delete leaked block volume during cleanup
      ansible.oci.oci_blockstorage_volume:
        state: absent
        volume_id: "{{ oci_volume_group_backup_integration_volume_id }}"
      when: oci_volume_group_backup_integration_volume_id | default('') | length > 0
      register: oci_cleanup_block_volume
      retries: 3
      ignore_errors: true

    - name: Verify resource cleanup succeeded
      ansible.builtin.assert:
        that:
          - oci_cleanup_volume_group_backup is not failed
          - oci_cleanup_volume_group is not failed
          - oci_cleanup_block_volume is not failed
        fail_msg: Resource cleanup failed after 3 retries; see the failed cleanup tasks above.
