name: Determine OCI integration targets
description: Resolve whether a PR should run all, selected, or no integration targets

inputs:
  collection-path:
    description: Path to the disposable PR checkout in the collection directory layout
    required: true
  base-sha:
    description: Base commit used to find the PR merge base
    required: true

outputs:
  run-integration:
    description: Whether integration should run for this PR
    value: ${{ steps.determine.outputs.run-integration }}
  targets:
    description: Space-separated ansible-test integration targets
    value: ${{ steps.determine.outputs.targets }}

runs:
  using: composite
  steps:
    - name: Determine integration targets
      id: determine
      shell: bash
      env:
        COLLECTION_PATH: ${{ inputs.collection-path }}
        BASE_SHA: ${{ inputs.base-sha }}
      run: >-
        bash "${{ github.action_path }}/determine-targets.sh"
        "${COLLECTION_PATH}"
        "${BASE_SHA}"
