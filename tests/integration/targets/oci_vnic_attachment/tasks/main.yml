---
- name: Validate required OCI integration variables
  ansible.builtin.assert:
    that:
      - oci_integration_compartment_id | default('', true) | length > 0
    fail_msg: >-
      OCI VNIC attachment integration tests require oci_integration_compartment_id to be defined in tests/integration/integration_config.yml.

- name: Compute unique resource names for this run
  ansible.builtin.set_fact:
    oci_vnic_attachment_integration_vcn_name: "{{ oci_vnic_attachment_integration_vcn_name }}-{{ oci_integration_rpfx }}"
    oci_vnic_attachment_integration_subnet_name: "{{ oci_vnic_attachment_integration_subnet_name }}-{{ oci_integration_rpfx }}"
    oci_vnic_attachment_integration_instance_name: "{{ oci_vnic_attachment_integration_instance_name }}-{{ oci_integration_rpfx }}"
    oci_vnic_attachment_integration_attachment_name: "{{ oci_vnic_attachment_integration_attachment_name }}-{{ oci_integration_rpfx }}"
    oci_vnic_attachment_integration_vnic_name: "{{ oci_vnic_attachment_integration_vnic_name }}-{{ oci_integration_rpfx }}"

- name: Exercise VNIC attachment module lifecycle
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Discover an availability domain in the compartment
      ansible.oci.oci_availability_domain_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
      register: oci_vnic_attachment_ad_info

    - name: Assert an availability domain was discovered
      ansible.builtin.assert:
        that:
          - oci_vnic_attachment_ad_info.availability_domains | length > 0

    - name: Set the working availability domain
      ansible.builtin.set_fact:
        oci_vnic_attachment_availability_domain: "{{ oci_vnic_attachment_ad_info.availability_domains[0].name }}"

    - name: Discover a compatible image
      ansible.oci.oci_image_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        operating_system: "{{ oci_vnic_attachment_integration_operating_system }}"
        operating_system_version: "{{ oci_vnic_attachment_integration_operating_system_version }}"
        shape: "{{ oci_vnic_attachment_integration_shape }}"
      register: oci_vnic_attachment_image_info

    - name: Assert a compatible image was discovered
      ansible.builtin.assert:
        that:
          - oci_vnic_attachment_image_info.images | length > 0

    - name: Create test VCN
      ansible.oci.oci_network_vcn:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_vnic_attachment_integration_vcn_name }}"
        cidr_blocks:
          - "{{ oci_vnic_attachment_integration_vcn_cidr_block }}"
      register: oci_vnic_attachment_vcn_create

    - name: Create test subnet
      ansible.oci.oci_network_subnet:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        vcn_id: "{{ oci_vnic_attachment_vcn_create.resource.id }}"
        cidr_block: "{{ oci_vnic_attachment_integration_subnet_cidr_block }}"
        name: "{{ oci_vnic_attachment_integration_subnet_name }}"
      register: oci_vnic_attachment_subnet_create

    - name: Create test compute instance
      ansible.oci.oci_instance:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        availability_domain: "{{ oci_vnic_attachment_availability_domain }}"
        name: "{{ oci_vnic_attachment_integration_instance_name }}"
        shape: "{{ oci_vnic_attachment_integration_shape }}"
        shape_config: "{{ oci_vnic_attachment_integration_shape_config }}"
        image_id: "{{ oci_vnic_attachment_image_info.images[0].id }}"
        subnet_id: "{{ oci_vnic_attachment_subnet_create.resource.id }}"
      register: oci_vnic_attachment_instance_create

    - name: Capture created instance ID
      ansible.builtin.set_fact:
        oci_vnic_attachment_instance_id: "{{ oci_vnic_attachment_instance_create.resource.id }}"

    - name: Create VNIC attachment in check mode
      ansible.oci.oci_vnic_attachment: &oci_vnic_attachment_create_options
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        instance_id: "{{ oci_vnic_attachment_instance_id }}"
        name: "{{ oci_vnic_attachment_integration_attachment_name }}"
        create_vnic_details:
          subnet_id: "{{ oci_vnic_attachment_subnet_create.resource.id }}"
          display_name: "{{ oci_vnic_attachment_integration_vnic_name }}"
          assign_public_ip: false
      check_mode: true
      register: oci_vnic_attachment_create_check

    - name: Assert create check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_vnic_attachment_create_check.changed | bool

    - name: Verify check mode did not create the attachment
      ansible.oci.oci_vnic_attachment_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        instance_id: "{{ oci_vnic_attachment_instance_id }}"
        name: "{{ oci_vnic_attachment_integration_attachment_name }}"
      register: oci_vnic_attachment_create_check_probe

    - name: Assert the attachment remains absent
      ansible.builtin.assert:
        that:
          - oci_vnic_attachment_create_check_probe.vnic_attachments | length == 0

    - name: Create VNIC attachment
      ansible.oci.oci_vnic_attachment:
        <<: *oci_vnic_attachment_create_options
      register: oci_vnic_attachment_create

    - name: Capture VNIC attachment ID
      ansible.builtin.set_fact:
        oci_vnic_attachment_id: "{{ oci_vnic_attachment_create.resource.id }}"

    - name: Assert attachment creation result
      ansible.builtin.assert:
        that:
          - oci_vnic_attachment_create.changed | bool
          - oci_vnic_attachment_create.resource.lifecycle_state == "ATTACHED"
          - oci_vnic_attachment_create.resource.instance_id == oci_vnic_attachment_instance_id
          - oci_vnic_attachment_create.resource.subnet_id == oci_vnic_attachment_subnet_create.resource.id
          - oci_vnic_attachment_create.resource.vnic_id | length > 0

    - name: Read created attachment by ID
      ansible.oci.oci_vnic_attachment_info:
        vnic_attachment_id: "{{ oci_vnic_attachment_id }}"
      register: oci_vnic_attachment_info_by_id

    - name: Assert info by ID returned the attachment
      ansible.builtin.assert:
        that:
          - oci_vnic_attachment_info_by_id.vnic_attachments | length == 1
          - oci_vnic_attachment_info_by_id.vnic_attachments[0].id == oci_vnic_attachment_id

    - name: Reconcile attachment by returned ID
      ansible.oci.oci_vnic_attachment:
        <<: *oci_vnic_attachment_create_options
        vnic_attachment_id: "{{ oci_vnic_attachment_id }}"
      register: oci_vnic_attachment_rerun_by_id

    - name: Assert ID reconciliation is idempotent
      ansible.builtin.assert:
        that:
          - not oci_vnic_attachment_rerun_by_id.changed | bool

    - name: Reconcile attachment by scoped name
      ansible.oci.oci_vnic_attachment:
        <<: *oci_vnic_attachment_create_options
      register: oci_vnic_attachment_rerun_by_name

    - name: Assert name reconciliation is idempotent
      ansible.builtin.assert:
        that:
          - not oci_vnic_attachment_rerun_by_name.changed | bool

    - name: Detach VNIC in check mode
      ansible.oci.oci_vnic_attachment: &oci_vnic_attachment_delete_options
        state: absent
        vnic_attachment_id: "{{ oci_vnic_attachment_id }}"
      check_mode: true
      register: oci_vnic_attachment_delete_check

    - name: Assert detach check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_vnic_attachment_delete_check.changed | bool

    - name: Verify check mode did not detach the VNIC
      ansible.oci.oci_vnic_attachment_info:
        vnic_attachment_id: "{{ oci_vnic_attachment_id }}"
      register: oci_vnic_attachment_delete_check_probe

    - name: Assert the attachment still exists
      ansible.builtin.assert:
        that:
          - oci_vnic_attachment_delete_check_probe.vnic_attachments | length == 1

    - name: Detach VNIC
      ansible.oci.oci_vnic_attachment:
        <<: *oci_vnic_attachment_delete_options
      register: oci_vnic_attachment_delete

    - name: Assert detach reported a change
      ansible.builtin.assert:
        that:
          - oci_vnic_attachment_delete.changed | bool

    - name: Detach VNIC again
      ansible.oci.oci_vnic_attachment:
        <<: *oci_vnic_attachment_delete_options
      register: oci_vnic_attachment_delete_rerun

    - name: Assert detach rerun is idempotent
      ansible.builtin.assert:
        that:
          - not oci_vnic_attachment_delete_rerun.changed | bool

  always:
    - name: Run VNIC attachment cleanup
      ansible.builtin.include_tasks: cleanup.yml
