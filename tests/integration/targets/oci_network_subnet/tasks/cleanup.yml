---
- name: Initialize deletion test status
  ansible.builtin.set_fact:
    oci_cleanup_checks_failed: false

- name: Delete leaked duplicate subnet during cleanup
  ansible.oci.oci_network_subnet:
    state: absent
    subnet_id: '{{ oci_subnet_duplicate_id }}'
  when:
    - oci_subnet_duplicate_id is defined
    - oci_subnet_duplicate_id | default('') | length > 0
  register: oci_cleanup_delete_leaked_duplicate_subnet_during_cleanup
  retries: 3
  ignore_errors: true

- name: Verify oci_network_subnet deletion
  when: oci_tests_completed | bool
  block:

    - name: Exercise subnet module lifecycle
      module_defaults:
        group/ansible.oci.oci:
          config_file_location: '{{ oci_integration_config_file_location }}'
          config_profile_name: '{{ oci_integration_config_profile_name }}'
      block:

        - name: Use the tested subnet for VCN dependency checks
          ansible.builtin.set_fact:
            oci_network_vcn_integration_subnet_id: '{{ oci_subnet_id }}'

        - name: Delete subnet in check mode
          ansible.oci.oci_network_subnet:
            state: '{{ oci_subnet_delete_params.state }}'
            subnet_id: '{{ oci_subnet_delete_params.subnet_id }}'
          check_mode: true
          register: oci_cleanup_delete_subnet_in_check_mode

        - name: Assert delete check mode reported a change
          ansible.builtin.assert:
            that:
              - oci_cleanup_delete_subnet_in_check_mode.changed | bool

        - name: Read subnet after delete check mode
          ansible.oci.oci_network_subnet_info:
            subnet_id: '{{ oci_subnet_id }}'
          register: oci_cleanup_read_subnet_after_delete_check_mode

        - name: Assert subnet still exists after delete check mode
          ansible.builtin.assert:
            that:
              - oci_cleanup_read_subnet_after_delete_check_mode.subnets | length == 1

        - name: Delete subnet
          ansible.oci.oci_network_subnet:
            state: '{{ oci_subnet_delete_params.state }}'
            subnet_id: '{{ oci_subnet_delete_params.subnet_id }}'
          register: oci_cleanup_delete_subnet

        - name: Assert delete reported a change
          ansible.builtin.assert:
            that:
              - oci_cleanup_delete_subnet.changed | bool

        - name: Assert delete is idempotent on rerun
          ansible.oci.oci_network_subnet:
            state: '{{ oci_subnet_delete_params.state }}'
            subnet_id: '{{ oci_subnet_delete_params.subnet_id }}'
          register: oci_cleanup_assert_delete_is_idempotent_on_rerun

        - name: Verify delete rerun is a no-op
          ansible.builtin.assert:
            that:
              - not oci_cleanup_assert_delete_is_idempotent_on_rerun.changed | bool
  rescue:

    - name: Record a deletion test failure
      ansible.builtin.set_fact:
        oci_cleanup_checks_failed: true

- name: Delete leaked subnet during cleanup
  ansible.oci.oci_network_subnet:
    state: absent
    subnet_id: '{{ oci_subnet_id }}'
  when:
    - oci_subnet_id is defined
    - oci_subnet_id | default('') | length > 0
  register: oci_cleanup_delete_leaked_subnet_during_cleanup
  retries: 3
  ignore_errors: true

- name: Delete prerequisite oci_network_vcn_create
  ansible.oci.oci_network_vcn:
    state: absent
    vcn_id: '{{ oci_network_vcn_create.resource.id }}'
  when:
    - oci_network_vcn_create is defined
    - oci_network_vcn_create.resource.id | default('') | length > 0
  register: oci_cleanup_delete_prerequisite_oci_network_vcn_create
  retries: 3
  delay: 5
  until: oci_cleanup_delete_prerequisite_oci_network_vcn_create is not failed
  ignore_errors: true

- name: Verify resource cleanup
  ansible.builtin.assert:
    that:
      - not oci_cleanup_checks_failed | bool
      - (oci_cleanup_delete_leaked_duplicate_subnet_during_cleanup | default({})) is not failed
      - (oci_cleanup_delete_leaked_subnet_during_cleanup | default({})) is not failed
      - (oci_cleanup_delete_prerequisite_oci_network_vcn_create | default({})) is not failed
    fail_msg: Resource cleanup or deletion checks failed. See the failed tasks above.
