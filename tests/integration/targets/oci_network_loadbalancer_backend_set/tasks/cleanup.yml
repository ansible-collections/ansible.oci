---
- name: Initialize deletion test status
  ansible.builtin.set_fact:
    oci_cleanup_checks_failed: false

- name: Delete the prerequisite backend set
  ansible.oci.oci_network_loadbalancer_backend_set:
    network_load_balancer_id: '{{ oci_nlb_test_id }}'
    name: '{{ oci_nlb_test_backend_set }}'
    state: absent
  when:
    - oci_nlb_test_id is defined
    - oci_nlb_test_backend_set is defined
    - oci_nlb_test_id | default('', true) | length > 0
    - oci_integration_rpfx | string in oci_nlb_test_backend_set | string
  ignore_errors: true
  register: oci_cleanup_delete_the_prerequisite_backend_set

- name: Remove prerequisite backend set
  ansible.oci.oci_network_loadbalancer_backend_set:
    network_load_balancer_id: '{{ oci_nlb_test_id }}'
    name: '{{ oci_nlb_test_backend_set }}'
    state: absent
  when:
    - oci_nlb_test_id is defined
    - oci_nlb_test_backend_set is defined
    - oci_nlb_test_id | default('') | length > 0
    - oci_integration_rpfx | string in oci_nlb_test_backend_set | string
  register: oci_cleanup_remove_prerequisite_backend_set
  ignore_errors: true

- name: Delete prerequisite oci_nlb_test_create
  ansible.oci.oci_network_loadbalancer:
    state: absent
    network_load_balancer_id: '{{ oci_nlb_test_create.resource.id }}'
  when:
    - oci_nlb_test_create is defined
    - oci_nlb_test_create.resource.id | default('') | length > 0
  register: oci_cleanup_delete_prerequisite_oci_nlb_test_create
  retries: 3
  delay: 5
  until: oci_cleanup_delete_prerequisite_oci_nlb_test_create is not failed
  ignore_errors: true

- name: Delete prerequisite oci_nlb_test_subnet
  ansible.oci.oci_network_subnet:
    state: absent
    subnet_id: '{{ oci_nlb_test_subnet.resource.id }}'
  when:
    - oci_nlb_test_subnet is defined
    - oci_nlb_test_subnet.resource.id | default('') | length > 0
  register: oci_cleanup_delete_prerequisite_oci_nlb_test_subnet
  retries: 3
  delay: 5
  until: oci_cleanup_delete_prerequisite_oci_nlb_test_subnet is not failed
  ignore_errors: true

- name: Delete prerequisite oci_nlb_test_vcn
  ansible.oci.oci_network_vcn:
    state: absent
    vcn_id: '{{ oci_nlb_test_vcn.resource.id }}'
  when:
    - oci_nlb_test_vcn is defined
    - oci_nlb_test_vcn.resource.id | default('') | length > 0
  register: oci_cleanup_delete_prerequisite_oci_nlb_test_vcn
  retries: 3
  delay: 5
  until: oci_cleanup_delete_prerequisite_oci_nlb_test_vcn is not failed
  ignore_errors: true

- name: Verify resource cleanup
  ansible.builtin.assert:
    that:
      - not oci_cleanup_checks_failed | bool
      - (oci_cleanup_delete_the_prerequisite_backend_set | default({})) is not failed
      - (oci_cleanup_remove_prerequisite_backend_set | default({})) is not failed
      - (oci_cleanup_delete_prerequisite_oci_nlb_test_create | default({})) is not failed
      - (oci_cleanup_delete_prerequisite_oci_nlb_test_subnet | default({})) is not failed
      - (oci_cleanup_delete_prerequisite_oci_nlb_test_vcn | default({})) is not failed
    fail_msg: Resource cleanup or deletion checks failed. See the failed tasks above.
