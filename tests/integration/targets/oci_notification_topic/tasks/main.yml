---
- name: Validate notification topic test inputs
  ansible.builtin.assert:
    that:
      - oci_integration_compartment_id | default('', true) | length > 0

- name: Initialize notification topic cleanup markers
  ansible.builtin.set_fact:
    oci_notification_topic_cleanup_id: ""
    oci_notification_topic_cleanup_name: "{{ oci_notification_topic_integration_name }}-{{ oci_integration_rpfx }}"
    oci_notification_topic_integration_name: "{{ oci_notification_topic_integration_name }}-{{ oci_integration_rpfx }}"

- name: Exercise notification topic lifecycle
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Check topic creation
      ansible.oci.oci_notification_topic: &topic_create
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_notification_topic_integration_name }}"
        description: "{{ oci_notification_topic_integration_description }}"
        freeform_tags:
          phase: create
      check_mode: true
      register: topic_create_check

    - name: Verify topic creation check left topic absent
      ansible.oci.oci_notification_topic_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_notification_topic_integration_name }}"
      register: topic_create_check_info
      failed_when: >-
        not topic_create_check.changed or
        topic_create_check_info.topics | length != 0

    - name: Create topic
      ansible.oci.oci_notification_topic:
        <<: *topic_create
      register: topic_create

    - name: Capture topic id for cleanup
      ansible.builtin.set_fact:
        oci_notification_topic_cleanup_id: "{{ topic_create.resource.topic_id }}"

    - name: Verify created topic values
      ansible.builtin.assert:
        that:
          - topic_create.changed
          - topic_create.resource.topic_id | length > 0
          - topic_create.resource.name == oci_notification_topic_integration_name
          - topic_create.resource.compartment_id == oci_integration_compartment_id
          - topic_create.resource.description == oci_notification_topic_integration_description
          - topic_create.resource.lifecycle_state == 'ACTIVE'
          - topic_create.resource.freeform_tags.phase == 'create'

    - name: Wait for topic visibility by exact name
      ansible.oci.oci_notification_topic_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_notification_topic_integration_name }}"
      register: topic_by_name
      until: topic_by_name.topics | length == 1
      retries: 12
      delay: 5

    - name: Verify topic creation is idempotent without topic_id
      ansible.oci.oci_notification_topic:
        <<: *topic_create
      register: topic_create_rerun
      failed_when: >-
        topic_create_rerun.changed or
        topic_create_rerun.resource.topic_id != topic_create.resource.topic_id

    - name: Verify topic creation is idempotent in check mode
      ansible.oci.oci_notification_topic:
        <<: *topic_create
      check_mode: true
      register: topic_create_check_rerun
      failed_when: >-
        topic_create_check_rerun.changed or
        topic_create_check_rerun.resource.topic_id != topic_create.resource.topic_id

    - name: Retrieve topic by id
      ansible.oci.oci_notification_topic_info:
        topic_id: "{{ topic_create.resource.topic_id }}"
      register: topic_by_id

    - name: Retrieve topics by compartment and lifecycle state
      ansible.oci.oci_notification_topic_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        lifecycle_state: active
      register: topics_active

    - name: Verify info queries return the topic
      ansible.builtin.assert:
        that:
          - topic_by_id.topics | length == 1
          - topic_by_id.topics[0].topic_id == topic_create.resource.topic_id
          - topic_by_id.topics[0].name == oci_notification_topic_integration_name
          - topic_by_id.topics[0].compartment_id == oci_integration_compartment_id
          - topics_active.topics | selectattr('topic_id', 'equalto', topic_create.resource.topic_id) | list | length == 1

    - name: Check topic update
      ansible.oci.oci_notification_topic: &topic_update
        topic_id: "{{ topic_create.resource.topic_id }}"
        description: "{{ oci_notification_topic_integration_description }} updated"
        freeform_tags:
          phase: update
      check_mode: true
      register: topic_update_check
      failed_when: not topic_update_check.changed

    - name: Verify topic update check left topic unchanged
      ansible.oci.oci_notification_topic_info:
        topic_id: "{{ topic_create.resource.topic_id }}"
      register: topic_update_check_info
      failed_when: >-
        topic_update_check_info.topics | length != 1 or
        topic_update_check_info.topics[0].description !=
          oci_notification_topic_integration_description or
        topic_update_check_info.topics[0].freeform_tags.phase != 'create'

    - name: Update topic
      ansible.oci.oci_notification_topic:
        <<: *topic_update
      register: topic_update

    - name: Verify updated topic values
      ansible.builtin.assert:
        that:
          - topic_update.changed
          - topic_update.resource.topic_id == topic_create.resource.topic_id
          - topic_update.resource.name == oci_notification_topic_integration_name
          - topic_update.resource.description == oci_notification_topic_integration_description + ' updated'
          - topic_update.resource.freeform_tags.phase == 'update'

    - name: Wait for topic update visibility
      ansible.oci.oci_notification_topic_info:
        topic_id: "{{ topic_create.resource.topic_id }}"
      register: topic_after_update
      until: >-
        topic_after_update.topics | length == 1 and
        topic_after_update.topics[0].freeform_tags.phase == 'update' and
        topic_after_update.topics[0].description ==
          oci_notification_topic_integration_description + ' updated'
      retries: 12
      delay: 5

    - name: Verify update is idempotent in normal mode
      ansible.oci.oci_notification_topic:
        <<: *topic_update
      register: topic_update_rerun
      failed_when: topic_update_rerun.changed

    - name: Verify update is idempotent in check mode
      ansible.oci.oci_notification_topic:
        <<: *topic_update
      check_mode: true
      register: topic_update_check_rerun
      failed_when: topic_update_check_rerun.changed

    - name: Check tags-only update by name lookup
      ansible.oci.oci_notification_topic: &topic_tags_update
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_notification_topic_integration_name }}"
        freeform_tags:
          phase: tags-only
      check_mode: true
      register: topic_tags_update_check
      failed_when: not topic_tags_update_check.changed

    - name: Verify tags-only check left topic unchanged
      ansible.oci.oci_notification_topic_info:
        topic_id: "{{ topic_create.resource.topic_id }}"
      register: topic_tags_update_check_info
      failed_when: >-
        topic_tags_update_check_info.topics | length != 1 or
        topic_tags_update_check_info.topics[0].freeform_tags.phase != 'update' or
        topic_tags_update_check_info.topics[0].description !=
          oci_notification_topic_integration_description + ' updated'

    - name: Update topic tags only by name lookup
      ansible.oci.oci_notification_topic:
        <<: *topic_tags_update
      register: topic_tags_update

    - name: Verify tags-only update preserved the description
      ansible.builtin.assert:
        that:
          - topic_tags_update.changed
          - topic_tags_update.resource.topic_id == topic_create.resource.topic_id
          - topic_tags_update.resource.freeform_tags.phase == 'tags-only'
          - topic_tags_update.resource.description == oci_notification_topic_integration_description + ' updated'

    - name: Wait for tags-only update visibility
      ansible.oci.oci_notification_topic_info:
        topic_id: "{{ topic_create.resource.topic_id }}"
      register: topic_after_tags_update
      until: >-
        topic_after_tags_update.topics | length == 1 and
        topic_after_tags_update.topics[0].freeform_tags.phase == 'tags-only' and
        topic_after_tags_update.topics[0].description ==
          oci_notification_topic_integration_description + ' updated'
      retries: 12
      delay: 5

    - name: Verify tags-only update is idempotent in normal mode
      ansible.oci.oci_notification_topic:
        <<: *topic_tags_update
      register: topic_tags_update_rerun
      failed_when: >-
        topic_tags_update_rerun.changed or
        topic_tags_update_rerun.resource.topic_id != topic_create.resource.topic_id

    - name: Verify tags-only update is idempotent in check mode
      ansible.oci.oci_notification_topic:
        <<: *topic_tags_update
      check_mode: true
      register: topic_tags_update_check_rerun
      failed_when: >-
        topic_tags_update_check_rerun.changed or
        topic_tags_update_check_rerun.resource.topic_id != topic_create.resource.topic_id

    - name: Check topic deletion
      ansible.oci.oci_notification_topic: &topic_delete
        topic_id: "{{ topic_create.resource.topic_id }}"
        state: absent
      check_mode: true
      register: topic_delete_check
      failed_when: not topic_delete_check.changed

    - name: Verify deletion check left topic present
      ansible.oci.oci_notification_topic_info:
        topic_id: "{{ topic_create.resource.topic_id }}"
      register: topic_delete_check_info
      failed_when: topic_delete_check_info.topics | length != 1

    - name: Delete topic
      ansible.oci.oci_notification_topic:
        <<: *topic_delete
      register: topic_delete
      failed_when: not topic_delete.changed

    - name: Wait until topic is absent from the active list
      ansible.oci.oci_notification_topic_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_notification_topic_integration_name }}"
        lifecycle_state: active
      register: topic_after_delete
      until: topic_after_delete.topics | length == 0
      retries: 12
      delay: 5

    - name: Verify topic deletion is idempotent
      ansible.oci.oci_notification_topic:
        <<: *topic_delete
      register: topic_delete_rerun
      failed_when: topic_delete_rerun.changed

    - name: Verify topic deletion is idempotent in check mode
      ansible.oci.oci_notification_topic:
        <<: *topic_delete
      check_mode: true
      register: topic_delete_check_rerun
      failed_when: topic_delete_check_rerun.changed

    - name: Clear topic cleanup markers after verified delete
      ansible.builtin.set_fact:
        oci_notification_topic_cleanup_id: ""
        oci_notification_topic_cleanup_name: ""

  always:
    - name: Clean up the temporary topic
      ansible.builtin.include_tasks: cleanup.yml
