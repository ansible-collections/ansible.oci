---
oci_blockstorage_volume_integration_volume_name: oci-blockstorage-volume-integration-volume
oci_blockstorage_volume_integration_updated_volume_name: oci-blockstorage-volume-integration-volume-updated
oci_blockstorage_volume_integration_restore_volume_name: oci-blockstorage-volume-integration-restore
oci_blockstorage_volume_integration_backup_name: oci-blockstorage-volume-integration-backup
oci_blockstorage_volume_integration_size_in_gbs: 50
oci_blockstorage_volume_integration_vpus_per_gb: 10
oci_blockstorage_volume_integration_create_tags:
  phase: create
  role: integration
oci_volume_backup_policy_integration_name: oci-volume-backup-policy-integration
oci_volume_backup_policy_integration_updated_name: oci-volume-backup-policy-integration-updated
oci_volume_backup_policy_integration_create_schedule:
  - backup_type: incremental
    period: one_day
    offset_type: structured
    hour_of_day: 2
    retention_seconds: 604800
    time_zone: utc
oci_volume_backup_policy_integration_update_schedule:
  - backup_type: full
    period: one_week
    offset_type: structured
    hour_of_day: 3
    day_of_week: sunday
    retention_seconds: 1209600
    time_zone: utc
oci_volume_backup_policy_integration_create_tags:
  phase: create
  role: integration
oci_volume_backup_policy_integration_update_tags:
  phase: update
  role: integration
oci_volume_backup_policy_assignment_volume_name: oci-policy-assignment-volume
oci_volume_backup_policy_assignment_first_policy_name: oci-policy-assignment-first
oci_volume_backup_policy_assignment_second_policy_name: oci-policy-assignment-second
oci_volume_backup_policy_assignment_schedule:
  - backup_type: incremental
    period: one_day
    offset_type: structured
    hour_of_day: 2
    retention_seconds: 604800
    time_zone: utc
