---
- name: Delete leaked volume backup policy during cleanup
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  ansible.oci.oci_volume_backup_policy:
    state: absent
    volume_backup_policy_id: "{{ oci_volume_backup_policy_id }}"
  when: oci_volume_backup_policy_id | default('') | length > 0
