---
- name: Clean up the temporary identity domain
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Delete leaked group by ID
      ansible.oci.oci_iam_group:
        state: absent
        domain_id: "{{ oci_iam_group_domain_id }}"
        group_id: "{{ oci_iam_group_cleanup_id }}"
      when:
        - oci_iam_group_domain_id | length > 0
        - oci_iam_group_cleanup_id | default('') | length > 0

    - name: Delete leaked group by name when no ID was captured
      ansible.oci.oci_iam_group:
        state: absent
        domain_id: "{{ oci_iam_group_domain_id }}"
        name: "{{ oci_iam_group_cleanup_name }}"
      when:
        - oci_iam_group_domain_id | length > 0
        - oci_iam_group_cleanup_id | default('') | length == 0
        - oci_iam_group_cleanup_name | default('') | length > 0

    - name: Delete temporary identity domain by ID
      ansible.oci.oci_iam_domain:
        state: absent
        domain_id: "{{ oci_iam_group_domain_id }}"
      when: oci_iam_group_domain_id | length > 0

    - name: Delete temporary identity domain by name when no ID was captured
      ansible.oci.oci_iam_domain:
        state: absent
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_iam_group_integration_domain_name }}"
      when: oci_iam_group_domain_id | length == 0
