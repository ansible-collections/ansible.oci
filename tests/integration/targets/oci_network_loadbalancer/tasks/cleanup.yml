---
- name: Initialize cleanup failures
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: []

- name: Delete the listener before backend cleanup
  ansible.oci.oci_network_loadbalancer_listener:
    network_load_balancer_id: '{{ oci_nlb_test_id }}'
    name: '{{ oci_nlb_test_listener }}'
    state: absent
  when:
    - oci_group_started_oci_network_loadbalancer_listener | default(false)
    - oci_nlb_test_id | default('', true) | length > 0
  register: oci_group_cleanup_0
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Delete the listener before backend cleanup''] }}'
  when: oci_group_cleanup_0 is failed

- name: Delete the prerequisite backend set
  ansible.oci.oci_network_loadbalancer_backend_set:
    network_load_balancer_id: '{{ oci_nlb_test_id }}'
    name: '{{ oci_nlb_test_backend_set }}'
    state: absent
  when:
    - oci_group_started_oci_network_loadbalancer_listener | default(false)
    - oci_nlb_test_id | default('', true) | length > 0
  register: oci_group_cleanup_2
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Delete the prerequisite backend set''] }}'
  when: oci_group_cleanup_2 is failed

- name: Delete the prerequisite backend set
  ansible.oci.oci_network_loadbalancer_backend_set:
    network_load_balancer_id: '{{ oci_nlb_test_id }}'
    name: '{{ oci_nlb_test_backend_set }}'
    state: absent
  when:
    - oci_group_started_oci_network_loadbalancer_health_checker | default(false)
    - oci_nlb_test_id | default('', true) | length > 0
  ignore_errors: true
  register: oci_group_cleanup_4

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Delete the prerequisite backend set''] }}'
  when: oci_group_cleanup_4 is failed

- name: Remove prerequisite backend set
  ansible.oci.oci_network_loadbalancer_backend_set:
    network_load_balancer_id: '{{ oci_nlb_test_id }}'
    name: '{{ oci_nlb_test_backend_set }}'
    state: absent
  when:
    - oci_group_started_oci_network_loadbalancer_backend | default(false)
    - oci_nlb_test_id | default('') | length > 0
  register: oci_group_cleanup_6
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Remove prerequisite backend set''] }}'
  when: oci_group_cleanup_6 is failed

- name: Delete known test network load balancer names
  ansible.oci.oci_network_loadbalancer:
    compartment_id: '{{ oci_integration_compartment_id }}'
    name: '{{ item }}'
    state: absent
  loop:
    - '{{ oci_nlb_integration_public_name }}'
    - '{{ oci_nlb_integration_updated_name }}'
    - '{{ oci_nlb_integration_private_name }}'
    - '{{ oci_nlb_integration_ipv6_name }}'
  register: oci_group_cleanup_8
  until: oci_group_cleanup_8 is succeeded
  retries: 10
  delay: 30
  when:
    - oci_group_started_oci_network_loadbalancer | default(false)
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Delete known test network load balancer names''] }}'
  when: oci_group_cleanup_8 is failed

- name: Delete test network load balancers
  ansible.oci.oci_network_loadbalancer:
    network_load_balancer_id: '{{ item }}'
    state: absent
  loop: '{{ oci_nlb_cleanup_ids | default([]) | unique }}'
  register: oci_group_cleanup_10
  until: oci_group_cleanup_10 is succeeded
  retries: 10
  delay: 30
  when:
    - oci_group_started_oci_network_loadbalancer | default(false)
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Delete test network load balancers''] }}'
  when: oci_group_cleanup_10 is failed

- name: Delete the test network security group
  ansible.oci.oci_network_security_group:
    network_security_group_id: '{{ oci_nlb_nsg_id }}'
    state: absent
  when:
    - oci_group_started_oci_network_loadbalancer | default(false)
    - oci_nlb_nsg_id | default('', true) | length > 0
  register: oci_group_cleanup_12
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Delete the test network security group''] }}'
  when: oci_group_cleanup_12 is failed

- name: Delete the private test subnet
  ansible.oci.oci_network_subnet:
    compartment_id: '{{ oci_integration_compartment_id }}'
    subnet_id: '{{ oci_nlb_private_subnet_id }}'
    state: absent
  when:
    - oci_group_started_oci_network_loadbalancer | default(false)
    - oci_nlb_private_subnet_id | default('', true) | length > 0
  register: oci_group_cleanup_14
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Delete the private test subnet''] }}'
  when: oci_group_cleanup_14 is failed

- name: Delete the public test subnet
  ansible.oci.oci_network_subnet:
    compartment_id: '{{ oci_integration_compartment_id }}'
    subnet_id: '{{ oci_nlb_public_subnet_id }}'
    state: absent
  when:
    - oci_group_started_oci_network_loadbalancer | default(false)
    - oci_nlb_public_subnet_id | default('', true) | length > 0
  register: oci_group_cleanup_16
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Delete the public test subnet''] }}'
  when: oci_group_cleanup_16 is failed

- name: Delete the test VCN
  ansible.oci.oci_network_vcn:
    compartment_id: '{{ oci_integration_compartment_id }}'
    vcn_id: '{{ oci_nlb_vcn_id }}'
    state: absent
  when:
    - oci_group_started_oci_network_loadbalancer | default(false)
    - oci_nlb_vcn_id | default('', true) | length > 0
  register: oci_group_cleanup_18
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Delete the test VCN''] }}'
  when: oci_group_cleanup_18 is failed

- name: Check all cleanup results
  ansible.builtin.assert:
    that:
      - oci_group_cleanup_failures | length == 0
    fail_msg: 'Cleanup failed for: {{ oci_group_cleanup_failures | join(", ") }}'
