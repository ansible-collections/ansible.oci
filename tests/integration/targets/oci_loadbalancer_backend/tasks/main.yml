---
- name: Exercise backend lifecycle
  block:
    - name: Prepare the parent load balancer
      ansible.builtin.include_role:
        name: prepare_oci_loadbalancer_subresources

    - name: Create the prerequisite backend set
      ansible.oci.oci_loadbalancer_backend_set:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
        policy: round_robin
        health_checker:
          protocol: tcp
          port: 8080
          return_code: 200
          retries: 3
          timeout_in_millis: 3000
          interval_in_millis: 10000
          response_body_regex: .*

    - name: Read state before backend registration
      ansible.oci.oci_loadbalancer_backend_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        backend_set_name: '{{ oci_lb_test_backend_set }}'
        name: 10.253.1.10:8080
      register: oci_lb_before

    - name: Predict backend registration
      ansible.oci.oci_loadbalancer_backend:
        load_balancer_id: '{{ oci_lb_test_id }}'
        backend_set_name: '{{ oci_lb_test_backend_set }}'
        name: 10.253.1.10:8080
        ip_address: 10.253.1.10
        port: 8080
        weight: 1
        backup: false
        drain: false
        offline: false
      check_mode: true
      register: oci_lb_prediction

    - name: Assert change predicted
      ansible.builtin.assert:
        that:
          - oci_lb_prediction.changed | bool

    - name: Read state after check mode
      ansible.oci.oci_loadbalancer_backend_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        backend_set_name: '{{ oci_lb_test_backend_set }}'
        name: 10.253.1.10:8080
      register: oci_lb_after_check

    - name: Assert check mode preserved OCI state
      ansible.builtin.assert:
        that:
          - oci_lb_before.backends == oci_lb_after_check.backends

    - name: Apply backend registration
      ansible.oci.oci_loadbalancer_backend:
        load_balancer_id: '{{ oci_lb_test_id }}'
        backend_set_name: '{{ oci_lb_test_backend_set }}'
        name: 10.253.1.10:8080
        ip_address: 10.253.1.10
        port: 8080
        weight: 1
        backup: false
        drain: false
        offline: false
      register: oci_lb_applied

    - name: Assert operation changed OCI state
      ansible.builtin.assert:
        that:
          - oci_lb_applied.changed | bool

    - name: Read resulting state
      ansible.oci.oci_loadbalancer_backend_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        backend_set_name: '{{ oci_lb_test_backend_set }}'
        name: 10.253.1.10:8080
      register: oci_lb_after

    - name: Assert resource configuration
      ansible.builtin.assert:
        that:
          - oci_lb_after.backends | length == 1
          - oci_lb_after.backends[0].ip_address == '10.253.1.10'
          - oci_lb_after.backends[0].port == 8080
          - oci_lb_after.backends[0].weight == 1

    - name: Test backend registration idempotency
      ansible.oci.oci_loadbalancer_backend:
        load_balancer_id: '{{ oci_lb_test_id }}'
        backend_set_name: '{{ oci_lb_test_backend_set }}'
        name: 10.253.1.10:8080
        ip_address: 10.253.1.10
        port: 8080
        weight: 1
        backup: false
        drain: false
        offline: false
      register: oci_lb_repeat

    - name: Test backend registration idempotency in check mode
      ansible.oci.oci_loadbalancer_backend:
        load_balancer_id: '{{ oci_lb_test_id }}'
        backend_set_name: '{{ oci_lb_test_backend_set }}'
        name: 10.253.1.10:8080
        ip_address: 10.253.1.10
        port: 8080
        weight: 1
        backup: false
        drain: false
        offline: false
      check_mode: true
      register: oci_lb_repeat_check

    - name: Assert idempotency in normal and check mode
      ansible.builtin.assert:
        that:
          - not oci_lb_repeat.changed | bool
          - not oci_lb_repeat_check.changed | bool

    - name: Read remote state after idempotency tests
      ansible.oci.oci_loadbalancer_backend_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        backend_set_name: '{{ oci_lb_test_backend_set }}'
        name: 10.253.1.10:8080
      register: oci_lb_final

    - name: Assert idempotency tests preserved remote state
      ansible.builtin.assert:
        that:
          - oci_lb_final.backends == oci_lb_after.backends

    - name: List registered backends
      ansible.oci.oci_loadbalancer_backend_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        backend_set_name: '{{ oci_lb_test_backend_set }}'
      register: oci_lb_backends

    - name: Assert backend registration is listed
      ansible.builtin.assert:
        that:
          - '''10.253.1.10:8080'' in (oci_lb_backends.backends | map(attribute=''name'') | list)'

    - name: Read state before backend update
      ansible.oci.oci_loadbalancer_backend_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        backend_set_name: '{{ oci_lb_test_backend_set }}'
        name: 10.253.1.10:8080
      register: oci_lb_before

    - name: Predict backend update
      ansible.oci.oci_loadbalancer_backend:
        load_balancer_id: '{{ oci_lb_test_id }}'
        backend_set_name: '{{ oci_lb_test_backend_set }}'
        name: 10.253.1.10:8080
        ip_address: 10.253.1.10
        port: 8080
        weight: 2
        drain: true
      check_mode: true
      register: oci_lb_prediction

    - name: Assert change predicted
      ansible.builtin.assert:
        that:
          - oci_lb_prediction.changed | bool

    - name: Read state after check mode
      ansible.oci.oci_loadbalancer_backend_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        backend_set_name: '{{ oci_lb_test_backend_set }}'
        name: 10.253.1.10:8080
      register: oci_lb_after_check

    - name: Assert check mode preserved OCI state
      ansible.builtin.assert:
        that:
          - oci_lb_before.backends == oci_lb_after_check.backends

    - name: Apply backend update
      ansible.oci.oci_loadbalancer_backend:
        load_balancer_id: '{{ oci_lb_test_id }}'
        backend_set_name: '{{ oci_lb_test_backend_set }}'
        name: 10.253.1.10:8080
        ip_address: 10.253.1.10
        port: 8080
        weight: 2
        drain: true
      register: oci_lb_applied

    - name: Assert operation changed OCI state
      ansible.builtin.assert:
        that:
          - oci_lb_applied.changed | bool

    - name: Read resulting state
      ansible.oci.oci_loadbalancer_backend_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        backend_set_name: '{{ oci_lb_test_backend_set }}'
        name: 10.253.1.10:8080
      register: oci_lb_after

    - name: Assert resource configuration
      ansible.builtin.assert:
        that:
          - oci_lb_after.backends | length == 1
          - oci_lb_after.backends[0].weight == 2
          - oci_lb_after.backends[0].drain == True
          - oci_lb_after.backends[0].backup == False
          - oci_lb_after.backends[0].offline == False

    - name: Test backend update idempotency
      ansible.oci.oci_loadbalancer_backend:
        load_balancer_id: '{{ oci_lb_test_id }}'
        backend_set_name: '{{ oci_lb_test_backend_set }}'
        name: 10.253.1.10:8080
        ip_address: 10.253.1.10
        port: 8080
        weight: 2
        drain: true
      register: oci_lb_repeat

    - name: Test backend update idempotency in check mode
      ansible.oci.oci_loadbalancer_backend:
        load_balancer_id: '{{ oci_lb_test_id }}'
        backend_set_name: '{{ oci_lb_test_backend_set }}'
        name: 10.253.1.10:8080
        ip_address: 10.253.1.10
        port: 8080
        weight: 2
        drain: true
      check_mode: true
      register: oci_lb_repeat_check

    - name: Assert idempotency in normal and check mode
      ansible.builtin.assert:
        that:
          - not oci_lb_repeat.changed | bool
          - not oci_lb_repeat_check.changed | bool

    - name: Read remote state after idempotency tests
      ansible.oci.oci_loadbalancer_backend_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        backend_set_name: '{{ oci_lb_test_backend_set }}'
        name: 10.253.1.10:8080
      register: oci_lb_final

    - name: Assert idempotency tests preserved remote state
      ansible.builtin.assert:
        that:
          - oci_lb_final.backends == oci_lb_after.backends

    - name: Read state before backend deregistration
      ansible.oci.oci_loadbalancer_backend_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        backend_set_name: '{{ oci_lb_test_backend_set }}'
        name: 10.253.1.10:8080
      register: oci_lb_before

    - name: Predict backend deregistration
      ansible.oci.oci_loadbalancer_backend:
        load_balancer_id: '{{ oci_lb_test_id }}'
        backend_set_name: '{{ oci_lb_test_backend_set }}'
        name: 10.253.1.10:8080
        ip_address: 10.253.1.10
        port: 8080
        state: absent
      check_mode: true
      register: oci_lb_prediction

    - name: Assert change predicted
      ansible.builtin.assert:
        that:
          - oci_lb_prediction.changed | bool

    - name: Read state after check mode
      ansible.oci.oci_loadbalancer_backend_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        backend_set_name: '{{ oci_lb_test_backend_set }}'
        name: 10.253.1.10:8080
      register: oci_lb_after_check

    - name: Assert check mode preserved OCI state
      ansible.builtin.assert:
        that:
          - oci_lb_before.backends == oci_lb_after_check.backends

    - name: Apply backend deregistration
      ansible.oci.oci_loadbalancer_backend:
        load_balancer_id: '{{ oci_lb_test_id }}'
        backend_set_name: '{{ oci_lb_test_backend_set }}'
        name: 10.253.1.10:8080
        ip_address: 10.253.1.10
        port: 8080
        state: absent
      register: oci_lb_applied

    - name: Assert operation changed OCI state
      ansible.builtin.assert:
        that:
          - oci_lb_applied.changed | bool

    - name: Read resulting state
      ansible.oci.oci_loadbalancer_backend_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        backend_set_name: '{{ oci_lb_test_backend_set }}'
        name: 10.253.1.10:8080
      register: oci_lb_after

    - name: Assert resource was deleted
      ansible.builtin.assert:
        that:
          - oci_lb_after.backends | length == 0

    - name: Test backend deregistration idempotency
      ansible.oci.oci_loadbalancer_backend:
        load_balancer_id: '{{ oci_lb_test_id }}'
        backend_set_name: '{{ oci_lb_test_backend_set }}'
        name: 10.253.1.10:8080
        ip_address: 10.253.1.10
        port: 8080
        state: absent
      register: oci_lb_repeat

    - name: Test backend deregistration idempotency in check mode
      ansible.oci.oci_loadbalancer_backend:
        load_balancer_id: '{{ oci_lb_test_id }}'
        backend_set_name: '{{ oci_lb_test_backend_set }}'
        name: 10.253.1.10:8080
        ip_address: 10.253.1.10
        port: 8080
        state: absent
      check_mode: true
      register: oci_lb_repeat_check

    - name: Assert idempotency in normal and check mode
      ansible.builtin.assert:
        that:
          - not oci_lb_repeat.changed | bool
          - not oci_lb_repeat_check.changed | bool

    - name: Read remote state after idempotency tests
      ansible.oci.oci_loadbalancer_backend_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        backend_set_name: '{{ oci_lb_test_backend_set }}'
        name: 10.253.1.10:8080
      register: oci_lb_final

    - name: Assert idempotency tests preserved remote state
      ansible.builtin.assert:
        that:
          - oci_lb_final.backends == oci_lb_after.backends
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: '{{ oci_integration_config_file_location }}'
      config_profile_name: '{{ oci_integration_config_profile_name }}'
  vars:
    oci_lb_test_suffix: backend

  always:
    - name: Clean up test-owned resources
      ansible.builtin.include_role:
        name: prepare_oci_loadbalancer_subresources
        tasks_from: cleanup
