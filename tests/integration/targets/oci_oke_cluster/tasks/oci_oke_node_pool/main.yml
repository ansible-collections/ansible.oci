---
- name: Check the test compartment
  ansible.builtin.assert:
    that:
      - oci_integration_compartment_id | default('', true) | length > 0

- name: Set unique test names
  ansible.builtin.set_fact:
    oci_oke_np_cleanup_ids: []
    oci_oke_node_pool_integration_vcn_name: '{{ oci_oke_node_pool_integration_vcn_name }}-{{ oci_integration_rpfx }}'
    oci_oke_node_pool_integration_subnet_name: '{{ oci_oke_node_pool_integration_subnet_name }}-{{ oci_integration_rpfx }}'
    oci_oke_node_pool_integration_igw_name: '{{ oci_oke_node_pool_integration_igw_name }}-{{ oci_integration_rpfx }}'
    oci_oke_node_pool_integration_route_table_name: '{{ oci_oke_node_pool_integration_route_table_name }}-{{ oci_integration_rpfx
      }}'
    oci_oke_node_pool_integration_security_list_name: '{{ oci_oke_node_pool_integration_security_list_name }}-{{ oci_integration_rpfx
      }}'
    oci_oke_node_pool_integration_cluster_name: '{{ oci_oke_node_pool_integration_cluster_name }}-{{ oci_integration_rpfx
      }}'
    oci_oke_node_pool_integration_name: '{{ oci_oke_node_pool_integration_name }}-{{ oci_integration_rpfx }}'
    oci_oke_node_pool_integration_updated_name: '{{ oci_oke_node_pool_integration_updated_name }}-{{ oci_integration_rpfx
      }}'
    oci_oke_node_pool_integration_subnet_cidr: '{{ oci_oke_cluster_integration_subnet_cidr }}'

- name: Mark oci_oke_node_pool as started
  ansible.builtin.set_fact:
    oci_group_started_oci_oke_node_pool: true

- name: Test the OKE node pool lifecycle
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: '{{ oci_integration_config_file_location }}'
      config_profile_name: '{{ oci_integration_config_profile_name }}'
  block:

    - name: Get an availability domain
      ansible.oci.oci_identity_availability_domain_info:
        compartment_id: '{{ oci_integration_compartment_id }}'
      register: oci_oke_np_ads

    - name: Save the availability domain name
      ansible.builtin.set_fact:
        oci_oke_np_ad: '{{ oci_oke_np_ads.availability_domains[0].name }}'

    - name: Use the shared vcn
      ansible.builtin.set_fact:
        oci_oke_np_vcn: '{{ oci_prerequisites.vcn }}'

    - name: Save the VCN ID
      ansible.builtin.set_fact:
        oci_oke_np_vcn_id: '{{ oci_oke_np_vcn.resource.id }}'

    - name: Create the internet gateway
      ansible.oci.oci_network_internet_gateway:
        compartment_id: '{{ oci_integration_compartment_id }}'
        vcn_id: '{{ oci_oke_np_vcn_id }}'
        name: '{{ oci_oke_node_pool_integration_igw_name }}'
        is_enabled: true
      register: oci_oke_np_igw

    - name: Save the internet gateway ID
      ansible.builtin.set_fact:
        oci_oke_np_igw_id: '{{ oci_oke_np_igw.resource.id }}'

    - name: Create the route table
      ansible.oci.oci_network_route_table:
        compartment_id: '{{ oci_integration_compartment_id }}'
        vcn_id: '{{ oci_oke_np_vcn_id }}'
        name: '{{ oci_oke_node_pool_integration_route_table_name }}'
        route_rules:
          - destination: 0.0.0.0/0
            destination_type: CIDR_BLOCK
            network_entity_id: '{{ oci_oke_np_igw_id }}'
      register: oci_oke_np_route_table

    - name: Save the route table ID
      ansible.builtin.set_fact:
        oci_oke_np_route_table_id: '{{ oci_oke_np_route_table.resource.id }}'

    - name: Create the security list
      ansible.oci.oci_network_security_list:
        compartment_id: '{{ oci_integration_compartment_id }}'
        vcn_id: '{{ oci_oke_np_vcn_id }}'
        name: '{{ oci_oke_node_pool_integration_security_list_name }}'
        ingress_security_rules:
          - source: '{{ oci_oke_node_pool_integration_subnet_cidr }}'
            protocol: all
            description: All traffic between workers and the API endpoint
          - source: 0.0.0.0/0
            protocol: '6'
            description: Kubernetes API endpoint
            tcp_options:
              destination_port_min: 6443
              destination_port_max: 6443
          - source: 0.0.0.0/0
            protocol: '1'
            description: Path MTU discovery
            icmp_options:
              type: 3
              code: 4
        egress_security_rules:
          - destination: 0.0.0.0/0
            protocol: all
      register: oci_oke_np_security_list

    - name: Save the security list ID
      ansible.builtin.set_fact:
        oci_oke_np_security_list_id: '{{ oci_oke_np_security_list.resource.id }}'

    - name: Configure the shared endpoint subnet for worker nodes
      ansible.oci.oci_network_subnet:
        subnet_id: '{{ oci_oke_subnet_id }}'
        route_table_id: '{{ oci_oke_np_route_table_id }}'
        security_list_ids:
          - '{{ oci_oke_np_security_list_id }}'
      register: oci_oke_np_subnet

    - name: Save the subnet ID
      ansible.builtin.set_fact:
        oci_oke_np_subnet_id: '{{ oci_oke_np_subnet.resource.id }}'

    - name: Use the shared cluster
      ansible.builtin.set_fact:
        oci_oke_np_cluster: '{{ oci_prerequisites.cluster }}'

    - name: Save the cluster ID and Kubernetes version
      ansible.builtin.set_fact:
        oci_oke_np_cluster_id: '{{ oci_oke_np_cluster.resource.id }}'
        oci_oke_np_k8s_version: '{{ oci_oke_np_cluster.resource.kubernetes_version }}'

    - name: List the node pool images available for the cluster and shape
      ansible.oci.oci_oke_node_pool_options_info:
        node_pool_option_id: '{{ oci_oke_np_cluster_id }}'
        node_pool_os_arch: '{{ oci_oke_node_pool_integration_node_os_arch }}'
        node_pool_k8s_version: '{{ oci_oke_np_k8s_version }}'
      register: oci_oke_np_options

    - name: Select a worker-node image for the node pool
      ansible.builtin.set_fact:
        oci_oke_np_image_id: |-
          {{
            oci_oke_node_pool_integration_image_id
            if (oci_oke_node_pool_integration_image_id | default('', true) | length > 0)
            else (
              oci_oke_np_options.node_pool_options[0].sources
              | selectattr('image_id')
              | rejectattr('source_name', 'search', 'GPU')
              | selectattr('source_name', 'search',
                  '-OKE-' ~ (oci_oke_np_k8s_version | regex_replace('^v', '') | regex_escape) ~ '(-|$)')
              | map(attribute='image_id') | first | default('')
            )
          }}

    - name: Check the options yielded a selectable worker-node image
      ansible.builtin.assert:
        that:
          - not oci_oke_np_options.changed | bool
          - oci_oke_np_options.node_pool_options | length == 1
          - oci_oke_np_options.node_pool_options[0].sources | length > 0
          - oci_oke_np_image_id | length > 0
        fail_msg: |-
          No worker-node image was found for cluster {{ oci_oke_np_cluster_id }}, architecture {{
          oci_oke_node_pool_integration_node_os_arch }}, and Kubernetes version {{ oci_oke_np_k8s_version }}.
          Set oci_oke_node_pool_integration_image_id to override discovery.

    - name: Test node pool creation
      ansible.builtin.include_tasks: test_node_pool_scenario.yml
      vars:
        oci_oke_lookup_name: '{{ oci_oke_node_pool_integration_name }}'
        oci_oke_operation:
          compartment_id: '{{ oci_integration_compartment_id }}'
          cluster_id: '{{ oci_oke_np_cluster_id }}'
          name: '{{ oci_oke_node_pool_integration_name }}'
          node_shape: '{{ oci_oke_node_pool_integration_node_shape }}'
          node_shape_config:
            ocpus: '{{ oci_oke_node_pool_integration_node_ocpus }}'
            memory_in_gbs: '{{ oci_oke_node_pool_integration_node_memory_gbs }}'
          node_source_details:
            image_id: '{{ oci_oke_np_image_id }}'
          node_config_details:
            size: 1
            placement_configs:
              - availability_domain: '{{ oci_oke_np_ad }}'
                subnet_id: '{{ oci_oke_np_subnet_id }}'
          freeform_tags:
            phase: create
        oci_oke_expected:
          name: '{{ oci_oke_node_pool_integration_name }}'
          freeform_tags:
            phase: create

    - name: List node pools by name and state
      ansible.oci.oci_oke_node_pool_info:
        compartment_id: '{{ oci_integration_compartment_id }}'
        cluster_id: '{{ oci_oke_np_cluster_id }}'
        name: '{{ oci_oke_node_pool_integration_name }}'
        lifecycle_state: ACTIVE
      register: oci_oke_np_list

    - name: Check the list contains the node pool
      ansible.builtin.assert:
        that:
          - not oci_oke_np_list.changed | bool
          - oci_oke_np_list.node_pools | length == 1
          - oci_oke_np_list.node_pools[0].id == oci_oke_np_node_pool_id

    - name: Test scale, rename, and tag updates
      ansible.builtin.include_tasks: test_node_pool_scenario.yml
      vars:
        oci_oke_lookup_name: '{{ oci_oke_node_pool_integration_name }}'
        oci_oke_operation:
          node_pool_id: '{{ oci_oke_np_node_pool_id }}'
          name: '{{ oci_oke_node_pool_integration_updated_name }}'
          node_config_details:
            size: 2
          freeform_tags:
            phase: update
        oci_oke_expected:
          name: '{{ oci_oke_node_pool_integration_updated_name }}'
          freeform_tags:
            phase: update

    - name: Test node pool deletion by ID
      ansible.builtin.include_tasks: test_node_pool_scenario.yml
      vars:
        oci_oke_lookup_name: '{{ oci_oke_node_pool_integration_updated_name }}'
        oci_oke_operation:
          state: absent
          node_pool_id: '{{ oci_oke_np_node_pool_id }}'
        oci_oke_expected: {}

- name: Restore the shared subnet associations
  ansible.oci.oci_network_subnet:
    subnet_id: '{{ oci_oke_subnet_id }}'
    route_table_id: '{{ oci_oke_vcn.resource.default_route_table_id }}'
    security_list_ids:
      - '{{ oci_oke_vcn.resource.default_security_list_id }}'

- name: Clean up module resources
  ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_oke_node_pool/cleanup.yml'

- name: Release module resources
  ansible.builtin.set_fact:
    oci_group_started_oci_oke_node_pool: false
