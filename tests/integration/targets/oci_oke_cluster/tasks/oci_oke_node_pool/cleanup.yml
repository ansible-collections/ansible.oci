---
- name: Delete leaked node pools during cleanup
  ansible.oci.oci_oke_node_pool:
    state: absent
    node_pool_id: '{{ item }}'
  loop: '{{ oci_oke_np_cleanup_ids | default([]) | unique | list }}'
  when:
    - oci_group_started_oci_oke_node_pool | default(false)
    - item | default('') | length > 0
  register: oci_group_cleanup_0
  until: oci_group_cleanup_0 is succeeded
  retries: 10
  delay: 30
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Delete leaked node pools during cleanup''] }}'
  when: oci_group_cleanup_0 is failed

- name: Delete leaked route table during cleanup
  ansible.oci.oci_network_route_table:
    state: absent
    route_table_id: '{{ oci_oke_np_route_table_id }}'
  when:
    - oci_group_started_oci_oke_node_pool | default(false)
    - oci_oke_np_route_table_id | default('') | length > 0
  register: oci_group_cleanup_4
  until: oci_group_cleanup_4 is succeeded
  retries: 10
  delay: 30
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Delete leaked route table during cleanup''] }}'
  when: oci_group_cleanup_4 is failed

- name: Delete leaked security list during cleanup
  ansible.oci.oci_network_security_list:
    state: absent
    security_list_id: '{{ oci_oke_np_security_list_id }}'
  when:
    - oci_group_started_oci_oke_node_pool | default(false)
    - oci_oke_np_security_list_id | default('') | length > 0
  register: oci_group_cleanup_6
  until: oci_group_cleanup_6 is succeeded
  retries: 10
  delay: 30
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Delete leaked security list during cleanup''] }}'
  when: oci_group_cleanup_6 is failed

- name: Delete leaked internet gateway during cleanup
  ansible.oci.oci_network_internet_gateway:
    state: absent
    internet_gateway_id: '{{ oci_oke_np_igw_id }}'
  when:
    - oci_group_started_oci_oke_node_pool | default(false)
    - oci_oke_np_igw_id | default('') | length > 0
  register: oci_group_cleanup_8
  until: oci_group_cleanup_8 is succeeded
  retries: 10
  delay: 30
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Delete leaked internet gateway during cleanup''] }}'
  when: oci_group_cleanup_8 is failed

- name: Check module cleanup results
  ansible.builtin.assert:
    that:
      - oci_group_cleanup_failures | length == 0
    fail_msg: 'Cleanup failed for: {{ oci_group_cleanup_failures | join(", ") }}'
