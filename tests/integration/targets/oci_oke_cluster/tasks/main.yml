---
- name: Initialize resource identifiers
  ansible.builtin.set_fact:
    oci_tests_completed: false

- name: Test oci_oke_cluster
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: '{{ oci_integration_config_file_location }}'
      config_profile_name: '{{ oci_integration_config_profile_name }}'
  block:

    - name: Run oci_oke_cluster tests
      ansible.builtin.include_tasks: oci_oke_cluster.yml

    - name: Run oci_oke_node_pool tests
      ansible.builtin.include_tasks: oci_oke_node_pool.yml

    - name: Mark tests as complete
      ansible.builtin.set_fact:
        oci_tests_completed: true
  always:

    - name: Clean up all test resources
      ansible.builtin.include_tasks: cleanup.yml
