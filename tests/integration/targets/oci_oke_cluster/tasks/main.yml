---
- name: Initialize shared resources and ownership
  ansible.builtin.set_fact:
    oci_group_resources: {}
    oci_group_cleanup_failures: []
    oci_group_started_oci_oke_cluster: false
    oci_group_started_oci_oke_node_pool: false

- name: Test oci_oke_cluster and dependent modules
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: '{{ oci_integration_config_file_location }}'
      config_profile_name: '{{ oci_integration_config_profile_name }}'
  block:

    - name: Run oci_oke_cluster tests
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_oke_cluster/main.yml'
      vars:
        oci_prerequisites: '{{ oci_group_resources }}'

    - name: Run oci_oke_node_pool tests
      ansible.builtin.include_tasks: oci_oke_node_pool/main.yml
      vars:
        oci_prerequisites: '{{ oci_group_resources }}'

    - name: Run oci_oke_cluster remaining tests
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_oke_cluster/delete.yml'
      vars:
        oci_prerequisites: '{{ oci_group_resources }}'
  always:

    - name: Clean up all group resources
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/cleanup.yml'
