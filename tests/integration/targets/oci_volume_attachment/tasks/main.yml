---
- name: Validate required OCI integration variables
  ansible.builtin.assert:
    that:
      - oci_integration_compartment_id | default('', true) | length > 0
    fail_msg: >-
      OCI volume attachment integration tests require oci_integration_compartment_id to be defined in tests/integration/integration_config.yml.

- name: Compute unique resource names for this run
  ansible.builtin.set_fact:
    oci_volume_attachment_integration_vcn_name: "{{ oci_volume_attachment_integration_vcn_name }}-{{ oci_integration_rpfx }}"
    oci_volume_attachment_integration_subnet_name: "{{ oci_volume_attachment_integration_subnet_name }}-{{ oci_integration_rpfx }}"
    oci_volume_attachment_integration_instance_name: "{{ oci_volume_attachment_integration_instance_name }}-{{ oci_integration_rpfx }}"
    oci_volume_attachment_integration_volume_name: "{{ oci_volume_attachment_integration_volume_name }}-{{ oci_integration_rpfx }}"
    oci_volume_attachment_integration_attachment_name: "{{ oci_volume_attachment_integration_attachment_name }}-{{ oci_integration_rpfx }}"

- name: Exercise volume attachment module lifecycle
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Discover an availability domain in the compartment
      ansible.oci.oci_availability_domain_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
      register: oci_volume_attachment_ad_info

    - name: Assert at least one availability domain was discovered
      ansible.builtin.assert:
        that:
          - oci_volume_attachment_ad_info.availability_domains | length > 0

    - name: Set the working availability domain
      ansible.builtin.set_fact:
        oci_volume_attachment_integration_availability_domain: "{{ oci_volume_attachment_ad_info.availability_domains[0].name }}"

    - name: Discover a compatible image
      ansible.oci.oci_image_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        operating_system: "{{ oci_volume_attachment_integration_operating_system }}"
        operating_system_version: "{{ oci_volume_attachment_integration_operating_system_version }}"
        shape: "{{ oci_volume_attachment_integration_shape }}"
      register: oci_volume_attachment_image_info

    - name: Assert a compatible image was discovered
      ansible.builtin.assert:
        that:
          - oci_volume_attachment_image_info.images | length > 0

    - name: Set the working image id
      ansible.builtin.set_fact:
        oci_volume_attachment_image_id: "{{ oci_volume_attachment_image_info.images[0].id }}"

    - name: Create test VCN for volume attachment integration
      ansible.oci.oci_network_vcn:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_volume_attachment_integration_vcn_name }}"
        cidr_blocks:
          - "{{ oci_volume_attachment_integration_vcn_cidr_block }}"
      register: oci_volume_attachment_vcn_create

    - name: Create test subnet for volume attachment integration
      ansible.oci.oci_network_subnet:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        vcn_id: "{{ oci_volume_attachment_vcn_create.resource.id }}"
        cidr_block: "{{ oci_volume_attachment_integration_subnet_cidr_block }}"
        name: "{{ oci_volume_attachment_integration_subnet_name }}"
      register: oci_volume_attachment_subnet_create

    - name: Create test compute instance for volume attachment integration
      ansible.oci.oci_instance:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        availability_domain: "{{ oci_volume_attachment_integration_availability_domain }}"
        name: "{{ oci_volume_attachment_integration_instance_name }}"
        shape: "{{ oci_volume_attachment_integration_shape }}"
        shape_config: "{{ oci_volume_attachment_integration_shape_config }}"
        image_id: "{{ oci_volume_attachment_image_id }}"
        subnet_id: "{{ oci_volume_attachment_subnet_create.resource.id }}"
      register: oci_volume_attachment_instance_create

    - name: Capture created instance id
      ansible.builtin.set_fact:
        oci_volume_attachment_instance_id: "{{ oci_volume_attachment_instance_create.resource.id }}"

    - name: Create test block volume for volume attachment integration
      ansible.oci.oci_blockstorage_volume:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        availability_domain: "{{ oci_volume_attachment_integration_availability_domain }}"
        name: "{{ oci_volume_attachment_integration_volume_name }}"
        size_in_gbs: "{{ oci_volume_attachment_integration_size_in_gbs }}"
      register: oci_volume_attachment_volume_create

    - name: Capture created volume id
      ansible.builtin.set_fact:
        oci_volume_attachment_volume_id: "{{ oci_volume_attachment_volume_create.resource.id }}"

    - name: Define volume attachment create and delete parameters
      ansible.builtin.set_fact:
        oci_volume_attachment_create_params:
          state: present
          compartment_id: "{{ oci_integration_compartment_id }}"
          instance_id: "{{ oci_volume_attachment_instance_id }}"
          volume_id: "{{ oci_volume_attachment_volume_id }}"
          name: "{{ oci_volume_attachment_integration_attachment_name }}"
          type: "{{ oci_volume_attachment_integration_type }}"
        oci_volume_attachment_delete_params:
          state: absent
          volume_attachment_id: ""

    - name: Create volume attachment in check mode
      ansible.oci.oci_volume_attachment: &oci_volume_attachment_create_module_options
        state: "{{ oci_volume_attachment_create_params.state }}"
        compartment_id: "{{ oci_volume_attachment_create_params.compartment_id }}"
        instance_id: "{{ oci_volume_attachment_create_params.instance_id }}"
        volume_id: "{{ oci_volume_attachment_create_params.volume_id }}"
        name: "{{ oci_volume_attachment_create_params.name }}"
        type: "{{ oci_volume_attachment_create_params.type }}"
      check_mode: true
      register: oci_volume_attachment_create_check

    - name: Assert create check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_volume_attachment_create_check.changed | bool

    - name: Read volume attachment after create check mode
      ansible.oci.oci_volume_attachment_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        instance_id: "{{ oci_volume_attachment_instance_id }}"
        volume_id: "{{ oci_volume_attachment_volume_id }}"
        name: "{{ oci_volume_attachment_integration_attachment_name }}"
      register: oci_volume_attachment_create_check_probe

    - name: Assert volume attachment is still absent after create check mode
      ansible.builtin.assert:
        that:
          - oci_volume_attachment_create_check_probe.volume_attachments | length == 0

    - name: Create volume attachment
      ansible.oci.oci_volume_attachment:
        <<: *oci_volume_attachment_create_module_options
      register: oci_volume_attachment_create

    - name: Capture volume attachment id and define delete parameters
      ansible.builtin.set_fact:
        oci_volume_attachment_id: "{{ oci_volume_attachment_create.resource.id }}"
        oci_volume_attachment_delete_params:
          state: absent
          volume_attachment_id: "{{ oci_volume_attachment_create.resource.id }}"

    - name: Assert create reported a change
      ansible.builtin.assert:
        that:
          - oci_volume_attachment_create.changed | bool

    - name: Read created volume attachment by id
      ansible.oci.oci_volume_attachment_info:
        volume_attachment_id: "{{ oci_volume_attachment_id }}"
      register: oci_volume_attachment_probe_after_create

    - name: Assert volume attachment info by id returned the created attachment
      ansible.builtin.assert:
        that:
          - oci_volume_attachment_probe_after_create.volume_attachments | length == 1
          - oci_volume_attachment_probe_after_create.volume_attachments[0].id == oci_volume_attachment_id
          - oci_volume_attachment_probe_after_create.volume_attachments[0].instance_id == oci_volume_attachment_instance_id
          - oci_volume_attachment_probe_after_create.volume_attachments[0].volume_id == oci_volume_attachment_volume_id
          - oci_volume_attachment_probe_after_create.volume_attachments[0].lifecycle_state == "ATTACHED"

    - name: List created volume attachment by scoped name
      ansible.oci.oci_volume_attachment_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        instance_id: "{{ oci_volume_attachment_instance_id }}"
        volume_id: "{{ oci_volume_attachment_volume_id }}"
        name: "{{ oci_volume_attachment_integration_attachment_name }}"
      register: oci_volume_attachment_info_list

    - name: Assert volume attachment info list returned the created attachment
      ansible.builtin.assert:
        that:
          - oci_volume_attachment_info_list.volume_attachments | selectattr('id', 'equalto', oci_volume_attachment_id) | list | length == 1

    - name: Assert created volume attachment is a no-op on rerun with returned id
      ansible.oci.oci_volume_attachment:
        <<: *oci_volume_attachment_create_module_options
        volume_attachment_id: "{{ oci_volume_attachment_id }}"
      register: oci_volume_attachment_create_rerun

    - name: Verify rerun with returned id is a no-op
      ansible.builtin.assert:
        that:
          - not oci_volume_attachment_create_rerun.changed | bool

    - name: Assert created volume attachment is a no-op on rerun with scoped name
      ansible.oci.oci_volume_attachment:
        <<: *oci_volume_attachment_create_module_options
      register: oci_volume_attachment_create_rerun_by_name

    - name: Verify rerun with scoped name is a no-op
      ansible.builtin.assert:
        that:
          - not oci_volume_attachment_create_rerun_by_name.changed | bool

    - name: Detach volume attachment in check mode
      ansible.oci.oci_volume_attachment: &oci_volume_attachment_delete_module_options
        state: "{{ oci_volume_attachment_delete_params.state }}"
        volume_attachment_id: "{{ oci_volume_attachment_delete_params.volume_attachment_id }}"
      check_mode: true
      register: oci_volume_attachment_delete_check

    - name: Assert detach check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_volume_attachment_delete_check.changed | bool

    - name: Read volume attachment after detach check mode
      ansible.oci.oci_volume_attachment_info:
        volume_attachment_id: "{{ oci_volume_attachment_id }}"
      register: oci_volume_attachment_delete_check_probe

    - name: Assert volume attachment still exists after detach check mode
      ansible.builtin.assert:
        that:
          - oci_volume_attachment_delete_check_probe.volume_attachments | length == 1
          - oci_volume_attachment_delete_check_probe.volume_attachments[0].id == oci_volume_attachment_id

    - name: Detach volume attachment
      ansible.oci.oci_volume_attachment:
        <<: *oci_volume_attachment_delete_module_options
      register: oci_volume_attachment_delete

    - name: Assert detach reported a change
      ansible.builtin.assert:
        that:
          - oci_volume_attachment_delete.changed | bool

    - name: Assert detach is idempotent on rerun
      ansible.oci.oci_volume_attachment:
        <<: *oci_volume_attachment_delete_module_options
      register: oci_volume_attachment_delete_rerun

    - name: Verify detach rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_volume_attachment_delete_rerun.changed | bool

  always:
    - name: Run volume attachment cleanup
      ansible.builtin.include_tasks: cleanup.yml
