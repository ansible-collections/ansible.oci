---
- name: Exercise backend set lifecycle
  block:
    - name: Prepare the parent load balancer
      ansible.builtin.include_role:
        name: prepare_oci_loadbalancer_subresources

    - name: Read state before backend set creation
      ansible.oci.oci_loadbalancer_backend_set_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
      register: oci_lb_before

    - name: Predict backend set creation
      ansible.oci.oci_loadbalancer_backend_set:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
        policy: round_robin
        health_checker:
          protocol: tcp
          port: 8080
          return_code: 200
          retries: 7
          timeout_in_millis: 3000
          interval_in_millis: 10000
          response_body_regex: .*
      check_mode: true
      register: oci_lb_prediction

    - name: Assert change predicted
      ansible.builtin.assert:
        that:
          - oci_lb_prediction.changed | bool

    - name: Read state after check mode
      ansible.oci.oci_loadbalancer_backend_set_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
      register: oci_lb_after_check

    - name: Assert check mode preserved OCI state
      ansible.builtin.assert:
        that:
          - oci_lb_before.backend_sets == oci_lb_after_check.backend_sets

    - name: Apply backend set creation
      ansible.oci.oci_loadbalancer_backend_set:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
        policy: round_robin
        health_checker:
          protocol: tcp
          port: 8080
          return_code: 200
          retries: 7
          timeout_in_millis: 3000
          interval_in_millis: 10000
          response_body_regex: .*
      register: oci_lb_applied

    - name: Assert operation changed OCI state
      ansible.builtin.assert:
        that:
          - oci_lb_applied.changed | bool

    - name: Read resulting state
      ansible.oci.oci_loadbalancer_backend_set_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
      register: oci_lb_after

    - name: Assert resource configuration
      ansible.builtin.assert:
        that:
          - oci_lb_after.backend_sets | length == 1
          - oci_lb_after.backend_sets[0].policy == 'ROUND_ROBIN'

    - name: Test backend set creation idempotency
      ansible.oci.oci_loadbalancer_backend_set:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
        policy: round_robin
        health_checker:
          protocol: tcp
          port: 8080
          return_code: 200
          retries: 7
          timeout_in_millis: 3000
          interval_in_millis: 10000
          response_body_regex: .*
      register: oci_lb_repeat

    - name: Test backend set creation idempotency in check mode
      ansible.oci.oci_loadbalancer_backend_set:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
        policy: round_robin
        health_checker:
          protocol: tcp
          port: 8080
          return_code: 200
          retries: 7
          timeout_in_millis: 3000
          interval_in_millis: 10000
          response_body_regex: .*
      check_mode: true
      register: oci_lb_repeat_check

    - name: Assert idempotency in normal and check mode
      ansible.builtin.assert:
        that:
          - not oci_lb_repeat.changed | bool
          - not oci_lb_repeat_check.changed | bool

    - name: Read remote state after idempotency tests
      ansible.oci.oci_loadbalancer_backend_set_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
      register: oci_lb_final

    - name: Assert idempotency tests preserved remote state
      ansible.builtin.assert:
        that:
          - oci_lb_final.backend_sets == oci_lb_after.backend_sets

    - name: List backend sets
      ansible.oci.oci_loadbalancer_backend_set_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
      register: oci_lb_sets

    - name: Assert created backend set is listed
      ansible.builtin.assert:
        that:
          - oci_lb_test_backend_set in (oci_lb_sets.backend_sets | map(attribute='name') | list)

    - name: Read state before applying health checker defaults
      ansible.oci.oci_loadbalancer_backend_set_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
      register: oci_lb_defaults_before

    - name: Assert custom retry count before applying defaults
      ansible.builtin.assert:
        that:
          - oci_lb_defaults_before.backend_sets[0].health_checker.retries == 7

    - name: Predict health checker defaults and retry reset
      ansible.oci.oci_loadbalancer_backend_set:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
        health_checker: {}
      register: oci_lb_defaults_prediction
      check_mode: true

    - name: Assert health checker defaults predict a change
      ansible.builtin.assert:
        that:
          - oci_lb_defaults_prediction.changed | bool

    - name: Read state after predicting health checker defaults
      ansible.oci.oci_loadbalancer_backend_set_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
      register: oci_lb_defaults_after_check

    - name: Assert check mode preserved health checker settings
      ansible.builtin.assert:
        that:
          - oci_lb_defaults_before.backend_sets == oci_lb_defaults_after_check.backend_sets

    - name: Apply health checker defaults and retry reset
      ansible.oci.oci_loadbalancer_backend_set:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
        health_checker: {}
      register: oci_lb_defaults_applied

    - name: Assert health checker defaults changed OCI state
      ansible.builtin.assert:
        that:
          - oci_lb_defaults_applied.changed | bool

    - name: Read state after applying health checker defaults
      ansible.oci.oci_loadbalancer_backend_set_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
      register: oci_lb_defaults_after

    - name: Assert defaults reset retries and preserve plaintext settings
      ansible.builtin.assert:
        that:
          - oci_lb_defaults_after.backend_sets | length == 1
          - oci_lb_defaults_after.backend_sets[0].health_checker.protocol == 'HTTP'
          - oci_lb_defaults_after.backend_sets[0].health_checker.port == 80
          - oci_lb_defaults_after.backend_sets[0].health_checker.url_path == '/'
          - oci_lb_defaults_after.backend_sets[0].health_checker.return_code == 200
          - oci_lb_defaults_after.backend_sets[0].health_checker.retries == 3
          - oci_lb_defaults_after.backend_sets[0].health_checker.timeout_in_millis == 3000
          - oci_lb_defaults_after.backend_sets[0].health_checker.interval_in_millis == 10000
          - oci_lb_defaults_after.backend_sets[0].health_checker.response_body_regex == ''
          - oci_lb_defaults_after.backend_sets[0].health_checker.get('is_force_plain_text') ==
            oci_lb_defaults_before.backend_sets[0].health_checker.get('is_force_plain_text')

    - name: Test health checker defaults idempotency
      ansible.oci.oci_loadbalancer_backend_set:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
        health_checker: {}
      register: oci_lb_defaults_repeat

    - name: Test health checker defaults idempotency in check mode
      ansible.oci.oci_loadbalancer_backend_set:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
        health_checker: {}
      register: oci_lb_defaults_repeat_check
      check_mode: true

    - name: Assert health checker defaults idempotency
      ansible.builtin.assert:
        that:
          - not oci_lb_defaults_repeat.changed | bool
          - not oci_lb_defaults_repeat_check.changed | bool

    - name: Read state after health checker defaults idempotency tests
      ansible.oci.oci_loadbalancer_backend_set_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
      register: oci_lb_defaults_final

    - name: Assert idempotency tests preserved health checker defaults
      ansible.builtin.assert:
        that:
          - oci_lb_defaults_final.backend_sets == oci_lb_defaults_after.backend_sets

    - name: Read state before backend set update
      ansible.oci.oci_loadbalancer_backend_set_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
      register: oci_lb_before

    - name: Predict backend set update
      ansible.oci.oci_loadbalancer_backend_set:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
        policy: least_connections
      check_mode: true
      register: oci_lb_prediction

    - name: Assert change predicted
      ansible.builtin.assert:
        that:
          - oci_lb_prediction.changed | bool

    - name: Read state after check mode
      ansible.oci.oci_loadbalancer_backend_set_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
      register: oci_lb_after_check

    - name: Assert check mode preserved OCI state
      ansible.builtin.assert:
        that:
          - oci_lb_before.backend_sets == oci_lb_after_check.backend_sets

    - name: Apply backend set update
      ansible.oci.oci_loadbalancer_backend_set:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
        policy: least_connections
      register: oci_lb_applied

    - name: Assert operation changed OCI state
      ansible.builtin.assert:
        that:
          - oci_lb_applied.changed | bool

    - name: Read resulting state
      ansible.oci.oci_loadbalancer_backend_set_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
      register: oci_lb_after

    - name: Assert resource configuration
      ansible.builtin.assert:
        that:
          - oci_lb_after.backend_sets | length == 1
          - oci_lb_after.backend_sets[0].policy == 'LEAST_CONNECTIONS'

    - name: Test backend set update idempotency
      ansible.oci.oci_loadbalancer_backend_set:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
        policy: least_connections
      register: oci_lb_repeat

    - name: Test backend set update idempotency in check mode
      ansible.oci.oci_loadbalancer_backend_set:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
        policy: least_connections
      check_mode: true
      register: oci_lb_repeat_check

    - name: Assert idempotency in normal and check mode
      ansible.builtin.assert:
        that:
          - not oci_lb_repeat.changed | bool
          - not oci_lb_repeat_check.changed | bool

    - name: Read remote state after idempotency tests
      ansible.oci.oci_loadbalancer_backend_set_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
      register: oci_lb_final

    - name: Assert idempotency tests preserved remote state
      ansible.builtin.assert:
        that:
          - oci_lb_final.backend_sets == oci_lb_after.backend_sets

    - name: Assert omitted health checker was preserved
      ansible.builtin.assert:
        that:
          - oci_lb_after.backend_sets[0].health_checker == oci_lb_defaults_after.backend_sets[0].health_checker

    - name: Test cookie persistence changes and idempotency
      ansible.builtin.include_tasks: test_persistence_operation.yml
      loop:
        - name: application cookie configuration
          option: session_persistence_configuration
          opposite: lb_cookie_session_persistence_configuration
        - name: switch to load balancer cookies
          option: lb_cookie_session_persistence_configuration
          opposite: session_persistence_configuration
        - name: switch to application cookies
          option: session_persistence_configuration
          opposite: lb_cookie_session_persistence_configuration
      loop_control:
        loop_var: oci_lb_persistence_operation
        label: '{{ oci_lb_persistence_operation.name }}'

    - name: Read state before backend set deletion
      ansible.oci.oci_loadbalancer_backend_set_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
      register: oci_lb_before

    - name: Predict backend set deletion
      ansible.oci.oci_loadbalancer_backend_set:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
        state: absent
      check_mode: true
      register: oci_lb_prediction

    - name: Assert change predicted
      ansible.builtin.assert:
        that:
          - oci_lb_prediction.changed | bool

    - name: Read state after check mode
      ansible.oci.oci_loadbalancer_backend_set_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
      register: oci_lb_after_check

    - name: Assert check mode preserved OCI state
      ansible.builtin.assert:
        that:
          - oci_lb_before.backend_sets == oci_lb_after_check.backend_sets

    - name: Apply backend set deletion
      ansible.oci.oci_loadbalancer_backend_set:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
        state: absent
      register: oci_lb_applied

    - name: Assert operation changed OCI state
      ansible.builtin.assert:
        that:
          - oci_lb_applied.changed | bool

    - name: Read resulting state
      ansible.oci.oci_loadbalancer_backend_set_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
      register: oci_lb_after

    - name: Assert resource was deleted
      ansible.builtin.assert:
        that:
          - oci_lb_after.backend_sets | length == 0

    - name: Test backend set deletion idempotency
      ansible.oci.oci_loadbalancer_backend_set:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
        state: absent
      register: oci_lb_repeat

    - name: Test backend set deletion idempotency in check mode
      ansible.oci.oci_loadbalancer_backend_set:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
        state: absent
      check_mode: true
      register: oci_lb_repeat_check

    - name: Assert idempotency in normal and check mode
      ansible.builtin.assert:
        that:
          - not oci_lb_repeat.changed | bool
          - not oci_lb_repeat_check.changed | bool

    - name: Read remote state after idempotency tests
      ansible.oci.oci_loadbalancer_backend_set_info:
        load_balancer_id: '{{ oci_lb_test_id }}'
        name: '{{ oci_lb_test_backend_set }}'
      register: oci_lb_final

    - name: Assert idempotency tests preserved remote state
      ansible.builtin.assert:
        that:
          - oci_lb_final.backend_sets == oci_lb_after.backend_sets
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: '{{ oci_integration_config_file_location }}'
      config_profile_name: '{{ oci_integration_config_profile_name }}'
  vars:
    oci_lb_test_suffix: backend-set

  always:
    - name: Clean up test-owned resources
      ansible.builtin.include_role:
        name: prepare_oci_loadbalancer_subresources
        tasks_from: cleanup
