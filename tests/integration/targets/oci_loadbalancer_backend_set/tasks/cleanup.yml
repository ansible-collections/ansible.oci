---
- name: Initialize deletion test status
  ansible.builtin.set_fact:
    oci_cleanup_checks_failed: false

- name: Delete prerequisite oci_lb_test_create
  ansible.oci.oci_loadbalancer:
    state: absent
    load_balancer_id: '{{ oci_lb_test_create.resource.id }}'
  when:
    - oci_lb_test_create is defined
    - oci_lb_test_create.resource.id | default('') | length > 0
  register: oci_cleanup_delete_prerequisite_oci_lb_test_create
  retries: 3
  delay: 5
  until: oci_cleanup_delete_prerequisite_oci_lb_test_create is not failed
  ignore_errors: true

- name: Delete prerequisite oci_lb_test_subnet
  ansible.oci.oci_network_subnet:
    state: absent
    subnet_id: '{{ oci_lb_test_subnet.resource.id }}'
  when:
    - oci_lb_test_subnet is defined
    - oci_lb_test_subnet.resource.id | default('') | length > 0
  register: oci_cleanup_delete_prerequisite_oci_lb_test_subnet
  retries: 3
  delay: 5
  until: oci_cleanup_delete_prerequisite_oci_lb_test_subnet is not failed
  ignore_errors: true

- name: Delete prerequisite oci_lb_test_vcn
  ansible.oci.oci_network_vcn:
    state: absent
    vcn_id: '{{ oci_lb_test_vcn.resource.id }}'
  when:
    - oci_lb_test_vcn is defined
    - oci_lb_test_vcn.resource.id | default('') | length > 0
  register: oci_cleanup_delete_prerequisite_oci_lb_test_vcn
  retries: 3
  delay: 5
  until: oci_cleanup_delete_prerequisite_oci_lb_test_vcn is not failed
  ignore_errors: true

- name: Verify resource cleanup
  ansible.builtin.assert:
    that:
      - not oci_cleanup_checks_failed | bool
      - (oci_cleanup_delete_prerequisite_oci_lb_test_create | default({})) is not failed
      - (oci_cleanup_delete_prerequisite_oci_lb_test_subnet | default({})) is not failed
      - (oci_cleanup_delete_prerequisite_oci_lb_test_vcn | default({})) is not failed
    fail_msg: Resource cleanup or deletion checks failed. See the failed tasks above.
