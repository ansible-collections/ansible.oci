---
- name: Run Network Security Group cleanup with shared OCI auth defaults
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Delete leaked duplicate Network Security Group during cleanup
      ansible.oci.oci_network_security_group:
        state: absent
        network_security_group_id: "{{ oci_network_security_group_duplicate_id }}"
      when: oci_network_security_group_duplicate_id | default('') | length > 0
      register: oci_cleanup_duplicate_network_security_group
      retries: 3
      ignore_errors: true

    - name: Delete leaked Network Security Group during cleanup
      ansible.oci.oci_network_security_group:
        state: absent
        network_security_group_id: "{{ oci_network_security_group_id }}"
      when: oci_network_security_group_id | default('') | length > 0
      register: oci_cleanup_network_security_group
      retries: 3
      ignore_errors: true

    - name: Delete leaked VCN during cleanup
      ansible.oci.oci_network_vcn:
        state: absent
        vcn_id: "{{ oci_network_security_group_vcn_create.resource.id }}"
      when: oci_network_security_group_vcn_create.resource.id | default('') | length > 0
      register: oci_cleanup_vcn
      retries: 3
      ignore_errors: true

    - name: Verify resource cleanup succeeded
      ansible.builtin.assert:
        that:
          - oci_cleanup_duplicate_network_security_group is not failed
          - oci_cleanup_network_security_group is not failed
          - oci_cleanup_vcn is not failed
        fail_msg: Resource cleanup failed after 3 retries; see the failed cleanup tasks above.
