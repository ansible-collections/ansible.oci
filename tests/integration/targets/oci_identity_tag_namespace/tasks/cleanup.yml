---
- name: Run tag namespace cleanup with shared OCI auth defaults
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Delete leaked tag namespaces by ID
      ansible.oci.oci_identity_tag_namespace:
        state: absent
        tag_namespace_id: "{{ item.id }}"
      loop: &oci_identity_tag_namespace_cleanup_resources
        - id: "{{ oci_identity_tag_namespace_active_id | default('') }}"
          name: "{{ oci_identity_tag_namespace_cleanup_name | default('') }}"
        - id: "{{ oci_identity_tag_namespace_retired_id | default('') }}"
          name: "{{ oci_identity_tag_namespace_cleanup_retired_name | default('') }}"
      when: item.id | length > 0
      register: oci_cleanup_tag_namespace_by_id
      retries: 3
      ignore_errors: true

    - name: Delete leaked tag namespaces by name when no ID was captured
      ansible.oci.oci_identity_tag_namespace:
        state: absent
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ item.name }}"
      loop: *oci_identity_tag_namespace_cleanup_resources
      when:
        - item.id | length == 0
        - item.name | length > 0
      register: oci_cleanup_tag_namespace_by_name
      retries: 3
      ignore_errors: true

    - name: Verify resource cleanup succeeded
      ansible.builtin.assert:
        that:
          - oci_cleanup_tag_namespace_by_id is not failed
          - oci_cleanup_tag_namespace_by_name is not failed
        fail_msg: Resource cleanup failed after 3 retries. Read the failed cleanup tasks above.
