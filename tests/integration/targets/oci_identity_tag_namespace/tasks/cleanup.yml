---
- name: Initialize deletion test status
  ansible.builtin.set_fact:
    oci_cleanup_checks_failed: false

- name: Delete temporary enum tag
  ansible.oci.oci_identity_tag:
    state: absent
    tag_namespace_id: '{{ oci_identity_tag_integration_namespace_id }}'
    name: '{{ oci_identity_tag_integration_enum_name }}'
  when:
    - oci_identity_tag_integration_namespace_id is defined
    - oci_identity_tag_integration_enum_name is defined
    - oci_identity_tag_integration_namespace_id | length > 0
    - oci_integration_rpfx | string in oci_identity_tag_integration_enum_name | string
  register: oci_cleanup_delete_temporary_enum_tag
  retries: 3
  ignore_errors: true

- name: Verify oci_identity_tag_namespace deletion
  when: oci_tests_completed | bool
  block:

    - name: Test the namespace lifecycle
      module_defaults:
        group/ansible.oci.oci:
          config_file_location: '{{ oci_integration_config_file_location }}'
          config_profile_name: '{{ oci_integration_config_profile_name }}'
      block:

        - name: Read the namespace before namespace retirement
          ansible.oci.oci_identity_tag_namespace_info:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_name }}'
          register: oci_cleanup_read_the_namespace_before_namespace_retirement

        - name: Retire the namespace in check mode
          ansible.oci.oci_identity_tag_namespace:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_name | upper }}'
            is_retired: true
          check_mode: true
          register: oci_cleanup_retire_the_namespace_in_check_mode

        - name: Read the namespace after the check
          ansible.oci.oci_identity_tag_namespace_info:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_name }}'
          register: oci_cleanup_read_the_namespace_after_the_check

        - name: Verify check mode predicts a change without a mutation
          ansible.builtin.assert:
            that:
              - oci_cleanup_retire_the_namespace_in_check_mode.changed
              - |-
                oci_cleanup_read_the_namespace_after_the_check.tag_namespaces ==
                oci_cleanup_read_the_namespace_before_namespace_retirement.tag_namespaces

        - name: Retire the namespace
          ansible.oci.oci_identity_tag_namespace:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_name | upper }}'
            is_retired: true
          register: oci_cleanup_retire_the_namespace

        - name: Read the namespace after namespace retirement
          ansible.oci.oci_identity_tag_namespace_info:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_name }}'
          register: oci_cleanup_read_the_namespace_after_namespace_retirement

        - name: Verify namespace retirement changed the resource
          ansible.builtin.assert:
            that:
              - oci_cleanup_retire_the_namespace.changed
              - oci_cleanup_read_the_namespace_after_namespace_retirement.tag_namespaces | length == 1

        - name: Verify the namespace fields after namespace retirement
          ansible.builtin.assert:
            that:
              - oci_cleanup_read_the_namespace_after_namespace_retirement.tag_namespaces[0].is_retired == true
              - oci_cleanup_read_the_namespace_after_namespace_retirement.tag_namespaces[0].lifecycle_state == "INACTIVE"
              - |-
                oci_cleanup_read_the_namespace_after_namespace_retirement.tag_namespaces[0].description ==
                oci_identity_tag_namespace_integration_update_description

        - name: Repeat namespace retirement
          ansible.oci.oci_identity_tag_namespace:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_name | upper }}'
            is_retired: true
          register: oci_cleanup_repeat_namespace_retirement

        - name: Repeat namespace retirement in check mode
          ansible.oci.oci_identity_tag_namespace:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_name | upper }}'
            is_retired: true
          check_mode: true
          register: oci_cleanup_repeat_namespace_retirement_in_check_mode

        - name: Verify repeated namespace retirement is unchanged
          ansible.builtin.assert:
            that:
              - not oci_cleanup_repeat_namespace_retirement.changed
              - not oci_cleanup_repeat_namespace_retirement_in_check_mode.changed

        - name: Read the namespace before retired namespace description update
          ansible.oci.oci_identity_tag_namespace_info:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_name }}'
          register: oci_cleanup_read_the_namespace_before_retired_namespace_description_update

        - name: Update the retired namespace description in check mode
          ansible.oci.oci_identity_tag_namespace:
            tag_namespace_id: '{{ oci_identity_tag_namespace_active_id }}'
            description: '{{ oci_identity_tag_namespace_integration_retired_description }}'
          check_mode: true
          register: oci_cleanup_update_the_retired_namespace_description_in_check_mode

        - name: Read the namespace after the check
          ansible.oci.oci_identity_tag_namespace_info:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_name }}'
          register: oci_cleanup_read_the_namespace_after_the_check_again

        - name: Verify check mode predicts a change without a mutation
          ansible.builtin.assert:
            that:
              - oci_cleanup_update_the_retired_namespace_description_in_check_mode.changed
              - |-
                oci_cleanup_read_the_namespace_after_the_check_again.tag_namespaces ==
                oci_cleanup_read_the_namespace_before_retired_namespace_description_update.tag_namespaces

        - name: Update the retired namespace description
          ansible.oci.oci_identity_tag_namespace:
            tag_namespace_id: '{{ oci_identity_tag_namespace_active_id }}'
            description: '{{ oci_identity_tag_namespace_integration_retired_description }}'
          register: oci_cleanup_update_the_retired_namespace_description

        - name: Read the namespace after retired namespace description update
          ansible.oci.oci_identity_tag_namespace_info:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_name }}'
          register: oci_cleanup_read_the_namespace_after_retired_namespace_description_update

        - name: Verify retired namespace description update changed the resource
          ansible.builtin.assert:
            that:
              - oci_cleanup_update_the_retired_namespace_description.changed
              - oci_cleanup_read_the_namespace_after_retired_namespace_description_update.tag_namespaces | length
                == 1

        - name: Verify the namespace fields after retired namespace description update
          ansible.builtin.assert:
            that:
              - oci_cleanup_read_the_namespace_after_retired_namespace_description_update.tag_namespaces[0].is_retired
                == true
              - oci_cleanup_read_the_namespace_after_retired_namespace_description_update.tag_namespaces[0].lifecycle_state
                == "INACTIVE"
              - |-
                oci_cleanup_read_the_namespace_after_retired_namespace_description_update.tag_namespaces[0].description ==
                oci_identity_tag_namespace_integration_retired_description

        - name: Repeat retired namespace description update
          ansible.oci.oci_identity_tag_namespace:
            tag_namespace_id: '{{ oci_identity_tag_namespace_active_id }}'
            description: '{{ oci_identity_tag_namespace_integration_retired_description }}'
          register: oci_cleanup_repeat_retired_namespace_description_update

        - name: Repeat retired namespace description update in check mode
          ansible.oci.oci_identity_tag_namespace:
            tag_namespace_id: '{{ oci_identity_tag_namespace_active_id }}'
            description: '{{ oci_identity_tag_namespace_integration_retired_description }}'
          check_mode: true
          register: oci_cleanup_repeat_retired_namespace_description_update_in_check_mode

        - name: Verify repeated retired namespace description update is unchanged
          ansible.builtin.assert:
            that:
              - not oci_cleanup_repeat_retired_namespace_description_update.changed
              - not oci_cleanup_repeat_retired_namespace_description_update_in_check_mode.changed

        - name: Read the namespace before namespace activation
          ansible.oci.oci_identity_tag_namespace_info:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_name }}'
          register: oci_cleanup_read_the_namespace_before_namespace_activation

        - name: Activate the namespace in check mode
          ansible.oci.oci_identity_tag_namespace:
            tag_namespace_id: '{{ oci_identity_tag_namespace_active_id }}'
            is_retired: false
          check_mode: true
          register: oci_cleanup_activate_the_namespace_in_check_mode

        - name: Read the namespace after the check
          ansible.oci.oci_identity_tag_namespace_info:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_name }}'
          register: oci_cleanup_read_the_namespace_after_the_check_again_again

        - name: Verify check mode predicts a change without a mutation
          ansible.builtin.assert:
            that:
              - oci_cleanup_activate_the_namespace_in_check_mode.changed
              - |-
                oci_cleanup_read_the_namespace_after_the_check_again_again.tag_namespaces ==
                oci_cleanup_read_the_namespace_before_namespace_activation.tag_namespaces

        - name: Activate the namespace
          ansible.oci.oci_identity_tag_namespace:
            tag_namespace_id: '{{ oci_identity_tag_namespace_active_id }}'
            is_retired: false
          register: oci_cleanup_activate_the_namespace

        - name: Read the namespace after namespace activation
          ansible.oci.oci_identity_tag_namespace_info:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_name }}'
          register: oci_cleanup_read_the_namespace_after_namespace_activation

        - name: Verify namespace activation changed the resource
          ansible.builtin.assert:
            that:
              - oci_cleanup_activate_the_namespace.changed
              - oci_cleanup_read_the_namespace_after_namespace_activation.tag_namespaces | length == 1

        - name: Verify the namespace fields after namespace activation
          ansible.builtin.assert:
            that:
              - oci_cleanup_read_the_namespace_after_namespace_activation.tag_namespaces[0].is_retired == false
              - oci_cleanup_read_the_namespace_after_namespace_activation.tag_namespaces[0].lifecycle_state == "ACTIVE"
              - |-
                oci_cleanup_read_the_namespace_after_namespace_activation.tag_namespaces[0].description ==
                oci_identity_tag_namespace_integration_retired_description

        - name: Repeat namespace activation
          ansible.oci.oci_identity_tag_namespace:
            tag_namespace_id: '{{ oci_identity_tag_namespace_active_id }}'
            is_retired: false
          register: oci_cleanup_repeat_namespace_activation

        - name: Repeat namespace activation in check mode
          ansible.oci.oci_identity_tag_namespace:
            tag_namespace_id: '{{ oci_identity_tag_namespace_active_id }}'
            is_retired: false
          check_mode: true
          register: oci_cleanup_repeat_namespace_activation_in_check_mode

        - name: Verify repeated namespace activation is unchanged
          ansible.builtin.assert:
            that:
              - not oci_cleanup_repeat_namespace_activation.changed
              - not oci_cleanup_repeat_namespace_activation_in_check_mode.changed

        - name: Read the namespace before retired namespace creation
          ansible.oci.oci_identity_tag_namespace_info:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_retired_name }}'
          register: oci_cleanup_read_the_namespace_before_retired_namespace_creation

        - name: Create a retired namespace in check mode
          ansible.oci.oci_identity_tag_namespace:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_retired_name }}'
            description: '{{ oci_identity_tag_namespace_integration_retired_description }}'
            is_retired: true
          check_mode: true
          register: oci_cleanup_create_a_retired_namespace_in_check_mode

        - name: Read the namespace after the check
          ansible.oci.oci_identity_tag_namespace_info:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_retired_name }}'
          register: oci_cleanup_read_the_namespace_after_the_check_again_again_again

        - name: Verify check mode predicts a change without a mutation
          ansible.builtin.assert:
            that:
              - oci_cleanup_create_a_retired_namespace_in_check_mode.changed
              - |-
                oci_cleanup_read_the_namespace_after_the_check_again_again_again.tag_namespaces ==
                oci_cleanup_read_the_namespace_before_retired_namespace_creation.tag_namespaces

        - name: Create a retired namespace
          ansible.oci.oci_identity_tag_namespace:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_retired_name }}'
            description: '{{ oci_identity_tag_namespace_integration_retired_description }}'
            is_retired: true
          register: oci_cleanup_create_a_retired_namespace

        - name: Save the retired namespace ID
          ansible.builtin.set_fact:
            oci_identity_tag_namespace_retired_id: '{{ oci_cleanup_create_a_retired_namespace.resource.id }}'

        - name: Read the namespace after retired namespace creation
          ansible.oci.oci_identity_tag_namespace_info:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_retired_name }}'
          register: oci_cleanup_read_the_namespace_after_retired_namespace_creation

        - name: Verify retired namespace creation changed the resource
          ansible.builtin.assert:
            that:
              - oci_cleanup_create_a_retired_namespace.changed
              - oci_cleanup_read_the_namespace_after_retired_namespace_creation.tag_namespaces | length == 1

        - name: Verify the namespace fields after retired namespace creation
          ansible.builtin.assert:
            that:
              - oci_cleanup_read_the_namespace_after_retired_namespace_creation.tag_namespaces[0].is_retired ==
                true
              - oci_cleanup_read_the_namespace_after_retired_namespace_creation.tag_namespaces[0].lifecycle_state
                == "INACTIVE"
              - |-
                oci_cleanup_read_the_namespace_after_retired_namespace_creation.tag_namespaces[0].description ==
                oci_identity_tag_namespace_integration_retired_description

        - name: Repeat retired namespace creation
          ansible.oci.oci_identity_tag_namespace:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_retired_name }}'
            description: '{{ oci_identity_tag_namespace_integration_retired_description }}'
            is_retired: true
          register: oci_cleanup_repeat_retired_namespace_creation

        - name: Repeat retired namespace creation in check mode
          ansible.oci.oci_identity_tag_namespace:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_retired_name }}'
            description: '{{ oci_identity_tag_namespace_integration_retired_description }}'
            is_retired: true
          check_mode: true
          register: oci_cleanup_repeat_retired_namespace_creation_in_check_mode

        - name: Verify repeated retired namespace creation is unchanged
          ansible.builtin.assert:
            that:
              - not oci_cleanup_repeat_retired_namespace_creation.changed
              - not oci_cleanup_repeat_retired_namespace_creation_in_check_mode.changed

        - name: Get a namespace by ID in check mode
          ansible.oci.oci_identity_tag_namespace_info:
            tag_namespace_id: '{{ oci_identity_tag_namespace_retired_id }}'
          check_mode: true
          register: oci_cleanup_get_a_namespace_by_id_in_check_mode

        - name: Verify the namespace returned by ID
          ansible.builtin.assert:
            that:
              - not oci_cleanup_get_a_namespace_by_id_in_check_mode.changed
              - oci_cleanup_get_a_namespace_by_id_in_check_mode.tag_namespaces | length == 1
              - oci_cleanup_get_a_namespace_by_id_in_check_mode.tag_namespaces[0].id == oci_identity_tag_namespace_retired_id
              - oci_cleanup_get_a_namespace_by_id_in_check_mode.tag_namespaces[0].is_retired

        - name: List inactive namespaces with lowercase filters
          ansible.oci.oci_identity_tag_namespace_info:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_retired_name | upper }}'
            lifecycle_state: inactive
            include_subcompartments: false
          register: oci_cleanup_list_inactive_namespaces_with_lowercase_filters

        - name: Verify namespace list filters
          ansible.builtin.assert:
            that:
              - not oci_cleanup_list_inactive_namespaces_with_lowercase_filters.changed
              - oci_cleanup_list_inactive_namespaces_with_lowercase_filters.tag_namespaces | length == 1
              - oci_cleanup_list_inactive_namespaces_with_lowercase_filters.tag_namespaces[0].id == oci_identity_tag_namespace_retired_id

        - name: Read the namespace before active namespace deletion
          ansible.oci.oci_identity_tag_namespace_info:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_name }}'
          register: oci_cleanup_read_the_namespace_before_active_namespace_deletion

        - name: Delete the active empty namespace in check mode
          ansible.oci.oci_identity_tag_namespace:
            state: absent
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_name | upper }}'
          check_mode: true
          register: oci_cleanup_delete_the_active_empty_namespace_in_check_mode

        - name: Read the namespace after the check
          ansible.oci.oci_identity_tag_namespace_info:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_name }}'
          register: oci_cleanup_read_the_namespace_after_the_check_again_again_again_again

        - name: Verify check mode predicts a change without a mutation
          ansible.builtin.assert:
            that:
              - oci_cleanup_delete_the_active_empty_namespace_in_check_mode.changed
              - |-
                oci_cleanup_read_the_namespace_after_the_check_again_again_again_again.tag_namespaces ==
                oci_cleanup_read_the_namespace_before_active_namespace_deletion.tag_namespaces

        - name: Delete the active empty namespace
          ansible.oci.oci_identity_tag_namespace:
            state: absent
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_name | upper }}'
          register: oci_cleanup_delete_the_active_empty_namespace

        - name: Read the namespace after active namespace deletion
          ansible.oci.oci_identity_tag_namespace_info:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_name }}'
          register: oci_cleanup_read_the_namespace_after_active_namespace_deletion

        - name: Verify active namespace deletion changed the resource
          ansible.builtin.assert:
            that:
              - oci_cleanup_delete_the_active_empty_namespace.changed
              - |-
                oci_cleanup_read_the_namespace_after_active_namespace_deletion.tag_namespaces | rejectattr('lifecycle_state', 'equalto',
                'DELETED') | list | length == 0

        - name: Repeat active namespace deletion
          ansible.oci.oci_identity_tag_namespace:
            state: absent
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_name | upper }}'
          register: oci_cleanup_repeat_active_namespace_deletion

        - name: Repeat active namespace deletion in check mode
          ansible.oci.oci_identity_tag_namespace:
            state: absent
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_name | upper }}'
          check_mode: true
          register: oci_cleanup_repeat_active_namespace_deletion_in_check_mode

        - name: Verify repeated active namespace deletion is unchanged
          ansible.builtin.assert:
            that:
              - not oci_cleanup_repeat_active_namespace_deletion.changed
              - not oci_cleanup_repeat_active_namespace_deletion_in_check_mode.changed

        - name: Clear cleanup values after active namespace deletion
          ansible.builtin.set_fact:
            oci_identity_tag_namespace_active_id: ''
            oci_identity_tag_namespace_cleanup_name: ''

        - name: Read the namespace before retired namespace deletion
          ansible.oci.oci_identity_tag_namespace_info:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_retired_name }}'
          register: oci_cleanup_read_the_namespace_before_retired_namespace_deletion

        - name: Delete the retired empty namespace in check mode
          ansible.oci.oci_identity_tag_namespace:
            state: absent
            tag_namespace_id: '{{ oci_identity_tag_namespace_retired_id }}'
          check_mode: true
          register: oci_cleanup_delete_the_retired_empty_namespace_in_check_mode

        - name: Read the namespace after the check
          ansible.oci.oci_identity_tag_namespace_info:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_retired_name }}'
          register: oci_cleanup_read_the_namespace_after_the_check_again_again_again_again_again

        - name: Verify check mode predicts a change without a mutation
          ansible.builtin.assert:
            that:
              - oci_cleanup_delete_the_retired_empty_namespace_in_check_mode.changed
              - |-
                oci_cleanup_read_the_namespace_after_the_check_again_again_again_again_again.tag_namespaces ==
                oci_cleanup_read_the_namespace_before_retired_namespace_deletion.tag_namespaces

        - name: Delete the retired empty namespace
          ansible.oci.oci_identity_tag_namespace:
            state: absent
            tag_namespace_id: '{{ oci_identity_tag_namespace_retired_id }}'
          register: oci_cleanup_delete_the_retired_empty_namespace

        - name: Read the namespace after retired namespace deletion
          ansible.oci.oci_identity_tag_namespace_info:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_identity_tag_namespace_integration_retired_name }}'
          register: oci_cleanup_read_the_namespace_after_retired_namespace_deletion

        - name: Verify retired namespace deletion changed the resource
          ansible.builtin.assert:
            that:
              - oci_cleanup_delete_the_retired_empty_namespace.changed
              - |-
                oci_cleanup_read_the_namespace_after_retired_namespace_deletion.tag_namespaces | rejectattr('lifecycle_state',
                'equalto', 'DELETED') | list | length == 0

        - name: Repeat retired namespace deletion
          ansible.oci.oci_identity_tag_namespace:
            state: absent
            tag_namespace_id: '{{ oci_identity_tag_namespace_retired_id }}'
          register: oci_cleanup_repeat_retired_namespace_deletion

        - name: Repeat retired namespace deletion in check mode
          ansible.oci.oci_identity_tag_namespace:
            state: absent
            tag_namespace_id: '{{ oci_identity_tag_namespace_retired_id }}'
          check_mode: true
          register: oci_cleanup_repeat_retired_namespace_deletion_in_check_mode

        - name: Verify repeated retired namespace deletion is unchanged
          ansible.builtin.assert:
            that:
              - not oci_cleanup_repeat_retired_namespace_deletion.changed
              - not oci_cleanup_repeat_retired_namespace_deletion_in_check_mode.changed

        - name: Clear cleanup values after retired namespace deletion
          ansible.builtin.set_fact:
            oci_identity_tag_namespace_retired_id: ''
            oci_identity_tag_namespace_cleanup_retired_name: ''
  rescue:

    - name: Record a deletion test failure
      ansible.builtin.set_fact:
        oci_cleanup_checks_failed: true

- name: Delete leaked tag namespaces by ID
  ansible.oci.oci_identity_tag_namespace:
    state: absent
    tag_namespace_id: '{{ item.id }}'
  loop:
    - id: '{{ oci_identity_tag_namespace_active_id | default('''') }}'
      name: '{{ oci_identity_tag_namespace_cleanup_name | default('''') }}'
    - id: '{{ oci_identity_tag_namespace_retired_id | default('''') }}'
      name: '{{ oci_identity_tag_namespace_cleanup_retired_name | default('''') }}'
  when:
    - item.id | length > 0
  register: oci_cleanup_delete_leaked_tag_namespaces_by_id
  retries: 3
  ignore_errors: true

- name: Delete leaked tag namespaces by name when no ID was captured
  ansible.oci.oci_identity_tag_namespace:
    state: absent
    compartment_id: '{{ oci_integration_compartment_id }}'
    name: '{{ item.name }}'
  loop:
    - id: '{{ oci_identity_tag_namespace_active_id | default('''') }}'
      name: '{{ oci_identity_tag_namespace_cleanup_name | default('''') }}'
    - id: '{{ oci_identity_tag_namespace_retired_id | default('''') }}'
      name: '{{ oci_identity_tag_namespace_cleanup_retired_name | default('''') }}'
  when:
    - oci_integration_compartment_id is defined
    - item.id | length == 0
    - item.name | length > 0
  register: oci_cleanup_delete_leaked_tag_namespaces_by_name_when_no_id_was_captured
  retries: 3
  ignore_errors: true

- name: Verify resource cleanup
  ansible.builtin.assert:
    that:
      - not oci_cleanup_checks_failed | bool
      - (oci_cleanup_delete_temporary_enum_tag | default({})) is not failed
      - (oci_cleanup_delete_leaked_tag_namespaces_by_id | default({})) is not failed
      - (oci_cleanup_delete_leaked_tag_namespaces_by_name_when_no_id_was_captured | default({})) is not failed
    fail_msg: Resource cleanup or deletion checks failed. See the failed tasks above.
