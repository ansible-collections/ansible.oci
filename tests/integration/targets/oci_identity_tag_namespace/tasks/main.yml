---
- name: Initialize shared resources and ownership
  ansible.builtin.set_fact:
    oci_group_resources: {}
    oci_group_cleanup_failures: []
    oci_group_started_oci_identity_tag_namespace: false
    oci_group_started_oci_identity_tag: false

- name: Test oci_identity_tag_namespace and dependent modules
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: '{{ oci_integration_config_file_location }}'
      config_profile_name: '{{ oci_integration_config_profile_name }}'
  block:

    - name: Run oci_identity_tag_namespace tests
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_identity_tag_namespace/main.yml'
      vars:
        oci_prerequisites: '{{ oci_group_resources }}'

    - name: Run oci_identity_tag tests
      ansible.builtin.include_tasks: oci_identity_tag/main.yml
      vars:
        oci_prerequisites: '{{ oci_group_resources }}'

    - name: Run oci_identity_tag_namespace remaining tests
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_identity_tag_namespace/delete.yml'
      vars:
        oci_prerequisites: '{{ oci_group_resources }}'
  always:

    - name: Clean up all group resources
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/cleanup.yml'
