---
- name: Delete temporary enum tag
  ansible.oci.oci_identity_tag:
    state: absent
    tag_namespace_id: '{{ oci_identity_tag_integration_namespace_id }}'
    name: '{{ oci_identity_tag_integration_enum_name }}'
  when:
    - oci_group_started_oci_identity_tag | default(false)
    - oci_identity_tag_integration_namespace_id | length > 0
  register: oci_group_cleanup_0
  retries: 3
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Delete temporary enum tag''] }}'
  when: oci_group_cleanup_0 is failed

- name: Check module cleanup results
  ansible.builtin.assert:
    that:
      - oci_group_cleanup_failures | length == 0
    fail_msg: 'Cleanup failed for: {{ oci_group_cleanup_failures | join(", ") }}'
