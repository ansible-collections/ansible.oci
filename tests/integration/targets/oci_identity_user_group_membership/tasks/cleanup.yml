---
- name: Clean up the temporary identity domain
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Remove leaked membership during cleanup
      ansible.oci.oci_identity_user_group_membership:
        state: absent
        domain_id: "{{ oci_membership_domain_id }}"
        user_id: "{{ oci_membership_user_cleanup_id }}"
        group_id: "{{ oci_membership_group_cleanup_id }}"
      when:
        - oci_membership_domain_id | length > 0
        - oci_membership_added | default(false)
        - oci_membership_user_cleanup_id | default('') | length > 0
        - oci_membership_group_cleanup_id | default('') | length > 0

    - name: Delete leaked group by ID
      ansible.oci.oci_identity_group:
        state: absent
        domain_id: "{{ oci_membership_domain_id }}"
        group_id: "{{ oci_membership_group_cleanup_id }}"
      when:
        - oci_membership_domain_id | length > 0
        - oci_membership_group_cleanup_id | default('') | length > 0

    - name: Delete leaked group by name when no ID was captured
      ansible.oci.oci_identity_group:
        state: absent
        domain_id: "{{ oci_membership_domain_id }}"
        name: "{{ oci_membership_group_name }}"
      when:
        - oci_membership_domain_id | length > 0
        - oci_membership_group_cleanup_id | default('') | length == 0
        - oci_membership_group_name | default('') | length > 0

    - name: Delete leaked user by ID
      ansible.oci.oci_identity_user:
        state: absent
        domain_id: "{{ oci_membership_domain_id }}"
        user_id: "{{ oci_membership_user_cleanup_id }}"
      when:
        - oci_membership_domain_id | length > 0
        - oci_membership_user_cleanup_id | default('') | length > 0

    - name: Delete leaked user by name when no ID was captured
      ansible.oci.oci_identity_user:
        state: absent
        domain_id: "{{ oci_membership_domain_id }}"
        user_name: "{{ oci_membership_user_name }}"
      when:
        - oci_membership_domain_id | length > 0
        - oci_membership_user_cleanup_id | default('') | length == 0
        - oci_membership_user_name | default('') | length > 0

    - name: Delete temporary identity domain by ID
      ansible.oci.oci_identity_domain:
        state: absent
        domain_id: "{{ oci_membership_domain_id }}"
      when: oci_membership_domain_id | length > 0

    - name: Delete temporary identity domain by name when no ID was captured
      ansible.oci.oci_identity_domain:
        state: absent
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_membership_domain_name }}"
      when: oci_membership_domain_id | length == 0
