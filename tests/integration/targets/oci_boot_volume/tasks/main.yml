---
- name: Validate required OCI integration variables
  ansible.builtin.assert:
    that:
      - oci_integration_compartment_id | default('', true) | length > 0
    fail_msg: >-
      OCI boot volume integration tests require
      oci_integration_compartment_id to be defined in
      tests/integration/integration_config.yml.

- name: Compute unique resource names for this run
  ansible.builtin.set_fact:
    oci_boot_volume_integration_vcn_name: "{{ oci_boot_volume_integration_vcn_name }}-{{ oci_integration_rpfx }}"
    oci_boot_volume_integration_subnet_name: "{{ oci_boot_volume_integration_subnet_name }}-{{ oci_integration_rpfx }}"
    oci_boot_volume_integration_instance_name: "{{ oci_boot_volume_integration_instance_name }}-{{ oci_integration_rpfx }}"
    oci_boot_volume_integration_backup_name: "{{ oci_boot_volume_integration_backup_name }}-{{ oci_integration_rpfx }}"
    oci_boot_volume_integration_restore_name: "{{ oci_boot_volume_integration_restore_name }}-{{ oci_integration_rpfx }}"
    oci_boot_volume_integration_updated_restore_name: "{{ oci_boot_volume_integration_updated_restore_name }}-{{ oci_integration_rpfx }}"

- name: Exercise boot volume restore lifecycle
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Discover an availability domain in the compartment
      ansible.oci.oci_availability_domain_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
      register: oci_boot_volume_ad_info

    - name: Assert at least one availability domain was discovered
      ansible.builtin.assert:
        that:
          - oci_boot_volume_ad_info.availability_domains | length > 0

    - name: Set the working availability domain
      ansible.builtin.set_fact:
        oci_boot_volume_integration_availability_domain: "{{ oci_boot_volume_ad_info.availability_domains[0].name }}"

    - name: Discover a compatible image
      ansible.oci.oci_image_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        operating_system: "{{ oci_boot_volume_integration_operating_system }}"
        operating_system_version: "{{ oci_boot_volume_integration_operating_system_version }}"
        shape: "{{ oci_boot_volume_integration_shape }}"
      register: oci_boot_volume_image_info

    - name: Assert a compatible image was discovered
      ansible.builtin.assert:
        that:
          - oci_boot_volume_image_info.images | length > 0

    - name: Set the working image id
      ansible.builtin.set_fact:
        oci_boot_volume_image_id: "{{ oci_boot_volume_image_info.images[0].id }}"

    - name: Create test VCN for boot volume restore integration
      ansible.oci.oci_network_vcn:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_boot_volume_integration_vcn_name }}"
        cidr_blocks:
          - "{{ oci_boot_volume_integration_vcn_cidr_block }}"
      register: oci_boot_volume_vcn_create

    - name: Create test subnet for boot volume restore integration
      ansible.oci.oci_network_subnet:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        vcn_id: "{{ oci_boot_volume_vcn_create.resource.id }}"
        cidr_block: "{{ oci_boot_volume_integration_subnet_cidr_block }}"
        name: "{{ oci_boot_volume_integration_subnet_name }}"
      register: oci_boot_volume_subnet_create

    - name: Create test compute instance for boot volume restore integration
      ansible.oci.oci_instance:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        availability_domain: "{{ oci_boot_volume_integration_availability_domain }}"
        name: "{{ oci_boot_volume_integration_instance_name }}"
        shape: "{{ oci_boot_volume_integration_shape }}"
        shape_config: "{{ oci_boot_volume_integration_shape_config }}"
        image_id: "{{ oci_boot_volume_image_id }}"
        subnet_id: "{{ oci_boot_volume_subnet_create.resource.id }}"
      register: oci_boot_volume_instance_create

    - name: Capture created instance id
      ansible.builtin.set_fact:
        oci_boot_volume_instance_id: "{{ oci_boot_volume_instance_create.resource.id }}"

    - name: Look up the instance boot volume
      ansible.oci.oci_boot_volume_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        availability_domain: "{{ oci_boot_volume_integration_availability_domain }}"
        name: "{{ oci_boot_volume_integration_instance_name }} (Boot Volume)"
      register: oci_boot_volume_source_info
      until: oci_boot_volume_source_info.boot_volumes | length == 1
      retries: 30
      delay: 10

    - name: Capture the instance boot volume id
      ansible.builtin.set_fact:
        oci_boot_volume_integration_source_boot_volume_id: "{{ oci_boot_volume_source_info.boot_volumes[0].id }}"

    - name: Assert the instance boot volume was found
      ansible.builtin.assert:
        that:
          - oci_boot_volume_integration_source_boot_volume_id | length > 0

    - name: Create boot volume backup for restore
      ansible.oci.oci_boot_volume_backup:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_boot_volume_integration_backup_name }}"
        boot_volume_id: "{{ oci_boot_volume_integration_source_boot_volume_id }}"
        type: "{{ oci_boot_volume_integration_backup_type }}"
      register: oci_boot_volume_backup_create

    - name: Capture boot volume backup id and define restore parameters
      ansible.builtin.set_fact:
        oci_boot_volume_backup_id: "{{ oci_boot_volume_backup_create.resource.id }}"
        oci_boot_volume_create_params:
          state: present
          compartment_id: "{{ oci_integration_compartment_id }}"
          availability_domain: "{{ oci_boot_volume_integration_availability_domain }}"
          name: "{{ oci_boot_volume_integration_restore_name }}"
          source_details:
            type: bootVolumeBackup
            id: "{{ oci_boot_volume_backup_create.resource.id }}"
          freeform_tags: "{{ oci_boot_volume_integration_create_tags }}"
        oci_boot_volume_delete_params:
          state: absent
          boot_volume_id: ""

    - name: Assert boot volume backup create reported a change
      ansible.builtin.assert:
        that:
          - oci_boot_volume_backup_create.changed | bool
          - oci_boot_volume_backup_create.resource.lifecycle_state == "AVAILABLE"

    - name: Restore boot volume from backup in check mode
      ansible.oci.oci_boot_volume: &oci_boot_volume_create_module_options
        state: "{{ oci_boot_volume_create_params.state }}"
        compartment_id: "{{ oci_boot_volume_create_params.compartment_id }}"
        availability_domain: "{{ oci_boot_volume_create_params.availability_domain }}"
        name: "{{ oci_boot_volume_create_params.name }}"
        source_details: "{{ oci_boot_volume_create_params.source_details }}"
        freeform_tags: "{{ oci_boot_volume_create_params.freeform_tags }}"
      check_mode: true
      register: oci_boot_volume_create_check

    - name: Assert restore check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_boot_volume_create_check.changed | bool

    - name: Read restored boot volume after restore check mode
      ansible.oci.oci_boot_volume_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        availability_domain: "{{ oci_boot_volume_integration_availability_domain }}"
        name: "{{ oci_boot_volume_integration_restore_name }}"
      register: oci_boot_volume_create_check_probe

    - name: Assert restored boot volume is still absent after restore check mode
      ansible.builtin.assert:
        that:
          - oci_boot_volume_create_check_probe.boot_volumes | length == 0

    - name: Restore boot volume from backup
      ansible.oci.oci_boot_volume:
        <<: *oci_boot_volume_create_module_options
      register: oci_boot_volume_create

    - name: Capture restored boot volume id and define update parameters
      ansible.builtin.set_fact:
        oci_boot_volume_id: "{{ oci_boot_volume_create.resource.id }}"
        oci_boot_volume_update_params:
          state: present
          boot_volume_id: "{{ oci_boot_volume_create.resource.id }}"
          name: "{{ oci_boot_volume_integration_updated_restore_name }}"
          freeform_tags: "{{ oci_boot_volume_integration_update_tags }}"
        oci_boot_volume_delete_params:
          state: absent
          boot_volume_id: "{{ oci_boot_volume_create.resource.id }}"

    - name: Assert restore reported a change
      ansible.builtin.assert:
        that:
          - oci_boot_volume_create.changed | bool
          - oci_boot_volume_create.resource.lifecycle_state == "AVAILABLE"
          - oci_boot_volume_create.resource.is_hydrated | bool
          - oci_boot_volume_create.resource.source_details.type == "bootVolumeBackup"
          - oci_boot_volume_create.resource.source_details.id == oci_boot_volume_backup_id

    - name: Read restored boot volume by id
      ansible.oci.oci_boot_volume_info:
        boot_volume_id: "{{ oci_boot_volume_id }}"
      register: oci_boot_volume_info_by_id

    - name: Assert boot volume info by id returned the restored volume
      ansible.builtin.assert:
        that:
          - oci_boot_volume_info_by_id.boot_volumes | length == 1
          - oci_boot_volume_info_by_id.boot_volumes[0].id == oci_boot_volume_id
          - oci_boot_volume_info_by_id.boot_volumes[0].name == oci_boot_volume_integration_restore_name
          - oci_boot_volume_info_by_id.boot_volumes[0].lifecycle_state == "AVAILABLE"
          - oci_boot_volume_info_by_id.boot_volumes[0].is_hydrated | bool
          - oci_boot_volume_info_by_id.boot_volumes[0].source_details.type == "bootVolumeBackup"
          - oci_boot_volume_info_by_id.boot_volumes[0].source_details.id == oci_boot_volume_backup_id

    - name: List restored boot volume by name
      ansible.oci.oci_boot_volume_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        availability_domain: "{{ oci_boot_volume_integration_availability_domain }}"
        name: "{{ oci_boot_volume_integration_restore_name }}"
      register: oci_boot_volume_info_list

    - name: Assert boot volume info list returned the restored volume
      ansible.builtin.assert:
        that:
          - oci_boot_volume_info_list.boot_volumes | selectattr('id', 'equalto', oci_boot_volume_id) | list | length == 1

    - name: Assert restored boot volume is a no-op on rerun with unique name
      ansible.oci.oci_boot_volume:
        <<: *oci_boot_volume_create_module_options
      register: oci_boot_volume_create_rerun_by_name

    - name: Verify restore rerun with unique name is a no-op
      ansible.builtin.assert:
        that:
          - not oci_boot_volume_create_rerun_by_name.changed | bool
          - oci_boot_volume_create_rerun_by_name.resource.id == oci_boot_volume_id

    - name: Update restored boot volume in check mode
      ansible.oci.oci_boot_volume: &oci_boot_volume_update_module_options
        state: "{{ oci_boot_volume_update_params.state }}"
        boot_volume_id: "{{ oci_boot_volume_update_params.boot_volume_id }}"
        name: "{{ oci_boot_volume_update_params.name }}"
        freeform_tags: "{{ oci_boot_volume_update_params.freeform_tags }}"
      check_mode: true
      register: oci_boot_volume_update_check

    - name: Assert update check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_boot_volume_update_check.changed | bool

    - name: Read restored boot volume after update check mode
      ansible.oci.oci_boot_volume_info:
        boot_volume_id: "{{ oci_boot_volume_id }}"
      register: oci_boot_volume_update_check_probe

    - name: Assert update check mode did not mutate cloud state
      ansible.builtin.assert:
        that:
          - oci_boot_volume_update_check_probe.boot_volumes[0].name == oci_boot_volume_integration_restore_name
          - oci_boot_volume_update_check_probe.boot_volumes[0].freeform_tags.phase == "create"

    - name: Update restored boot volume
      ansible.oci.oci_boot_volume:
        <<: *oci_boot_volume_update_module_options
      register: oci_boot_volume_update

    - name: Assert update reported a change
      ansible.builtin.assert:
        that:
          - oci_boot_volume_update.changed | bool

    - name: Read updated restored boot volume by name
      ansible.oci.oci_boot_volume_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        availability_domain: "{{ oci_boot_volume_integration_availability_domain }}"
        name: "{{ oci_boot_volume_integration_updated_restore_name }}"
      register: oci_boot_volume_info_updated

    - name: Assert boot volume info reflects the updated restored volume
      ansible.builtin.assert:
        that:
          - oci_boot_volume_info_updated.boot_volumes | selectattr('id', 'equalto', oci_boot_volume_id) | list | length == 1
          - oci_boot_volume_info_updated.boot_volumes[0].freeform_tags.phase == "update"

    - name: Assert update is idempotent on rerun
      ansible.oci.oci_boot_volume:
        <<: *oci_boot_volume_update_module_options
      register: oci_boot_volume_update_rerun

    - name: Verify update rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_boot_volume_update_rerun.changed | bool

    - name: Delete restored boot volume in check mode
      ansible.oci.oci_boot_volume: &oci_boot_volume_delete_module_options
        state: "{{ oci_boot_volume_delete_params.state }}"
        boot_volume_id: "{{ oci_boot_volume_delete_params.boot_volume_id }}"
      check_mode: true
      register: oci_boot_volume_delete_check

    - name: Assert delete check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_boot_volume_delete_check.changed | bool

    - name: Read restored boot volume after delete check mode
      ansible.oci.oci_boot_volume_info:
        boot_volume_id: "{{ oci_boot_volume_id }}"
      register: oci_boot_volume_delete_check_probe

    - name: Assert restored boot volume still exists after delete check mode
      ansible.builtin.assert:
        that:
          - oci_boot_volume_delete_check_probe.boot_volumes | length == 1

    - name: Delete restored boot volume
      ansible.oci.oci_boot_volume:
        <<: *oci_boot_volume_delete_module_options
      register: oci_boot_volume_delete

    - name: Assert delete reported a change
      ansible.builtin.assert:
        that:
          - oci_boot_volume_delete.changed | bool

    - name: Assert delete is idempotent on rerun
      ansible.oci.oci_boot_volume:
        <<: *oci_boot_volume_delete_module_options
      register: oci_boot_volume_delete_rerun

    - name: Verify delete rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_boot_volume_delete_rerun.changed | bool

    - name: Clear restored boot volume id after successful delete
      ansible.builtin.set_fact:
        oci_boot_volume_id: ""

  always:
    - name: Run boot volume cleanup
      ansible.builtin.include_tasks: cleanup.yml
