---
# Long-lived vault shared by every run. The first run creates it; later runs find it by name. The vault itself is
# never mutated after creation in this target so concurrent runs stay parallel safe; oci_vault module lifecycle
# coverage lives in the oci_vault_lifecycle target.
oci_vault_integration_vault_name: "ansible-oci-integration-vault"
oci_vault_key_integration_key_name: "oci-vault-key-integration"
oci_vault_key_integration_renamed_key_name: "oci-vault-key-integration-renamed"
oci_vault_key_integration_key_shape:
  algorithm: aes
  length: 32
oci_vault_key_integration_deletion_days: 7
oci_vault_key_integration_create_tags:
  phase: create
  role: integration
oci_vault_key_integration_update_tags:
  phase: update
  role: integration

# Long-lived AES key that encrypts the per-run secrets. It is created on first use, found by name afterwards, and
# never mutated or deleted, unlike the per-run key above, which cleanup schedules for deletion.
oci_vault_secret_integration_key_name: "ansible-oci-integration-secret-key"
oci_vault_secret_integration_key_shape:
  algorithm: aes
  length: 32

# Per-run secrets; the run prefix is appended in tasks/main.yml.
oci_vault_secret_integration_secret_name: "oci-vault-secret-integration"
oci_vault_secret_integration_generated_secret_name: "oci-vault-secret-integration-generated"
oci_vault_secret_integration_invalid_secret_name: "oci-vault-secret-integration-invalid"

oci_vault_secret_integration_deletion_days: 1

oci_vault_secret_integration_create_description: "Created by the ansible.oci integration tests"
oci_vault_secret_integration_update_description: "Updated by the ansible.oci integration tests"
oci_vault_secret_integration_create_metadata:
  owner: integration
  phase: create
oci_vault_secret_integration_update_metadata:
  owner: integration
  phase: update
oci_vault_secret_integration_create_tags:
  phase: create
  role: integration
oci_vault_secret_integration_update_tags:
  phase: update
  role: integration

oci_vault_secret_integration_content_v1: "integration-secret-content-one"
oci_vault_secret_integration_content_v2: "integration-secret-content-two"
oci_vault_secret_integration_content_v3: "integration-secret-content-three"
oci_vault_secret_integration_content_v3_base64: "{{ oci_vault_secret_integration_content_v3 | b64encode }}"
oci_vault_secret_integration_content_ignored: "integration-secret-content-ignored"

oci_vault_secret_integration_secret_rules:
  - rule_type: secret_expiry_rule
    secret_version_expiry_interval: P30D
    is_secret_content_retrieval_blocked_on_expiry: false
  - rule_type: secret_reuse_rule
    is_enforced_on_deleted_secret_versions: true

oci_vault_secret_integration_generation_context:
  generation_type: passphrase
  generation_template: secrets_default_password
