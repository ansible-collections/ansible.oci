---
# Writes a new secret version through oci_vault_secret and verifies the check, apply, and idempotency behavior.
# Expects oci_vault_secret_id plus these variables from the caller:
#   oci_vault_secret_step_content           content passed to the module (text or base64, per encoding)
#   oci_vault_secret_step_encoding          text or base64
#   oci_vault_secret_step_plain             decoded text the secret must return afterwards
#   oci_vault_secret_step_previous_plain    decoded text the secret returned before this step
#   oci_vault_secret_step_name              name given to the new version
#   oci_vault_secret_step_version           version number the new version must receive
- name: Update secret content with shared OCI auth defaults
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Update secret content in check mode
      ansible.oci.oci_vault_secret: &oci_vault_secret_content_module_options
        state: present
        secret_id: "{{ oci_vault_secret_id }}"
        content: "{{ oci_vault_secret_step_content }}"
        content_encoding: "{{ oci_vault_secret_step_encoding }}"
        content_name: "{{ oci_vault_secret_step_name }}"
      check_mode: true
      register: oci_vault_secret_content_check

    - name: Read secret and content after content update check mode
      ansible.oci.oci_vault_secret_info:
        secret_id: "{{ oci_vault_secret_id }}"
        include_content: true
      no_log: true
      register: oci_vault_secret_content_check_probe

    - name: Assert content update check mode reported a change without writing a version
      ansible.builtin.assert:
        that:
          - oci_vault_secret_content_check.changed | bool
          - oci_vault_secret_content_check_probe.vault_secrets[0].current_version_number == oci_vault_secret_step_version | int - 1
          - oci_vault_secret_content_check_probe.vault_secrets[0].content == oci_vault_secret_step_previous_plain
        fail_msg: Content update check mode must report a change and leave the current version untouched.

    - name: Update secret content
      ansible.oci.oci_vault_secret:
        <<: *oci_vault_secret_content_module_options
      register: oci_vault_secret_content_update

    - name: Read secret and content after content update
      ansible.oci.oci_vault_secret_info:
        secret_id: "{{ oci_vault_secret_id }}"
        include_content: true
      no_log: true
      register: oci_vault_secret_content_update_probe

    - name: Assert content update created the next version
      ansible.builtin.assert:
        that:
          - oci_vault_secret_content_update.changed | bool
          - oci_vault_secret_content_update.resource.id == oci_vault_secret_id
          - oci_vault_secret_content_update.resource.lifecycle_state == "ACTIVE"
          - oci_vault_secret_content_update.resource.current_version_number == oci_vault_secret_step_version | int
          - "'content' not in oci_vault_secret_content_update.resource"
          - oci_vault_secret_content_update_probe.vault_secrets[0].current_version_number == oci_vault_secret_step_version | int
          - oci_vault_secret_content_update_probe.vault_secrets[0].content == oci_vault_secret_step_plain
        fail_msg: Content update must create the next version, make it current, and never return content in the resource.

    - name: Rerun content update
      ansible.oci.oci_vault_secret:
        <<: *oci_vault_secret_content_module_options
      register: oci_vault_secret_content_update_again

    - name: Rerun content update in check mode
      ansible.oci.oci_vault_secret:
        <<: *oci_vault_secret_content_module_options
      check_mode: true
      register: oci_vault_secret_content_update_again_check

    - name: Read secret after content update reruns
      ansible.oci.oci_vault_secret_info:
        secret_id: "{{ oci_vault_secret_id }}"
      register: oci_vault_secret_content_update_again_probe

    - name: Assert content update reruns are idempotent
      ansible.builtin.assert:
        that:
          - not oci_vault_secret_content_update_again.changed | bool
          - not oci_vault_secret_content_update_again_check.changed | bool
          - oci_vault_secret_content_update_again_probe.vault_secrets[0].current_version_number == oci_vault_secret_step_version | int
        fail_msg: Rerunning an identical content update must not write another version.
