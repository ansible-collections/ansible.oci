---
- name: Validate required OCI integration variables
  ansible.builtin.assert:
    that:
      - oci_integration_compartment_id | default('', true) | length > 0
    fail_msg: >-
      OCI vault integration tests require oci_integration_compartment_id to be defined in
      tests/integration/integration_config.yml.

- name: Compute unique resource names for this run
  ansible.builtin.set_fact:
    oci_vault_key_integration_key_name: "{{ oci_vault_key_integration_key_name }}-{{ oci_integration_rpfx }}"
    oci_vault_key_integration_renamed_key_name: "{{ oci_vault_key_integration_renamed_key_name }}-{{ oci_integration_rpfx }}"
    oci_vault_secret_integration_secret_name: "{{ oci_vault_secret_integration_secret_name }}-{{ oci_integration_rpfx }}"
    oci_vault_secret_integration_generated_secret_name: >-
      {{ oci_vault_secret_integration_generated_secret_name }}-{{ oci_integration_rpfx }}
    oci_vault_secret_integration_invalid_secret_name: "{{ oci_vault_secret_integration_invalid_secret_name }}-{{ oci_integration_rpfx }}"

- name: Exercise vault key and secret modules against the shared vault
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    # ------------------------------------------------- shared vault bootstrap
    # The vault is long-lived and shared by every run: the first run creates it and later runs find it by name. This
    # bootstrap is the only vault mutation in the regular run so that concurrent runs cannot replace each other's
    # tags or otherwise race on the shared vault; the create, rename, retag, delete, and restore coverage for the
    # oci_vault module lives in the oci_vault_lifecycle target, which is excluded from regular runs.
    - name: Read the shared vault by name
      ansible.oci.oci_vault_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_vault_integration_vault_name }}"
      register: oci_vault_bootstrap_lookup

    - name: Create the shared vault when it is missing
      ansible.oci.oci_vault:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_vault_integration_vault_name }}"
      when: >-
        (oci_vault_bootstrap_lookup.vaults
        | rejectattr('lifecycle_state', 'in', ['DELETED', 'DELETING']) | list | length) == 0
      register: oci_vault_bootstrap_create

    - name: Keep the vaults found by the initial lookup
      ansible.builtin.set_fact:
        oci_vault_bootstrap_vaults: "{{ oci_vault_bootstrap_lookup.vaults
          | rejectattr('lifecycle_state', 'in', ['DELETED', 'DELETING']) | list }}"
      when: oci_vault_bootstrap_create is skipped

    - name: Read the shared vault by name after create
      ansible.oci.oci_vault_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_vault_integration_vault_name }}"
      register: oci_vault_bootstrap_created
      when: oci_vault_bootstrap_create is not skipped

    - name: Capture the vaults found after create
      ansible.builtin.set_fact:
        oci_vault_bootstrap_vaults: "{{ oci_vault_bootstrap_created.vaults
          | rejectattr('lifecycle_state', 'in', ['DELETED', 'DELETING']) | list }}"
      when: oci_vault_bootstrap_create is not skipped

    - name: Assert the shared vault bootstrap left exactly one active vault
      ansible.builtin.assert:
        that:
          - oci_vault_bootstrap_vaults | length == 1
        fail_msg: >-
          Expected exactly one active vault named {{ oci_vault_integration_vault_name }};
          found {{ oci_vault_bootstrap_vaults | length }}. Concurrent bootstrap runs may have created
          duplicates; remove the extras and rerun.

    - name: Capture vault id
      ansible.builtin.set_fact:
        oci_vault_id: "{{ oci_vault_bootstrap_vaults[0].id }}"

    - name: Read vault by id
      ansible.oci.oci_vault_info:
        vault_id: "{{ oci_vault_id }}"
      register: oci_vault_info_by_id

    - name: Assert vault info by id returned the shared vault
      ansible.builtin.assert:
        that:
          - oci_vault_info_by_id.vaults | length == 1
          - oci_vault_info_by_id.vaults[0].id == oci_vault_id
          - oci_vault_info_by_id.vaults[0].name == oci_vault_integration_vault_name
          - oci_vault_info_by_id.vaults[0].lifecycle_state == "ACTIVE"
          - oci_vault_info_by_id.vaults[0].vault_type == "DEFAULT"
          - oci_vault_info_by_id.vaults[0].management_endpoint | length > 0

    - name: Exercise vault key modules
      ansible.builtin.include_tasks: key.yml

    - name: Exercise vault secret modules
      ansible.builtin.include_tasks: secret.yml

  always:
    - name: Run vault key and secret cleanup
      ansible.builtin.include_tasks: cleanup.yml
