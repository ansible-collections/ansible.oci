---
- name: Initialize resource identifiers
  ansible.builtin.set_fact:
    oci_instance_id: ''
    oci_console_history_id: ''
    oci_console_connection_id: ''
    oci_instance_vcn_create: {}
    oci_instance_subnet_create: {}
    oci_instance_create: {}
    oci_tests_completed: false

- name: Test oci_instance_console_connection
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: '{{ oci_integration_config_file_location }}'
      config_profile_name: '{{ oci_integration_config_profile_name }}'
  block:

    - name: Create prerequisites
      ansible.builtin.include_tasks: prerequisites.yml

    - name: Run oci_instance_console_connection tests
      ansible.builtin.include_tasks: oci_instance_console_connection.yml
      vars:
        oci_shared_instance: '{{ oci_instance_create }}'
        oci_shared_vcn: '{{ oci_instance_vcn_create }}'
        oci_shared_subnet: '{{ oci_instance_subnet_create }}'

    - name: Test oci_instance_console_history
      ansible.builtin.include_tasks: oci_instance_console_history.yml

    - name: Mark tests as complete
      ansible.builtin.set_fact:
        oci_tests_completed: true
  always:

    - name: Clean up all test resources
      ansible.builtin.include_tasks: cleanup.yml
