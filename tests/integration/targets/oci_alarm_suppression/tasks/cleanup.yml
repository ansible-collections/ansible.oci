---
- name: Run alarm suppression cleanup with shared OCI auth defaults
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    # Suppressions reference the alarm, and the alarm references the topic.
    - name: Delete leaked alarm suppression by id
      ansible.oci.oci_alarm_suppression:
        state: absent
        alarm_suppression_id: "{{ oci_alarm_suppression_id }}"
      when: oci_alarm_suppression_id | default('') | length > 0
      register: oci_cleanup_suppression
      until: oci_cleanup_suppression is not failed
      retries: 3
      delay: 5
      ignore_errors: true

    - name: Delete leaked compartment suppression by id
      ansible.oci.oci_alarm_suppression:
        state: absent
        alarm_suppression_id: "{{ oci_alarm_suppression_compartment_suppression_id }}"
      when: oci_alarm_suppression_compartment_suppression_id | default('') | length > 0
      register: oci_cleanup_compartment_suppression
      until: oci_cleanup_compartment_suppression is not failed
      retries: 3
      delay: 5
      ignore_errors: true

    - name: Delete leaked dimension suppression by id
      ansible.oci.oci_alarm_suppression:
        state: absent
        alarm_suppression_id: "{{ oci_alarm_suppression_dimension_suppression_id }}"
      when: oci_alarm_suppression_dimension_suppression_id | default('') | length > 0
      register: oci_cleanup_dimension_suppression
      until: oci_cleanup_dimension_suppression is not failed
      retries: 3
      delay: 5
      ignore_errors: true

    - name: Delete leaked alarm by id
      ansible.oci.oci_alarm:
        state: absent
        alarm_id: "{{ oci_alarm_suppression_alarm_id }}"
      when: oci_alarm_suppression_alarm_id | default('') | length > 0
      register: oci_cleanup_alarm
      until: oci_cleanup_alarm is not failed
      retries: 3
      delay: 5
      ignore_errors: true

    - name: Delete leaked alarm by exact scoped name when no id was captured
      ansible.oci.oci_alarm:
        state: absent
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_alarm_suppression_integration_alarm_name }}"
      when: oci_alarm_suppression_alarm_id | default('') | length == 0
      register: oci_cleanup_alarm_by_name
      until: oci_cleanup_alarm_by_name is not failed
      retries: 3
      delay: 5
      ignore_errors: true

    - name: Delete leaked topic by id
      ansible.oci.oci_notification_topic:
        state: absent
        topic_id: "{{ oci_alarm_suppression_topic_id }}"
      when: oci_alarm_suppression_topic_id | default('') | length > 0
      register: oci_cleanup_topic
      until: oci_cleanup_topic is not failed
      retries: 3
      delay: 5
      ignore_errors: true

    - name: Delete leaked topic by exact scoped name when no id was captured
      ansible.oci.oci_notification_topic:
        state: absent
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_alarm_suppression_integration_topic_name }}"
      when: oci_alarm_suppression_topic_id | default('') | length == 0
      register: oci_cleanup_topic_by_name
      until: oci_cleanup_topic_by_name is not failed
      retries: 3
      delay: 5
      ignore_errors: true

    - name: Verify resource cleanup succeeded
      ansible.builtin.assert:
        that:
          - oci_cleanup_suppression is not failed
          - oci_cleanup_compartment_suppression is not failed
          - oci_cleanup_dimension_suppression is not failed
          - oci_cleanup_alarm is not failed
          - oci_cleanup_alarm_by_name is not failed
          - oci_cleanup_topic is not failed
          - oci_cleanup_topic_by_name is not failed
        fail_msg: Resource cleanup failed after 3 retries; see the failed cleanup tasks above.
