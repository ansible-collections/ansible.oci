---
- name: Check policy creation
  ansible.oci.oci_network_firewall_policy:
    compartment_id: '{{ oci_integration_compartment_id }}'
    name: '{{ oci_firewall_policy_test_name }}'
    freeform_tags:
      phase: create
    description: Network firewall integration policy
  check_mode: true
  register: policy_create_check

- name: Read policies after the creation check
  ansible.oci.oci_network_firewall_policy_info:
    compartment_id: '{{ oci_integration_compartment_id }}'
    name: '{{ oci_firewall_policy_test_name }}'
  register: policy_before_create

- name: Verify the creation check left the policy absent
  ansible.builtin.assert:
    that:
      - policy_create_check.changed
      - policy_before_create.network_firewall_policies | length == 0

- name: Create the policy
  ansible.oci.oci_network_firewall_policy:
    compartment_id: '{{ oci_integration_compartment_id }}'
    name: '{{ oci_firewall_policy_test_name }}'
    freeform_tags:
      phase: create
    description: Network firewall integration policy
  register: policy_create

- name: Save the policy ID for cleanup
  ansible.builtin.set_fact:
    oci_firewall_policy_cleanup_id: '{{ policy_create.resource.id }}'

- name: Verify the created policy
  ansible.builtin.assert:
    that:
      - policy_create.changed
      - policy_create.resource.id | length > 0
      - policy_create.resource.name == oci_firewall_policy_test_name
      - policy_create.resource.compartment_id == oci_integration_compartment_id
      - policy_create.resource.lifecycle_state == 'ACTIVE'
      - policy_create.resource.freeform_tags.phase == 'create'

- name: Wait for the policy to appear in the active list
  ansible.oci.oci_network_firewall_policy_info:
    compartment_id: '{{ oci_integration_compartment_id }}'
    name: '{{ oci_firewall_policy_test_name }}'
    lifecycle_state: active
  register: policy_list
  until: policy_list.network_firewall_policies | length == 1
  retries: 12
  delay: 5

- name: Verify the list result
  ansible.builtin.assert:
    that:
      - not policy_list.changed
      - policy_list.network_firewall_policies[0].id == oci_firewall_policy_cleanup_id

- name: Retrieve the policy by ID
  ansible.oci.oci_network_firewall_policy_info:
    network_firewall_policy_id: '{{ oci_firewall_policy_cleanup_id }}'
  register: policy_by_id

- name: Verify the ID result
  ansible.builtin.assert:
    that:
      - not policy_by_id.changed
      - policy_by_id.network_firewall_policies | length == 1
      - policy_by_id.network_firewall_policies[0].id == oci_firewall_policy_cleanup_id

- name: Verify creation is unchanged
  ansible.oci.oci_network_firewall_policy:
    compartment_id: '{{ oci_integration_compartment_id }}'
    name: '{{ oci_firewall_policy_test_name }}'
    freeform_tags:
      phase: create
    description: Network firewall integration policy
  check_mode: false
  register: policy_create_repeat
  failed_when: policy_create_repeat.changed or policy_create_repeat.resource.id != oci_firewall_policy_cleanup_id

- name: Verify creation is unchanged in check mode
  ansible.oci.oci_network_firewall_policy:
    compartment_id: '{{ oci_integration_compartment_id }}'
    name: '{{ oci_firewall_policy_test_name }}'
    freeform_tags:
      phase: create
    description: Network firewall integration policy
  check_mode: true
  register: policy_create_repeat
  failed_when: policy_create_repeat.changed or policy_create_repeat.resource.id != oci_firewall_policy_cleanup_id

- name: Read the policy before update 1
  ansible.oci.oci_network_firewall_policy_info:
    network_firewall_policy_id: '{{ oci_firewall_policy_cleanup_id }}'
  register: policy_before_update

- name: Check policy update 1
  ansible.oci.oci_network_firewall_policy:
    network_firewall_policy_id: '{{ oci_firewall_policy_cleanup_id }}'
    name: '{{ oci_firewall_policy_test_name }}-updated'
    description: Updated network firewall integration policy
    freeform_tags:
      phase: update
  check_mode: true
  register: policy_update_check

- name: Read the policy after the update check
  ansible.oci.oci_network_firewall_policy_info:
    network_firewall_policy_id: '{{ oci_firewall_policy_cleanup_id }}'
  register: policy_after_update_check

- name: Verify the update check left the policy unchanged
  ansible.builtin.assert:
    that:
      - policy_update_check.changed
      - policy_after_update_check.network_firewall_policies == policy_before_update.network_firewall_policies

- name: Update the policy
  ansible.oci.oci_network_firewall_policy:
    network_firewall_policy_id: '{{ oci_firewall_policy_cleanup_id }}'
    name: '{{ oci_firewall_policy_test_name }}-updated'
    description: Updated network firewall integration policy
    freeform_tags:
      phase: update
  register: policy_update

- name: Verify the updated policy
  ansible.builtin.assert:
    that:
      - policy_update.changed
      - policy_update.resource.lifecycle_state == 'ACTIVE'
      - policy_update.resource.name == oci_firewall_policy_test_name + "-updated"
      - policy_update.resource.description == 'Updated network firewall integration policy'
      - 'policy_update.resource.freeform_tags == {''phase'': ''update''}'

- name: Verify update is unchanged
  ansible.oci.oci_network_firewall_policy:
    network_firewall_policy_id: '{{ oci_firewall_policy_cleanup_id }}'
    name: '{{ oci_firewall_policy_test_name }}-updated'
    description: Updated network firewall integration policy
    freeform_tags:
      phase: update
  check_mode: false
  register: policy_update_repeat
  failed_when: policy_update_repeat.changed or policy_update_repeat.resource.id != oci_firewall_policy_cleanup_id

- name: Verify the unchanged policy settings
  ansible.builtin.assert:
    that:
      - policy_update_repeat.resource.name == oci_firewall_policy_test_name + "-updated"
      - policy_update_repeat.resource.description == 'Updated network firewall integration policy'
      - 'policy_update_repeat.resource.freeform_tags == {''phase'': ''update''}'

- name: Verify update is unchanged in check mode
  ansible.oci.oci_network_firewall_policy:
    network_firewall_policy_id: '{{ oci_firewall_policy_cleanup_id }}'
    name: '{{ oci_firewall_policy_test_name }}-updated'
    description: Updated network firewall integration policy
    freeform_tags:
      phase: update
  check_mode: true
  register: policy_update_repeat
  failed_when: policy_update_repeat.changed or policy_update_repeat.resource.id != oci_firewall_policy_cleanup_id

- name: Verify the unchanged policy settings
  ansible.builtin.assert:
    that:
      - policy_update_repeat.resource.name == oci_firewall_policy_test_name + "-updated"
      - policy_update_repeat.resource.description == 'Updated network firewall integration policy'
      - 'policy_update_repeat.resource.freeform_tags == {''phase'': ''update''}'
