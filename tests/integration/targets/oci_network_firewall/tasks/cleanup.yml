---
- name: Run Network Firewall cleanup with shared OCI auth defaults
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
    ansible.oci.oci_network_firewall:
      wait_timeout: 3600
  block:
    - name: Delete leaked Network Firewall during cleanup
      ansible.oci.oci_network_firewall:
        state: absent
        network_firewall_id: "{{ oci_firewall_cleanup_id }}"
      when: oci_firewall_cleanup_id | default('') | length > 0
      register: oci_cleanup_network_firewall
      retries: 3
      ignore_errors: true

    - name: Delete leaked replacement policy during cleanup
      ansible.oci.oci_network_firewall_policy:
        state: absent
        network_firewall_policy_id: "{{ firewall_replacement_policy.resource.id }}"
      when: firewall_replacement_policy.resource.id | default('') | length > 0
      register: oci_cleanup_replacement_policy
      retries: 3
      ignore_errors: true

    - name: Delete leaked Network Firewall policy during cleanup
      ansible.oci.oci_network_firewall_policy:
        state: absent
        network_firewall_policy_id: "{{ oci_firewall_policy_cleanup_id }}"
      when: oci_firewall_policy_cleanup_id | default('') | length > 0
      register: oci_cleanup_network_firewall_policy
      retries: 3
      ignore_errors: true

    - name: Delete leaked Network Security Group during cleanup
      ansible.oci.oci_network_security_group:
        state: absent
        network_security_group_id: "{{ firewall_nsg.resource.id }}"
      when: firewall_nsg.resource.id | default('') | length > 0
      register: oci_cleanup_network_security_group
      retries: 3
      ignore_errors: true

    - name: Delete leaked subnet during cleanup
      ansible.oci.oci_network_subnet:
        state: absent
        subnet_id: "{{ firewall_subnet.resource.id }}"
      when: firewall_subnet.resource.id | default('') | length > 0
      register: oci_cleanup_subnet
      retries: 3
      ignore_errors: true

    - name: Delete leaked VCN during cleanup
      ansible.oci.oci_network_vcn:
        state: absent
        vcn_id: "{{ firewall_vcn.resource.id }}"
      when: firewall_vcn.resource.id | default('') | length > 0
      register: oci_cleanup_vcn
      retries: 3
      ignore_errors: true

    - name: Verify resource cleanup succeeded
      ansible.builtin.assert:
        that:
          - oci_cleanup_network_firewall is not failed
          - oci_cleanup_replacement_policy is not failed
          - oci_cleanup_network_firewall_policy is not failed
          - oci_cleanup_network_security_group is not failed
          - oci_cleanup_subnet is not failed
          - oci_cleanup_vcn is not failed
        fail_msg: Resource cleanup failed after 3 retries; see the failed cleanup tasks above.
