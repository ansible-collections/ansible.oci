---
- name: Check the test compartment
  ansible.builtin.assert:
    that:
      - oci_integration_compartment_id | default('', true) | length > 0

- name: Initialize the test names and cleanup IDs
  ansible.builtin.set_fact:
    oci_firewall_test_name: oci-network-firewall-{{ oci_integration_rpfx }}
    oci_firewall_policy_test_name: oci-network-firewall-policy-{{ oci_integration_rpfx }}
    oci_firewall_policy_cleanup_id: ''

- name: Test the policy lifecycle and firewall check mode
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: '{{ oci_integration_config_file_location }}'
      config_profile_name: '{{ oci_integration_config_profile_name }}'
  block:

    - name: Run oci_network_firewall_policy tests
      ansible.builtin.include_tasks: oci_network_firewall_policy.yml

    - name: Create the test VCN
      ansible.oci.oci_network_vcn:
        compartment_id: '{{ oci_integration_compartment_id }}'
        name: '{{ oci_firewall_test_name }}-vcn'
        cidr_blocks:
          - 10.247.0.0/16
      register: firewall_vcn

    - name: Create the test subnet
      ansible.oci.oci_network_subnet:
        compartment_id: '{{ oci_integration_compartment_id }}'
        name: '{{ oci_firewall_test_name }}-subnet'
        vcn_id: '{{ firewall_vcn.resource.id }}'
        cidr_block: 10.247.1.0/24
      register: firewall_subnet

    - name: Run oci_network_firewall tests
      ansible.builtin.include_tasks: oci_network_firewall.yml

    - name: Run oci_network_firewall_policy_delete tests
      ansible.builtin.include_tasks: oci_network_firewall_policy_delete.yml
  always:

    - name: Run Network Firewall cleanup
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/cleanup.yml'
