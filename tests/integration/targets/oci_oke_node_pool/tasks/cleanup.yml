---
- name: Run OKE node pool cleanup with shared OCI auth defaults
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Delete leaked node pools during cleanup
      ansible.oci.oci_oke_node_pool:
        state: absent
        node_pool_id: "{{ item }}"
      loop: "{{ oci_oke_np_cleanup_ids | default([]) | unique | list }}"
      when: item | default('') | length > 0
      register: oci_cleanup_node_pools
      retries: 3
      ignore_errors: true

    - name: Delete leaked cluster during cleanup
      ansible.oci.oci_oke_cluster:
        state: absent
        cluster_id: "{{ oci_oke_np_cluster_id }}"
      when: oci_oke_np_cluster_id | default('') | length > 0
      register: oci_cleanup_cluster
      retries: 3
      ignore_errors: true

    - name: Delete leaked subnet during cleanup
      ansible.oci.oci_network_subnet:
        state: absent
        subnet_id: "{{ oci_oke_np_subnet_id }}"
      when: oci_oke_np_subnet_id | default('') | length > 0
      register: oci_cleanup_subnet
      retries: 3
      ignore_errors: true

    - name: Delete leaked VCN during cleanup
      ansible.oci.oci_network_vcn:
        state: absent
        vcn_id: "{{ oci_oke_np_vcn_id }}"
      when: oci_oke_np_vcn_id | default('') | length > 0
      register: oci_cleanup_vcn
      retries: 3
      ignore_errors: true

    - name: Verify resource cleanup succeeded
      ansible.builtin.assert:
        that:
          - oci_cleanup_node_pools is not failed
          - oci_cleanup_cluster is not failed
          - oci_cleanup_subnet is not failed
          - oci_cleanup_vcn is not failed
        fail_msg: Resource cleanup failed after 3 retries; see the failed cleanup tasks above.
