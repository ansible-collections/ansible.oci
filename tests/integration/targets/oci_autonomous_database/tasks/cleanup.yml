---
- name: Initialize cleanup failures
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: []

- name: Find leaked databases by unique name
  ansible.oci.oci_autonomous_database_info:
    compartment_id: '{{ oci_integration_compartment_id }}'
    name: '{{ item }}'
  loop:
    - '{{ oci_adb_clone_integration_metadata_name }}'
    - '{{ oci_adb_clone_integration_metadata_renamed }}'
    - '{{ oci_adb_clone_integration_refreshable_name }}'
    - '{{ oci_adb_clone_integration_source_name }}'
  register: oci_group_cleanup_0
  ignore_errors: true
  when:
    - oci_group_started_oci_autonomous_database_clone | default(false)

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Find leaked databases by unique name''] }}'
  when: oci_group_cleanup_0 is failed

- name: Delete leaked autonomous database by id during cleanup
  ansible.oci.oci_autonomous_database:
    state: absent
    autonomous_database_id: '{{ oci_adb_id }}'
  when:
    - oci_group_started_oci_autonomous_database | default(false)
    - oci_adb_id | default('') | length > 0
  register: oci_group_cleanup_2
  retries: 3
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Delete leaked autonomous database by id during cleanup'']
      }}'
  when: oci_group_cleanup_2 is failed

- name: Find leaked autonomous database by unique name when id is unavailable
  ansible.oci.oci_autonomous_database_info:
    compartment_id: '{{ oci_integration_compartment_id }}'
    name: '{{ oci_adb_integration_display_name }}'
  when:
    - oci_group_started_oci_autonomous_database | default(false)
    - oci_adb_id | default('') | length == 0
  register: oci_group_cleanup_4
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Find leaked autonomous database by unique name when id
      is unavailable''] }}'
  when: oci_group_cleanup_4 is failed

- name: Delete leaked autonomous database found by name during cleanup
  ansible.oci.oci_autonomous_database:
    state: absent
    autonomous_database_id: '{{ item.id }}'
  loop: '{{ oci_cleanup_adb_lookup.autonomous_databases | default([]) }}'
  when:
    - oci_group_started_oci_autonomous_database | default(false)
    - oci_adb_id | default('') | length == 0
  register: oci_group_cleanup_6
  retries: 3
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Delete leaked autonomous database found by name during
      cleanup''] }}'
  when: oci_group_cleanup_6 is failed

- name: Remove temporary autonomous database wallet directory
  ansible.builtin.file:
    path: '{{ oci_adb_wallet_dir.path }}'
    state: absent
  when:
    - oci_group_started_oci_autonomous_database | default(false)
    - oci_adb_wallet_dir.path is defined
  register: oci_group_cleanup_8
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Remove temporary autonomous database wallet directory'']
      }}'
  when: oci_group_cleanup_8 is failed

- name: Check all cleanup results
  ansible.builtin.assert:
    that:
      - oci_group_cleanup_failures | length == 0
    fail_msg: 'Cleanup failed for: {{ oci_group_cleanup_failures | join(", ") }}'
