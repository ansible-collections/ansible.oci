---
- name: Exercise autonomous database module lifecycle
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: '{{ oci_integration_config_file_location }}'
      config_profile_name: '{{ oci_integration_config_profile_name }}'
  block:

    - name: Delete autonomous database in check mode
      ansible.oci.oci_autonomous_database:
        state: '{{ oci_adb_delete_params.state }}'
        autonomous_database_id: '{{ oci_adb_delete_params.autonomous_database_id }}'
      check_mode: true
      register: oci_adb_delete_check

    - name: Assert delete check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_adb_delete_check.changed | bool

    - name: Read autonomous database after delete check mode
      ansible.oci.oci_autonomous_database_info:
        autonomous_database_id: '{{ oci_adb_id }}'
      register: oci_adb_delete_check_probe

    - name: Assert autonomous database still exists after delete check mode
      ansible.builtin.assert:
        that:
          - oci_adb_delete_check_probe.autonomous_databases | length == 1

    - name: Delete autonomous database
      ansible.oci.oci_autonomous_database:
        state: '{{ oci_adb_delete_params.state }}'
        autonomous_database_id: '{{ oci_adb_delete_params.autonomous_database_id }}'
      register: oci_adb_delete

    - name: Assert delete reported a change
      ansible.builtin.assert:
        that:
          - oci_adb_delete.changed | bool

    - name: Assert delete is idempotent on rerun
      ansible.oci.oci_autonomous_database:
        state: '{{ oci_adb_delete_params.state }}'
        autonomous_database_id: '{{ oci_adb_delete_params.autonomous_database_id }}'
      register: oci_adb_delete_rerun

    - name: Verify delete rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_adb_delete_rerun.changed | bool

    - name: Clear autonomous database id after successful delete
      ansible.builtin.set_fact:
        oci_adb_id: ''
