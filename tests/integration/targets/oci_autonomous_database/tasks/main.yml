---
- name: Initialize resource identifiers
  ansible.builtin.set_fact:
    oci_tests_completed: false
    oci_adb_clone_metadata_id: ''
    oci_adb_clone_refreshable_id: ''

- name: Test oci_autonomous_database
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: '{{ oci_integration_config_file_location }}'
      config_profile_name: '{{ oci_integration_config_profile_name }}'
  block:

    - name: Run oci_autonomous_database tests
      ansible.builtin.include_tasks: oci_autonomous_database.yml

    - name: Run oci_autonomous_database_clone tests
      ansible.builtin.include_tasks: oci_autonomous_database_clone.yml

    - name: Mark tests as complete
      ansible.builtin.set_fact:
        oci_tests_completed: true
  always:

    - name: Clean up all test resources
      ansible.builtin.include_tasks: cleanup.yml
