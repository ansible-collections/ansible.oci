---
- name: Validate required OCI integration variables
  ansible.builtin.assert:
    that:
      - oci_integration_compartment_id | default('', true) | length > 0
    fail_msg: >-
      OCI alarm and notification topic integration tests require oci_integration_compartment_id to be defined in
      tests/integration/integration_config.yml.

- name: Compute unique resource names and initialize cleanup markers
  ansible.builtin.set_fact:
    oci_alarm_id: ""
    oci_alarm_integration_alarm_name: "{{ oci_alarm_integration_alarm_name }}-{{ oci_integration_rpfx }}"
    oci_notification_topic_cleanup_id: ""
    oci_notification_topic_cleanup_name: "{{ oci_notification_topic_integration_name }}-{{ oci_integration_rpfx }}"
    oci_notification_topic_integration_name: "{{ oci_notification_topic_integration_name }}-{{ oci_integration_rpfx }}"

- name: Exercise notification topic and alarm module lifecycles
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Create and update the notification topic
      ansible.builtin.import_tasks: notification_topic.yml

    # OCI requires every alarm to have a destination, so the alarm tests use
    # the topic created above.
    - name: Use the notification topic as the alarm destination
      ansible.builtin.set_fact:
        oci_alarm_integration_destination_id: "{{ topic_create.resource.topic_id }}"

    - name: Create, update, and delete the alarm
      ansible.builtin.import_tasks: alarm.yml

    - name: Delete the notification topic
      ansible.builtin.import_tasks: notification_topic_delete.yml

  always:
    - name: Run alarm and notification topic cleanup
      ansible.builtin.include_tasks: cleanup.yml
