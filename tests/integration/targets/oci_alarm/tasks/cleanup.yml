---
- name: Run alarm cleanup with shared OCI auth defaults
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Delete leaked alarm during cleanup
      ansible.oci.oci_alarm:
        state: absent
        alarm_id: "{{ oci_alarm_id }}"
      when: oci_alarm_id | default('') | length > 0
      register: oci_cleanup_alarm
      retries: 3
      ignore_errors: true

    - name: Verify resource cleanup succeeded
      ansible.builtin.assert:
        that:
          - oci_cleanup_alarm is not failed
        fail_msg: Resource cleanup failed after 3 retries; see the failed cleanup tasks above.
