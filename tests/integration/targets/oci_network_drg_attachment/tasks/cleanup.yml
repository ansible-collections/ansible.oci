---
- name: Run DRG attachment cleanup with shared OCI auth defaults
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Delete leaked DRG attachment during cleanup
      ansible.oci.oci_network_drg_attachment:
        state: absent
        drg_attachment_id: "{{ oci_drg_attachment_id }}"
      when: oci_drg_attachment_id | default('') | length > 0
      register: oci_cleanup_drg_attachment
      retries: 3
      ignore_errors: true

    - name: Delete leaked DRG during cleanup
      ansible.oci.oci_network_drg:
        state: absent
        drg_id: "{{ oci_drg_attachment_integration_drg_id }}"
      when: oci_drg_attachment_integration_drg_id | default('') | length > 0
      register: oci_cleanup_drg
      retries: 3
      ignore_errors: true

    - name: Delete leaked VCN during cleanup
      ansible.oci.oci_network_vcn:
        state: absent
        vcn_id: "{{ oci_drg_attachment_integration_vcn_id }}"
      when: oci_drg_attachment_integration_vcn_id | default('') | length > 0
      register: oci_cleanup_vcn
      retries: 3
      ignore_errors: true

    - name: Verify resource cleanup succeeded
      ansible.builtin.assert:
        that:
          - oci_cleanup_drg_attachment is not failed
          - oci_cleanup_drg is not failed
          - oci_cleanup_vcn is not failed
        fail_msg: Resource cleanup failed after 3 retries; see the failed cleanup tasks above.
