---
- name: Validate required OCI integration variables
  ansible.builtin.assert:
    that:
      - oci_integration_compartment_id | default('', true) | length > 0
    fail_msg: |-
      OCI volume backup integration tests require oci_integration_compartment_id to be defined in
      tests/integration/integration_config.yml.

- name: Compute unique resource names for this run
  ansible.builtin.set_fact:
    oci_volume_backup_integration_volume_name: '{{ oci_volume_backup_integration_volume_name }}-{{ oci_integration_rpfx }}'
    oci_volume_backup_integration_backup_name: '{{ oci_volume_backup_integration_backup_name }}-{{ oci_integration_rpfx }}'
    oci_volume_backup_integration_updated_backup_name: '{{ oci_volume_backup_integration_updated_backup_name }}-{{ oci_integration_rpfx
      }}'

- name: Mark oci_volume_backup as started
  ansible.builtin.set_fact:
    oci_group_started_oci_volume_backup: true

- name: Exercise volume backup module lifecycle
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: '{{ oci_integration_config_file_location }}'
      config_profile_name: '{{ oci_integration_config_profile_name }}'
  block:

    - name: Use the shared availability domains
      ansible.builtin.set_fact:
        oci_volume_backup_ad_info: '{{ oci_blockstorage_volume_ad_info }}'

    - name: Assert at least one availability domain was discovered
      ansible.builtin.assert:
        that:
          - oci_volume_backup_ad_info.availability_domains | length > 0

    - name: Set the working availability domain
      ansible.builtin.set_fact:
        oci_volume_backup_integration_availability_domain: '{{ oci_volume_backup_ad_info.availability_domains[0].name }}'

    - name: Use the shared volume
      ansible.builtin.set_fact:
        oci_volume_backup_volume_create: '{{ oci_prerequisites.volume }}'

    - name: Capture created volume id
      ansible.builtin.set_fact:
        oci_volume_backup_integration_volume_id: '{{ oci_volume_backup_volume_create.resource.id }}'

    - name: Define volume backup create parameters
      ansible.builtin.set_fact:
        oci_volume_backup_create_params:
          state: present
          compartment_id: '{{ oci_integration_compartment_id }}'
          name: '{{ oci_volume_backup_integration_backup_name }}'
          volume_id: '{{ oci_volume_backup_integration_volume_id }}'
          type: '{{ oci_volume_backup_integration_backup_type }}'
          freeform_tags: '{{ oci_volume_backup_integration_create_tags }}'

    - name: Create volume backup in check mode
      ansible.oci.oci_volume_backup:
        state: '{{ oci_volume_backup_create_params.state }}'
        compartment_id: '{{ oci_volume_backup_create_params.compartment_id }}'
        name: '{{ oci_volume_backup_create_params.name }}'
        volume_id: '{{ oci_volume_backup_create_params.volume_id }}'
        type: '{{ oci_volume_backup_create_params.type }}'
        freeform_tags: '{{ oci_volume_backup_create_params.freeform_tags }}'
      check_mode: true
      register: oci_volume_backup_create_check

    - name: Assert create check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_volume_backup_create_check.changed | bool

    - name: Read volume backup after create check mode
      ansible.oci.oci_volume_backup_info:
        compartment_id: '{{ oci_integration_compartment_id }}'
        name: '{{ oci_volume_backup_integration_backup_name }}'
      register: oci_volume_backup_create_check_probe

    - name: Assert volume backup is still absent after create check mode
      ansible.builtin.assert:
        that:
          - |-
            oci_volume_backup_create_check_probe.volume_backups | selectattr('name', 'equalto',
            oci_volume_backup_integration_backup_name) | list | length == 0

    - name: Create volume backup
      ansible.oci.oci_volume_backup:
        state: '{{ oci_volume_backup_create_params.state }}'
        compartment_id: '{{ oci_volume_backup_create_params.compartment_id }}'
        name: '{{ oci_volume_backup_create_params.name }}'
        volume_id: '{{ oci_volume_backup_create_params.volume_id }}'
        type: '{{ oci_volume_backup_create_params.type }}'
        freeform_tags: '{{ oci_volume_backup_create_params.freeform_tags }}'
      register: oci_volume_backup_create

    - name: Save shared backup
      ansible.builtin.set_fact:
        oci_group_resources: '{{ oci_group_resources | combine({''backup'': oci_volume_backup_create}) }}'

    - name: Capture volume backup id and define update parameters
      ansible.builtin.set_fact:
        oci_volume_backup_id: '{{ oci_volume_backup_create.resource.id }}'
        oci_volume_backup_update_params:
          state: present
          volume_backup_id: '{{ oci_volume_backup_create.resource.id }}'
          name: '{{ oci_volume_backup_integration_updated_backup_name }}'
          freeform_tags: '{{ oci_volume_backup_integration_update_tags }}'

    - name: Assert create reported a change
      ansible.builtin.assert:
        that:
          - oci_volume_backup_create.changed | bool
          - oci_volume_backup_create.resource.lifecycle_state == "AVAILABLE"
          - oci_volume_backup_create.resource.volume_id == oci_volume_backup_integration_volume_id

    - name: Read volume backup by id
      ansible.oci.oci_volume_backup_info:
        volume_backup_id: '{{ oci_volume_backup_id }}'
      register: oci_volume_backup_info_by_id

    - name: Assert volume backup info by id returned the created backup
      ansible.builtin.assert:
        that:
          - oci_volume_backup_info_by_id.volume_backups | length == 1
          - oci_volume_backup_info_by_id.volume_backups[0].id == oci_volume_backup_id
          - oci_volume_backup_info_by_id.volume_backups[0].name == oci_volume_backup_integration_backup_name

    - name: List volume backups by source volume
      ansible.oci.oci_volume_backup_info:
        compartment_id: '{{ oci_integration_compartment_id }}'
        volume_id: '{{ oci_volume_backup_integration_volume_id }}'
      register: oci_volume_backup_info_by_volume

    - name: Assert volume backup info by volume returned the created backup
      ansible.builtin.assert:
        that:
          - |-
            oci_volume_backup_info_by_volume.volume_backups | selectattr('id', 'equalto', oci_volume_backup_id)
            | list | length == 1

    - name: Assert created backup is a no-op in check mode with unique name
      ansible.oci.oci_volume_backup:
        state: '{{ oci_volume_backup_create_params.state }}'
        compartment_id: '{{ oci_volume_backup_create_params.compartment_id }}'
        name: '{{ oci_volume_backup_create_params.name }}'
        volume_id: '{{ oci_volume_backup_create_params.volume_id }}'
        type: '{{ oci_volume_backup_create_params.type }}'
        freeform_tags: '{{ oci_volume_backup_create_params.freeform_tags }}'
      check_mode: true
      register: oci_volume_backup_create_check_rerun_by_name

    - name: Verify backup check-mode rerun with unique name is a no-op
      ansible.builtin.assert:
        that:
          - not oci_volume_backup_create_check_rerun_by_name.changed | bool

    - name: Assert created backup is a no-op on rerun with unique name
      ansible.oci.oci_volume_backup:
        state: '{{ oci_volume_backup_create_params.state }}'
        compartment_id: '{{ oci_volume_backup_create_params.compartment_id }}'
        name: '{{ oci_volume_backup_create_params.name }}'
        volume_id: '{{ oci_volume_backup_create_params.volume_id }}'
        type: '{{ oci_volume_backup_create_params.type }}'
        freeform_tags: '{{ oci_volume_backup_create_params.freeform_tags }}'
      register: oci_volume_backup_create_rerun_by_name

    - name: Verify backup rerun with unique name is a no-op
      ansible.builtin.assert:
        that:
          - not oci_volume_backup_create_rerun_by_name.changed | bool
          - oci_volume_backup_create_rerun_by_name.resource.id == oci_volume_backup_id

    - name: Assert created backup is a no-op in check mode with returned id
      ansible.oci.oci_volume_backup:
        state: '{{ oci_volume_backup_create_params.state }}'
        compartment_id: '{{ oci_volume_backup_create_params.compartment_id }}'
        name: '{{ oci_volume_backup_create_params.name }}'
        volume_id: '{{ oci_volume_backup_create_params.volume_id }}'
        type: '{{ oci_volume_backup_create_params.type }}'
        freeform_tags: '{{ oci_volume_backup_create_params.freeform_tags }}'
        volume_backup_id: '{{ oci_volume_backup_id }}'
      check_mode: true
      register: oci_volume_backup_create_check_rerun

    - name: Verify check-mode rerun with returned id is a no-op
      ansible.builtin.assert:
        that:
          - not oci_volume_backup_create_check_rerun.changed | bool

    - name: Assert created backup is a no-op on rerun with returned id
      ansible.oci.oci_volume_backup:
        state: '{{ oci_volume_backup_create_params.state }}'
        compartment_id: '{{ oci_volume_backup_create_params.compartment_id }}'
        name: '{{ oci_volume_backup_create_params.name }}'
        volume_id: '{{ oci_volume_backup_create_params.volume_id }}'
        type: '{{ oci_volume_backup_create_params.type }}'
        freeform_tags: '{{ oci_volume_backup_create_params.freeform_tags }}'
        volume_backup_id: '{{ oci_volume_backup_id }}'
      register: oci_volume_backup_create_rerun

    - name: Verify rerun with returned id is a no-op
      ansible.builtin.assert:
        that:
          - not oci_volume_backup_create_rerun.changed | bool

    - name: Update volume backup in check mode
      ansible.oci.oci_volume_backup:
        state: '{{ oci_volume_backup_update_params.state }}'
        volume_backup_id: '{{ oci_volume_backup_update_params.volume_backup_id }}'
        name: '{{ oci_volume_backup_update_params.name }}'
        freeform_tags: '{{ oci_volume_backup_update_params.freeform_tags }}'
      check_mode: true
      register: oci_volume_backup_update_check

    - name: Assert update check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_volume_backup_update_check.changed | bool

    - name: Read volume backup after update check mode
      ansible.oci.oci_volume_backup_info:
        volume_backup_id: '{{ oci_volume_backup_id }}'
      register: oci_volume_backup_update_check_probe

    - name: Assert update check mode did not mutate cloud state
      ansible.builtin.assert:
        that:
          - oci_volume_backup_update_check_probe.volume_backups[0].name == oci_volume_backup_integration_backup_name
          - oci_volume_backup_update_check_probe.volume_backups[0].freeform_tags.phase == "create"

    - name: Update volume backup
      ansible.oci.oci_volume_backup:
        state: '{{ oci_volume_backup_update_params.state }}'
        volume_backup_id: '{{ oci_volume_backup_update_params.volume_backup_id }}'
        name: '{{ oci_volume_backup_update_params.name }}'
        freeform_tags: '{{ oci_volume_backup_update_params.freeform_tags }}'
      register: oci_volume_backup_update

    - name: Assert update reported a change
      ansible.builtin.assert:
        that:
          - oci_volume_backup_update.changed | bool

    - name: Read updated volume backup by name
      ansible.oci.oci_volume_backup_info:
        compartment_id: '{{ oci_integration_compartment_id }}'
        name: '{{ oci_volume_backup_integration_updated_backup_name }}'
      register: oci_volume_backup_info_updated

    - name: Assert volume backup info reflects the updated backup
      ansible.builtin.assert:
        that:
          - |-
            oci_volume_backup_info_updated.volume_backups | selectattr('id', 'equalto', oci_volume_backup_id) |
            list | length == 1
          - oci_volume_backup_info_updated.volume_backups[0].freeform_tags.phase == "update"

    - name: Assert update is a no-op in check mode
      ansible.oci.oci_volume_backup:
        state: '{{ oci_volume_backup_update_params.state }}'
        volume_backup_id: '{{ oci_volume_backup_update_params.volume_backup_id }}'
        name: '{{ oci_volume_backup_update_params.name }}'
        freeform_tags: '{{ oci_volume_backup_update_params.freeform_tags }}'
      check_mode: true
      register: oci_volume_backup_update_check_rerun

    - name: Verify update check-mode rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_volume_backup_update_check_rerun.changed | bool

    - name: Assert update is idempotent on rerun
      ansible.oci.oci_volume_backup:
        state: '{{ oci_volume_backup_update_params.state }}'
        volume_backup_id: '{{ oci_volume_backup_update_params.volume_backup_id }}'
        name: '{{ oci_volume_backup_update_params.name }}'
        freeform_tags: '{{ oci_volume_backup_update_params.freeform_tags }}'
      register: oci_volume_backup_update_rerun

    - name: Verify update rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_volume_backup_update_rerun.changed | bool
