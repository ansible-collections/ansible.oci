---
- name: Delete leaked volume group backup during cleanup
  ansible.oci.oci_volume_group_backup:
    state: absent
    volume_group_backup_id: '{{ oci_volume_group_backup_id }}'
  when:
    - oci_group_started_oci_volume_group_backup | default(false)
    - oci_volume_group_backup_id | default('') | length > 0
  register: oci_group_cleanup_6
  retries: 3
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Delete leaked volume group backup during cleanup''] }}'
  when: oci_group_cleanup_6 is failed

- name: Check module cleanup results
  ansible.builtin.assert:
    that:
      - oci_group_cleanup_failures | length == 0
    fail_msg: 'Cleanup failed for: {{ oci_group_cleanup_failures | join(", ") }}'
