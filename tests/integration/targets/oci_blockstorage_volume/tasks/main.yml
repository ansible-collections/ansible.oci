---
- name: Initialize resource identifiers
  ansible.builtin.set_fact:
    oci_tests_completed: false

- name: Test oci_blockstorage_volume
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: '{{ oci_integration_config_file_location }}'
      config_profile_name: '{{ oci_integration_config_profile_name }}'
  block:

    - name: Run oci_blockstorage_volume tests
      ansible.builtin.include_tasks: oci_blockstorage_volume.yml

    - name: Run oci_volume_backup tests
      ansible.builtin.include_tasks: oci_volume_backup.yml

    - name: Run oci_blockstorage_volume intermediate tests
      ansible.builtin.include_tasks: oci_blockstorage_volume_restore.yml

    - name: Run oci_volume_group tests
      ansible.builtin.include_tasks: oci_volume_group.yml

    - name: Run oci_volume_group_backup tests
      ansible.builtin.include_tasks: oci_volume_group_backup.yml

    - name: Mark tests as complete
      ansible.builtin.set_fact:
        oci_tests_completed: true
  always:

    - name: Clean up all test resources
      ansible.builtin.include_tasks: cleanup.yml
