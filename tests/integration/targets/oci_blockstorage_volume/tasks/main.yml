---
- name: Initialize shared resources and ownership
  ansible.builtin.set_fact:
    oci_group_resources: {}
    oci_group_cleanup_failures: []
    oci_group_started_oci_blockstorage_volume: false
    oci_group_started_oci_volume_backup: false
    oci_group_started_oci_volume_group: false
    oci_group_started_oci_volume_group_backup: false
    oci_group_started_oci_volume_backup_policy: false
    oci_group_started_oci_volume_backup_policy_assignment: false

- name: Test oci_blockstorage_volume and dependent modules
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: '{{ oci_integration_config_file_location }}'
      config_profile_name: '{{ oci_integration_config_profile_name }}'
  block:

    - name: Run oci_blockstorage_volume tests
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_blockstorage_volume/main.yml'
      vars:
        oci_prerequisites: '{{ oci_group_resources }}'

    - name: Run oci_volume_backup tests
      ansible.builtin.include_tasks: oci_volume_backup/main.yml
      vars:
        oci_prerequisites: '{{ oci_group_resources }}'

    - name: Run oci_blockstorage_volume intermediate tests
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_blockstorage_volume/restore.yml'
      vars:
        oci_prerequisites: '{{ oci_group_resources }}'

    - name: Run oci_volume_group tests
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_volume_group/main.yml'
      vars:
        oci_prerequisites: '{{ oci_group_resources }}'

    - name: Run oci_volume_group_backup tests
      ansible.builtin.include_tasks: oci_volume_group_backup/main.yml
      vars:
        oci_prerequisites: '{{ oci_group_resources }}'

    - name: Run oci_volume_group remaining tests
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_volume_group/delete.yml'
      vars:
        oci_prerequisites: '{{ oci_group_resources }}'

    - name: Run oci_volume_backup_policy tests
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_volume_backup_policy/main.yml'
      vars:
        oci_prerequisites: '{{ oci_group_resources }}'

    - name: Run oci_volume_backup_policy_assignment tests
      ansible.builtin.include_tasks: oci_volume_backup_policy_assignment/main.yml
      vars:
        oci_prerequisites: '{{ oci_group_resources }}'

    - name: Run oci_volume_backup_policy remaining tests
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_volume_backup_policy/delete.yml'
      vars:
        oci_prerequisites: '{{ oci_group_resources }}'

    - name: Run oci_blockstorage_volume remaining tests
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_blockstorage_volume/delete.yml'
      vars:
        oci_prerequisites: '{{ oci_group_resources }}'
  always:

    - name: Clean up all group resources
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/cleanup.yml'
