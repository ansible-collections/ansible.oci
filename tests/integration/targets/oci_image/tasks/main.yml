---
- name: Validate required OCI integration variables
  ansible.builtin.assert:
    that:
      - oci_integration_compartment_id | default('', true) | length > 0
      - oci_image_integration_availability_domain | default('', true) | length > 0
    fail_msg: >-
      OCI image integration tests require oci_integration_compartment_id to be
      defined in tests/integration/integration_config.yml, and
      oci_image_integration_availability_domain to be set to a valid
      availability domain name for the CI tenancy/region in
      tests/integration/targets/oci_image/defaults/main.yml.

- name: Compute unique resource names for this run
  ansible.builtin.set_fact:
    oci_image_integration_vcn_name: "{{ oci_image_integration_vcn_name }}-{{ oci_integration_rpfx }}"
    oci_image_integration_subnet_name: "{{ oci_image_integration_subnet_name }}-{{ oci_integration_rpfx }}"
    oci_image_integration_instance_name: "{{ oci_image_integration_instance_name }}-{{ oci_integration_rpfx }}"
    oci_image_integration_image_name: "{{ oci_image_integration_image_name }}-{{ oci_integration_rpfx }}"
    oci_image_integration_updated_image_name: "{{ oci_image_integration_updated_image_name }}-{{ oci_integration_rpfx }}"

- name: Exercise custom image module lifecycle
  module_defaults:
    group/oracle.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Discover a compatible source image
      oracle.oci.oci_image_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        operating_system: "{{ oci_image_integration_operating_system }}"
        operating_system_version: "{{ oci_image_integration_operating_system_version }}"
        shape: "{{ oci_image_integration_shape }}"
      register: oci_image_source_discovered

    - name: Assert a compatible source image was discovered
      ansible.builtin.assert:
        that:
          - oci_image_source_discovered.images | length > 0

    - name: Set the source image id
      ansible.builtin.set_fact:
        oci_image_source_image_id: "{{ oci_image_source_discovered.images[0].id }}"

    - name: Create test VCN for image integration
      oracle.oci.oci_network_vcn:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_image_integration_vcn_name }}"
        cidr_blocks:
          - "{{ oci_image_integration_vcn_cidr_block }}"
      register: oci_image_vcn_create

    - name: Create test subnet for image integration
      oracle.oci.oci_subnet:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        vcn_id: "{{ oci_image_vcn_create.resource.id }}"
        cidr_block: "{{ oci_image_integration_subnet_cidr_block }}"
        name: "{{ oci_image_integration_subnet_name }}"
      register: oci_image_subnet_create

    - name: Create the source instance to capture an image from
      oracle.oci.oci_instance:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        availability_domain: "{{ oci_image_integration_availability_domain }}"
        name: "{{ oci_image_integration_instance_name }}"
        shape: "{{ oci_image_integration_shape }}"
        shape_config: "{{ oci_image_integration_shape_config }}"
        image_id: "{{ oci_image_source_image_id }}"
        subnet_id: "{{ oci_image_subnet_create.resource.id }}"
      register: oci_image_instance_create

    - name: Capture the source instance id
      ansible.builtin.set_fact:
        oci_image_instance_id: "{{ oci_image_instance_create.resource.id }}"

    - name: Stop the source instance for a consistent image capture
      oracle.oci.oci_instance:
        instance_id: "{{ oci_image_instance_id }}"
        power_state: stopped
      register: oci_image_instance_stop

    - name: Define image create parameters
      ansible.builtin.set_fact:
        oci_image_create_params:
          state: present
          compartment_id: "{{ oci_integration_compartment_id }}"
          name: "{{ oci_image_integration_image_name }}"
          instance_id: "{{ oci_image_instance_id }}"
          freeform_tags: "{{ oci_image_integration_create_tags }}"

    - name: Create custom image in check mode
      oracle.oci.oci_image: &oci_image_create_module_options
        state: "{{ oci_image_create_params.state }}"
        compartment_id: "{{ oci_image_create_params.compartment_id }}"
        name: "{{ oci_image_create_params.name }}"
        instance_id: "{{ oci_image_create_params.instance_id }}"
        freeform_tags: "{{ oci_image_create_params.freeform_tags }}"
      check_mode: true
      register: oci_image_create_check

    - name: Assert create check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_image_create_check.changed | bool

    - name: Read custom image after create check mode
      oracle.oci.oci_image_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_image_integration_image_name }}"
      register: oci_image_create_check_probe

    - name: Assert custom image is still absent after create check mode
      ansible.builtin.assert:
        that:
          - oci_image_create_check_probe.images | length == 0

    - name: Create custom image
      oracle.oci.oci_image:
        <<: *oci_image_create_module_options
      register: oci_image_create

    - name: Capture custom image id
      ansible.builtin.set_fact:
        oci_image_id: "{{ oci_image_create.resource.id }}"
        oci_image_update_params:
          state: present
          image_id: "{{ oci_image_create.resource.id }}"
          name: "{{ oci_image_integration_updated_image_name }}"
          freeform_tags: "{{ oci_image_integration_update_tags }}"

    - name: Assert create reported a change
      ansible.builtin.assert:
        that:
          - oci_image_create.changed | bool
          - oci_image_create.resource.lifecycle_state == "AVAILABLE"

    - name: Read custom image by id
      oracle.oci.oci_image_info:
        image_id: "{{ oci_image_id }}"
      register: oci_image_info_by_id

    - name: Assert image info by id returned the created image
      ansible.builtin.assert:
        that:
          - oci_image_info_by_id.images | length == 1
          - oci_image_info_by_id.images[0].id == oci_image_id
          - oci_image_info_by_id.images[0].name == oci_image_integration_image_name

    - name: List custom image by name
      oracle.oci.oci_image_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_image_integration_image_name }}"
      register: oci_image_info_list

    - name: Assert image info list returned the created image
      ansible.builtin.assert:
        that:
          - oci_image_info_list.images | selectattr('id', 'equalto', oci_image_id) | list | length == 1

    - name: Assert created image is a no-op on rerun with unique name
      oracle.oci.oci_image:
        <<: *oci_image_create_module_options
      register: oci_image_create_rerun_by_name

    - name: Verify image rerun with unique name is a no-op
      ansible.builtin.assert:
        that:
          - not oci_image_create_rerun_by_name.changed | bool

    - name: Assert created image is a no-op on rerun with returned id
      oracle.oci.oci_image:
        <<: *oci_image_create_module_options
        image_id: "{{ oci_image_id }}"
      register: oci_image_create_rerun

    - name: Verify rerun with returned id is a no-op
      ansible.builtin.assert:
        that:
          - not oci_image_create_rerun.changed | bool

    - name: Update custom image in check mode
      oracle.oci.oci_image: &oci_image_update_module_options
        state: "{{ oci_image_update_params.state }}"
        image_id: "{{ oci_image_update_params.image_id }}"
        name: "{{ oci_image_update_params.name }}"
        freeform_tags: "{{ oci_image_update_params.freeform_tags }}"
      check_mode: true
      register: oci_image_update_check

    - name: Assert update check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_image_update_check.changed | bool

    - name: Read custom image after update check mode
      oracle.oci.oci_image_info:
        image_id: "{{ oci_image_id }}"
      register: oci_image_update_check_probe

    - name: Assert update check mode did not mutate cloud state
      ansible.builtin.assert:
        that:
          - oci_image_update_check_probe.images | length == 1
          - oci_image_update_check_probe.images[0].name == oci_image_integration_image_name
          - oci_image_update_check_probe.images[0].freeform_tags.phase == "create"

    - name: Update custom image
      oracle.oci.oci_image:
        <<: *oci_image_update_module_options
      register: oci_image_update

    - name: Assert update reported a change
      ansible.builtin.assert:
        that:
          - oci_image_update.changed | bool

    - name: Read updated custom image by name
      oracle.oci.oci_image_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_image_integration_updated_image_name }}"
      register: oci_image_info_updated

    - name: Assert image info reflects the updated image
      ansible.builtin.assert:
        that:
          - oci_image_info_updated.images | selectattr('id', 'equalto', oci_image_id) | list | length == 1
          - oci_image_info_updated.images[0].freeform_tags.phase == "update"

    - name: Assert update is idempotent on rerun
      oracle.oci.oci_image:
        <<: *oci_image_update_module_options
      register: oci_image_update_rerun

    - name: Verify update rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_image_update_rerun.changed | bool

    - name: Delete custom image in check mode
      oracle.oci.oci_image: &oci_image_delete_module_options
        state: absent
        image_id: "{{ oci_image_id }}"
      check_mode: true
      register: oci_image_delete_check

    - name: Assert delete check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_image_delete_check.changed | bool

    - name: Read custom image after delete check mode
      oracle.oci.oci_image_info:
        image_id: "{{ oci_image_id }}"
      register: oci_image_delete_check_probe

    - name: Assert custom image still exists after delete check mode
      ansible.builtin.assert:
        that:
          - oci_image_delete_check_probe.images | length == 1

    - name: Delete custom image
      oracle.oci.oci_image:
        <<: *oci_image_delete_module_options
      register: oci_image_delete

    - name: Assert delete reported a change
      ansible.builtin.assert:
        that:
          - oci_image_delete.changed | bool

    - name: Assert delete is idempotent on rerun
      oracle.oci.oci_image:
        <<: *oci_image_delete_module_options
      register: oci_image_delete_rerun

    - name: Verify delete rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_image_delete_rerun.changed | bool

    - name: Clear custom image id after successful delete
      ansible.builtin.set_fact:
        oci_image_id: ""

  always:
    - name: Run image cleanup
      ansible.builtin.include_tasks: cleanup.yml
