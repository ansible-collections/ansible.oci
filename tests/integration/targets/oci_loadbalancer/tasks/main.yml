---
- name: Initialize resource identifiers
  ansible.builtin.set_fact:
    oci_tests_completed: false

- name: Test oci_loadbalancer
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: '{{ oci_integration_config_file_location }}'
      config_profile_name: '{{ oci_integration_config_profile_name }}'
  block:

    - name: Run oci_loadbalancer tests
      ansible.builtin.include_tasks: oci_loadbalancer.yml

    - name: Run oci_loadbalancer_listener tests
      ansible.builtin.include_tasks: oci_loadbalancer_listener.yml

    - name: Run oci_loadbalancer_routing_policy tests
      ansible.builtin.include_tasks: oci_loadbalancer_routing_policy.yml

    - name: Test oci_loadbalancer_certificate
      ansible.builtin.include_tasks: oci_loadbalancer_certificate.yml

    - name: Mark tests as complete
      ansible.builtin.set_fact:
        oci_tests_completed: true
  always:

    - name: Clean up all test resources
      ansible.builtin.include_tasks: cleanup.yml
