---
- name: Test UI password reset for a temporary user in the Default domain
  block:
    - name: Set the Default domain user cleanup name and tenancy OCID
      ansible.builtin.set_fact:
        oci_identity_user_ui_password_cleanup_name: "oci-ui-password-{{ oci_integration_rpfx }}@example.com"
        oci_identity_user_ui_password_tenancy_id: >-
          {{ lookup(
            'ansible.builtin.ini',
            'tenancy',
            section=oci_integration_config_profile_name,
            file=oci_integration_config_file_location
          ) }}

    - name: Verify the tenancy OCID is available
      ansible.builtin.assert:
        that:
          - oci_identity_user_ui_password_tenancy_id | length > 0

    - name: Find the Default identity domain
      ansible.oci.oci_identity_domain_info:
        compartment_id: "{{ oci_identity_user_ui_password_tenancy_id }}"
        name: Default
      register: oci_identity_user_ui_password_default_domain

    - name: Verify exactly one Default identity domain exists
      ansible.builtin.assert:
        that:
          - oci_identity_user_ui_password_default_domain.domains | length == 1

    - name: Save the Default domain ID for user creation and cleanup
      ansible.builtin.set_fact:
        oci_identity_user_ui_password_domain_id: "{{ oci_identity_user_ui_password_default_domain.domains[0].id }}"

    # IAM password reset returned 404 for a user in a non-default domain.
    - name: Create a temporary user in the Default domain
      ansible.oci.oci_identity_user:
        domain_id: "{{ oci_identity_user_ui_password_domain_id }}"
        user_name: "{{ oci_identity_user_ui_password_cleanup_name }}"
        name: OCI UI Password Integration
        given_name: OCI
        family_name: Integration
        email: "{{ oci_identity_user_ui_password_cleanup_name }}"
        active: true
      register: oci_identity_user_ui_password_user_create

    - name: Wait for the temporary user in the Default domain
      ansible.oci.oci_identity_user_info:
        domain_id: "{{ oci_identity_user_ui_password_domain_id }}"
        user_name: "{{ oci_identity_user_ui_password_cleanup_name }}"
      register: oci_identity_user_ui_password_user_readiness
      until: oci_identity_user_ui_password_user_readiness.users | length == 1
      retries: 12
      delay: 5

    - name: Save the temporary user's OCID
      ansible.builtin.set_fact:
        oci_identity_user_ui_password_user_ocid: "{{ oci_identity_user_ui_password_user_create.resource.ocid }}"

    - name: Read UI password metadata before reset
      ansible.oci.oci_identity_ui_password_info:
        user_id: "{{ oci_identity_user_ui_password_user_ocid }}"
      register: oci_identity_user_ui_password_before
      no_log: true

    - name: Verify initial UI password info is unchanged
      ansible.builtin.assert:
        that:
          - not oci_identity_user_ui_password_before.changed
      no_log: true

    - name: Save UI password metadata before reset
      ansible.builtin.set_fact:
        oci_identity_user_ui_password_before_metadata: "{{ oci_identity_user_ui_password_before.ui_passwords }}"
      no_log: true

    - name: Check reset reports a change before a real reset
      ansible.oci.oci_identity_ui_password_reset:
        user_id: "{{ oci_identity_user_ui_password_user_ocid }}"
      check_mode: true
      register: oci_identity_user_ui_password_initial_check
      no_log: true

    - name: Verify the first check predicts change
      ansible.builtin.assert:
        that:
          - oci_identity_user_ui_password_initial_check.changed
      no_log: true

    - name: Read UI password metadata after the first check
      ansible.oci.oci_identity_ui_password_info:
        user_id: "{{ oci_identity_user_ui_password_user_ocid }}"
      register: oci_identity_user_ui_password_after_initial_check
      no_log: true

    - name: Verify the first check did not change password metadata
      ansible.builtin.assert:
        that:
          - not oci_identity_user_ui_password_after_initial_check.changed
          - oci_identity_user_ui_password_after_initial_check.ui_passwords == oci_identity_user_ui_password_before_metadata
      no_log: true

    # Domain reset sends email; this test checks API behavior, not email delivery.
    - name: Reset the UI password
      ansible.oci.oci_identity_ui_password_reset:
        user_id: "{{ oci_identity_user_ui_password_user_ocid }}"
      register: oci_identity_user_ui_password_reset
      no_log: true

    - name: Verify the reset changed state and returned the user OCID
      ansible.builtin.assert:
        that:
          - oci_identity_user_ui_password_reset.changed
          - oci_identity_user_ui_password_reset.resource.user_id | length > 0
          - oci_identity_user_ui_password_reset.resource.user_id == oci_identity_user_ui_password_user_ocid
      no_log: true

    - name: Read UI password metadata after reset
      ansible.oci.oci_identity_ui_password_info:
        user_id: "{{ oci_identity_user_ui_password_user_ocid }}"
      register: oci_identity_user_ui_password_after_reset
      until: oci_identity_user_ui_password_after_reset.ui_passwords | length > 0
      retries: 12
      delay: 5
      no_log: true

    - name: Verify UI password info is unchanged after reset
      ansible.builtin.assert:
        that:
          - not oci_identity_user_ui_password_after_reset.changed
          - oci_identity_user_ui_password_after_reset.ui_passwords[0].user_id | length > 0
          - oci_identity_user_ui_password_after_reset.ui_passwords[0].user_id == oci_identity_user_ui_password_user_ocid
      no_log: true

    - name: Save UI password metadata after reset
      ansible.builtin.set_fact:
        oci_identity_user_ui_password_reset_metadata: "{{ oci_identity_user_ui_password_after_reset.ui_passwords }}"
      no_log: true

    - name: Read UI password metadata in check mode
      ansible.oci.oci_identity_ui_password_info:
        user_id: "{{ oci_identity_user_ui_password_user_ocid }}"
      check_mode: true
      register: oci_identity_user_ui_password_info_check
      no_log: true

    - name: Verify info check mode is unchanged and returns the same metadata
      ansible.builtin.assert:
        that:
          - not oci_identity_user_ui_password_info_check.changed
          - oci_identity_user_ui_password_info_check.ui_passwords == oci_identity_user_ui_password_reset_metadata
      no_log: true

    - name: Check reset reports a change after a real reset
      ansible.oci.oci_identity_ui_password_reset:
        user_id: "{{ oci_identity_user_ui_password_user_ocid }}"
      check_mode: true
      register: oci_identity_user_ui_password_existing_check
      no_log: true

    - name: Verify the second check predicts change
      ansible.builtin.assert:
        that:
          - oci_identity_user_ui_password_existing_check.changed
      no_log: true

    - name: Read UI password metadata after the second check
      ansible.oci.oci_identity_ui_password_info:
        user_id: "{{ oci_identity_user_ui_password_user_ocid }}"
      register: oci_identity_user_ui_password_after_existing_check
      no_log: true

    - name: Verify the second check did not change password metadata
      ansible.builtin.assert:
        that:
          - not oci_identity_user_ui_password_after_existing_check.changed
          - oci_identity_user_ui_password_after_existing_check.ui_passwords == oci_identity_user_ui_password_reset_metadata
      no_log: true

    - name: Reset the UI password again
      ansible.oci.oci_identity_ui_password_reset:
        user_id: "{{ oci_identity_user_ui_password_user_ocid }}"
      register: oci_identity_user_ui_password_reset_again
      no_log: true

    - name: Verify the repeated reset reports a change
      ansible.builtin.assert:
        that:
          - oci_identity_user_ui_password_reset_again.changed
          - oci_identity_user_ui_password_reset_again.resource.user_id | length > 0
          - oci_identity_user_ui_password_reset_again.resource.user_id == oci_identity_user_ui_password_user_ocid
      no_log: true

    - name: Read UI password metadata after repeated reset
      ansible.oci.oci_identity_ui_password_info:
        user_id: "{{ oci_identity_user_ui_password_user_ocid }}"
      register: oci_identity_user_ui_password_after_repeat
      no_log: true

    - name: Verify info is unchanged after the repeated reset
      ansible.builtin.assert:
        that:
          - not oci_identity_user_ui_password_after_repeat.changed
      no_log: true

  always:
    - name: Delete the temporary Default domain user by name
      ansible.oci.oci_identity_user:
        state: absent
        domain_id: "{{ oci_identity_user_ui_password_domain_id | default('') }}"
        user_name: "{{ oci_identity_user_ui_password_cleanup_name | default('') }}"
      when:
        - oci_identity_user_ui_password_domain_id | default('') | length > 0
        - oci_identity_user_ui_password_cleanup_name | default('') | length > 0
      register: oci_identity_user_ui_password_cleanup
      retries: 3
      ignore_errors: true

    - name: Verify temporary Default domain user cleanup succeeded
      ansible.builtin.assert:
        that:
          - oci_identity_user_ui_password_cleanup is not failed
