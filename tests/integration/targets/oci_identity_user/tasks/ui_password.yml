---
- name: Test UI password modules for the temporary identity domain user
  block:
    - name: Read password info before reset
      ansible.oci.oci_identity_ui_password_info:
        domain_id: "{{ oci_integration_domain_id }}"
        user_id: "{{ user_create_result.resource.id }}"
      register: oci_identity_user_ui_password_domain_before
      no_log: true

    - name: Check password info before reset
      ansible.builtin.assert:
        that:
          - not oci_identity_user_ui_password_domain_before.changed
          - oci_identity_user_ui_password_domain_before.ui_passwords | length == 1
          - oci_identity_user_ui_password_domain_before.ui_passwords[0].user_id == user_create_result.resource.id
          - oci_identity_user_ui_password_domain_before.ui_passwords[0].user_ocid == user_create_result.resource.ocid
          - oci_identity_user_ui_password_domain_before.ui_passwords[0].user_name == user_create_result.resource.user_name
          - oci_identity_user_ui_password_domain_before.ui_passwords[0].domain_id == oci_integration_domain_id
          - (oci_identity_user_ui_password_domain_before.ui_passwords[0].keys() | sort) == ['domain_id', 'password_state', 'user_id', 'user_name', 'user_ocid']
          - oci_identity_user_ui_password_domain_before.ui_passwords[0].password_state is mapping
      no_log: true

    - name: Save password state before reset
      ansible.builtin.set_fact:
        oci_identity_user_ui_password_domain_state_before: "{{ oci_identity_user_ui_password_domain_before.ui_passwords[0].password_state }}"
      no_log: true

    - name: Read password info in check mode
      ansible.oci.oci_identity_ui_password_info:
        domain_url: "{{ oci_integration_domain_url }}"
        user_id: "{{ user_create_result.resource.id }}"
      check_mode: true
      register: oci_identity_user_ui_password_domain_info_check
      no_log: true

    - name: Check password info check mode
      ansible.builtin.assert:
        that:
          - not oci_identity_user_ui_password_domain_info_check.changed
          - oci_identity_user_ui_password_domain_info_check.ui_passwords | length == 1
          - oci_identity_user_ui_password_domain_info_check.ui_passwords[0].user_id == user_create_result.resource.id
          - oci_identity_user_ui_password_domain_info_check.ui_passwords[0].password_state == oci_identity_user_ui_password_domain_state_before
      no_log: true

    - name: Check reset in check mode
      ansible.oci.oci_identity_ui_password_reset:
        domain_id: "{{ oci_integration_domain_id }}"
        user_id: "{{ user_create_result.resource.id }}"
      check_mode: true
      register: oci_identity_user_ui_password_domain_reset_check
      no_log: true

    - name: Check reset check mode result
      ansible.builtin.assert:
        that:
          - oci_identity_user_ui_password_domain_reset_check.changed
          - oci_identity_user_ui_password_domain_reset_check.resource is not defined
      no_log: true

    - name: Read password info after reset check mode
      ansible.oci.oci_identity_ui_password_info:
        domain_url: "{{ oci_integration_domain_url }}"
        user_ocid: "{{ user_create_result.resource.ocid }}"
      register: oci_identity_user_ui_password_domain_after_check
      no_log: true

    - name: Check password info after reset check mode
      ansible.builtin.assert:
        that:
          - not oci_identity_user_ui_password_domain_after_check.changed
          - oci_identity_user_ui_password_domain_after_check.ui_passwords | length == 1
          - oci_identity_user_ui_password_domain_after_check.ui_passwords[0].user_ocid == user_create_result.resource.ocid
          - oci_identity_user_ui_password_domain_after_check.ui_passwords[0].password_state == oci_identity_user_ui_password_domain_state_before
      no_log: true

    - name: Reset password by user name
      ansible.oci.oci_identity_ui_password_reset:
        domain_name: "{{ oci_identity_user_integration_domain_name }}"
        compartment_id: "{{ oci_integration_compartment_id }}"
        user_name: "{{ user_create_result.resource.user_name }}"
      register: oci_identity_user_ui_password_domain_reset
      no_log: true

    - name: Check reset result
      ansible.builtin.assert:
        that:
          - oci_identity_user_ui_password_domain_reset.changed
          - oci_identity_user_ui_password_domain_reset.resource.user_id == user_create_result.resource.id
          - oci_identity_user_ui_password_domain_reset.resource.user_ocid == user_create_result.resource.ocid
          - oci_identity_user_ui_password_domain_reset.resource.user_name == user_create_result.resource.user_name
          - oci_identity_user_ui_password_domain_reset.resource.domain_id == oci_integration_domain_id
      no_log: true

    - name: Read password info after reset
      ansible.oci.oci_identity_ui_password_info:
        domain_id: "{{ oci_integration_domain_id }}"
        user_ocid: "{{ user_create_result.resource.ocid }}"
      register: oci_identity_user_ui_password_domain_after_reset
      no_log: true

    - name: Check password info after reset
      ansible.builtin.assert:
        that:
          - not oci_identity_user_ui_password_domain_after_reset.changed
          - oci_identity_user_ui_password_domain_after_reset.ui_passwords | length == 1
          - oci_identity_user_ui_password_domain_after_reset.ui_passwords[0].user_id == user_create_result.resource.id
          - oci_identity_user_ui_password_domain_after_reset.ui_passwords[0].user_ocid == user_create_result.resource.ocid
          - oci_identity_user_ui_password_domain_after_reset.ui_passwords[0].user_name == user_create_result.resource.user_name
          - oci_identity_user_ui_password_domain_after_reset.ui_passwords[0].domain_id == oci_integration_domain_id
          - oci_identity_user_ui_password_domain_after_reset.ui_passwords[0].password_state is mapping
      no_log: true

    - name: Save password state after reset
      ansible.builtin.set_fact:
        oci_identity_user_ui_password_domain_state_after: "{{ oci_identity_user_ui_password_domain_after_reset.ui_passwords[0].password_state }}"
      no_log: true

    - name: Read password info in check mode by domain name
      ansible.oci.oci_identity_ui_password_info:
        domain_name: "{{ oci_identity_user_integration_domain_name }}"
        compartment_id: "{{ oci_integration_compartment_id }}"
        user_name: "{{ user_create_result.resource.user_name }}"
      check_mode: true
      register: oci_identity_user_ui_password_domain_info_final_check
      no_log: true

    - name: Check final password info check mode
      ansible.builtin.assert:
        that:
          - not oci_identity_user_ui_password_domain_info_final_check.changed
          - oci_identity_user_ui_password_domain_info_final_check.ui_passwords | length == 1
          - oci_identity_user_ui_password_domain_info_final_check.ui_passwords[0].password_state == oci_identity_user_ui_password_domain_state_after
      no_log: true

    - name: Repeat password reset by user ID
      ansible.oci.oci_identity_ui_password_reset:
        domain_url: "{{ oci_integration_domain_url }}"
        user_id: "{{ user_create_result.resource.id }}"
      register: oci_identity_user_ui_password_domain_reset_again
      no_log: true

    - name: Check repeated reset result
      ansible.builtin.assert:
        that:
          - oci_identity_user_ui_password_domain_reset_again.changed
          - oci_identity_user_ui_password_domain_reset_again.resource.user_id == user_create_result.resource.id
          - oci_identity_user_ui_password_domain_reset_again.resource.user_ocid == user_create_result.resource.ocid
          - oci_identity_user_ui_password_domain_reset_again.resource.domain_id == oci_integration_domain_id
      no_log: true

    - name: Read password info after repeated reset
      ansible.oci.oci_identity_ui_password_info:
        domain_id: "{{ oci_integration_domain_id }}"
        user_id: "{{ user_create_result.resource.id }}"
      register: oci_identity_user_ui_password_domain_after_repeat
      no_log: true

    - name: Check password info after repeated reset
      ansible.builtin.assert:
        that:
          - not oci_identity_user_ui_password_domain_after_repeat.changed
          - oci_identity_user_ui_password_domain_after_repeat.ui_passwords | length == 1
          - oci_identity_user_ui_password_domain_after_repeat.ui_passwords[0].user_id == user_create_result.resource.id
          - oci_identity_user_ui_password_domain_after_repeat.ui_passwords[0].password_state is mapping
      no_log: true

- name: Test UI password modules for a temporary Default domain user
  block:
    - name: Set Default domain user name and tenancy ID
      ansible.builtin.set_fact:
        oci_identity_user_ui_password_cleanup_name: "oci-ui-password-{{ oci_integration_rpfx }}@example.com"
        oci_identity_user_ui_password_tenancy_id: >-
          {{ lookup(
            'ansible.builtin.ini',
            'tenancy',
            section=oci_integration_config_profile_name,
            file=oci_integration_config_file_location
          ) }}

    - name: Check tenancy ID
      ansible.builtin.assert:
        that:
          - oci_identity_user_ui_password_tenancy_id | length > 0

    - name: Find Default domain
      ansible.oci.oci_identity_domain_info:
        compartment_id: "{{ oci_identity_user_ui_password_tenancy_id }}"
        name: Default
      register: oci_identity_user_ui_password_default_domain

    - name: Check Default domain lookup
      ansible.builtin.assert:
        that:
          - oci_identity_user_ui_password_default_domain.domains | length == 1

    - name: Save Default domain ID
      ansible.builtin.set_fact:
        oci_identity_user_ui_password_domain_id: "{{ oci_identity_user_ui_password_default_domain.domains[0].id }}"
        oci_identity_user_ui_password_domain_url: "{{ oci_identity_user_ui_password_default_domain.domains[0].url }}"

    - name: Create temporary Default domain user
      ansible.oci.oci_identity_user:
        domain_id: "{{ oci_identity_user_ui_password_domain_id }}"
        user_name: "{{ oci_identity_user_ui_password_cleanup_name }}"
        name: OCI UI Password Integration
        given_name: OCI
        family_name: Integration
        email: "{{ oci_identity_user_ui_password_cleanup_name }}"
        active: true
      register: oci_identity_user_ui_password_user_create

    - name: Wait for temporary Default domain user
      ansible.oci.oci_identity_user_info:
        domain_id: "{{ oci_identity_user_ui_password_domain_id }}"
        user_name: "{{ oci_identity_user_ui_password_cleanup_name }}"
      register: oci_identity_user_ui_password_user_readiness
      until: oci_identity_user_ui_password_user_readiness.users | length == 1
      retries: 12
      delay: 5

    - name: Read Default domain password info by name
      ansible.oci.oci_identity_ui_password_info:
        domain_name: Default
        user_name: "{{ oci_identity_user_ui_password_user_create.resource.user_name }}"
      register: oci_identity_user_ui_password_default_before
      no_log: true

    - name: Check Default domain password info before reset
      ansible.builtin.assert:
        that:
          - not oci_identity_user_ui_password_default_before.changed
          - oci_identity_user_ui_password_default_before.ui_passwords | length == 1
          - oci_identity_user_ui_password_default_before.ui_passwords[0].user_id == oci_identity_user_ui_password_user_create.resource.id
          - oci_identity_user_ui_password_default_before.ui_passwords[0].user_ocid == oci_identity_user_ui_password_user_create.resource.ocid
          - oci_identity_user_ui_password_default_before.ui_passwords[0].user_name == oci_identity_user_ui_password_user_create.resource.user_name
          - oci_identity_user_ui_password_default_before.ui_passwords[0].domain_id == oci_identity_user_ui_password_domain_id
          - (oci_identity_user_ui_password_default_before.ui_passwords[0].keys() | sort) == ['domain_id', 'password_state', 'user_id', 'user_name', 'user_ocid']
          - oci_identity_user_ui_password_default_before.ui_passwords[0].password_state is mapping
      no_log: true

    - name: Save Default domain password state
      ansible.builtin.set_fact:
        oci_identity_user_ui_password_default_state_before: "{{ oci_identity_user_ui_password_default_before.ui_passwords[0].password_state }}"
      no_log: true

    - name: Check Default domain reset in check mode
      ansible.oci.oci_identity_ui_password_reset:
        domain_id: "{{ oci_identity_user_ui_password_domain_id }}"
        user_id: "{{ oci_identity_user_ui_password_user_create.resource.id }}"
      check_mode: true
      register: oci_identity_user_ui_password_default_reset_check
      no_log: true

    - name: Check Default domain reset check mode result
      ansible.builtin.assert:
        that:
          - oci_identity_user_ui_password_default_reset_check.changed
          - oci_identity_user_ui_password_default_reset_check.resource is not defined
      no_log: true

    - name: Read Default domain password info after check mode
      ansible.oci.oci_identity_ui_password_info:
        domain_id: "{{ oci_identity_user_ui_password_domain_id }}"
        user_ocid: "{{ oci_identity_user_ui_password_user_create.resource.ocid }}"
      register: oci_identity_user_ui_password_default_after_check
      no_log: true

    - name: Check Default domain info after reset check mode
      ansible.builtin.assert:
        that:
          - not oci_identity_user_ui_password_default_after_check.changed
          - oci_identity_user_ui_password_default_after_check.ui_passwords | length == 1
          - oci_identity_user_ui_password_default_after_check.ui_passwords[0].user_id == oci_identity_user_ui_password_user_create.resource.id
          - oci_identity_user_ui_password_default_after_check.ui_passwords[0].password_state == oci_identity_user_ui_password_default_state_before
      no_log: true

    - name: Reset Default domain password by OCID
      ansible.oci.oci_identity_ui_password_reset:
        domain_name: Default
        user_ocid: "{{ oci_identity_user_ui_password_user_create.resource.ocid }}"
      register: oci_identity_user_ui_password_default_reset
      no_log: true

    - name: Check Default domain reset result
      ansible.builtin.assert:
        that:
          - oci_identity_user_ui_password_default_reset.changed
          - oci_identity_user_ui_password_default_reset.resource.user_id == oci_identity_user_ui_password_user_create.resource.id
          - oci_identity_user_ui_password_default_reset.resource.user_ocid == oci_identity_user_ui_password_user_create.resource.ocid
          - oci_identity_user_ui_password_default_reset.resource.user_name == oci_identity_user_ui_password_user_create.resource.user_name
          - oci_identity_user_ui_password_default_reset.resource.domain_id == oci_identity_user_ui_password_domain_id
      no_log: true

    - name: Read Default domain password info after reset
      ansible.oci.oci_identity_ui_password_info:
        domain_url: "{{ oci_identity_user_ui_password_domain_url }}"
        user_id: "{{ oci_identity_user_ui_password_user_create.resource.id }}"
      register: oci_identity_user_ui_password_default_after_reset
      no_log: true

    - name: Check Default domain password info after reset
      ansible.builtin.assert:
        that:
          - not oci_identity_user_ui_password_default_after_reset.changed
          - oci_identity_user_ui_password_default_after_reset.ui_passwords | length == 1
          - oci_identity_user_ui_password_default_after_reset.ui_passwords[0].user_id == oci_identity_user_ui_password_user_create.resource.id
          - oci_identity_user_ui_password_default_after_reset.ui_passwords[0].user_ocid == oci_identity_user_ui_password_user_create.resource.ocid
          - oci_identity_user_ui_password_default_after_reset.ui_passwords[0].password_state is mapping
      no_log: true

    - name: Save Default domain password state after reset
      ansible.builtin.set_fact:
        oci_identity_user_ui_password_default_state_after: "{{ oci_identity_user_ui_password_default_after_reset.ui_passwords[0].password_state }}"
      no_log: true

    - name: Read Default domain password info in check mode
      ansible.oci.oci_identity_ui_password_info:
        domain_name: Default
        user_name: "{{ oci_identity_user_ui_password_user_create.resource.user_name }}"
      check_mode: true
      register: oci_identity_user_ui_password_default_info_check
      no_log: true

    - name: Check Default domain info check mode result
      ansible.builtin.assert:
        that:
          - not oci_identity_user_ui_password_default_info_check.changed
          - oci_identity_user_ui_password_default_info_check.ui_passwords | length == 1
          - oci_identity_user_ui_password_default_info_check.ui_passwords[0].password_state == oci_identity_user_ui_password_default_state_after
      no_log: true

    - name: Repeat Default domain password reset by name
      ansible.oci.oci_identity_ui_password_reset:
        domain_id: "{{ oci_identity_user_ui_password_domain_id }}"
        user_name: "{{ oci_identity_user_ui_password_user_create.resource.user_name }}"
      register: oci_identity_user_ui_password_default_reset_again
      no_log: true

    - name: Check repeated Default domain reset result
      ansible.builtin.assert:
        that:
          - oci_identity_user_ui_password_default_reset_again.changed
          - oci_identity_user_ui_password_default_reset_again.resource.user_id == oci_identity_user_ui_password_user_create.resource.id
          - oci_identity_user_ui_password_default_reset_again.resource.user_ocid == oci_identity_user_ui_password_user_create.resource.ocid
          - oci_identity_user_ui_password_default_reset_again.resource.domain_id == oci_identity_user_ui_password_domain_id
      no_log: true

    - name: Read Default domain password info after repeated reset
      ansible.oci.oci_identity_ui_password_info:
        domain_id: "{{ oci_identity_user_ui_password_domain_id }}"
        user_ocid: "{{ oci_identity_user_ui_password_user_create.resource.ocid }}"
      register: oci_identity_user_ui_password_default_after_repeat
      no_log: true

    - name: Check Default domain info after repeated reset
      ansible.builtin.assert:
        that:
          - not oci_identity_user_ui_password_default_after_repeat.changed
          - oci_identity_user_ui_password_default_after_repeat.ui_passwords | length == 1
          - oci_identity_user_ui_password_default_after_repeat.ui_passwords[0].user_id == oci_identity_user_ui_password_user_create.resource.id
          - oci_identity_user_ui_password_default_after_repeat.ui_passwords[0].password_state is mapping
      no_log: true

  always:
    - name: Delete temporary Default domain user
      ansible.oci.oci_identity_user:
        state: absent
        domain_id: "{{ oci_identity_user_ui_password_domain_id | default('') }}"
        user_name: "{{ oci_identity_user_ui_password_cleanup_name | default('') }}"
      when:
        - oci_identity_user_ui_password_domain_id | default('') | length > 0
        - oci_identity_user_ui_password_cleanup_name | default('') | length > 0
      register: oci_identity_user_ui_password_cleanup
      retries: 3
      ignore_errors: true
      no_log: true

    - name: Check temporary Default domain user cleanup
      ansible.builtin.assert:
        that:
          - oci_identity_user_ui_password_cleanup is not failed
      no_log: true
