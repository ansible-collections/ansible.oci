---
- name: Validate domain creation inputs
  ansible.builtin.assert:
    that:
      - oci_integration_compartment_id | default('', true) | length > 0
      - oci_identity_user_integration_home_region | length > 0

- name: Compute unique domain and user names
  ansible.builtin.set_fact:
    oci_integration_domain_id: ''
    oci_integration_domain_url: ''
    oci_identity_user_integration_domain_name: '{{ oci_identity_user_integration_domain_name }}-{{ oci_integration_rpfx }}'
    oci_identity_user_integration_name: '{{ oci_identity_user_integration_name }}-{{ oci_integration_rpfx }}@example.com'
    oci_identity_user_cleanup_name: '{{ oci_identity_user_integration_name }}-{{ oci_integration_rpfx }}@example.com'

- name: Mark oci_identity_user as started
  ansible.builtin.set_fact:
    oci_group_started_oci_identity_user: true

- name: Exercise identity-domain user lifecycle in a temporary domain
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: '{{ oci_integration_config_file_location }}'
      config_profile_name: '{{ oci_integration_config_profile_name }}'
  block:

    - name: Use the shared domain
      ansible.builtin.set_fact:
        oci_identity_user_domain_create: '{{ oci_prerequisites.domain }}'

    - name: Capture temporary identity domain endpoint
      ansible.builtin.set_fact:
        oci_integration_domain_id: '{{ oci_identity_user_domain_create.resource.id }}'
        oci_integration_domain_url: '{{ oci_identity_user_domain_create.resource.url }}'

    - name: Verify temporary identity domain endpoint
      ansible.builtin.assert:
        that:
          - oci_integration_domain_id | length > 0
          - oci_integration_domain_url | length > 0

    - name: Wait for the temporary identity domain API
      block:

        - name: Poll temporary identity domain API
          ansible.oci.oci_identity_user_info:
            domain_url: '{{ oci_integration_domain_url }}'
            user_name: '{{ oci_identity_user_integration_name }}'
          register: oci_identity_domain_readiness
          until: oci_identity_domain_readiness is succeeded
          retries: 12
          delay: 5
      rescue:

        - name: Report temporary identity domain readiness failure
          ansible.builtin.fail:
            msg: >-
              Identity domain API readiness retry limit reached (12 retries, 5 seconds apart, excluding API request time).
              Last API result: {{ ansible_failed_result }}

    - name: Create user in check mode
      ansible.oci.oci_identity_user:
        domain_id: '{{ oci_integration_domain_id }}'
        user_name: '{{ oci_identity_user_integration_name }}'
        name: OCI User Integration
        given_name: OCI
        family_name: Integration
        email: '{{ oci_identity_user_integration_name }}'
        description: '{{ oci_identity_user_integration_description }}'
        active: true
        freeform_tags: &id001
          phase: create
      check_mode: true
      register: user_check

    - name: Verify check mode left user absent
      ansible.oci.oci_identity_user_info:
        domain_id: '{{ oci_integration_domain_id }}'
        user_name: '{{ oci_identity_user_integration_name }}'
      register: user_check_info
      failed_when: not user_check.changed or user_check_info.users | length != 0

    - name: Create user
      ansible.oci.oci_identity_user:
        domain_id: '{{ oci_integration_domain_id }}'
        user_name: '{{ oci_identity_user_integration_name }}'
        name: OCI User Integration
        given_name: OCI
        family_name: Integration
        email: '{{ oci_identity_user_integration_name }}'
        description: '{{ oci_identity_user_integration_description }}'
        active: true
        freeform_tags: *id001
      register: user_create_result

    - name: Save the shared user
      ansible.builtin.set_fact:
        oci_group_resources: '{{ oci_group_resources | combine({''user'': user_create_result}) }}'

    - name: Verify user creation is idempotent
      ansible.oci.oci_identity_user:
        domain_id: '{{ oci_integration_domain_id }}'
        user_name: '{{ oci_identity_user_integration_name }}'
        name: OCI User Integration
        given_name: OCI
        family_name: Integration
        email: '{{ oci_identity_user_integration_name }}'
        description: '{{ oci_identity_user_integration_description }}'
        active: true
        freeform_tags: *id001
      register: user_create_rerun
      failed_when: user_create_rerun.changed or user_create_rerun.resource.id != user_create_result.resource.id

    - name: Verify create result identifies the new user
      ansible.builtin.assert:
        that:
          - user_create_result.resource.id | length > 0
          - user_create_result.resource.ocid | length > 0
          - user_create_result.resource.domain_id == oci_integration_domain_id
          - user_create_result.resource.user_name == oci_identity_user_integration_name
          - user_create_result.resource.name == 'OCI User Integration'
          - user_create_result.resource.given_name == 'OCI'
          - user_create_result.resource.family_name == 'Integration'
          - user_create_result.resource.email == oci_identity_user_integration_name
          - user_create_result.resource.description == oci_identity_user_integration_description
          - user_create_result.resource.active == true
          - user_create_result.resource.freeform_tags.phase == 'create'
          - user_create_result.resource.defined_tags is mapping
          - user_create_result.resource.time_created | length > 0
          - user_create_result.resource.time_modified | length > 0

    - name: Retrieve user by ID
      ansible.oci.oci_identity_user_info:
        domain_url: '{{ oci_integration_domain_url }}'
        user_id: '{{ user_create_result.resource.id }}'
      register: user_by_id
      failed_when: user_by_id.users | length != 1

    - name: Verify info result uses the same identifiers and field names
      ansible.builtin.assert:
        that:
          - user_by_id.users[0].id == user_create_result.resource.id
          - user_by_id.users[0].ocid == user_create_result.resource.ocid
          - user_by_id.users[0].domain_id == oci_integration_domain_id
          - user_by_id.users[0].name == 'OCI User Integration'
          - user_by_id.users[0].email == oci_identity_user_integration_name

    - name: Update user
      ansible.oci.oci_identity_user:
        domain_id: '{{ oci_integration_domain_id }}'
        user_id: '{{ user_create_result.resource.id }}'
        name: OCI User Integration Updated
        email: updated-{{ oci_identity_user_integration_name }}
        description: '{{ oci_identity_user_integration_description }} updated'
        active: false
        freeform_tags: &id002
          phase: update
      register: user_update

    - name: Verify update
      ansible.builtin.assert:
        that:
          - user_update.changed
          - user_update.resource.name == 'OCI User Integration Updated'
          - user_update.resource.active == false
          - user_update.resource.freeform_tags.phase == 'update'

    - name: Reconcile updated user
      ansible.oci.oci_identity_user:
        domain_id: '{{ oci_integration_domain_id }}'
        user_id: '{{ user_create_result.resource.id }}'
        name: OCI User Integration Updated
        email: updated-{{ oci_identity_user_integration_name }}
        description: '{{ oci_identity_user_integration_description }} updated'
        active: false
        freeform_tags: *id002
      register: user_rerun
      failed_when: user_rerun.changed

    - name: Activate the shared user for dependent tests
      ansible.oci.oci_identity_user:
        domain_id: '{{ oci_integration_domain_id }}'
        user_id: '{{ user_create_result.resource.id }}'
        active: true
