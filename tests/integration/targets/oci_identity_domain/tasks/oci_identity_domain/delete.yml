---
- name: Exercise identity domain module lifecycle
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: '{{ oci_integration_config_file_location }}'
      config_profile_name: '{{ oci_integration_config_profile_name }}'
  block:

    - name: Delete identity domain in check mode
      ansible.oci.oci_identity_domain:
        state: absent
        domain_id: '{{ oci_identity_domain_id }}'
      check_mode: true
      register: oci_identity_domain_delete_check

    - name: Assert delete check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_identity_domain_delete_check.changed | bool

    - name: Read identity domain after delete check mode
      ansible.oci.oci_identity_domain_info:
        domain_id: '{{ oci_identity_domain_id }}'
      register: oci_identity_domain_delete_check_probe

    - name: Assert identity domain still exists after delete check mode
      ansible.builtin.assert:
        that:
          - oci_identity_domain_delete_check_probe.domains | length == 1

    - name: Delete identity domain
      ansible.oci.oci_identity_domain:
        state: absent
        domain_id: '{{ oci_identity_domain_id }}'
      register: oci_identity_domain_delete

    - name: Assert delete reported a change
      ansible.builtin.assert:
        that:
          - oci_identity_domain_delete.changed | bool

    - name: Assert delete is idempotent on rerun
      ansible.oci.oci_identity_domain:
        state: absent
        domain_id: '{{ oci_identity_domain_id }}'
      register: oci_identity_domain_delete_rerun

    - name: Verify delete rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_identity_domain_delete_rerun.changed | bool

    - name: Clear identity domain ID after delete idempotency check
      ansible.builtin.set_fact:
        oci_identity_domain_id: ''
