---
- name: Validate required OCI integration variables
  ansible.builtin.assert:
    that:
      - oci_integration_compartment_id | default('', true) | length > 0
    fail_msg: >-
      OCI subnet integration tests require OCI_TEST_COMPARTMENT_ID to be set.

- name: Exercise subnet module lifecycle
  module_defaults:
    group/oracle.oci.oci:
      config_file_location: "{{ oci_subnet_integration_config_file_location }}"
      config_profile_name: "{{ oci_subnet_integration_config_profile_name }}"
  block:
    - name: Create test VCN for subnet integration
      oracle.oci.oci_network_vcn:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_subnet_integration_vcn_name }}"
        cidr_blocks:
          - "{{ oci_subnet_integration_vcn_cidr_block }}"
        dns_label: "{{ oci_subnet_integration_vcn_dns_label }}"
      register: oci_subnet_vcn_create

    - name: Capture created network ids
      ansible.builtin.set_fact:
        oci_subnet_integration_network:
          vcn_id: "{{ oci_subnet_vcn_create.resource.id }}"
          default_route_table_id: "{{ oci_subnet_vcn_create.resource.default_route_table_id }}"
          default_security_list_id: "{{ oci_subnet_vcn_create.resource.default_security_list_id }}"

    - name: Define subnet create and delete parameters
      ansible.builtin.set_fact:
        oci_subnet_create_params:
          state: present
          compartment_id: "{{ oci_integration_compartment_id }}"
          vcn_id: "{{ oci_subnet_integration_network.vcn_id }}"
          cidr_block: "{{ oci_subnet_integration_subnet_cidr_block }}"
          name: "{{ oci_subnet_integration_subnet_name }}"
          dns_label: "{{ oci_subnet_integration_subnet_dns_label }}"
          route_table_id: "{{ oci_subnet_integration_network.default_route_table_id }}"
          security_list_ids:
            - "{{ oci_subnet_integration_network.default_security_list_id }}"
          freeform_tags: "{{ oci_subnet_integration_create_tags }}"
        oci_subnet_delete_params:
          state: absent
          subnet_id: ""

    - name: Create subnet in check mode
      oracle.oci.oci_subnet: &oci_subnet_create_module_options
        state: "{{ oci_subnet_create_params.state }}"
        compartment_id: "{{ oci_subnet_create_params.compartment_id }}"
        vcn_id: "{{ oci_subnet_create_params.vcn_id }}"
        cidr_block: "{{ oci_subnet_create_params.cidr_block }}"
        name: "{{ oci_subnet_create_params.name }}"
        dns_label: "{{ oci_subnet_create_params.dns_label }}"
        route_table_id: "{{ oci_subnet_create_params.route_table_id }}"
        security_list_ids: "{{ oci_subnet_create_params.security_list_ids }}"
        freeform_tags: "{{ oci_subnet_create_params.freeform_tags }}"
      check_mode: true
      register: oci_subnet_create_check

    - name: Assert create check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_subnet_create_check.changed | bool

    - name: Read subnet after create check mode
      oracle.oci.oci_subnet_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        vcn_id: "{{ oci_subnet_integration_network.vcn_id }}"
        name: "{{ oci_subnet_integration_subnet_name }}"
      register: oci_subnet_create_check_probe

    - name: Assert subnet is still absent after create check mode
      ansible.builtin.assert:
        that:
          - oci_subnet_create_check_probe.subnets | length == 0

    - name: Create subnet
      oracle.oci.oci_subnet:
        <<: *oci_subnet_create_module_options
      register: oci_subnet_create

    - name: Capture subnet id and define update parameters
      ansible.builtin.set_fact:
        oci_subnet_id: "{{ oci_subnet_create.resource.id }}"
        oci_subnet_update_params:
          state: present
          subnet_id: "{{ oci_subnet_create.resource.id }}"
          name: "{{ oci_subnet_integration_updated_subnet_name }}"
          cidr_block: "{{ oci_subnet_integration_updated_subnet_cidr_block }}"
          route_table_id: "{{ oci_subnet_integration_network.default_route_table_id }}"
          security_list_ids:
            - "{{ oci_subnet_integration_network.default_security_list_id }}"
          freeform_tags: "{{ oci_subnet_integration_update_tags }}"
        oci_subnet_delete_params:
          state: absent
          subnet_id: "{{ oci_subnet_create.resource.id }}"

    - name: Assert create reported a change
      ansible.builtin.assert:
        that:
          - oci_subnet_create.changed | bool

    - name: Read subnet by id
      oracle.oci.oci_subnet_info:
        subnet_id: "{{ oci_subnet_id }}"
      register: oci_subnet_info_by_id

    - name: Assert subnet info by id returned the created subnet
      ansible.builtin.assert:
        that:
          - oci_subnet_info_by_id.subnets | length == 1
          - oci_subnet_info_by_id.subnets[0].id == oci_subnet_id
          - oci_subnet_info_by_id.subnets[0].name == oci_subnet_integration_subnet_name
          - oci_subnet_info_by_id.subnets[0].cidr_block == oci_subnet_integration_subnet_cidr_block
          - oci_subnet_info_by_id.subnets[0].lifecycle_state == "AVAILABLE"
          - oci_subnet_info_by_id.subnets[0].route_table_id == oci_subnet_integration_network.default_route_table_id
          - oci_subnet_info_by_id.subnets[0].security_list_ids == [oci_subnet_integration_network.default_security_list_id]

    - name: List subnet by name
      oracle.oci.oci_subnet_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        vcn_id: "{{ oci_subnet_integration_network.vcn_id }}"
        name: "{{ oci_subnet_integration_subnet_name }}"
        lifecycle_state: AVAILABLE
      register: oci_subnet_info_list

    - name: Assert subnet info list returned the created subnet
      ansible.builtin.assert:
        that:
          - oci_subnet_info_list.subnets | selectattr('id', 'equalto', oci_subnet_id) | list | length == 1

    - name: Assert created subnet is a no-op on rerun with unique name
      oracle.oci.oci_subnet:
        <<: *oci_subnet_create_module_options
      register: oci_subnet_create_rerun_by_name

    - name: Verify subnet rerun with unique name is a no-op
      ansible.builtin.assert:
        that:
          - not oci_subnet_create_rerun_by_name.changed | bool

    - name: Assert created subnet is a no-op on rerun with returned id
      oracle.oci.oci_subnet:
        <<: *oci_subnet_create_module_options
        subnet_id: "{{ oci_subnet_id }}"
      register: oci_subnet_create_rerun

    - name: Verify rerun with returned id is a no-op
      ansible.builtin.assert:
        that:
          - not oci_subnet_create_rerun.changed | bool

    - name: Update subnet in check mode
      oracle.oci.oci_subnet: &oci_subnet_update_module_options
        state: "{{ oci_subnet_update_params.state }}"
        subnet_id: "{{ oci_subnet_update_params.subnet_id }}"
        name: "{{ oci_subnet_update_params.name }}"
        cidr_block: "{{ oci_subnet_update_params.cidr_block }}"
        route_table_id: "{{ oci_subnet_update_params.route_table_id }}"
        security_list_ids: "{{ oci_subnet_update_params.security_list_ids }}"
        freeform_tags: "{{ oci_subnet_update_params.freeform_tags }}"
      check_mode: true
      register: oci_subnet_update_check

    - name: Assert update check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_subnet_update_check.changed | bool

    - name: Read subnet after update check mode
      oracle.oci.oci_subnet_info:
        subnet_id: "{{ oci_subnet_id }}"
      register: oci_subnet_update_check_probe

    - name: Assert update check mode did not mutate cloud state
      ansible.builtin.assert:
        that:
          - oci_subnet_update_check_probe.subnets | length == 1
          - oci_subnet_update_check_probe.subnets[0].cidr_block == oci_subnet_integration_subnet_cidr_block
          - oci_subnet_update_check_probe.subnets[0].name == oci_subnet_integration_subnet_name
          - oci_subnet_update_check_probe.subnets[0].route_table_id == oci_subnet_integration_network.default_route_table_id
          - oci_subnet_update_check_probe.subnets[0].security_list_ids == [oci_subnet_integration_network.default_security_list_id]
          - oci_subnet_update_check_probe.subnets[0].freeform_tags.phase == "create"

    - name: Update subnet
      oracle.oci.oci_subnet:
        <<: *oci_subnet_update_module_options
      register: oci_subnet_update

    - name: Assert update reported a change
      ansible.builtin.assert:
        that:
          - oci_subnet_update.changed | bool

    - name: Read updated subnet by name
      oracle.oci.oci_subnet_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        vcn_id: "{{ oci_subnet_integration_network.vcn_id }}"
        name: "{{ oci_subnet_integration_updated_subnet_name }}"
        lifecycle_state: AVAILABLE
      register: oci_subnet_info_updated

    - name: Assert subnet info reflects updated subnet
      ansible.builtin.assert:
        that:
          - oci_subnet_info_updated.subnets | selectattr('id', 'equalto', oci_subnet_id) | list | length == 1
          - oci_subnet_info_updated.subnets | selectattr('cidr_block', 'equalto', oci_subnet_integration_updated_subnet_cidr_block) | list | length == 1
          - >-
            oci_subnet_info_updated.subnets
            | selectattr('route_table_id', 'equalto',
              oci_subnet_integration_network.default_route_table_id)
            | list | length == 1
          - >-
            oci_subnet_info_updated.subnets
            | selectattr('security_list_ids', 'equalto',
              [oci_subnet_integration_network.default_security_list_id])
            | list | length == 1
          - oci_subnet_info_updated.subnets[0].freeform_tags.phase == "update"

    - name: Assert update is idempotent on rerun
      oracle.oci.oci_subnet:
        <<: *oci_subnet_update_module_options
      register: oci_subnet_update_rerun

    - name: Verify update rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_subnet_update_rerun.changed | bool

    - name: Delete subnet in check mode
      oracle.oci.oci_subnet: &oci_subnet_delete_module_options
        state: "{{ oci_subnet_delete_params.state }}"
        subnet_id: "{{ oci_subnet_delete_params.subnet_id }}"
      check_mode: true
      register: oci_subnet_delete_check

    - name: Assert delete check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_subnet_delete_check.changed | bool

    - name: Read subnet after delete check mode
      oracle.oci.oci_subnet_info:
        subnet_id: "{{ oci_subnet_id }}"
      register: oci_subnet_delete_check_probe

    - name: Assert subnet still exists after delete check mode
      ansible.builtin.assert:
        that:
          - oci_subnet_delete_check_probe.subnets | length == 1

    - name: Delete subnet
      oracle.oci.oci_subnet:
        <<: *oci_subnet_delete_module_options
      register: oci_subnet_delete

    - name: Assert delete reported a change
      ansible.builtin.assert:
        that:
          - oci_subnet_delete.changed | bool

    - name: Assert delete is idempotent on rerun
      oracle.oci.oci_subnet:
        <<: *oci_subnet_delete_module_options
      register: oci_subnet_delete_rerun

    - name: Verify delete rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_subnet_delete_rerun.changed | bool

  always:
    - name: Run subnet cleanup
      ansible.builtin.include_tasks: cleanup.yml
