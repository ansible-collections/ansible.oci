---
- name: Validate required OCI integration variables
  ansible.builtin.assert:
    that:
      - oci_integration_compartment_id | default('', true) | length > 0
    fail_msg: >-
      OCI vault secret integration tests require oci_integration_compartment_id to be defined in
      tests/integration/integration_config.yml.

- name: Compute unique resource names for this run
  ansible.builtin.set_fact:
    oci_vault_secret_integration_secret_name: "{{ oci_vault_secret_integration_secret_name }}-{{ oci_integration_rpfx }}"
    oci_vault_secret_integration_generated_secret_name: >-
      {{ oci_vault_secret_integration_generated_secret_name }}-{{ oci_integration_rpfx }}
    oci_vault_secret_integration_invalid_secret_name: "{{ oci_vault_secret_integration_invalid_secret_name }}-{{ oci_integration_rpfx }}"

- name: Exercise vault secret module lifecycle against the shared vault and key
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
    ansible.oci.oci_vault_key:
      vault_id: "{{ oci_vault_id | default(omit) }}"
    ansible.oci.oci_vault_key_info:
      vault_id: "{{ oci_vault_id | default(omit) }}"
  block:
    # ------------------------------------------------- shared vault bootstrap
    # The vault and key are long-lived and shared by every run: the first run creates them and later runs find them
    # by name. They are never mutated or deleted here so that concurrent runs cannot race on them.
    - name: Read the shared vault by name
      ansible.oci.oci_vault_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_vault_secret_integration_vault_name }}"
      register: oci_vault_secret_vault_lookup

    - name: Create the shared vault when it is missing
      ansible.oci.oci_vault:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_vault_secret_integration_vault_name }}"
      when: >-
        (oci_vault_secret_vault_lookup.vaults
        | rejectattr('lifecycle_state', 'in', ['DELETED', 'DELETING']) | list | length) == 0
      register: oci_vault_secret_vault_create

    - name: Keep the vaults found by the initial lookup
      ansible.builtin.set_fact:
        oci_vault_secret_vaults: "{{ oci_vault_secret_vault_lookup.vaults
          | rejectattr('lifecycle_state', 'in', ['DELETED', 'DELETING']) | list }}"
      when: oci_vault_secret_vault_create is skipped

    - name: Read the shared vault by name after create
      ansible.oci.oci_vault_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_vault_secret_integration_vault_name }}"
      register: oci_vault_secret_vault_created
      when: oci_vault_secret_vault_create is not skipped

    - name: Capture the vaults found after create
      ansible.builtin.set_fact:
        oci_vault_secret_vaults: "{{ oci_vault_secret_vault_created.vaults
          | rejectattr('lifecycle_state', 'in', ['DELETED', 'DELETING']) | list }}"
      when: oci_vault_secret_vault_create is not skipped

    - name: Assert the shared vault bootstrap left exactly one active vault
      ansible.builtin.assert:
        that:
          - oci_vault_secret_vaults | length == 1
          - oci_vault_secret_vaults[0].lifecycle_state == "ACTIVE"
        fail_msg: >-
          Expected exactly one active vault named {{ oci_vault_secret_integration_vault_name }};
          found {{ oci_vault_secret_vaults | length }}. Concurrent bootstrap runs may have created
          duplicates; remove the extras and rerun.

    - name: Capture vault id
      ansible.builtin.set_fact:
        oci_vault_id: "{{ oci_vault_secret_vaults[0].id }}"

    - name: Read the shared key by name
      ansible.oci.oci_vault_key_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_vault_secret_integration_key_name }}"
      register: oci_vault_secret_key_lookup

    - name: Keep the enabled keys found by the lookup
      ansible.builtin.set_fact:
        oci_vault_secret_enabled_keys: "{{ oci_vault_secret_key_lookup.vault_keys
          | selectattr('lifecycle_state', 'equalto', 'ENABLED') | list }}"

    - name: Create the shared key when it is missing
      ansible.oci.oci_vault_key:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_vault_secret_integration_key_name }}"
        key_shape: "{{ oci_vault_secret_integration_key_shape }}"
        protection_mode: software
      when: oci_vault_secret_enabled_keys | length == 0
      register: oci_vault_secret_key_create

    - name: Capture key id
      ansible.builtin.set_fact:
        oci_vault_secret_key_id: >-
          {{ oci_vault_secret_key_create.resource.id
          if oci_vault_secret_key_create is not skipped
          else oci_vault_secret_enabled_keys[0].id }}

    # --------------------------------------------------------- secret create
    - name: Create secret without content in check mode
      ansible.oci.oci_vault_secret:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        vault_id: "{{ oci_vault_id }}"
        key_id: "{{ oci_vault_secret_key_id }}"
        name: "{{ oci_vault_secret_integration_invalid_secret_name }}"
      check_mode: true
      ignore_errors: true
      register: oci_vault_secret_invalid_check

    - name: Create secret without content or auto generation
      ansible.oci.oci_vault_secret:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        vault_id: "{{ oci_vault_id }}"
        key_id: "{{ oci_vault_secret_key_id }}"
        name: "{{ oci_vault_secret_integration_invalid_secret_name }}"
      ignore_errors: true
      register: oci_vault_secret_invalid

    - name: Read secrets by invalid name
      ansible.oci.oci_vault_secret_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        vault_id: "{{ oci_vault_id }}"
        name: "{{ oci_vault_secret_integration_invalid_secret_name }}"
      register: oci_vault_secret_invalid_probe

    - name: Assert a secret without content is rejected and nothing is created
      ansible.builtin.assert:
        that:
          - oci_vault_secret_invalid_check is failed
          - oci_vault_secret_invalid is failed
          - oci_vault_secret_invalid_probe.vault_secrets | length == 0
        fail_msg: Creating a secret without content or auto generation must fail in check mode and in normal mode.

    - name: Create secret in check mode
      ansible.oci.oci_vault_secret: &oci_vault_secret_create_module_options
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        vault_id: "{{ oci_vault_id }}"
        key_id: "{{ oci_vault_secret_key_id }}"
        name: "{{ oci_vault_secret_integration_secret_name }}"
        description: "{{ oci_vault_secret_integration_create_description }}"
        metadata: "{{ oci_vault_secret_integration_create_metadata }}"
        content: "{{ oci_vault_secret_integration_content_v1 }}"
        content_name: "v1"
        freeform_tags: "{{ oci_vault_secret_integration_create_tags }}"
      check_mode: true
      register: oci_vault_secret_create_check

    - name: Assert create check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_vault_secret_create_check.changed | bool
        fail_msg: Create check mode must report a change.

    - name: Read secrets by name after create check mode
      ansible.oci.oci_vault_secret_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        vault_id: "{{ oci_vault_id }}"
        name: "{{ oci_vault_secret_integration_secret_name }}"
      register: oci_vault_secret_create_check_probe

    - name: Assert secret is still absent after create check mode
      ansible.builtin.assert:
        that:
          - oci_vault_secret_create_check_probe.vault_secrets | length == 0
        fail_msg: Create check mode must not create the secret.

    - name: Create secret
      ansible.oci.oci_vault_secret:
        <<: *oci_vault_secret_create_module_options
      register: oci_vault_secret_create

    - name: Capture secret id
      ansible.builtin.set_fact:
        oci_vault_secret_id: "{{ oci_vault_secret_create.resource.id }}"

    - name: Assert create reported a change
      ansible.builtin.assert:
        that:
          - oci_vault_secret_create.changed | bool
          - oci_vault_secret_create.resource.lifecycle_state == "ACTIVE"
          - oci_vault_secret_create.resource.name == oci_vault_secret_integration_secret_name
          - oci_vault_secret_create.resource.current_version_number == 1
          - oci_vault_secret_create.resource.description == oci_vault_secret_integration_create_description
          - oci_vault_secret_create.resource.metadata == oci_vault_secret_integration_create_metadata
          - oci_vault_secret_create.resource.freeform_tags == oci_vault_secret_integration_create_tags
          - "'content' not in oci_vault_secret_create.resource"
        fail_msg: Create must return an ACTIVE secret at version 1 with the requested attributes and without content.

    - name: Rerun create by name
      ansible.oci.oci_vault_secret:
        <<: *oci_vault_secret_create_module_options
      register: oci_vault_secret_create_again

    - name: Rerun create by name in check mode
      ansible.oci.oci_vault_secret:
        <<: *oci_vault_secret_create_module_options
      check_mode: true
      register: oci_vault_secret_create_again_check

    - name: Rerun create by id
      ansible.oci.oci_vault_secret:
        state: present
        secret_id: "{{ oci_vault_secret_id }}"
        content: "{{ oci_vault_secret_integration_content_v1 }}"
        freeform_tags: "{{ oci_vault_secret_integration_create_tags }}"
      register: oci_vault_secret_create_by_id_again

    - name: Rerun create by id in check mode
      ansible.oci.oci_vault_secret:
        state: present
        secret_id: "{{ oci_vault_secret_id }}"
        content: "{{ oci_vault_secret_integration_content_v1 }}"
        freeform_tags: "{{ oci_vault_secret_integration_create_tags }}"
      check_mode: true
      register: oci_vault_secret_create_by_id_again_check

    - name: Assert create reruns are idempotent
      ansible.builtin.assert:
        that:
          - not oci_vault_secret_create_again.changed | bool
          - not oci_vault_secret_create_again_check.changed | bool
          - not oci_vault_secret_create_by_id_again.changed | bool
          - not oci_vault_secret_create_by_id_again_check.changed | bool
          - oci_vault_secret_create_again.resource.id == oci_vault_secret_id
          - oci_vault_secret_create_by_id_again.resource.id == oci_vault_secret_id
          - oci_vault_secret_create_by_id_again.resource.current_version_number == 1
        fail_msg: Rerunning the create by name and by id must not change the secret or write another version.

    # ----------------------------------------------------------- secret info
    - name: Read secret by id
      ansible.oci.oci_vault_secret_info:
        secret_id: "{{ oci_vault_secret_id }}"
      register: oci_vault_secret_info_by_id

    - name: Assert secret info by id returned the created secret without content
      ansible.builtin.assert:
        that:
          - oci_vault_secret_info_by_id.vault_secrets | length == 1
          - oci_vault_secret_info_by_id.vault_secrets[0].id == oci_vault_secret_id
          - oci_vault_secret_info_by_id.vault_secrets[0].name == oci_vault_secret_integration_secret_name
          - oci_vault_secret_info_by_id.vault_secrets[0].lifecycle_state == "ACTIVE"
          - oci_vault_secret_info_by_id.vault_secrets[0].current_version_number == 1
          - oci_vault_secret_info_by_id.vault_secrets[0].vault_id == oci_vault_id
          - oci_vault_secret_info_by_id.vault_secrets[0].key_id == oci_vault_secret_key_id
          - oci_vault_secret_info_by_id.vault_secrets[0].description == oci_vault_secret_integration_create_description
          - oci_vault_secret_info_by_id.vault_secrets[0].metadata == oci_vault_secret_integration_create_metadata
          - oci_vault_secret_info_by_id.vault_secrets[0].freeform_tags == oci_vault_secret_integration_create_tags
          - "'content' not in oci_vault_secret_info_by_id.vault_secrets[0]"
        fail_msg: Secret info by id must describe the created secret and omit content by default.

    - name: List secrets by name
      ansible.oci.oci_vault_secret_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        vault_id: "{{ oci_vault_id }}"
        name: "{{ oci_vault_secret_integration_secret_name }}"
        lifecycle_state: active
      register: oci_vault_secret_info_list

    - name: Assert secret info list returned the created secret
      ansible.builtin.assert:
        that:
          - oci_vault_secret_info_list.vault_secrets | length == 1
          - oci_vault_secret_info_list.vault_secrets[0].id == oci_vault_secret_id
          - oci_vault_secret_info_list.vault_secrets[0].name == oci_vault_secret_integration_secret_name
          - oci_vault_secret_info_list.vault_secrets[0].lifecycle_state == "ACTIVE"
        fail_msg: Secret info by name must return exactly the created secret.

    - name: Read secret with text content
      ansible.oci.oci_vault_secret_info:
        secret_id: "{{ oci_vault_secret_id }}"
        include_content: true
      no_log: true
      register: oci_vault_secret_info_content

    - name: Read secret with base64 content by name
      ansible.oci.oci_vault_secret_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        vault_id: "{{ oci_vault_id }}"
        name: "{{ oci_vault_secret_integration_secret_name }}"
        include_content: true
        content_encoding: base64
        content_stage: current
      no_log: true
      register: oci_vault_secret_info_content_base64

    - name: Assert secret info returned content in the requested encoding
      ansible.builtin.assert:
        that:
          - oci_vault_secret_info_content.vault_secrets[0].content == oci_vault_secret_integration_content_v1
          - oci_vault_secret_info_content_base64.vault_secrets | length == 1
          - oci_vault_secret_info_content_base64.vault_secrets[0].content == oci_vault_secret_integration_content_v1 | b64encode
        fail_msg: Secret info with include_content must return the stored content as text or base64.

    # ---------------------------------------------- secret attribute updates
    - name: Update secret description, metadata, and tags in check mode
      ansible.oci.oci_vault_secret: &oci_vault_secret_update_module_options
        state: present
        secret_id: "{{ oci_vault_secret_id }}"
        description: "{{ oci_vault_secret_integration_update_description }}"
        metadata: "{{ oci_vault_secret_integration_update_metadata }}"
        freeform_tags: "{{ oci_vault_secret_integration_update_tags }}"
      check_mode: true
      register: oci_vault_secret_update_check

    - name: Read secret after update check mode
      ansible.oci.oci_vault_secret_info:
        secret_id: "{{ oci_vault_secret_id }}"
      register: oci_vault_secret_update_check_probe

    - name: Assert update check mode reported a change without modifying the secret
      ansible.builtin.assert:
        that:
          - oci_vault_secret_update_check.changed | bool
          - oci_vault_secret_update_check_probe.vault_secrets[0].description == oci_vault_secret_integration_create_description
          - oci_vault_secret_update_check_probe.vault_secrets[0].metadata == oci_vault_secret_integration_create_metadata
          - oci_vault_secret_update_check_probe.vault_secrets[0].freeform_tags == oci_vault_secret_integration_create_tags
        fail_msg: Update check mode must report a change and leave description, metadata, and tags untouched.

    - name: Update secret description, metadata, and tags
      ansible.oci.oci_vault_secret:
        <<: *oci_vault_secret_update_module_options
      register: oci_vault_secret_update

    - name: Read secret after update
      ansible.oci.oci_vault_secret_info:
        secret_id: "{{ oci_vault_secret_id }}"
      register: oci_vault_secret_update_probe

    - name: Assert update changed the secret
      ansible.builtin.assert:
        that:
          - oci_vault_secret_update.changed | bool
          - oci_vault_secret_update.resource.id == oci_vault_secret_id
          - oci_vault_secret_update_probe.vault_secrets[0].description == oci_vault_secret_integration_update_description
          - oci_vault_secret_update_probe.vault_secrets[0].metadata == oci_vault_secret_integration_update_metadata
          - oci_vault_secret_update_probe.vault_secrets[0].freeform_tags == oci_vault_secret_integration_update_tags
          - oci_vault_secret_update_probe.vault_secrets[0].lifecycle_state == "ACTIVE"
          - oci_vault_secret_update_probe.vault_secrets[0].current_version_number == 1
        fail_msg: Update must apply description, metadata, and tags without writing a new version.

    - name: Rerun update
      ansible.oci.oci_vault_secret:
        <<: *oci_vault_secret_update_module_options
      register: oci_vault_secret_update_again

    - name: Rerun update in check mode
      ansible.oci.oci_vault_secret:
        <<: *oci_vault_secret_update_module_options
      check_mode: true
      register: oci_vault_secret_update_again_check

    - name: Assert update reruns are idempotent
      ansible.builtin.assert:
        that:
          - not oci_vault_secret_update_again.changed | bool
          - not oci_vault_secret_update_again_check.changed | bool
        fail_msg: Rerunning the same update must not change the secret.

    # ----------------------------------------------------------- secret rules
    - name: Update secret rules in check mode
      ansible.oci.oci_vault_secret: &oci_vault_secret_rules_module_options
        state: present
        secret_id: "{{ oci_vault_secret_id }}"
        secret_rules: "{{ oci_vault_secret_integration_secret_rules }}"
      check_mode: true
      register: oci_vault_secret_rules_check

    - name: Read secret after rules check mode
      ansible.oci.oci_vault_secret_info:
        secret_id: "{{ oci_vault_secret_id }}"
      register: oci_vault_secret_rules_check_probe

    - name: Assert rules check mode reported a change without adding rules
      ansible.builtin.assert:
        that:
          - oci_vault_secret_rules_check.changed | bool
          - oci_vault_secret_rules_check_probe.vault_secrets[0].secret_rules | default([], true) | length == 0
        fail_msg: Rules check mode must report a change and leave the secret without rules.

    - name: Update secret rules
      ansible.oci.oci_vault_secret:
        <<: *oci_vault_secret_rules_module_options
      register: oci_vault_secret_rules

    - name: Read secret after rules update
      ansible.oci.oci_vault_secret_info:
        secret_id: "{{ oci_vault_secret_id }}"
      register: oci_vault_secret_rules_probe

    - name: Assert rules were applied
      ansible.builtin.assert:
        that:
          - oci_vault_secret_rules.changed | bool
          - oci_vault_secret_rules_probe.vault_secrets[0].secret_rules | length == 2
          - >-
            oci_vault_secret_rules_probe.vault_secrets[0].secret_rules
            | map(attribute='rule_type') | sort | list
            == ['SECRET_EXPIRY_RULE', 'SECRET_REUSE_RULE']
          - >-
            (oci_vault_secret_rules_probe.vault_secrets[0].secret_rules
            | selectattr('rule_type', 'equalto', 'SECRET_EXPIRY_RULE')
            | map(attribute='secret_version_expiry_interval') | first) == "P30D"
          - oci_vault_secret_rules_probe.vault_secrets[0].current_version_number == 1
        fail_msg: Rules update must store the expiry and reuse rules without writing a new version.

    - name: Rerun rules update
      ansible.oci.oci_vault_secret:
        <<: *oci_vault_secret_rules_module_options
      register: oci_vault_secret_rules_again

    - name: Rerun rules update in check mode
      ansible.oci.oci_vault_secret:
        <<: *oci_vault_secret_rules_module_options
      check_mode: true
      register: oci_vault_secret_rules_again_check

    - name: Assert rules reruns are idempotent
      ansible.builtin.assert:
        that:
          - not oci_vault_secret_rules_again.changed | bool
          - not oci_vault_secret_rules_again_check.changed | bool
        fail_msg: Rerunning the same rules must not change the secret.

    # ---------------------------------------------------------- secret content
    # Versions 2 and 3 are written by content updates; version 3 is passed base64 encoded.
    - name: Write secret version 2
      ansible.builtin.include_tasks: content_update.yml
      vars:
        oci_vault_secret_step_content: "{{ oci_vault_secret_integration_content_v2 }}"
        oci_vault_secret_step_encoding: text
        oci_vault_secret_step_plain: "{{ oci_vault_secret_integration_content_v2 }}"
        oci_vault_secret_step_previous_plain: "{{ oci_vault_secret_integration_content_v1 }}"
        oci_vault_secret_step_name: "v2"
        oci_vault_secret_step_version: 2

    - name: Write secret version 3
      ansible.builtin.include_tasks: content_update.yml
      vars:
        oci_vault_secret_step_content: "{{ oci_vault_secret_integration_content_v3_base64 }}"
        oci_vault_secret_step_encoding: base64
        oci_vault_secret_step_plain: "{{ oci_vault_secret_integration_content_v3 }}"
        oci_vault_secret_step_previous_plain: "{{ oci_vault_secret_integration_content_v2 }}"
        oci_vault_secret_step_name: "v3"
        oci_vault_secret_step_version: 3

    - name: Rerun update with different content and update_content on_create in check mode
      ansible.oci.oci_vault_secret: &oci_vault_secret_on_create_module_options
        state: present
        secret_id: "{{ oci_vault_secret_id }}"
        content: "{{ oci_vault_secret_integration_content_ignored }}"
        update_content: on_create
      check_mode: true
      register: oci_vault_secret_on_create_check

    - name: Rerun update with different content and update_content on_create
      ansible.oci.oci_vault_secret:
        <<: *oci_vault_secret_on_create_module_options
      register: oci_vault_secret_on_create

    - name: Read secret and content after on_create reruns
      ansible.oci.oci_vault_secret_info:
        secret_id: "{{ oci_vault_secret_id }}"
        include_content: true
      no_log: true
      register: oci_vault_secret_on_create_probe

    - name: Assert update_content on_create left existing content alone
      ansible.builtin.assert:
        that:
          - not oci_vault_secret_on_create_check.changed | bool
          - not oci_vault_secret_on_create.changed | bool
          - oci_vault_secret_on_create_probe.vault_secrets[0].current_version_number == 3
          - oci_vault_secret_on_create_probe.vault_secrets[0].content == oci_vault_secret_integration_content_v3
        fail_msg: update_content on_create must never write content to an existing secret.

    # --------------------------------------------------------- secret versions
    - name: List secret versions
      ansible.oci.oci_vault_secret_version_info:
        secret_id: "{{ oci_vault_secret_id }}"
      register: oci_vault_secret_versions

    - name: Assert three versions exist with the expected stages
      ansible.builtin.assert:
        that:
          - oci_vault_secret_versions.secret_versions | length == 3
          - oci_vault_secret_versions.secret_versions | map(attribute='version_number') | sort | list == [1, 2, 3]
          - >-
            'CURRENT' in (oci_vault_secret_versions.secret_versions
            | selectattr('version_number', 'equalto', 3) | first).stages
          - >-
            'DEPRECATED' in (oci_vault_secret_versions.secret_versions
            | selectattr('version_number', 'equalto', 1) | first).stages
          - oci_vault_secret_versions.secret_versions | map(attribute='name') | sort | list == ['v1', 'v2', 'v3']
          - oci_vault_secret_versions.secret_versions | map(attribute='time_of_deletion', default=none) | select | list | length == 0
        fail_msg: Content updates must have produced versions 1 to 3, with version 1 deprecated and none scheduled for deletion.

    - name: Read secret version by number
      ansible.oci.oci_vault_secret_version_info:
        secret_id: "{{ oci_vault_secret_id }}"
        version_number: 2
      register: oci_vault_secret_version_by_number

    - name: Read secret version by name
      ansible.oci.oci_vault_secret_version_info:
        secret_id: "{{ oci_vault_secret_id }}"
        name: "v3"
      register: oci_vault_secret_version_by_name

    - name: Assert version info by number and by name
      ansible.builtin.assert:
        that:
          - oci_vault_secret_version_by_number.secret_versions | length == 1
          - oci_vault_secret_version_by_number.secret_versions[0].version_number == 2
          - oci_vault_secret_version_by_number.secret_versions[0].name == "v2"
          - oci_vault_secret_version_by_name.secret_versions | length == 1
          - oci_vault_secret_version_by_name.secret_versions[0].version_number == 3
        fail_msg: Version info must return one version when filtered by number or by name.

    - name: Read secret versions with text content
      ansible.oci.oci_vault_secret_version_info:
        secret_id: "{{ oci_vault_secret_id }}"
        include_content: true
      no_log: true
      register: oci_vault_secret_versions_content

    - name: Read secret version with base64 content
      ansible.oci.oci_vault_secret_version_info:
        secret_id: "{{ oci_vault_secret_id }}"
        version_number: 1
        include_content: true
        content_encoding: base64
      no_log: true
      register: oci_vault_secret_version_content_base64

    - name: Assert version info returned the content of each version
      ansible.builtin.assert:
        that:
          - >-
            (oci_vault_secret_versions_content.secret_versions
            | selectattr('version_number', 'equalto', 1) | first).content == oci_vault_secret_integration_content_v1
          - >-
            (oci_vault_secret_versions_content.secret_versions
            | selectattr('version_number', 'equalto', 2) | first).content == oci_vault_secret_integration_content_v2
          - >-
            (oci_vault_secret_versions_content.secret_versions
            | selectattr('version_number', 'equalto', 3) | first).content == oci_vault_secret_integration_content_v3
          - oci_vault_secret_version_content_base64.secret_versions[0].content == oci_vault_secret_integration_content_v1 | b64encode
        fail_msg: Version info with include_content must return each version's content in the requested encoding.

    # ----------------------------------------------- secret version deletion
    - name: Schedule deletion of deprecated version 1 in check mode
      ansible.oci.oci_vault_secret_version: &oci_vault_secret_version_delete_module_options
        state: absent
        secret_id: "{{ oci_vault_secret_id }}"
        version_number: 1
        deletion_days: "{{ oci_vault_secret_integration_deletion_days }}"
      check_mode: true
      register: oci_vault_secret_version_delete_check

    - name: Read version 1 after delete check mode
      ansible.oci.oci_vault_secret_version_info:
        secret_id: "{{ oci_vault_secret_id }}"
        version_number: 1
      register: oci_vault_secret_version_delete_check_probe

    - name: Assert delete check mode reported a change without scheduling deletion
      ansible.builtin.assert:
        that:
          - oci_vault_secret_version_delete_check.changed | bool
          - oci_vault_secret_version_delete_check_probe.secret_versions[0].time_of_deletion | default(none) is none
        fail_msg: Version delete check mode must report a change and leave version 1 unscheduled.

    - name: Schedule deletion of deprecated version 1
      ansible.oci.oci_vault_secret_version:
        <<: *oci_vault_secret_version_delete_module_options
      register: oci_vault_secret_version_delete

    - name: Read version 1 after delete
      ansible.oci.oci_vault_secret_version_info:
        secret_id: "{{ oci_vault_secret_id }}"
        version_number: 1
      register: oci_vault_secret_version_delete_probe

    - name: Read version 1 content while pending deletion
      ansible.oci.oci_vault_secret_version_info:
        secret_id: "{{ oci_vault_secret_id }}"
        version_number: 1
        include_content: true
      no_log: true
      register: oci_vault_secret_version_delete_content_probe

    - name: Assert version 1 is scheduled for deletion and its content is not returned
      ansible.builtin.assert:
        that:
          - oci_vault_secret_version_delete.changed | bool
          - oci_vault_secret_version_delete_probe.secret_versions | length == 1
          - oci_vault_secret_version_delete_probe.secret_versions[0].time_of_deletion | default(none) is not none
          - oci_vault_secret_version_delete_content_probe.secret_versions[0].content | default(none) is none
        fail_msg: Version 1 must have a deletion time and must not return content once deletion is scheduled.

    - name: Rerun version delete
      ansible.oci.oci_vault_secret_version:
        <<: *oci_vault_secret_version_delete_module_options
      register: oci_vault_secret_version_delete_again

    - name: Rerun version delete in check mode
      ansible.oci.oci_vault_secret_version:
        <<: *oci_vault_secret_version_delete_module_options
      check_mode: true
      register: oci_vault_secret_version_delete_again_check

    - name: Assert version delete reruns are idempotent
      ansible.builtin.assert:
        that:
          - not oci_vault_secret_version_delete_again.changed | bool
          - not oci_vault_secret_version_delete_again_check.changed | bool
        fail_msg: Rerunning the version delete must not change an already scheduled version.

    - name: Cancel deletion of version 1 in check mode
      ansible.oci.oci_vault_secret_version: &oci_vault_secret_version_restore_module_options
        state: present
        secret_id: "{{ oci_vault_secret_id }}"
        version_name: "v1"
      check_mode: true
      register: oci_vault_secret_version_restore_check

    - name: Read version 1 after restore check mode
      ansible.oci.oci_vault_secret_version_info:
        secret_id: "{{ oci_vault_secret_id }}"
        version_number: 1
      register: oci_vault_secret_version_restore_check_probe

    - name: Assert restore check mode reported a change and version 1 is still scheduled
      ansible.builtin.assert:
        that:
          - oci_vault_secret_version_restore_check.changed | bool
          - oci_vault_secret_version_restore_check_probe.secret_versions[0].time_of_deletion | default(none) is not none
        fail_msg: Version restore check mode must report a change and leave the deletion scheduled.

    - name: Cancel deletion of version 1
      ansible.oci.oci_vault_secret_version:
        <<: *oci_vault_secret_version_restore_module_options
      register: oci_vault_secret_version_restore

    - name: Read version 1 after restore
      ansible.oci.oci_vault_secret_version_info:
        secret_id: "{{ oci_vault_secret_id }}"
        version_number: 1
      register: oci_vault_secret_version_restore_probe

    - name: Assert version 1 deletion was cancelled
      ansible.builtin.assert:
        that:
          - oci_vault_secret_version_restore.changed | bool
          - oci_vault_secret_version_restore.resource.version_number == 1
          - oci_vault_secret_version_restore.resource.time_of_deletion | default(none) is none
          - oci_vault_secret_version_restore_probe.secret_versions[0].time_of_deletion | default(none) is none
        fail_msg: Version restore must clear the deletion time of version 1.

    - name: Rerun version restore
      ansible.oci.oci_vault_secret_version:
        <<: *oci_vault_secret_version_restore_module_options
      register: oci_vault_secret_version_restore_again

    - name: Rerun version restore in check mode
      ansible.oci.oci_vault_secret_version:
        <<: *oci_vault_secret_version_restore_module_options
      check_mode: true
      register: oci_vault_secret_version_restore_again_check

    - name: Assert version restore reruns are idempotent
      ansible.builtin.assert:
        that:
          - not oci_vault_secret_version_restore_again.changed | bool
          - not oci_vault_secret_version_restore_again_check.changed | bool
          - oci_vault_secret_version_restore_again.resource.version_number == 1
        fail_msg: Rerunning the version restore must not change a version that is not scheduled for deletion.

    - name: Schedule deletion of the current version 3 in check mode
      ansible.oci.oci_vault_secret_version: &oci_vault_secret_version_current_module_options
        state: absent
        secret_id: "{{ oci_vault_secret_id }}"
        version_number: 3
        deletion_days: "{{ oci_vault_secret_integration_deletion_days }}"
      check_mode: true
      ignore_errors: true
      register: oci_vault_secret_version_current_check

    - name: Schedule deletion of the current version 3
      ansible.oci.oci_vault_secret_version:
        <<: *oci_vault_secret_version_current_module_options
      ignore_errors: true
      register: oci_vault_secret_version_current

    - name: Read version 3 after rejected deletions
      ansible.oci.oci_vault_secret_version_info:
        secret_id: "{{ oci_vault_secret_id }}"
        version_number: 3
      register: oci_vault_secret_version_current_probe

    - name: Assert the current version cannot be scheduled for deletion
      ansible.builtin.assert:
        that:
          - oci_vault_secret_version_current_check is failed
          - oci_vault_secret_version_current is failed
          - oci_vault_secret_version_current_probe.secret_versions[0].time_of_deletion | default(none) is none
        fail_msg: Deleting a version that is not deprecated must fail in check mode and in normal mode.

    - name: Delete a version that does not exist
      ansible.oci.oci_vault_secret_version: &oci_vault_secret_version_missing_delete_module_options
        state: absent
        secret_id: "{{ oci_vault_secret_id }}"
        version_number: 99
      register: oci_vault_secret_version_missing_delete

    - name: Delete a version that does not exist in check mode
      ansible.oci.oci_vault_secret_version:
        <<: *oci_vault_secret_version_missing_delete_module_options
      check_mode: true
      register: oci_vault_secret_version_missing_delete_check

    - name: Require a version that does not exist
      ansible.oci.oci_vault_secret_version:
        state: present
        secret_id: "{{ oci_vault_secret_id }}"
        version_number: 99
      ignore_errors: true
      register: oci_vault_secret_version_missing_present

    - name: Assert missing versions are handled
      ansible.builtin.assert:
        that:
          - not oci_vault_secret_version_missing_delete.changed | bool
          - not oci_vault_secret_version_missing_delete_check.changed | bool
          - oci_vault_secret_version_missing_present is failed
        fail_msg: Deleting a missing version must be a no-op and requiring a missing version must fail.

    # -------------------------------------------- current version rollback
    - name: Roll back the current version in check mode
      ansible.oci.oci_vault_secret: &oci_vault_secret_rollback_module_options
        state: present
        secret_id: "{{ oci_vault_secret_id }}"
        current_version_number: 2
      check_mode: true
      register: oci_vault_secret_rollback_check

    - name: Read secret after rollback check mode
      ansible.oci.oci_vault_secret_info:
        secret_id: "{{ oci_vault_secret_id }}"
      register: oci_vault_secret_rollback_check_probe

    - name: Assert rollback check mode reported a change without changing the current version
      ansible.builtin.assert:
        that:
          - oci_vault_secret_rollback_check.changed | bool
          - oci_vault_secret_rollback_check_probe.vault_secrets[0].current_version_number == 3
        fail_msg: Rollback check mode must report a change and leave version 3 current.

    - name: Roll back the current version
      ansible.oci.oci_vault_secret:
        <<: *oci_vault_secret_rollback_module_options
      register: oci_vault_secret_rollback

    - name: Read secret and content after rollback
      ansible.oci.oci_vault_secret_info:
        secret_id: "{{ oci_vault_secret_id }}"
        include_content: true
      no_log: true
      register: oci_vault_secret_rollback_probe

    - name: Read version 2 after rollback
      ansible.oci.oci_vault_secret_version_info:
        secret_id: "{{ oci_vault_secret_id }}"
        version_number: 2
      register: oci_vault_secret_rollback_version_probe

    - name: Assert version 2 is current again
      ansible.builtin.assert:
        that:
          - oci_vault_secret_rollback.changed | bool
          - oci_vault_secret_rollback.resource.current_version_number == 2
          - oci_vault_secret_rollback_probe.vault_secrets[0].current_version_number == 2
          - oci_vault_secret_rollback_probe.vault_secrets[0].lifecycle_state == "ACTIVE"
          - oci_vault_secret_rollback_probe.vault_secrets[0].content == oci_vault_secret_integration_content_v2
          - "'CURRENT' in oci_vault_secret_rollback_version_probe.secret_versions[0].stages"
        fail_msg: Rollback must make version 2 and its content current.

    - name: Rerun rollback
      ansible.oci.oci_vault_secret:
        <<: *oci_vault_secret_rollback_module_options
      register: oci_vault_secret_rollback_again

    - name: Rerun rollback in check mode
      ansible.oci.oci_vault_secret:
        <<: *oci_vault_secret_rollback_module_options
      check_mode: true
      register: oci_vault_secret_rollback_again_check

    - name: Assert rollback reruns are idempotent
      ansible.builtin.assert:
        that:
          - not oci_vault_secret_rollback_again.changed | bool
          - not oci_vault_secret_rollback_again_check.changed | bool
        fail_msg: Rerunning the rollback must not change the secret.

    # ------------------------------------------------- generated passphrase
    - name: Create auto-generated secret in check mode
      ansible.oci.oci_vault_secret: &oci_vault_secret_generated_module_options
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        vault_id: "{{ oci_vault_id }}"
        key_id: "{{ oci_vault_secret_key_id }}"
        name: "{{ oci_vault_secret_integration_generated_secret_name }}"
        enable_auto_generation: true
        secret_generation_context: "{{ oci_vault_secret_integration_generation_context }}"
      check_mode: true
      register: oci_vault_secret_generated_check

    - name: Read secrets by generated name after create check mode
      ansible.oci.oci_vault_secret_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        vault_id: "{{ oci_vault_id }}"
        name: "{{ oci_vault_secret_integration_generated_secret_name }}"
      register: oci_vault_secret_generated_check_probe

    - name: Assert auto-generated create check mode reported a change without creating the secret
      ansible.builtin.assert:
        that:
          - oci_vault_secret_generated_check.changed | bool
          - oci_vault_secret_generated_check_probe.vault_secrets | length == 0
        fail_msg: Auto-generated create check mode must report a change and not create the secret.

    - name: Create auto-generated secret
      ansible.oci.oci_vault_secret:
        <<: *oci_vault_secret_generated_module_options
      register: oci_vault_secret_generated

    - name: Capture generated secret id
      ansible.builtin.set_fact:
        oci_vault_secret_generated_id: "{{ oci_vault_secret_generated.resource.id }}"

    - name: Read generated secret and content
      ansible.oci.oci_vault_secret_info:
        secret_id: "{{ oci_vault_secret_generated_id }}"
        include_content: true
      no_log: true
      register: oci_vault_secret_generated_probe

    - name: Assert the secret content was generated
      ansible.builtin.assert:
        that:
          - oci_vault_secret_generated.changed | bool
          - oci_vault_secret_generated.resource.lifecycle_state == "ACTIVE"
          - oci_vault_secret_generated.resource.name == oci_vault_secret_integration_generated_secret_name
          - oci_vault_secret_generated.resource.is_auto_generation_enabled | bool
          - "'content' not in oci_vault_secret_generated.resource"
          - oci_vault_secret_generated_probe.vault_secrets[0].current_version_number == 1
          - oci_vault_secret_generated_probe.vault_secrets[0].content | default('', true) | length > 0
        fail_msg: Auto-generated create must return an ACTIVE secret whose first version holds generated content.

    - name: Rerun auto-generated create
      ansible.oci.oci_vault_secret:
        <<: *oci_vault_secret_generated_module_options
      register: oci_vault_secret_generated_again

    - name: Rerun auto-generated create in check mode
      ansible.oci.oci_vault_secret:
        <<: *oci_vault_secret_generated_module_options
      check_mode: true
      register: oci_vault_secret_generated_again_check

    - name: Assert auto-generated create reruns are idempotent
      ansible.builtin.assert:
        that:
          - not oci_vault_secret_generated_again.changed | bool
          - not oci_vault_secret_generated_again_check.changed | bool
          - oci_vault_secret_generated_again.resource.id == oci_vault_secret_generated_id
        fail_msg: Rerunning the auto-generated create must not change the secret or generate another version.

    # --------------------------------------------------------- secret delete
    - name: Schedule secret deletion in check mode
      ansible.oci.oci_vault_secret: &oci_vault_secret_delete_module_options
        state: absent
        secret_id: "{{ oci_vault_secret_id }}"
        deletion_days: "{{ oci_vault_secret_integration_deletion_days }}"
      check_mode: true
      register: oci_vault_secret_delete_check

    - name: Read secret after delete check mode
      ansible.oci.oci_vault_secret_info:
        secret_id: "{{ oci_vault_secret_id }}"
      register: oci_vault_secret_delete_check_probe

    - name: Assert delete check mode reported a change without scheduling deletion
      ansible.builtin.assert:
        that:
          - oci_vault_secret_delete_check.changed | bool
          - oci_vault_secret_delete_check_probe.vault_secrets[0].lifecycle_state == "ACTIVE"
        fail_msg: Secret delete check mode must report a change and leave the secret ACTIVE.

    - name: Schedule secret deletion
      ansible.oci.oci_vault_secret:
        <<: *oci_vault_secret_delete_module_options
      register: oci_vault_secret_delete

    - name: Read secret after delete
      ansible.oci.oci_vault_secret_info:
        secret_id: "{{ oci_vault_secret_id }}"
      register: oci_vault_secret_delete_probe

    - name: Assert secret is pending deletion
      ansible.builtin.assert:
        that:
          - oci_vault_secret_delete.changed | bool
          - oci_vault_secret_delete_probe.vault_secrets | length == 1
          - oci_vault_secret_delete_probe.vault_secrets[0].lifecycle_state == "PENDING_DELETION"
          - oci_vault_secret_delete_probe.vault_secrets[0].time_of_deletion | default(none) is not none
        fail_msg: Secret delete must leave the secret PENDING_DELETION with a deletion time.

    - name: Rerun secret delete
      ansible.oci.oci_vault_secret:
        <<: *oci_vault_secret_delete_module_options
      register: oci_vault_secret_delete_again

    - name: Rerun secret delete in check mode
      ansible.oci.oci_vault_secret:
        <<: *oci_vault_secret_delete_module_options
      check_mode: true
      register: oci_vault_secret_delete_again_check

    - name: Assert secret delete reruns are idempotent
      ansible.builtin.assert:
        that:
          - not oci_vault_secret_delete_again.changed | bool
          - not oci_vault_secret_delete_again_check.changed | bool
        fail_msg: Rerunning the delete must not change a secret that is already pending deletion.

    # -------------------------------------------------------- secret restore
    - name: Cancel secret deletion in check mode
      ansible.oci.oci_vault_secret: &oci_vault_secret_restore_module_options
        state: present
        secret_id: "{{ oci_vault_secret_id }}"
      check_mode: true
      register: oci_vault_secret_restore_check

    - name: Read secret after restore check mode
      ansible.oci.oci_vault_secret_info:
        secret_id: "{{ oci_vault_secret_id }}"
      register: oci_vault_secret_restore_check_probe

    - name: Assert restore check mode reported a change and the secret is still pending deletion
      ansible.builtin.assert:
        that:
          - oci_vault_secret_restore_check.changed | bool
          - oci_vault_secret_restore_check_probe.vault_secrets[0].lifecycle_state == "PENDING_DELETION"
        fail_msg: Secret restore check mode must report a change and leave the secret PENDING_DELETION.

    - name: Cancel secret deletion
      ansible.oci.oci_vault_secret:
        <<: *oci_vault_secret_restore_module_options
      register: oci_vault_secret_restore

    - name: Read secret after restore
      ansible.oci.oci_vault_secret_info:
        secret_id: "{{ oci_vault_secret_id }}"
      register: oci_vault_secret_restore_probe

    - name: Assert secret is active again
      ansible.builtin.assert:
        that:
          - oci_vault_secret_restore.changed | bool
          - oci_vault_secret_restore.resource.lifecycle_state == "ACTIVE"
          - oci_vault_secret_restore_probe.vault_secrets[0].lifecycle_state == "ACTIVE"
          - oci_vault_secret_restore_probe.vault_secrets[0].current_version_number == 2
        fail_msg: Secret restore must return the secret to ACTIVE with its current version intact.

    - name: Rerun secret restore
      ansible.oci.oci_vault_secret:
        <<: *oci_vault_secret_restore_module_options
      register: oci_vault_secret_restore_again

    - name: Rerun secret restore in check mode
      ansible.oci.oci_vault_secret:
        <<: *oci_vault_secret_restore_module_options
      check_mode: true
      register: oci_vault_secret_restore_again_check

    - name: Assert secret restore reruns are idempotent
      ansible.builtin.assert:
        that:
          - not oci_vault_secret_restore_again.changed | bool
          - not oci_vault_secret_restore_again_check.changed | bool
        fail_msg: Rerunning the restore must not change an ACTIVE secret.

  always:
    - name: Run vault secret cleanup
      ansible.builtin.include_tasks: cleanup.yml
