---
- name: Initialize deletion test status
  ansible.builtin.set_fact:
    oci_cleanup_checks_failed: false

- name: Detach leaked volume attachment during cleanup
  ansible.oci.oci_volume_attachment:
    state: absent
    volume_attachment_id: '{{ oci_volume_attachment_id }}'
  when:
    - oci_volume_attachment_id is defined
    - oci_volume_attachment_id | default('') | length > 0
  register: oci_cleanup_detach_leaked_volume_attachment_during_cleanup
  retries: 3
  ignore_errors: true

- name: Delete leaked block volume during cleanup
  ansible.oci.oci_blockstorage_volume:
    state: absent
    volume_id: '{{ oci_volume_attachment_volume_id }}'
  when:
    - oci_volume_attachment_volume_id is defined
    - oci_volume_attachment_volume_id | default('') | length > 0
  register: oci_cleanup_delete_leaked_block_volume_during_cleanup
  retries: 3
  ignore_errors: true

- name: Delete leaked duplicate boot volume backup during cleanup
  ansible.oci.oci_boot_volume_backup:
    state: absent
    boot_volume_backup_id: '{{ oci_boot_volume_backup_duplicate_id }}'
  when:
    - oci_boot_volume_backup_duplicate_id is defined
    - oci_boot_volume_backup_duplicate_id | default('') | length > 0
  register: oci_cleanup_delete_leaked_duplicate_boot_volume_backup_during_cleanup
  retries: 3
  ignore_errors: true

- name: Verify oci_boot_volume_backup deletion
  when: oci_tests_completed | bool
  block:

    - name: Exercise boot volume backup module lifecycle
      module_defaults:
        group/ansible.oci.oci:
          config_file_location: '{{ oci_integration_config_file_location }}'
          config_profile_name: '{{ oci_integration_config_profile_name }}'
      block:

        - name: Delete boot volume backup in check mode
          ansible.oci.oci_boot_volume_backup: &oci_boot_volume_backup_delete_module_options
            state: absent
            boot_volume_backup_id: '{{ oci_boot_volume_backup_id }}'
          check_mode: true
          register: oci_cleanup_delete_boot_volume_backup_in_check_mode

        - name: Assert delete check mode reported a change
          ansible.builtin.assert:
            that:
              - oci_cleanup_delete_boot_volume_backup_in_check_mode.changed | bool

        - name: Read boot volume backup after delete check mode
          ansible.oci.oci_boot_volume_backup_info:
            boot_volume_backup_id: '{{ oci_boot_volume_backup_id }}'
          register: oci_cleanup_read_boot_volume_backup_after_delete_check_mode

        - name: Assert boot volume backup still exists after delete check mode
          ansible.builtin.assert:
            that:
              - oci_cleanup_read_boot_volume_backup_after_delete_check_mode.boot_volume_backups | length == 1

        - name: Delete boot volume backup
          ansible.oci.oci_boot_volume_backup:
            <<: *oci_boot_volume_backup_delete_module_options
          register: oci_cleanup_delete_boot_volume_backup

        - name: Assert delete reported a change
          ansible.builtin.assert:
            that:
              - oci_cleanup_delete_boot_volume_backup.changed | bool

        - name: Read boot volume backup after delete
          ansible.oci.oci_boot_volume_backup_info:
            boot_volume_backup_id: '{{ oci_boot_volume_backup_id }}'
          register: oci_cleanup_read_boot_volume_backup_after_delete

        - name: Assert boot volume backup is terminated after delete
          ansible.builtin.assert:
            that:
              - oci_cleanup_read_boot_volume_backup_after_delete.boot_volume_backups | length == 1
              - oci_cleanup_read_boot_volume_backup_after_delete.boot_volume_backups[0].id == oci_boot_volume_backup_id
              - oci_cleanup_read_boot_volume_backup_after_delete.boot_volume_backups[0].lifecycle_state == "TERMINATED"

        - name: List available boot volume backups by name after delete
          ansible.oci.oci_boot_volume_backup_info:
            compartment_id: '{{ oci_integration_compartment_id }}'
            name: '{{ oci_boot_volume_backup_integration_updated_backup_name }}'
            lifecycle_state: AVAILABLE
          register: oci_cleanup_list_available_boot_volume_backups_by_name_after_delete

        - name: Assert no available boot volume backup remains after delete
          ansible.builtin.assert:
            that:
              - oci_cleanup_list_available_boot_volume_backups_by_name_after_delete.boot_volume_backups | length
                == 0

        - name: Assert delete is a no-op in check mode
          ansible.oci.oci_boot_volume_backup:
            <<: *oci_boot_volume_backup_delete_module_options
          check_mode: true
          register: oci_cleanup_assert_delete_is_a_no_op_in_check_mode

        - name: Verify delete check-mode rerun is a no-op
          ansible.builtin.assert:
            that:
              - not oci_cleanup_assert_delete_is_a_no_op_in_check_mode.changed | bool

        - name: Assert delete is idempotent on rerun
          ansible.oci.oci_boot_volume_backup:
            <<: *oci_boot_volume_backup_delete_module_options
          register: oci_cleanup_assert_delete_is_idempotent_on_rerun

        - name: Verify delete rerun is a no-op
          ansible.builtin.assert:
            that:
              - not oci_cleanup_assert_delete_is_idempotent_on_rerun.changed | bool

        - name: Clear boot volume backup id after successful delete
          ansible.builtin.set_fact:
            oci_boot_volume_backup_id: ''
  rescue:

    - name: Record a deletion test failure
      ansible.builtin.set_fact:
        oci_cleanup_checks_failed: true

- name: Delete leaked boot volume backup during cleanup
  ansible.oci.oci_boot_volume_backup:
    state: absent
    boot_volume_backup_id: '{{ oci_boot_volume_backup_id }}'
  when:
    - oci_boot_volume_backup_id is defined
    - oci_boot_volume_backup_id | default('') | length > 0
  register: oci_cleanup_delete_leaked_boot_volume_backup_during_cleanup
  retries: 3
  ignore_errors: true

- name: Delete leaked restored boot volume during cleanup
  ansible.oci.oci_boot_volume:
    state: absent
    boot_volume_id: '{{ oci_boot_volume_id }}'
  when:
    - oci_boot_volume_id is defined
    - oci_boot_volume_id | default('') | length > 0
  register: oci_cleanup_delete_leaked_restored_boot_volume_during_cleanup
  retries: 3
  ignore_errors: true

- name: Delete leaked custom image during cleanup
  ansible.oci.oci_image:
    state: absent
    image_id: '{{ oci_image_id }}'
  when:
    - oci_image_id is defined
    - oci_image_id | default('') | length > 0
  register: oci_cleanup_delete_leaked_custom_image_during_cleanup
  retries: 3
  ignore_errors: true

- name: Delete leaked instance during cleanup
  ansible.oci.oci_instance:
    state: absent
    instance_id: '{{ oci_instance_id }}'
  when:
    - oci_instance_id is defined
    - oci_instance_id | default('') | length > 0
  register: oci_cleanup_delete_leaked_instance_during_cleanup
  retries: 3
  ignore_errors: true

- name: Delete leaked subnet during cleanup
  ansible.oci.oci_network_subnet:
    state: absent
    subnet_id: '{{ oci_instance_subnet_create.resource.id }}'
  when:
    - oci_instance_subnet_create is defined
    - oci_instance_subnet_create.resource.id | default('') | length > 0
  register: oci_cleanup_delete_leaked_subnet_during_cleanup
  retries: 3
  ignore_errors: true

- name: Delete leaked VCN during cleanup
  ansible.oci.oci_network_vcn:
    state: absent
    vcn_id: '{{ oci_instance_vcn_create.resource.id }}'
  when:
    - oci_instance_vcn_create is defined
    - oci_instance_vcn_create.resource.id | default('') | length > 0
  register: oci_cleanup_delete_leaked_vcn_during_cleanup
  retries: 3
  ignore_errors: true

- name: Delete prerequisite oci_instance_create
  ansible.oci.oci_instance:
    state: absent
    instance_id: '{{ oci_instance_create.resource.id }}'
  when:
    - oci_instance_create is defined
    - oci_instance_create.resource.id | default('') | length > 0
  register: oci_cleanup_delete_prerequisite_oci_instance_create
  retries: 3
  delay: 5
  until: oci_cleanup_delete_prerequisite_oci_instance_create is not failed
  ignore_errors: true

- name: Delete prerequisite oci_instance_subnet_create
  ansible.oci.oci_network_subnet:
    state: absent
    subnet_id: '{{ oci_instance_subnet_create.resource.id }}'
  when:
    - oci_instance_subnet_create is defined
    - oci_instance_subnet_create.resource.id | default('') | length > 0
  register: oci_cleanup_delete_prerequisite_oci_instance_subnet_create
  retries: 3
  delay: 5
  until: oci_cleanup_delete_prerequisite_oci_instance_subnet_create is not failed
  ignore_errors: true

- name: Delete prerequisite oci_instance_vcn_create
  ansible.oci.oci_network_vcn:
    state: absent
    vcn_id: '{{ oci_instance_vcn_create.resource.id }}'
  when:
    - oci_instance_vcn_create is defined
    - oci_instance_vcn_create.resource.id | default('') | length > 0
  register: oci_cleanup_delete_prerequisite_oci_instance_vcn_create
  retries: 3
  delay: 5
  until: oci_cleanup_delete_prerequisite_oci_instance_vcn_create is not failed
  ignore_errors: true

- name: Verify resource cleanup
  ansible.builtin.assert:
    that:
      - not oci_cleanup_checks_failed | bool
      - (oci_cleanup_detach_leaked_volume_attachment_during_cleanup | default({})) is not failed
      - (oci_cleanup_delete_leaked_block_volume_during_cleanup | default({})) is not failed
      - (oci_cleanup_delete_leaked_duplicate_boot_volume_backup_during_cleanup | default({})) is not failed
      - (oci_cleanup_delete_leaked_boot_volume_backup_during_cleanup | default({})) is not failed
      - (oci_cleanup_delete_leaked_restored_boot_volume_during_cleanup | default({})) is not failed
      - (oci_cleanup_delete_leaked_custom_image_during_cleanup | default({})) is not failed
      - (oci_cleanup_delete_leaked_instance_during_cleanup | default({})) is not failed
      - (oci_cleanup_delete_leaked_subnet_during_cleanup | default({})) is not failed
      - (oci_cleanup_delete_leaked_vcn_during_cleanup | default({})) is not failed
      - (oci_cleanup_delete_prerequisite_oci_instance_create | default({})) is not failed
      - (oci_cleanup_delete_prerequisite_oci_instance_subnet_create | default({})) is not failed
      - (oci_cleanup_delete_prerequisite_oci_instance_vcn_create | default({})) is not failed
    fail_msg: Resource cleanup or deletion checks failed. See the failed tasks above.
