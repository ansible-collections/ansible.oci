---
- name: Validate required OCI integration variables
  ansible.builtin.assert:
    that:
      - oci_integration_compartment_id | default('', true) | length > 0
    fail_msg: >-
      OCI boot volume backup integration tests require
      oci_integration_compartment_id to be defined in
      tests/integration/integration_config.yml.

- name: Compute unique resource names for this run
  ansible.builtin.set_fact:
    oci_boot_volume_backup_integration_vcn_name: "{{ oci_boot_volume_backup_integration_vcn_name }}-{{ oci_integration_rpfx }}"
    oci_boot_volume_backup_integration_subnet_name: "{{ oci_boot_volume_backup_integration_subnet_name }}-{{ oci_integration_rpfx }}"
    oci_boot_volume_backup_integration_instance_name: "{{ oci_boot_volume_backup_integration_instance_name }}-{{ oci_integration_rpfx }}"
    oci_boot_volume_backup_integration_backup_name: "{{ oci_boot_volume_backup_integration_backup_name }}-{{ oci_integration_rpfx }}"
    oci_boot_volume_backup_integration_updated_backup_name: "{{ oci_boot_volume_backup_integration_updated_backup_name }}-{{ oci_integration_rpfx }}"

- name: Exercise boot volume backup module lifecycle
  module_defaults:
    group/oracle.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    # Retention, prevent-deletion, indefinite-hold, and retention-lock are
    # supported by the module but are not exercised here. Those settings
    # produce backups that cannot be deleted until the period expires or the
    # hold is cleared, which would leak resources in the CI tenancy.
    - name: Discover an availability domain in the compartment
      oracle.oci.oci_availability_domain_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
      register: oci_boot_volume_backup_ad_info

    - name: Assert at least one availability domain was discovered
      ansible.builtin.assert:
        that:
          - oci_boot_volume_backup_ad_info.availability_domains | length > 0

    - name: Set the working availability domain
      ansible.builtin.set_fact:
        oci_boot_volume_backup_integration_availability_domain: "{{ oci_boot_volume_backup_ad_info.availability_domains[0].name }}"

    - name: Discover a compatible image
      oracle.oci.oci_image_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        operating_system: "{{ oci_boot_volume_backup_integration_operating_system }}"
        operating_system_version: "{{ oci_boot_volume_backup_integration_operating_system_version }}"
        shape: "{{ oci_boot_volume_backup_integration_shape }}"
      register: oci_boot_volume_backup_image_info

    - name: Assert a compatible image was discovered
      ansible.builtin.assert:
        that:
          - oci_boot_volume_backup_image_info.images | length > 0

    - name: Set the working image id
      ansible.builtin.set_fact:
        oci_boot_volume_backup_image_id: "{{ oci_boot_volume_backup_image_info.images[0].id }}"

    - name: Create test VCN for boot volume backup integration
      oracle.oci.oci_network_vcn:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_boot_volume_backup_integration_vcn_name }}"
        cidr_blocks:
          - "{{ oci_boot_volume_backup_integration_vcn_cidr_block }}"
      register: oci_boot_volume_backup_vcn_create

    - name: Create test subnet for boot volume backup integration
      oracle.oci.oci_subnet:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        vcn_id: "{{ oci_boot_volume_backup_vcn_create.resource.id }}"
        cidr_block: "{{ oci_boot_volume_backup_integration_subnet_cidr_block }}"
        name: "{{ oci_boot_volume_backup_integration_subnet_name }}"
      register: oci_boot_volume_backup_subnet_create

    - name: Create test compute instance for boot volume backup integration
      oracle.oci.oci_instance:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        availability_domain: "{{ oci_boot_volume_backup_integration_availability_domain }}"
        name: "{{ oci_boot_volume_backup_integration_instance_name }}"
        shape: "{{ oci_boot_volume_backup_integration_shape }}"
        shape_config: "{{ oci_boot_volume_backup_integration_shape_config }}"
        image_id: "{{ oci_boot_volume_backup_image_id }}"
        subnet_id: "{{ oci_boot_volume_backup_subnet_create.resource.id }}"
      register: oci_boot_volume_backup_instance_create

    - name: Capture created instance id
      ansible.builtin.set_fact:
        oci_boot_volume_backup_instance_id: "{{ oci_boot_volume_backup_instance_create.resource.id }}"

    - name: Look up the instance boot volume
      oracle.oci.oci_boot_volume_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        availability_domain: "{{ oci_boot_volume_backup_integration_availability_domain }}"
        name: "{{ oci_boot_volume_backup_integration_instance_name }} (Boot Volume)"
      register: oci_boot_volume_backup_boot_volume_info
      until: oci_boot_volume_backup_boot_volume_info.boot_volumes | length == 1
      retries: 30
      delay: 10

    - name: Capture the instance boot volume id
      ansible.builtin.set_fact:
        oci_boot_volume_backup_integration_boot_volume_id: "{{ oci_boot_volume_backup_boot_volume_info.boot_volumes[0].id }}"

    - name: Assert the instance boot volume was found
      ansible.builtin.assert:
        that:
          - oci_boot_volume_backup_integration_boot_volume_id | length > 0

    - name: Define boot volume backup create parameters
      ansible.builtin.set_fact:
        oci_boot_volume_backup_create_params:
          state: present
          compartment_id: "{{ oci_integration_compartment_id }}"
          name: "{{ oci_boot_volume_backup_integration_backup_name }}"
          boot_volume_id: "{{ oci_boot_volume_backup_integration_boot_volume_id }}"
          type: "{{ oci_boot_volume_backup_integration_backup_type }}"
          freeform_tags: "{{ oci_boot_volume_backup_integration_create_tags }}"

    - name: Create boot volume backup in check mode
      oracle.oci.oci_boot_volume_backup: &oci_boot_volume_backup_create_module_options
        state: "{{ oci_boot_volume_backup_create_params.state }}"
        compartment_id: "{{ oci_boot_volume_backup_create_params.compartment_id }}"
        name: "{{ oci_boot_volume_backup_create_params.name }}"
        boot_volume_id: "{{ oci_boot_volume_backup_create_params.boot_volume_id }}"
        type: "{{ oci_boot_volume_backup_create_params.type }}"
        freeform_tags: "{{ oci_boot_volume_backup_create_params.freeform_tags }}"
      check_mode: true
      register: oci_boot_volume_backup_create_check

    - name: Assert create check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_boot_volume_backup_create_check.changed | bool

    - name: Read boot volume backup after create check mode
      oracle.oci.oci_boot_volume_backup_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_boot_volume_backup_integration_backup_name }}"
      register: oci_boot_volume_backup_create_check_probe

    - name: Assert boot volume backup is still absent after create check mode
      ansible.builtin.assert:
        that:
          - oci_boot_volume_backup_create_check_probe.boot_volume_backups
            | selectattr('name', 'equalto', oci_boot_volume_backup_integration_backup_name)
            | list | length == 0

    - name: Create boot volume backup
      oracle.oci.oci_boot_volume_backup:
        <<: *oci_boot_volume_backup_create_module_options
      register: oci_boot_volume_backup_create

    - name: Capture boot volume backup id and define update parameters
      ansible.builtin.set_fact:
        oci_boot_volume_backup_id: "{{ oci_boot_volume_backup_create.resource.id }}"
        oci_boot_volume_backup_update_params:
          state: present
          boot_volume_backup_id: "{{ oci_boot_volume_backup_create.resource.id }}"
          name: "{{ oci_boot_volume_backup_integration_updated_backup_name }}"
          freeform_tags: "{{ oci_boot_volume_backup_integration_update_tags }}"

    - name: Assert create reported a change
      ansible.builtin.assert:
        that:
          - oci_boot_volume_backup_create.changed | bool
          - oci_boot_volume_backup_create.resource.lifecycle_state == "AVAILABLE"
          - oci_boot_volume_backup_create.resource.boot_volume_id == oci_boot_volume_backup_integration_boot_volume_id

    - name: Read boot volume backup by id
      oracle.oci.oci_boot_volume_backup_info:
        boot_volume_backup_id: "{{ oci_boot_volume_backup_id }}"
      register: oci_boot_volume_backup_info_by_id

    - name: Assert boot volume backup info by id returned the created backup
      ansible.builtin.assert:
        that:
          - oci_boot_volume_backup_info_by_id.boot_volume_backups | length == 1
          - oci_boot_volume_backup_info_by_id.boot_volume_backups[0].id == oci_boot_volume_backup_id
          - oci_boot_volume_backup_info_by_id.boot_volume_backups[0].name == oci_boot_volume_backup_integration_backup_name

    - name: List boot volume backups by source boot volume
      oracle.oci.oci_boot_volume_backup_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        boot_volume_id: "{{ oci_boot_volume_backup_integration_boot_volume_id }}"
      register: oci_boot_volume_backup_info_by_volume

    - name: Assert boot volume backup info by volume returned the created backup
      ansible.builtin.assert:
        that:
          - oci_boot_volume_backup_info_by_volume.boot_volume_backups
            | selectattr('id', 'equalto', oci_boot_volume_backup_id)
            | list | length == 1

    - name: Assert created backup is a no-op in check mode with unique name
      oracle.oci.oci_boot_volume_backup:
        <<: *oci_boot_volume_backup_create_module_options
      check_mode: true
      register: oci_boot_volume_backup_create_check_rerun_by_name

    - name: Verify backup check-mode rerun with unique name is a no-op
      ansible.builtin.assert:
        that:
          - not oci_boot_volume_backup_create_check_rerun_by_name.changed | bool

    - name: Assert created backup is a no-op on rerun with unique name
      oracle.oci.oci_boot_volume_backup:
        <<: *oci_boot_volume_backup_create_module_options
      register: oci_boot_volume_backup_create_rerun_by_name

    - name: Verify backup rerun with unique name is a no-op
      ansible.builtin.assert:
        that:
          - not oci_boot_volume_backup_create_rerun_by_name.changed | bool
          - oci_boot_volume_backup_create_rerun_by_name.resource.id == oci_boot_volume_backup_id

    - name: Intentionally create a second backup with the same display name
      oracle.oci.oci_boot_volume_backup:
        <<: *oci_boot_volume_backup_create_module_options
        allow_duplicate_name: true
      register: oci_boot_volume_backup_duplicate_create

    - name: Capture duplicate boot volume backup id
      ansible.builtin.set_fact:
        oci_boot_volume_backup_duplicate_id: "{{ oci_boot_volume_backup_duplicate_create.resource.id }}"

    - name: Assert duplicate backup create used a new resource
      ansible.builtin.assert:
        that:
          - oci_boot_volume_backup_duplicate_create.changed | bool
          - oci_boot_volume_backup_duplicate_id != oci_boot_volume_backup_id

    - name: Delete the duplicate boot volume backup
      oracle.oci.oci_boot_volume_backup:
        state: absent
        boot_volume_backup_id: "{{ oci_boot_volume_backup_duplicate_id }}"

    - name: Clear duplicate boot volume backup id after successful delete
      ansible.builtin.set_fact:
        oci_boot_volume_backup_duplicate_id: ""

    - name: Assert created backup is a no-op in check mode with returned id
      oracle.oci.oci_boot_volume_backup:
        <<: *oci_boot_volume_backup_create_module_options
        boot_volume_backup_id: "{{ oci_boot_volume_backup_id }}"
      check_mode: true
      register: oci_boot_volume_backup_create_check_rerun

    - name: Verify check-mode rerun with returned id is a no-op
      ansible.builtin.assert:
        that:
          - not oci_boot_volume_backup_create_check_rerun.changed | bool

    - name: Assert created backup is a no-op on rerun with returned id
      oracle.oci.oci_boot_volume_backup:
        <<: *oci_boot_volume_backup_create_module_options
        boot_volume_backup_id: "{{ oci_boot_volume_backup_id }}"
      register: oci_boot_volume_backup_create_rerun

    - name: Verify rerun with returned id is a no-op
      ansible.builtin.assert:
        that:
          - not oci_boot_volume_backup_create_rerun.changed | bool

    - name: Update boot volume backup in check mode
      oracle.oci.oci_boot_volume_backup: &oci_boot_volume_backup_update_module_options
        state: "{{ oci_boot_volume_backup_update_params.state }}"
        boot_volume_backup_id: "{{ oci_boot_volume_backup_update_params.boot_volume_backup_id }}"
        name: "{{ oci_boot_volume_backup_update_params.name }}"
        freeform_tags: "{{ oci_boot_volume_backup_update_params.freeform_tags }}"
      check_mode: true
      register: oci_boot_volume_backup_update_check

    - name: Assert update check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_boot_volume_backup_update_check.changed | bool

    - name: Read boot volume backup after update check mode
      oracle.oci.oci_boot_volume_backup_info:
        boot_volume_backup_id: "{{ oci_boot_volume_backup_id }}"
      register: oci_boot_volume_backup_update_check_probe

    - name: Assert update check mode did not mutate cloud state
      ansible.builtin.assert:
        that:
          - oci_boot_volume_backup_update_check_probe.boot_volume_backups[0].name == oci_boot_volume_backup_integration_backup_name
          - oci_boot_volume_backup_update_check_probe.boot_volume_backups[0].freeform_tags.phase == "create"

    - name: Update boot volume backup
      oracle.oci.oci_boot_volume_backup:
        <<: *oci_boot_volume_backup_update_module_options
      register: oci_boot_volume_backup_update

    - name: Assert update reported a change
      ansible.builtin.assert:
        that:
          - oci_boot_volume_backup_update.changed | bool

    - name: Read updated boot volume backup by name
      oracle.oci.oci_boot_volume_backup_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_boot_volume_backup_integration_updated_backup_name }}"
      register: oci_boot_volume_backup_info_updated

    - name: Assert boot volume backup info reflects the updated backup
      ansible.builtin.assert:
        that:
          - oci_boot_volume_backup_info_updated.boot_volume_backups
            | selectattr('id', 'equalto', oci_boot_volume_backup_id)
            | list | length == 1
          - oci_boot_volume_backup_info_updated.boot_volume_backups[0].freeform_tags.phase == "update"

    - name: Assert update is a no-op in check mode
      oracle.oci.oci_boot_volume_backup:
        <<: *oci_boot_volume_backup_update_module_options
      check_mode: true
      register: oci_boot_volume_backup_update_check_rerun

    - name: Verify update check-mode rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_boot_volume_backup_update_check_rerun.changed | bool

    - name: Assert update is idempotent on rerun
      oracle.oci.oci_boot_volume_backup:
        <<: *oci_boot_volume_backup_update_module_options
      register: oci_boot_volume_backup_update_rerun

    - name: Verify update rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_boot_volume_backup_update_rerun.changed | bool

    - name: Delete boot volume backup in check mode
      oracle.oci.oci_boot_volume_backup: &oci_boot_volume_backup_delete_module_options
        state: absent
        boot_volume_backup_id: "{{ oci_boot_volume_backup_id }}"
      check_mode: true
      register: oci_boot_volume_backup_delete_check

    - name: Assert delete check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_boot_volume_backup_delete_check.changed | bool

    - name: Read boot volume backup after delete check mode
      oracle.oci.oci_boot_volume_backup_info:
        boot_volume_backup_id: "{{ oci_boot_volume_backup_id }}"
      register: oci_boot_volume_backup_delete_check_probe

    - name: Assert boot volume backup still exists after delete check mode
      ansible.builtin.assert:
        that:
          - oci_boot_volume_backup_delete_check_probe.boot_volume_backups | length == 1

    - name: Delete boot volume backup
      oracle.oci.oci_boot_volume_backup:
        <<: *oci_boot_volume_backup_delete_module_options
      register: oci_boot_volume_backup_delete

    - name: Assert delete reported a change
      ansible.builtin.assert:
        that:
          - oci_boot_volume_backup_delete.changed | bool

    - name: Read boot volume backup after delete
      oracle.oci.oci_boot_volume_backup_info:
        boot_volume_backup_id: "{{ oci_boot_volume_backup_id }}"
      register: oci_boot_volume_backup_delete_probe

    - name: Assert boot volume backup is terminated after delete
      ansible.builtin.assert:
        that:
          - oci_boot_volume_backup_delete_probe.boot_volume_backups | length == 1
          - oci_boot_volume_backup_delete_probe.boot_volume_backups[0].id == oci_boot_volume_backup_id
          - oci_boot_volume_backup_delete_probe.boot_volume_backups[0].lifecycle_state == "TERMINATED"

    - name: List available boot volume backups by name after delete
      oracle.oci.oci_boot_volume_backup_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_boot_volume_backup_integration_updated_backup_name }}"
        lifecycle_state: AVAILABLE
      register: oci_boot_volume_backup_info_available_after_delete

    - name: Assert no available boot volume backup remains after delete
      ansible.builtin.assert:
        that:
          - oci_boot_volume_backup_info_available_after_delete.boot_volume_backups | length == 0

    - name: Assert delete is a no-op in check mode
      oracle.oci.oci_boot_volume_backup:
        <<: *oci_boot_volume_backup_delete_module_options
      check_mode: true
      register: oci_boot_volume_backup_delete_check_rerun

    - name: Verify delete check-mode rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_boot_volume_backup_delete_check_rerun.changed | bool

    - name: Assert delete is idempotent on rerun
      oracle.oci.oci_boot_volume_backup:
        <<: *oci_boot_volume_backup_delete_module_options
      register: oci_boot_volume_backup_delete_rerun

    - name: Verify delete rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_boot_volume_backup_delete_rerun.changed | bool

    - name: Clear boot volume backup id after successful delete
      ansible.builtin.set_fact:
        oci_boot_volume_backup_id: ""

  always:
    - name: Run boot volume backup cleanup
      ansible.builtin.include_tasks: cleanup.yml
