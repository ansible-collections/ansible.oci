---
# Clones are deleted before their source. oci_autonomous_database is used for
# cleanup because it manages any database regardless of clone source.
- name: Run autonomous database clone cleanup with shared OCI auth defaults
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Find leaked databases by unique name
      ansible.oci.oci_autonomous_database_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ item }}"
      loop:
        - "{{ oci_adb_clone_integration_metadata_name }}"
        - "{{ oci_adb_clone_integration_metadata_renamed }}"
        - "{{ oci_adb_clone_integration_refreshable_name }}"
        - "{{ oci_adb_clone_integration_source_name }}"
      register: oci_cleanup_adb_clone_lookup
      ignore_errors: true

    - name: Collect leaked clone and source ids
      vars:
        # One list of matches per looked-up name, in the loop order above.
        oci_cleanup_adb_clone_found: >-
          {{ oci_cleanup_adb_clone_lookup.results | default([]) | map(attribute='autonomous_databases', default=[]) | list }}
      ansible.builtin.set_fact:
        oci_cleanup_adb_clone_ids: >-
          {{ ([oci_adb_clone_metadata_id | default(''), oci_adb_clone_refreshable_id | default('')]
              + (oci_cleanup_adb_clone_found[:3] | flatten | map(attribute='id') | list))
             | select | unique | list }}
        oci_cleanup_adb_clone_source_ids: >-
          {{ ([oci_adb_clone_source_id | default('')]
              + (oci_cleanup_adb_clone_found[3:] | flatten | map(attribute='id') | list))
             | select | unique | list }}

    - name: Delete leaked clones during cleanup
      ansible.oci.oci_autonomous_database:
        state: absent
        autonomous_database_id: "{{ item }}"
        wait_timeout: "{{ oci_adb_clone_integration_wait_timeout }}"
      loop: "{{ oci_cleanup_adb_clone_ids }}"
      register: oci_cleanup_adb_clone_delete
      retries: 3
      ignore_errors: true

    - name: Delete leaked source database during cleanup
      ansible.oci.oci_autonomous_database:
        state: absent
        autonomous_database_id: "{{ item }}"
        wait_timeout: "{{ oci_adb_clone_integration_wait_timeout }}"
      loop: "{{ oci_cleanup_adb_clone_source_ids }}"
      register: oci_cleanup_adb_clone_source_delete
      retries: 3
      ignore_errors: true

    - name: Verify resource cleanup succeeded
      ansible.builtin.assert:
        that:
          - oci_cleanup_adb_clone_lookup is not failed
          - oci_cleanup_adb_clone_delete is not failed
          - oci_cleanup_adb_clone_source_delete is not failed
        fail_msg: Resource cleanup failed after 3 retries; see the failed cleanup task above.
