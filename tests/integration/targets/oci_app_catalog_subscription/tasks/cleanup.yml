---
- name: Delete the test subscription during cleanup
  ansible.oci.oci_app_catalog_subscription:
    state: absent
  when: oci_app_catalog_created_by_test | default(false)
  register: oci_app_catalog_cleanup
  retries: 3
  ignore_errors: true

- name: Verify subscription cleanup succeeded
  ansible.builtin.assert:
    that:
      - oci_app_catalog_cleanup is not failed
    fail_msg: Subscription cleanup failed after three retries. See the cleanup task result.

- name: Verify the subscription remains absent after cleanup
  ansible.builtin.include_tasks: verify_absent.yml
  when: oci_app_catalog_created_by_test | default(false)
