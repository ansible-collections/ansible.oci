---
- name: Check the subscription three times at 30-second intervals
  ansible.oci.oci_app_catalog_subscription:
    state: absent
  check_mode: true
  register: oci_app_catalog_absent_checks
  loop: [1, 2, 3]
  loop_control:
    pause: 30

- name: Assert the subscription remained absent
  ansible.builtin.assert:
    that:
      - oci_app_catalog_absent_checks.results | selectattr('changed') | list | length == 0
    fail_msg: >-
      OCI listed the subscription after deletion. Check the subscription in the test compartment.
