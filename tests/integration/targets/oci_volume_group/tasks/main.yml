---
- name: Validate required OCI integration variables
  ansible.builtin.assert:
    that:
      - oci_integration_compartment_id | default('', true) | length > 0
      - oci_volume_group_integration_availability_domain | default('', true) | length > 0
      - oci_volume_group_integration_volume_ids | default([], true) | length > 0
    fail_msg: >-
      OCI volume group integration tests require oci_integration_compartment_id,
      oci_volume_group_integration_availability_domain, and
      oci_volume_group_integration_volume_ids (OCIDs of one or more pre-existing
      block volumes in that availability domain) to be defined in
      tests/integration/integration_config.yml.

- name: Compute unique resource names for this run
  ansible.builtin.set_fact:
    oci_volume_group_integration_group_name: "{{ oci_volume_group_integration_group_name }}-{{ oci_integration_rpfx }}"
    oci_volume_group_integration_updated_group_name: "{{ oci_volume_group_integration_updated_group_name }}-{{ oci_integration_rpfx }}"

- name: Exercise volume group module lifecycle
  module_defaults:
    group/oracle.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Define volume group create parameters
      ansible.builtin.set_fact:
        oci_volume_group_create_params:
          state: present
          compartment_id: "{{ oci_integration_compartment_id }}"
          availability_domain: "{{ oci_volume_group_integration_availability_domain }}"
          name: "{{ oci_volume_group_integration_group_name }}"
          volume_ids: "{{ oci_volume_group_integration_volume_ids }}"
          freeform_tags: "{{ oci_volume_group_integration_create_tags }}"

    - name: Create volume group in check mode
      oracle.oci.oci_volume_group: &oci_volume_group_create_module_options
        state: "{{ oci_volume_group_create_params.state }}"
        compartment_id: "{{ oci_volume_group_create_params.compartment_id }}"
        availability_domain: "{{ oci_volume_group_create_params.availability_domain }}"
        name: "{{ oci_volume_group_create_params.name }}"
        volume_ids: "{{ oci_volume_group_create_params.volume_ids }}"
        freeform_tags: "{{ oci_volume_group_create_params.freeform_tags }}"
      check_mode: true
      register: oci_volume_group_create_check

    - name: Assert create check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_volume_group_create_check.changed | bool

    - name: Read volume group after create check mode
      oracle.oci.oci_volume_group_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_volume_group_integration_group_name }}"
      register: oci_volume_group_create_check_probe

    - name: Assert volume group is still absent after create check mode
      ansible.builtin.assert:
        that:
          - oci_volume_group_create_check_probe.volume_groups
            | selectattr('name', 'equalto', oci_volume_group_integration_group_name)
            | list | length == 0

    - name: Create volume group
      oracle.oci.oci_volume_group:
        <<: *oci_volume_group_create_module_options
      register: oci_volume_group_create

    - name: Capture volume group id and define update parameters
      ansible.builtin.set_fact:
        oci_volume_group_id: "{{ oci_volume_group_create.resource.id }}"
        oci_volume_group_update_params:
          state: present
          volume_group_id: "{{ oci_volume_group_create.resource.id }}"
          name: "{{ oci_volume_group_integration_updated_group_name }}"
          volume_ids: "{{ oci_volume_group_integration_volume_ids }}"
          freeform_tags: "{{ oci_volume_group_integration_update_tags }}"

    - name: Assert create reported a change
      ansible.builtin.assert:
        that:
          - oci_volume_group_create.changed | bool
          - oci_volume_group_create.resource.lifecycle_state == "AVAILABLE"

    - name: Read volume group by id
      oracle.oci.oci_volume_group_info:
        volume_group_id: "{{ oci_volume_group_id }}"
      register: oci_volume_group_info_by_id

    - name: Assert volume group info by id returned the created group
      ansible.builtin.assert:
        that:
          - oci_volume_group_info_by_id.volume_groups | length == 1
          - oci_volume_group_info_by_id.volume_groups[0].id == oci_volume_group_id
          - oci_volume_group_info_by_id.volume_groups[0].name == oci_volume_group_integration_group_name
          - oci_volume_group_info_by_id.volume_groups[0].volume_ids | sort
            == oci_volume_group_integration_volume_ids | sort

    - name: List volume group by name
      oracle.oci.oci_volume_group_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_volume_group_integration_group_name }}"
      register: oci_volume_group_info_list

    - name: Assert volume group info list returned the created group
      ansible.builtin.assert:
        that:
          - oci_volume_group_info_list.volume_groups
            | selectattr('id', 'equalto', oci_volume_group_id)
            | list | length == 1

    - name: Assert created volume group is a no-op on rerun with unique name
      oracle.oci.oci_volume_group:
        <<: *oci_volume_group_create_module_options
      register: oci_volume_group_create_rerun_by_name

    - name: Verify volume group rerun with unique name is a no-op
      ansible.builtin.assert:
        that:
          - not oci_volume_group_create_rerun_by_name.changed | bool

    - name: Assert created volume group is a no-op on rerun with returned id
      oracle.oci.oci_volume_group:
        <<: *oci_volume_group_create_module_options
        volume_group_id: "{{ oci_volume_group_id }}"
      register: oci_volume_group_create_rerun

    - name: Verify rerun with returned id is a no-op
      ansible.builtin.assert:
        that:
          - not oci_volume_group_create_rerun.changed | bool

    - name: Update volume group in check mode
      oracle.oci.oci_volume_group: &oci_volume_group_update_module_options
        state: "{{ oci_volume_group_update_params.state }}"
        volume_group_id: "{{ oci_volume_group_update_params.volume_group_id }}"
        name: "{{ oci_volume_group_update_params.name }}"
        volume_ids: "{{ oci_volume_group_update_params.volume_ids }}"
        freeform_tags: "{{ oci_volume_group_update_params.freeform_tags }}"
      check_mode: true
      register: oci_volume_group_update_check

    - name: Assert update check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_volume_group_update_check.changed | bool

    - name: Read volume group after update check mode
      oracle.oci.oci_volume_group_info:
        volume_group_id: "{{ oci_volume_group_id }}"
      register: oci_volume_group_update_check_probe

    - name: Assert update check mode did not mutate cloud state
      ansible.builtin.assert:
        that:
          - oci_volume_group_update_check_probe.volume_groups[0].name == oci_volume_group_integration_group_name
          - oci_volume_group_update_check_probe.volume_groups[0].freeform_tags.phase == "create"

    - name: Update volume group
      oracle.oci.oci_volume_group:
        <<: *oci_volume_group_update_module_options
      register: oci_volume_group_update

    - name: Assert update reported a change
      ansible.builtin.assert:
        that:
          - oci_volume_group_update.changed | bool

    - name: Read updated volume group by name
      oracle.oci.oci_volume_group_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_volume_group_integration_updated_group_name }}"
      register: oci_volume_group_info_updated

    - name: Assert volume group info reflects the updated group
      ansible.builtin.assert:
        that:
          - oci_volume_group_info_updated.volume_groups
            | selectattr('id', 'equalto', oci_volume_group_id)
            | list | length == 1
          - oci_volume_group_info_updated.volume_groups[0].freeform_tags.phase == "update"

    - name: Assert update is idempotent on rerun
      oracle.oci.oci_volume_group:
        <<: *oci_volume_group_update_module_options
      register: oci_volume_group_update_rerun

    - name: Verify update rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_volume_group_update_rerun.changed | bool

    - name: Delete volume group in check mode
      oracle.oci.oci_volume_group: &oci_volume_group_delete_module_options
        state: absent
        volume_group_id: "{{ oci_volume_group_id }}"
      check_mode: true
      register: oci_volume_group_delete_check

    - name: Assert delete check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_volume_group_delete_check.changed | bool

    - name: Read volume group after delete check mode
      oracle.oci.oci_volume_group_info:
        volume_group_id: "{{ oci_volume_group_id }}"
      register: oci_volume_group_delete_check_probe

    - name: Assert volume group still exists after delete check mode
      ansible.builtin.assert:
        that:
          - oci_volume_group_delete_check_probe.volume_groups | length == 1

    - name: Delete volume group
      oracle.oci.oci_volume_group:
        <<: *oci_volume_group_delete_module_options
      register: oci_volume_group_delete

    - name: Assert delete reported a change
      ansible.builtin.assert:
        that:
          - oci_volume_group_delete.changed | bool

    - name: Assert delete is idempotent on rerun
      oracle.oci.oci_volume_group:
        <<: *oci_volume_group_delete_module_options
      register: oci_volume_group_delete_rerun

    - name: Verify delete rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_volume_group_delete_rerun.changed | bool

    - name: Clear volume group id after successful delete
      ansible.builtin.set_fact:
        oci_volume_group_id: ""

  always:
    - name: Run volume group cleanup
      ansible.builtin.include_tasks: cleanup.yml
