---
- name: Initialize deletion test status
  ansible.builtin.set_fact:
    oci_cleanup_checks_failed: false

- name: Delete leaked service gateway during cleanup
  ansible.oci.oci_network_service_gateway:
    state: absent
    service_gateway_id: '{{ oci_service_gateway_id }}'
  when:
    - oci_service_gateway_id is defined
    - oci_service_gateway_id | default('') | length > 0
  register: oci_cleanup_delete_leaked_service_gateway_during_cleanup
  retries: 3
  ignore_errors: true

- name: Delete leaked NAT gateway during cleanup
  ansible.oci.oci_network_nat_gateway:
    state: absent
    nat_gateway_id: '{{ oci_nat_gateway_id }}'
  when:
    - oci_nat_gateway_id is defined
    - oci_nat_gateway_id | default('') | length > 0
  register: oci_cleanup_delete_leaked_nat_gateway_during_cleanup
  retries: 3
  ignore_errors: true

- name: Delete leaked duplicate route table during cleanup
  ansible.oci.oci_network_route_table:
    state: absent
    route_table_id: '{{ oci_route_table_duplicate_id }}'
  when:
    - oci_route_table_duplicate_id is defined
    - oci_route_table_duplicate_id | default('') | length > 0
  register: oci_cleanup_delete_leaked_duplicate_route_table_during_cleanup
  retries: 3
  ignore_errors: true

- name: Delete leaked route table during cleanup
  ansible.oci.oci_network_route_table:
    state: absent
    route_table_id: '{{ oci_route_table_id }}'
  when:
    - oci_route_table_id is defined
    - oci_route_table_id | default('') | length > 0
  register: oci_cleanup_delete_leaked_route_table_during_cleanup
  retries: 3
  ignore_errors: true

- name: Verify oci_network_internet_gateway deletion
  when: oci_tests_completed | bool
  block:

    - name: Exercise internet gateway module lifecycle
      module_defaults:
        group/ansible.oci.oci:
          config_file_location: '{{ oci_integration_config_file_location }}'
          config_profile_name: '{{ oci_integration_config_profile_name }}'
      block:

        - name: Delete internet gateway in check mode
          ansible.oci.oci_network_internet_gateway:
            state: '{{ oci_internet_gateway_delete_params.state }}'
            internet_gateway_id: '{{ oci_internet_gateway_delete_params.internet_gateway_id }}'
          check_mode: true
          register: oci_cleanup_delete_internet_gateway_in_check_mode

        - name: Assert delete check mode reported a change
          ansible.builtin.assert:
            that:
              - oci_cleanup_delete_internet_gateway_in_check_mode.changed | bool

        - name: Read internet gateway after delete check mode
          ansible.oci.oci_network_internet_gateway_info:
            internet_gateway_id: '{{ oci_internet_gateway_id }}'
          register: oci_cleanup_read_internet_gateway_after_delete_check_mode

        - name: Assert internet gateway still exists after delete check mode
          ansible.builtin.assert:
            that:
              - oci_cleanup_read_internet_gateway_after_delete_check_mode.internet_gateways | length == 1

        - name: Delete internet gateway
          ansible.oci.oci_network_internet_gateway:
            state: '{{ oci_internet_gateway_delete_params.state }}'
            internet_gateway_id: '{{ oci_internet_gateway_delete_params.internet_gateway_id }}'
          register: oci_cleanup_delete_internet_gateway

        - name: Assert delete reported a change
          ansible.builtin.assert:
            that:
              - oci_cleanup_delete_internet_gateway.changed | bool

        - name: Assert delete is idempotent on rerun
          ansible.oci.oci_network_internet_gateway:
            state: '{{ oci_internet_gateway_delete_params.state }}'
            internet_gateway_id: '{{ oci_internet_gateway_delete_params.internet_gateway_id }}'
          register: oci_cleanup_assert_delete_is_idempotent_on_rerun

        - name: Verify delete rerun is a no-op
          ansible.builtin.assert:
            that:
              - not oci_cleanup_assert_delete_is_idempotent_on_rerun.changed | bool
  rescue:

    - name: Record a deletion test failure
      ansible.builtin.set_fact:
        oci_cleanup_checks_failed: true

- name: Delete leaked internet gateway during cleanup
  ansible.oci.oci_network_internet_gateway:
    state: absent
    internet_gateway_id: '{{ oci_internet_gateway_id }}'
  when:
    - oci_internet_gateway_id is defined
    - oci_internet_gateway_id | default('') | length > 0
  register: oci_cleanup_delete_leaked_internet_gateway_during_cleanup
  retries: 3
  ignore_errors: true

- name: Delete prerequisite oci_network_vcn_create
  ansible.oci.oci_network_vcn:
    state: absent
    vcn_id: '{{ oci_network_vcn_create.resource.id }}'
  when:
    - oci_network_vcn_create is defined
    - oci_network_vcn_create.resource.id | default('') | length > 0
  register: oci_cleanup_delete_prerequisite_oci_network_vcn_create
  retries: 3
  delay: 5
  until: oci_cleanup_delete_prerequisite_oci_network_vcn_create is not failed
  ignore_errors: true

- name: Verify resource cleanup
  ansible.builtin.assert:
    that:
      - not oci_cleanup_checks_failed | bool
      - (oci_cleanup_delete_leaked_service_gateway_during_cleanup | default({})) is not failed
      - (oci_cleanup_delete_leaked_nat_gateway_during_cleanup | default({})) is not failed
      - (oci_cleanup_delete_leaked_duplicate_route_table_during_cleanup | default({})) is not failed
      - (oci_cleanup_delete_leaked_route_table_during_cleanup | default({})) is not failed
      - (oci_cleanup_delete_leaked_internet_gateway_during_cleanup | default({})) is not failed
      - (oci_cleanup_delete_prerequisite_oci_network_vcn_create | default({})) is not failed
    fail_msg: Resource cleanup or deletion checks failed. See the failed tasks above.
