---
- name: Initialize resource identifiers
  ansible.builtin.set_fact:
    oci_network_vcn_create: {}
    oci_tests_completed: false

- name: Test oci_network_internet_gateway
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: '{{ oci_integration_config_file_location }}'
      config_profile_name: '{{ oci_integration_config_profile_name }}'
  block:

    - name: Create prerequisites
      ansible.builtin.include_tasks: prerequisites.yml

    - name: Run oci_network_internet_gateway tests
      ansible.builtin.include_tasks: oci_network_internet_gateway.yml
      vars:
        oci_shared_vcn: '{{ oci_network_vcn_create }}'

    - name: Run oci_network_route_table tests
      ansible.builtin.include_tasks: oci_network_route_table.yml
      vars:
        oci_shared_vcn: '{{ oci_network_vcn_create }}'

    - name: Test oci_network_nat_gateway
      ansible.builtin.include_tasks: oci_network_nat_gateway.yml
      vars:
        oci_shared_vcn: '{{ oci_network_vcn_create }}'

    - name: Test oci_network_service_gateway
      ansible.builtin.include_tasks: oci_network_service_gateway.yml
      vars:
        oci_shared_vcn: '{{ oci_network_vcn_create }}'

    - name: Mark tests as complete
      ansible.builtin.set_fact:
        oci_tests_completed: true
  always:

    - name: Clean up all test resources
      ansible.builtin.include_tasks: cleanup.yml
  vars:
    oci_shared_vcn: '{{ oci_network_vcn_create }}'
