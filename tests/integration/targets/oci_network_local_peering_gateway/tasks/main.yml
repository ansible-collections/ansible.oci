---
- name: Validate required OCI integration variables
  ansible.builtin.assert:
    that:
      - oci_integration_compartment_id | default('', true) | length > 0
    fail_msg: >-
      OCI local peering gateway integration tests require
      oci_integration_compartment_id to be defined in
      tests/integration/integration_config.yml.

- name: Compute unique resource names for this run
  ansible.builtin.set_fact:
    oci_lpg_integration_vcn_name: "{{ oci_lpg_integration_vcn_name }}-{{ oci_integration_rpfx }}"
    oci_lpg_integration_peer_vcn_name: "{{ oci_lpg_integration_peer_vcn_name }}-{{ oci_integration_rpfx }}"
    oci_lpg_integration_lpg_name: "{{ oci_lpg_integration_lpg_name }}-{{ oci_integration_rpfx }}"
    oci_lpg_integration_updated_lpg_name: "{{ oci_lpg_integration_updated_lpg_name }}-{{ oci_integration_rpfx }}"
    oci_lpg_integration_peer_lpg_name: "{{ oci_lpg_integration_peer_lpg_name }}-{{ oci_integration_rpfx }}"
    oci_lpg_integration_vcn_dns_label: "lpgv{{ oci_integration_rpfx }}"
    oci_lpg_integration_peer_vcn_dns_label: "lpgp{{ oci_integration_rpfx }}"

- name: Exercise local peering gateway module lifecycle
  module_defaults:
    group/oracle.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Create test VCN for the local peering gateway
      oracle.oci.oci_network_vcn:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_lpg_integration_vcn_name }}"
        cidr_blocks:
          - "{{ oci_lpg_integration_vcn_cidr_block }}"
        dns_label: "{{ oci_lpg_integration_vcn_dns_label }}"
      register: oci_lpg_vcn_create

    - name: Create a second test VCN to peer with
      oracle.oci.oci_network_vcn:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_lpg_integration_peer_vcn_name }}"
        cidr_blocks:
          - "{{ oci_lpg_integration_peer_vcn_cidr_block }}"
        dns_label: "{{ oci_lpg_integration_peer_vcn_dns_label }}"
      register: oci_lpg_peer_vcn_create

    - name: Define local peering gateway create parameters
      ansible.builtin.set_fact:
        oci_lpg_create_params:
          state: present
          compartment_id: "{{ oci_integration_compartment_id }}"
          vcn_id: "{{ oci_lpg_vcn_create.resource.id }}"
          name: "{{ oci_lpg_integration_lpg_name }}"
          freeform_tags: "{{ oci_lpg_integration_create_tags }}"

    - name: Create local peering gateway in check mode
      oracle.oci.oci_network_local_peering_gateway: &oci_lpg_create_module_options
        state: "{{ oci_lpg_create_params.state }}"
        compartment_id: "{{ oci_lpg_create_params.compartment_id }}"
        vcn_id: "{{ oci_lpg_create_params.vcn_id }}"
        name: "{{ oci_lpg_create_params.name }}"
        freeform_tags: "{{ oci_lpg_create_params.freeform_tags }}"
      check_mode: true
      register: oci_lpg_create_check

    - name: Assert create check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_lpg_create_check.changed | bool

    - name: Read local peering gateway after create check mode
      oracle.oci.oci_network_local_peering_gateway_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        vcn_id: "{{ oci_lpg_create_params.vcn_id }}"
        name: "{{ oci_lpg_integration_lpg_name }}"
      register: oci_lpg_create_check_probe

    - name: Assert local peering gateway is still absent after create check mode
      ansible.builtin.assert:
        that:
          - oci_lpg_create_check_probe.local_peering_gateways | length == 0

    - name: Create local peering gateway
      oracle.oci.oci_network_local_peering_gateway:
        <<: *oci_lpg_create_module_options
      register: oci_lpg_create

    - name: Create the peer local peering gateway on the second VCN
      oracle.oci.oci_network_local_peering_gateway:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        vcn_id: "{{ oci_lpg_peer_vcn_create.resource.id }}"
        name: "{{ oci_lpg_integration_peer_lpg_name }}"
      register: oci_lpg_peer_create

    - name: Capture local peering gateway id and define update parameters
      ansible.builtin.set_fact:
        oci_lpg_id: "{{ oci_lpg_create.resource.id }}"
        oci_lpg_update_params:
          state: present
          local_peering_gateway_id: "{{ oci_lpg_create.resource.id }}"
          name: "{{ oci_lpg_integration_updated_lpg_name }}"
          freeform_tags: "{{ oci_lpg_integration_update_tags }}"
        oci_lpg_delete_params:
          state: absent
          local_peering_gateway_id: "{{ oci_lpg_create.resource.id }}"

    - name: Assert create reported a change
      ansible.builtin.assert:
        that:
          - oci_lpg_create.changed | bool

    - name: Read local peering gateway by id
      oracle.oci.oci_network_local_peering_gateway_info:
        local_peering_gateway_id: "{{ oci_lpg_id }}"
      register: oci_lpg_info_by_id

    - name: Assert local peering gateway info by id returned the created gateway
      ansible.builtin.assert:
        that:
          - oci_lpg_info_by_id.local_peering_gateways | length == 1
          - oci_lpg_info_by_id.local_peering_gateways[0].id == oci_lpg_id
          - oci_lpg_info_by_id.local_peering_gateways[0].name == oci_lpg_integration_lpg_name
          - oci_lpg_info_by_id.local_peering_gateways[0].lifecycle_state == "AVAILABLE"

    - name: Assert created local peering gateway is a no-op on rerun with unique name
      oracle.oci.oci_network_local_peering_gateway:
        <<: *oci_lpg_create_module_options
      register: oci_lpg_create_rerun_by_name

    - name: Verify local peering gateway rerun with unique name is a no-op
      ansible.builtin.assert:
        that:
          - not oci_lpg_create_rerun_by_name.changed | bool
          - oci_lpg_create_rerun_by_name.resource.id == oci_lpg_id

    - name: Intentionally create a second local peering gateway with the same display name
      oracle.oci.oci_network_local_peering_gateway:
        <<: *oci_lpg_create_module_options
        allow_duplicate_name: true
      register: oci_lpg_duplicate_create

    - name: Capture duplicate local peering gateway id
      ansible.builtin.set_fact:
        oci_lpg_duplicate_id: "{{ oci_lpg_duplicate_create.resource.id }}"

    - name: Assert duplicate local peering gateway create used a new resource
      ansible.builtin.assert:
        that:
          - oci_lpg_duplicate_create.changed | bool
          - oci_lpg_duplicate_id != oci_lpg_id

    - name: Delete the duplicate local peering gateway
      oracle.oci.oci_network_local_peering_gateway:
        state: absent
        local_peering_gateway_id: "{{ oci_lpg_duplicate_id }}"

    - name: Clear duplicate local peering gateway id after successful delete
      ansible.builtin.set_fact:
        oci_lpg_duplicate_id: ""

    - name: Peer the two local peering gateways
      oracle.oci.oci_network_local_peering_gateway:
        state: present
        local_peering_gateway_id: "{{ oci_lpg_id }}"
        peer_id: "{{ oci_lpg_peer_create.resource.id }}"
      register: oci_lpg_peer_connect

    - name: Assert peering reported a change
      ansible.builtin.assert:
        that:
          - oci_lpg_peer_connect.changed | bool

    - name: Read local peering gateway after peering
      oracle.oci.oci_network_local_peering_gateway_info:
        local_peering_gateway_id: "{{ oci_lpg_id }}"
      register: oci_lpg_info_after_peering

    - name: Assert local peering gateway info reflects the peering
      ansible.builtin.assert:
        that:
          - oci_lpg_info_after_peering.local_peering_gateways[0].peer_id == oci_lpg_peer_create.resource.id

    - name: Assert peering is idempotent on rerun
      oracle.oci.oci_network_local_peering_gateway:
        state: present
        local_peering_gateway_id: "{{ oci_lpg_id }}"
        peer_id: "{{ oci_lpg_peer_create.resource.id }}"
      register: oci_lpg_peer_connect_rerun

    - name: Verify peering rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_lpg_peer_connect_rerun.changed | bool

    - name: Update local peering gateway name and tags in check mode
      oracle.oci.oci_network_local_peering_gateway: &oci_lpg_update_module_options
        state: "{{ oci_lpg_update_params.state }}"
        local_peering_gateway_id: "{{ oci_lpg_update_params.local_peering_gateway_id }}"
        name: "{{ oci_lpg_update_params.name }}"
        freeform_tags: "{{ oci_lpg_update_params.freeform_tags }}"
      check_mode: true
      register: oci_lpg_update_check

    - name: Assert update check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_lpg_update_check.changed | bool

    - name: Update local peering gateway name and tags
      oracle.oci.oci_network_local_peering_gateway:
        <<: *oci_lpg_update_module_options
      register: oci_lpg_update

    - name: Assert update reported a change
      ansible.builtin.assert:
        that:
          - oci_lpg_update.changed | bool

    - name: Read updated local peering gateway by id
      oracle.oci.oci_network_local_peering_gateway_info:
        local_peering_gateway_id: "{{ oci_lpg_id }}"
      register: oci_lpg_info_updated

    - name: Assert local peering gateway info reflects the update
      ansible.builtin.assert:
        that:
          - oci_lpg_info_updated.local_peering_gateways[0].name == oci_lpg_integration_updated_lpg_name
          - oci_lpg_info_updated.local_peering_gateways[0].freeform_tags.phase == "update"
          - oci_lpg_info_updated.local_peering_gateways[0].peer_id == oci_lpg_peer_create.resource.id

    - name: Assert update is idempotent on rerun
      oracle.oci.oci_network_local_peering_gateway:
        <<: *oci_lpg_update_module_options
      register: oci_lpg_update_rerun

    - name: Verify update rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_lpg_update_rerun.changed | bool

    - name: Delete local peering gateway in check mode
      oracle.oci.oci_network_local_peering_gateway: &oci_lpg_delete_module_options
        state: "{{ oci_lpg_delete_params.state }}"
        local_peering_gateway_id: "{{ oci_lpg_delete_params.local_peering_gateway_id }}"
      check_mode: true
      register: oci_lpg_delete_check

    - name: Assert delete check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_lpg_delete_check.changed | bool

    - name: Delete local peering gateway
      oracle.oci.oci_network_local_peering_gateway:
        <<: *oci_lpg_delete_module_options
      register: oci_lpg_delete

    - name: Assert delete reported a change
      ansible.builtin.assert:
        that:
          - oci_lpg_delete.changed | bool

    - name: Assert delete is idempotent on rerun
      oracle.oci.oci_network_local_peering_gateway:
        <<: *oci_lpg_delete_module_options
      register: oci_lpg_delete_rerun

    - name: Verify delete rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_lpg_delete_rerun.changed | bool

    - name: Delete the peer local peering gateway
      oracle.oci.oci_network_local_peering_gateway:
        state: absent
        local_peering_gateway_id: "{{ oci_lpg_peer_create.resource.id }}"

  always:
    - name: Run local peering gateway cleanup
      ansible.builtin.include_tasks: cleanup.yml
