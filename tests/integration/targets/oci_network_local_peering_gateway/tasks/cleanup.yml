---
- name: Initialize deletion test status
  ansible.builtin.set_fact:
    oci_cleanup_checks_failed: false

- name: Delete leaked duplicate local peering gateway during cleanup
  ansible.oci.oci_network_local_peering_gateway:
    state: absent
    local_peering_gateway_id: '{{ oci_lpg_duplicate_id }}'
  when:
    - oci_lpg_duplicate_id is defined
    - oci_lpg_duplicate_id | default('') | length > 0
  register: oci_cleanup_delete_leaked_duplicate_local_peering_gateway_during_cleanup
  retries: 3
  ignore_errors: true

- name: Delete leaked local peering gateway during cleanup
  ansible.oci.oci_network_local_peering_gateway:
    state: absent
    local_peering_gateway_id: '{{ oci_lpg_id }}'
  when:
    - oci_lpg_id is defined
    - oci_lpg_id | default('') | length > 0
  register: oci_cleanup_delete_leaked_local_peering_gateway_during_cleanup
  retries: 3
  ignore_errors: true

- name: Delete leaked peer local peering gateway during cleanup
  ansible.oci.oci_network_local_peering_gateway:
    state: absent
    local_peering_gateway_id: '{{ oci_lpg_peer_create.resource.id }}'
  when:
    - oci_lpg_peer_create is defined
    - oci_lpg_peer_create.resource.id | default('') | length > 0
  register: oci_cleanup_delete_leaked_peer_local_peering_gateway_during_cleanup
  retries: 3
  ignore_errors: true

- name: Delete leaked peer VCN during cleanup
  ansible.oci.oci_network_vcn:
    state: absent
    vcn_id: '{{ oci_lpg_peer_vcn_create.resource.id }}'
  when:
    - oci_lpg_peer_vcn_create is defined
    - oci_lpg_peer_vcn_create.resource.id | default('') | length > 0
  register: oci_cleanup_delete_leaked_peer_vcn_during_cleanup
  retries: 3
  ignore_errors: true

- name: Delete prerequisite oci_network_vcn_create
  ansible.oci.oci_network_vcn:
    state: absent
    vcn_id: '{{ oci_network_vcn_create.resource.id }}'
  when:
    - oci_network_vcn_create is defined
    - oci_network_vcn_create.resource.id | default('') | length > 0
  register: oci_cleanup_delete_prerequisite_oci_network_vcn_create
  retries: 3
  delay: 5
  until: oci_cleanup_delete_prerequisite_oci_network_vcn_create is not failed
  ignore_errors: true

- name: Verify resource cleanup
  ansible.builtin.assert:
    that:
      - not oci_cleanup_checks_failed | bool
      - (oci_cleanup_delete_leaked_duplicate_local_peering_gateway_during_cleanup | default({})) is not failed
      - (oci_cleanup_delete_leaked_local_peering_gateway_during_cleanup | default({})) is not failed
      - (oci_cleanup_delete_leaked_peer_local_peering_gateway_during_cleanup | default({})) is not failed
      - (oci_cleanup_delete_leaked_peer_vcn_during_cleanup | default({})) is not failed
      - (oci_cleanup_delete_prerequisite_oci_network_vcn_create | default({})) is not failed
    fail_msg: Resource cleanup or deletion checks failed. See the failed tasks above.
