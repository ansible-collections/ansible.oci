---
- name: Run local peering gateway cleanup with shared OCI auth defaults
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Delete leaked duplicate local peering gateway during cleanup
      ansible.oci.oci_network_local_peering_gateway:
        state: absent
        local_peering_gateway_id: "{{ oci_lpg_duplicate_id }}"
      when: oci_lpg_duplicate_id | default('') | length > 0
      register: oci_cleanup_duplicate_local_peering_gateway
      retries: 3
      ignore_errors: true

    - name: Delete leaked local peering gateway during cleanup
      ansible.oci.oci_network_local_peering_gateway:
        state: absent
        local_peering_gateway_id: "{{ oci_lpg_id }}"
      when: oci_lpg_id | default('') | length > 0
      register: oci_cleanup_local_peering_gateway
      retries: 3
      ignore_errors: true

    - name: Delete leaked peer local peering gateway during cleanup
      ansible.oci.oci_network_local_peering_gateway:
        state: absent
        local_peering_gateway_id: "{{ oci_lpg_peer_create.resource.id }}"
      when: oci_lpg_peer_create.resource.id | default('') | length > 0
      register: oci_cleanup_peer_local_peering_gateway
      retries: 3
      ignore_errors: true

    - name: Delete leaked VCN during cleanup
      ansible.oci.oci_network_vcn:
        state: absent
        vcn_id: "{{ oci_lpg_vcn_create.resource.id }}"
      when: oci_lpg_vcn_create.resource.id | default('') | length > 0
      register: oci_cleanup_vcn
      retries: 3
      ignore_errors: true

    - name: Delete leaked peer VCN during cleanup
      ansible.oci.oci_network_vcn:
        state: absent
        vcn_id: "{{ oci_lpg_peer_vcn_create.resource.id }}"
      when: oci_lpg_peer_vcn_create.resource.id | default('') | length > 0
      register: oci_cleanup_peer_vcn
      retries: 3
      ignore_errors: true

    - name: Verify resource cleanup succeeded
      ansible.builtin.assert:
        that:
          - oci_cleanup_duplicate_local_peering_gateway is not failed
          - oci_cleanup_local_peering_gateway is not failed
          - oci_cleanup_peer_local_peering_gateway is not failed
          - oci_cleanup_vcn is not failed
          - oci_cleanup_peer_vcn is not failed
        fail_msg: Resource cleanup failed after 3 retries; see the failed cleanup tasks above.
