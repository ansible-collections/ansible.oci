---
- name: Initialize deletion test status
  ansible.builtin.set_fact:
    oci_cleanup_checks_failed: false

- name: Delete leaked duplicate security list during cleanup
  ansible.oci.oci_network_security_list:
    state: absent
    security_list_id: '{{ oci_security_list_duplicate_id }}'
  when:
    - oci_security_list_duplicate_id is defined
    - oci_security_list_duplicate_id | default('') | length > 0
  register: oci_cleanup_delete_leaked_duplicate_security_list_during_cleanup
  retries: 3
  ignore_errors: true

- name: Delete leaked security list during cleanup
  ansible.oci.oci_network_security_list:
    state: absent
    security_list_id: '{{ oci_security_list_id }}'
  when:
    - oci_security_list_id is defined
    - oci_security_list_id | default('') | length > 0
  register: oci_cleanup_delete_leaked_security_list_during_cleanup
  retries: 3
  ignore_errors: true

- name: Delete leaked duplicate DHCP options during cleanup
  ansible.oci.oci_network_dhcp_options:
    state: absent
    dhcp_options_id: '{{ oci_dhcp_options_duplicate_id }}'
  when:
    - oci_dhcp_options_duplicate_id is defined
    - oci_dhcp_options_duplicate_id | default('') | length > 0
  register: oci_cleanup_delete_leaked_duplicate_dhcp_options_during_cleanup
  retries: 3
  ignore_errors: true

- name: Delete leaked DHCP options during cleanup
  ansible.oci.oci_network_dhcp_options:
    state: absent
    dhcp_options_id: '{{ oci_dhcp_options_id }}'
  when:
    - oci_dhcp_options_id is defined
    - oci_dhcp_options_id | default('') | length > 0
  register: oci_cleanup_delete_leaked_dhcp_options_during_cleanup
  retries: 3
  ignore_errors: true

- name: Delete prerequisite oci_network_vcn_create
  ansible.oci.oci_network_vcn:
    state: absent
    vcn_id: '{{ oci_network_vcn_create.resource.id }}'
  when:
    - oci_network_vcn_create is defined
    - oci_network_vcn_create.resource.id | default('') | length > 0
  register: oci_cleanup_delete_prerequisite_oci_network_vcn_create
  retries: 3
  delay: 5
  until: oci_cleanup_delete_prerequisite_oci_network_vcn_create is not failed
  ignore_errors: true

- name: Verify resource cleanup
  ansible.builtin.assert:
    that:
      - not oci_cleanup_checks_failed | bool
      - (oci_cleanup_delete_leaked_duplicate_security_list_during_cleanup | default({})) is not failed
      - (oci_cleanup_delete_leaked_security_list_during_cleanup | default({})) is not failed
      - (oci_cleanup_delete_leaked_duplicate_dhcp_options_during_cleanup | default({})) is not failed
      - (oci_cleanup_delete_leaked_dhcp_options_during_cleanup | default({})) is not failed
      - (oci_cleanup_delete_prerequisite_oci_network_vcn_create | default({})) is not failed
    fail_msg: Resource cleanup or deletion checks failed. See the failed tasks above.
