---
- name: Clean up the temporary identity domain
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Delete leaked user before deleting its domain
      ansible.oci.oci_user:
        state: absent
        domain_id: "{{ oci_integration_domain_id }}"
        user_name: "{{ oci_user_cleanup_name }}"
      when:
        - oci_integration_domain_id | length > 0
        - oci_user_cleanup_name | default('') | length > 0

    - name: Delete temporary identity domain by ID
      ansible.oci.oci_domain:
        state: absent
        domain_id: "{{ oci_integration_domain_id }}"
      when: oci_integration_domain_id | length > 0

    - name: Delete temporary identity domain by name when no ID was captured
      ansible.oci.oci_domain:
        state: absent
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_user_integration_domain_name }}"
      when: oci_integration_domain_id | length == 0
