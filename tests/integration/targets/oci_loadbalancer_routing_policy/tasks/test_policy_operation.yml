---
- name: Read the routing policy before the operation
  ansible.oci.oci_loadbalancer_routing_policy_info: &oci_lb_policy_probe_options
    load_balancer_id: '{{ oci_lb_test_id }}'
    name: '{{ oci_lb_policy_name }}'
  register: oci_lb_policy_before

- name: Predict routing policy {{ oci_lb_policy_operation_name }}
  ansible.oci.oci_loadbalancer_routing_policy: &oci_lb_policy_operation_options
    load_balancer_id: '{{ oci_lb_test_id }}'
    name: '{{ oci_lb_policy_name }}'
    state: "{{ oci_lb_policy_operation.state | default('present') }}"
    rules: '{{ oci_lb_policy_operation.rules | default(omit) }}'
  check_mode: true
  register: oci_lb_policy_prediction

- name: Read the routing policy after check mode
  ansible.oci.oci_loadbalancer_routing_policy_info:
    <<: *oci_lb_policy_probe_options
  register: oci_lb_policy_after_check

- name: Assert check mode predicted a change and preserved the routing policy
  ansible.builtin.assert:
    that:
      - oci_lb_policy_prediction.changed
      - oci_lb_policy_after_check.routing_policies == oci_lb_policy_before.routing_policies

- name: Apply routing policy {{ oci_lb_policy_operation_name }}
  ansible.oci.oci_loadbalancer_routing_policy:
    <<: *oci_lb_policy_operation_options
  register: oci_lb_policy_applied

- name: Read the routing policy after the operation
  ansible.oci.oci_loadbalancer_routing_policy_info:
    <<: *oci_lb_policy_probe_options
  register: oci_lb_policy_after

- name: Assert the routing policy has the expected state
  ansible.builtin.assert:
    that:
      - oci_lb_policy_applied.changed
      - not oci_lb_policy_after.changed
      - >-
        oci_lb_policy_after.routing_policies | length ==
        (0 if oci_lb_policy_operation.state | default('present') == 'absent' else 1)

- name: Assert the routing policy language and rule order
  ansible.builtin.assert:
    that:
      - oci_lb_policy_after.routing_policies[0].name == oci_lb_policy_name
      - oci_lb_policy_after.routing_policies[0].condition_language_version == 'V1'
      - >-
        oci_lb_policy_after.routing_policies[0].rules | map(attribute='name') | list ==
        oci_lb_policy_operation.rules | map(attribute='name') | list
  when: oci_lb_policy_operation.state | default('present') == 'present'

- name: Assert routing rule conditions and actions
  ansible.builtin.assert:
    that:
      - oci_lb_policy_after.routing_policies[0].rules[oci_lb_policy_rule_index].condition == item.condition
      - oci_lb_policy_after.routing_policies[0].rules[oci_lb_policy_rule_index].actions | length == 1
      - oci_lb_policy_after.routing_policies[0].rules[oci_lb_policy_rule_index].actions[0].name == 'FORWARD_TO_BACKENDSET'
      - >-
        oci_lb_policy_after.routing_policies[0].rules[oci_lb_policy_rule_index].actions[0].backend_set_name ==
        item.actions[0].backend_set_name
  loop: '{{ oci_lb_policy_operation.rules | default([]) }}'
  loop_control:
    index_var: oci_lb_policy_rule_index
    label: '{{ item.name }}'

- name: Test routing policy {{ oci_lb_policy_operation_name }} idempotency
  ansible.oci.oci_loadbalancer_routing_policy:
    <<: *oci_lb_policy_operation_options
  register: oci_lb_policy_repeat

- name: Test routing policy {{ oci_lb_policy_operation_name }} idempotency in check mode
  ansible.oci.oci_loadbalancer_routing_policy:
    <<: *oci_lb_policy_operation_options
  check_mode: true
  register: oci_lb_policy_repeat_check

- name: Read the routing policy after idempotency tests
  ansible.oci.oci_loadbalancer_routing_policy_info:
    <<: *oci_lb_policy_probe_options
  register: oci_lb_policy_final

- name: Assert idempotency tests preserved the routing policy
  ansible.builtin.assert:
    that:
      - not oci_lb_policy_repeat.changed
      - not oci_lb_policy_repeat_check.changed
      - oci_lb_policy_final.routing_policies == oci_lb_policy_after.routing_policies
