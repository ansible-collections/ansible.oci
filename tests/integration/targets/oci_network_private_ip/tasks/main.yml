---
- name: Validate required OCI integration variables
  ansible.builtin.assert:
    that:
      - oci_integration_compartment_id | default('', true) | length > 0
    fail_msg: >-
      OCI private IP integration tests require oci_integration_compartment_id
      to be defined in tests/integration/integration_config.yml.

- name: Compute unique resource names for this run
  ansible.builtin.set_fact:
    oci_network_private_ip_integration_vcn_name: "{{ oci_network_private_ip_integration_vcn_name }}-{{ oci_integration_rpfx }}"
    oci_network_private_ip_integration_subnet_name: "{{ oci_network_private_ip_integration_subnet_name }}-{{ oci_integration_rpfx }}"
    oci_network_private_ip_integration_instance_name: "{{ oci_network_private_ip_integration_instance_name }}-{{ oci_integration_rpfx }}"
    oci_network_private_ip_integration_attachment_name: "{{ oci_network_private_ip_integration_attachment_name }}-{{ oci_integration_rpfx }}"
    oci_network_private_ip_integration_vnic_name: "{{ oci_network_private_ip_integration_vnic_name }}-{{ oci_integration_rpfx }}"
    oci_network_private_ip_integration_name: "{{ oci_network_private_ip_integration_name }}-{{ oci_integration_rpfx }}"
    oci_network_private_ip_integration_updated_name: "{{ oci_network_private_ip_integration_updated_name }}-{{ oci_integration_rpfx }}"
    oci_network_private_ip_integration_hostname: "pip{{ oci_integration_rpfx }}"
    oci_network_private_ip_integration_updated_hostname: "pipupdated{{ oci_integration_rpfx }}"

- name: Exercise private IP module lifecycle
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Discover an availability domain
      ansible.oci.oci_availability_domain_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
      register: oci_network_private_ip_ad_info

    - name: Assert an availability domain was discovered
      ansible.builtin.assert:
        that:
          - oci_network_private_ip_ad_info.availability_domains | length > 0

    - name: Discover a compatible image
      ansible.oci.oci_image_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        operating_system: "{{ oci_network_private_ip_integration_operating_system }}"
        operating_system_version: "{{ oci_network_private_ip_integration_operating_system_version }}"
        shape: "{{ oci_network_private_ip_integration_shape }}"
      register: oci_network_private_ip_image_info

    - name: Assert a compatible image was discovered
      ansible.builtin.assert:
        that:
          - oci_network_private_ip_image_info.images | length > 0

    - name: Create test VCN
      ansible.oci.oci_network_vcn:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_network_private_ip_integration_vcn_name }}"
        cidr_blocks:
          - "{{ oci_network_private_ip_integration_vcn_cidr_block }}"
      register: oci_network_private_ip_vcn_create

    - name: Create test subnet
      ansible.oci.oci_network_subnet:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        vcn_id: "{{ oci_network_private_ip_vcn_create.resource.id }}"
        cidr_block: "{{ oci_network_private_ip_integration_subnet_cidr_block }}"
        name: "{{ oci_network_private_ip_integration_subnet_name }}"
      register: oci_network_private_ip_subnet_create

    - name: Create test compute instance
      ansible.oci.oci_instance:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        availability_domain: "{{ oci_network_private_ip_ad_info.availability_domains[0].name }}"
        name: "{{ oci_network_private_ip_integration_instance_name }}"
        shape: "{{ oci_network_private_ip_integration_shape }}"
        shape_config: "{{ oci_network_private_ip_integration_shape_config }}"
        image_id: "{{ oci_network_private_ip_image_info.images[0].id }}"
        subnet_id: "{{ oci_network_private_ip_subnet_create.resource.id }}"
      register: oci_network_private_ip_instance_create

    - name: Capture test instance ID
      ansible.builtin.set_fact:
        oci_network_private_ip_instance_id: "{{ oci_network_private_ip_instance_create.resource.id }}"

    - name: Create a secondary VNIC attachment
      ansible.oci.oci_vnic_attachment:
        state: present
        compartment_id: "{{ oci_integration_compartment_id }}"
        instance_id: "{{ oci_network_private_ip_instance_id }}"
        name: "{{ oci_network_private_ip_integration_attachment_name }}"
        create_vnic_details:
          subnet_id: "{{ oci_network_private_ip_subnet_create.resource.id }}"
          display_name: "{{ oci_network_private_ip_integration_vnic_name }}"
          assign_public_ip: false
      register: oci_network_private_ip_vnic_attachment_create

    - name: Capture secondary VNIC identifiers
      ansible.builtin.set_fact:
        oci_network_private_ip_vnic_attachment_id: "{{ oci_network_private_ip_vnic_attachment_create.resource.id }}"
        oci_network_private_ip_secondary_vnic_id: "{{ oci_network_private_ip_vnic_attachment_create.resource.vnic_id }}"

    - name: List instance VNIC attachments
      ansible.oci.oci_vnic_attachment_info:
        compartment_id: "{{ oci_integration_compartment_id }}"
        instance_id: "{{ oci_network_private_ip_instance_id }}"
      register: oci_network_private_ip_vnic_attachment_info

    - name: Capture primary VNIC ID
      ansible.builtin.set_fact:
        oci_network_private_ip_primary_vnic_id: >-
          {{
            (
              oci_network_private_ip_vnic_attachment_info.vnic_attachments
              | selectattr('nic_index', 'equalto', 0)
              | list
              | first
            ).vnic_id
          }}

    - name: Create secondary private IP in check mode
      ansible.oci.oci_network_private_ip: &private_ip_create_options
        state: present
        name: "{{ oci_network_private_ip_integration_name }}"
        vnic_id: "{{ oci_network_private_ip_primary_vnic_id }}"
        ip_address: "{{ oci_network_private_ip_integration_ip_address }}"
        hostname_label: "{{ oci_network_private_ip_integration_hostname }}"
        lifetime: ephemeral
        freeform_tags: "{{ oci_network_private_ip_integration_create_tags }}"
      check_mode: true
      register: oci_network_private_ip_create_check

    - name: Assert create check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_network_private_ip_create_check.changed | bool

    - name: Create secondary private IP
      ansible.oci.oci_network_private_ip:
        <<: *private_ip_create_options
      register: oci_network_private_ip_create

    - name: Capture private IP ID
      ansible.builtin.set_fact:
        oci_network_private_ip_id: "{{ oci_network_private_ip_create.resource.id }}"

    - name: Assert create returned the expected private IP
      ansible.builtin.assert:
        that:
          - oci_network_private_ip_create.changed | bool
          - not oci_network_private_ip_create.resource.is_primary | bool
          - oci_network_private_ip_create.resource.vnic_id == oci_network_private_ip_primary_vnic_id
          - oci_network_private_ip_create.resource.ip_address == oci_network_private_ip_integration_ip_address
          - oci_network_private_ip_create.resource.lifetime == "EPHEMERAL"

    - name: Reconcile private IP by scoped name
      ansible.oci.oci_network_private_ip:
        <<: *private_ip_create_options
      register: oci_network_private_ip_create_rerun

    - name: Assert create reconciliation is idempotent
      ansible.builtin.assert:
        that:
          - not oci_network_private_ip_create_rerun.changed | bool
          - oci_network_private_ip_create_rerun.resource.id == oci_network_private_ip_id

    - name: Update private IP in check mode
      ansible.oci.oci_network_private_ip: &private_ip_update_options
        state: present
        private_ip_id: "{{ oci_network_private_ip_id }}"
        name: "{{ oci_network_private_ip_integration_updated_name }}"
        hostname_label: "{{ oci_network_private_ip_integration_updated_hostname }}"
        vnic_id: "{{ oci_network_private_ip_secondary_vnic_id }}"
        lifetime: reserved
        route_table_id: "{{ oci_network_private_ip_vcn_create.resource.default_route_table_id }}"
        freeform_tags: "{{ oci_network_private_ip_integration_update_tags }}"
      check_mode: true
      register: oci_network_private_ip_update_check

    - name: Assert update check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_network_private_ip_update_check.changed | bool

    - name: Verify update check mode did not mutate the private IP
      ansible.oci.oci_network_private_ip:
        state: present
        private_ip_id: "{{ oci_network_private_ip_id }}"
        name: "{{ oci_network_private_ip_integration_name }}"
        hostname_label: "{{ oci_network_private_ip_integration_hostname }}"
        vnic_id: "{{ oci_network_private_ip_primary_vnic_id }}"
        lifetime: ephemeral
        freeform_tags: "{{ oci_network_private_ip_integration_create_tags }}"
      register: oci_network_private_ip_update_check_probe

    - name: Assert private IP is unchanged after update check mode
      ansible.builtin.assert:
        that:
          - not oci_network_private_ip_update_check_probe.changed | bool

    - name: Update and reassign private IP
      ansible.oci.oci_network_private_ip:
        <<: *private_ip_update_options
      register: oci_network_private_ip_update

    - name: Assert update returned the expected private IP
      ansible.builtin.assert:
        that:
          - oci_network_private_ip_update.changed | bool
          - oci_network_private_ip_update.resource.name == oci_network_private_ip_integration_updated_name
          - oci_network_private_ip_update.resource.hostname_label == oci_network_private_ip_integration_updated_hostname
          - oci_network_private_ip_update.resource.vnic_id == oci_network_private_ip_secondary_vnic_id
          - oci_network_private_ip_update.resource.lifetime == "RESERVED"
          - oci_network_private_ip_update.resource.route_table_id == oci_network_private_ip_vcn_create.resource.default_route_table_id
          - oci_network_private_ip_update.resource.freeform_tags.phase == "update"

    - name: Reapply private IP update
      ansible.oci.oci_network_private_ip:
        <<: *private_ip_update_options
      register: oci_network_private_ip_update_rerun

    - name: Assert update is idempotent
      ansible.builtin.assert:
        that:
          - not oci_network_private_ip_update_rerun.changed | bool

    - name: Delete private IP in check mode
      ansible.oci.oci_network_private_ip: &private_ip_delete_options
        state: absent
        private_ip_id: "{{ oci_network_private_ip_id }}"
      check_mode: true
      register: oci_network_private_ip_delete_check

    - name: Assert delete check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_network_private_ip_delete_check.changed | bool

    - name: Verify delete check mode did not remove the private IP
      ansible.oci.oci_network_private_ip:
        <<: *private_ip_update_options
      register: oci_network_private_ip_delete_check_probe

    - name: Assert private IP remains after delete check mode
      ansible.builtin.assert:
        that:
          - not oci_network_private_ip_delete_check_probe.changed | bool

    - name: Delete private IP
      ansible.oci.oci_network_private_ip:
        <<: *private_ip_delete_options
      register: oci_network_private_ip_delete

    - name: Assert delete reported a change
      ansible.builtin.assert:
        that:
          - oci_network_private_ip_delete.changed | bool

    - name: Delete private IP again
      ansible.oci.oci_network_private_ip:
        <<: *private_ip_delete_options
      register: oci_network_private_ip_delete_rerun

    - name: Assert repeated delete is idempotent
      ansible.builtin.assert:
        that:
          - not oci_network_private_ip_delete_rerun.changed | bool

    - name: Clear private IP ID after successful deletion
      ansible.builtin.set_fact:
        oci_network_private_ip_id: ""

  always:
    - name: Run private IP cleanup
      ansible.builtin.include_tasks: cleanup.yml
