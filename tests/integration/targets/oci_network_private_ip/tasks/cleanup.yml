---
- name: Run private IP cleanup with shared OCI auth defaults
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Delete leaked secondary private IP
      ansible.oci.oci_network_private_ip:
        state: absent
        private_ip_id: "{{ oci_network_private_ip_id }}"
      when: oci_network_private_ip_id | default('') | length > 0
      register: oci_cleanup_secondary_private_ip
      retries: 3
      ignore_errors: true

    - name: Detach leaked secondary VNIC
      ansible.oci.oci_vnic_attachment:
        state: absent
        vnic_attachment_id: "{{ oci_network_private_ip_vnic_attachment_id }}"
      when: oci_network_private_ip_vnic_attachment_id | default('') | length > 0
      register: oci_cleanup_secondary_vnic
      retries: 3
      ignore_errors: true

    - name: Delete leaked compute instance
      ansible.oci.oci_instance:
        state: absent
        instance_id: "{{ oci_network_private_ip_instance_id }}"
      when: oci_network_private_ip_instance_id | default('') | length > 0
      register: oci_cleanup_compute_instance
      retries: 3
      ignore_errors: true

    - name: Delete leaked subnet
      ansible.oci.oci_network_subnet:
        state: absent
        subnet_id: "{{ oci_network_private_ip_subnet_create.resource.id }}"
      when: oci_network_private_ip_subnet_create.resource.id | default('') | length > 0
      register: oci_cleanup_subnet
      retries: 3
      ignore_errors: true

    - name: Delete leaked VCN
      ansible.oci.oci_network_vcn:
        state: absent
        vcn_id: "{{ oci_network_private_ip_vcn_create.resource.id }}"
      when: oci_network_private_ip_vcn_create.resource.id | default('') | length > 0
      register: oci_cleanup_vcn
      retries: 3
      ignore_errors: true

    - name: Verify resource cleanup succeeded
      ansible.builtin.assert:
        that:
          - oci_cleanup_secondary_private_ip is not failed
          - oci_cleanup_secondary_vnic is not failed
          - oci_cleanup_compute_instance is not failed
          - oci_cleanup_subnet is not failed
          - oci_cleanup_vcn is not failed
        fail_msg: Resource cleanup failed after 3 retries; see the failed cleanup tasks above.
