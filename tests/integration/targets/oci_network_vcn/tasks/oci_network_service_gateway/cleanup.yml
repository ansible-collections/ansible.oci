---
- name: Delete leaked service gateway during cleanup
  ansible.oci.oci_network_service_gateway:
    state: absent
    service_gateway_id: '{{ oci_service_gateway_id }}'
  when:
    - oci_group_started_oci_network_service_gateway | default(false)
    - oci_service_gateway_id | default('') | length > 0
  register: oci_vcn_group_cleanup_0
  retries: 3
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Delete leaked service gateway during cleanup''] }}'
  when: oci_vcn_group_cleanup_0 is failed

- name: Check all cleanup results
  ansible.builtin.assert:
    that:
      - oci_group_cleanup_failures | length == 0
    fail_msg: 'Cleanup failed for: {{ oci_group_cleanup_failures | join(", ") }}'
