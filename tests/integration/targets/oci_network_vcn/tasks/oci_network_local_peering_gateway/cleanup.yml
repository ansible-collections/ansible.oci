---
- name: Delete leaked duplicate local peering gateway during cleanup
  ansible.oci.oci_network_local_peering_gateway:
    state: absent
    local_peering_gateway_id: '{{ oci_lpg_duplicate_id }}'
  when:
    - oci_group_started_oci_network_local_peering_gateway | default(false)
    - oci_lpg_duplicate_id | default('') | length > 0
  register: oci_vcn_group_cleanup_0
  retries: 3
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Delete leaked duplicate local peering gateway during cleanup'']
      }}'
  when: oci_vcn_group_cleanup_0 is failed

- name: Delete leaked local peering gateway during cleanup
  ansible.oci.oci_network_local_peering_gateway:
    state: absent
    local_peering_gateway_id: '{{ oci_lpg_id }}'
  when:
    - oci_group_started_oci_network_local_peering_gateway | default(false)
    - oci_lpg_id | default('') | length > 0
  register: oci_vcn_group_cleanup_2
  retries: 3
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Delete leaked local peering gateway during cleanup'']
      }}'
  when: oci_vcn_group_cleanup_2 is failed

- name: Delete leaked peer local peering gateway during cleanup
  ansible.oci.oci_network_local_peering_gateway:
    state: absent
    local_peering_gateway_id: '{{ oci_lpg_peer_create.resource.id }}'
  when:
    - oci_group_started_oci_network_local_peering_gateway | default(false)
    - oci_lpg_peer_create.resource.id | default('') | length > 0
  register: oci_vcn_group_cleanup_4
  retries: 3
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Delete leaked peer local peering gateway during cleanup'']
      }}'
  when: oci_vcn_group_cleanup_4 is failed

- name: Delete leaked peer VCN during cleanup
  ansible.oci.oci_network_vcn:
    state: absent
    vcn_id: '{{ oci_lpg_peer_vcn_create.resource.id }}'
  when:
    - oci_group_started_oci_network_local_peering_gateway | default(false)
    - oci_lpg_peer_vcn_create.resource.id | default('') | length > 0
  register: oci_vcn_group_cleanup_6
  retries: 3
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Delete leaked peer VCN during cleanup''] }}'
  when: oci_vcn_group_cleanup_6 is failed

- name: Check all cleanup results
  ansible.builtin.assert:
    that:
      - oci_group_cleanup_failures | length == 0
    fail_msg: 'Cleanup failed for: {{ oci_group_cleanup_failures | join(", ") }}'
