---
- name: Delete leaked duplicate DHCP options during cleanup
  ansible.oci.oci_network_dhcp_options:
    state: absent
    dhcp_options_id: '{{ oci_dhcp_options_duplicate_id }}'
  when:
    - oci_group_started_oci_network_dhcp_options | default(false)
    - oci_dhcp_options_duplicate_id | default('') | length > 0
  register: oci_vcn_group_cleanup_0
  retries: 3
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Delete leaked duplicate DHCP options during cleanup'']
      }}'
  when: oci_vcn_group_cleanup_0 is failed

- name: Delete leaked DHCP options during cleanup
  ansible.oci.oci_network_dhcp_options:
    state: absent
    dhcp_options_id: '{{ oci_dhcp_options_id }}'
  when:
    - oci_group_started_oci_network_dhcp_options | default(false)
    - oci_dhcp_options_id | default('') | length > 0
  register: oci_vcn_group_cleanup_2
  retries: 3
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Delete leaked DHCP options during cleanup''] }}'
  when: oci_vcn_group_cleanup_2 is failed

- name: Check all cleanup results
  ansible.builtin.assert:
    that:
      - oci_group_cleanup_failures | length == 0
    fail_msg: 'Cleanup failed for: {{ oci_group_cleanup_failures | join(", ") }}'
