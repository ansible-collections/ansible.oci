---
- name: Initialize cleanup failures
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: []

- name: Remove resolver rules that can reference the endpoint
  ansible.oci.oci_dns_resolver:
    resolver_id: '{{ oci_network_vcn_integration_resolver_id }}'
    forward_rules: []
  when:
    - oci_group_started_oci_network_vcn | default(false)
    - oci_network_vcn_integration_resolver_id | default('') | length > 0
    - oci_network_vcn_integration_endpoint_cleanup_needed | default(false) | bool
  register: oci_vcn_group_cleanup_0
  retries: 3
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Remove resolver rules that can reference the endpoint'']
      }}'
  when: oci_vcn_group_cleanup_0 is failed

- name: Delete leaked resolver endpoint
  ansible.oci.oci_dns_resolver_endpoint:
    state: absent
    resolver_id: '{{ oci_network_vcn_integration_resolver_id }}'
    name: '{{ oci_network_vcn_integration_endpoint_name }}'
  when:
    - oci_group_started_oci_network_vcn | default(false)
    - oci_network_vcn_integration_resolver_id | default('') | length > 0
    - oci_network_vcn_integration_endpoint_name | default('') | length > 0
    - oci_network_vcn_integration_endpoint_cleanup_needed | default(false) | bool
