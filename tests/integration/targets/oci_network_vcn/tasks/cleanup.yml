- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Delete leaked resolver endpoint''] }}'
  when: oci_vcn_group_cleanup_2 is failed

