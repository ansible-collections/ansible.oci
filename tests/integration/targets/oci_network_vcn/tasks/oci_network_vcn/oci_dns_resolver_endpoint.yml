---
- name: Mark resolver endpoint for cleanup
  ansible.builtin.set_fact:
    oci_network_vcn_integration_endpoint_cleanup_needed: true

- name: Create resolver endpoint in check mode
  ansible.oci.oci_dns_resolver_endpoint:
    state: present
    resolver_id: '{{ oci_network_vcn_integration_resolver_id }}'
    name: '{{ oci_network_vcn_integration_endpoint_name }}'
    subnet_id: '{{ oci_network_vcn_integration_subnet_id }}'
    is_forwarding: true
    is_listening: false
    freeform_tags: '{{ oci_network_vcn_integration_create_tags }}'
  check_mode: true
  register: oci_dns_resolver_endpoint_create_check

- name: Assert endpoint create check mode predicts a change
  ansible.builtin.assert:
    that:
      - oci_dns_resolver_endpoint_create_check.changed | bool

- name: Read endpoint after create check mode
  ansible.oci.oci_dns_resolver_endpoint_info:
    resolver_id: '{{ oci_network_vcn_integration_resolver_id }}'
    name: '{{ oci_network_vcn_integration_endpoint_name }}'
  register: oci_dns_resolver_endpoint_create_probe

- name: Assert endpoint does not exist after create check mode
  ansible.builtin.assert:
    that:
      - oci_dns_resolver_endpoint_create_probe.endpoints | length == 0

- name: Create resolver endpoint
  ansible.oci.oci_dns_resolver_endpoint:
    state: present
    resolver_id: '{{ oci_network_vcn_integration_resolver_id }}'
    name: '{{ oci_network_vcn_integration_endpoint_name }}'
    subnet_id: '{{ oci_network_vcn_integration_subnet_id }}'
    is_forwarding: true
    is_listening: false
    freeform_tags: '{{ oci_network_vcn_integration_create_tags }}'
  register: oci_dns_resolver_endpoint_create

- name: Save endpoint name
  ansible.builtin.set_fact:
    oci_network_vcn_integration_endpoint_name: '{{ oci_dns_resolver_endpoint_create.resource.name }}'

- name: Assert endpoint create changed cloud state
  ansible.builtin.assert:
    that:
      - oci_dns_resolver_endpoint_create.changed | bool

- name: Repeat endpoint create
  ansible.oci.oci_dns_resolver_endpoint:
    state: present
    resolver_id: '{{ oci_network_vcn_integration_resolver_id }}'
    name: '{{ oci_network_vcn_integration_endpoint_name }}'
    subnet_id: '{{ oci_network_vcn_integration_subnet_id }}'
    is_forwarding: true
    is_listening: false
    freeform_tags: '{{ oci_network_vcn_integration_create_tags }}'
  register: oci_dns_resolver_endpoint_create_repeat

- name: Assert repeated endpoint create is unchanged
  ansible.builtin.assert:
    that:
      - not oci_dns_resolver_endpoint_create_repeat.changed | bool

- name: Check repeated endpoint create
  ansible.oci.oci_dns_resolver_endpoint:
    state: present
    resolver_id: '{{ oci_network_vcn_integration_resolver_id }}'
    name: '{{ oci_network_vcn_integration_endpoint_name }}'
    subnet_id: '{{ oci_network_vcn_integration_subnet_id }}'
    is_forwarding: true
    is_listening: false
    freeform_tags: '{{ oci_network_vcn_integration_create_tags }}'
  check_mode: true
  register: oci_dns_resolver_endpoint_create_check_repeat

- name: Assert repeated endpoint create is unchanged in check mode
  ansible.builtin.assert:
    that:
      - not oci_dns_resolver_endpoint_create_check_repeat.changed | bool

- name: Update endpoint tags
  ansible.oci.oci_dns_resolver_endpoint:
    state: present
    resolver_id: '{{ oci_network_vcn_integration_resolver_id }}'
    name: '{{ oci_network_vcn_integration_endpoint_name }}'
    freeform_tags: '{{ oci_network_vcn_integration_update_tags }}'
  check_mode: true
  register: oci_dns_resolver_endpoint_update_check

- name: Assert endpoint update check mode predicts a change
  ansible.builtin.assert:
    that:
      - oci_dns_resolver_endpoint_update_check.changed | bool

- name: Read endpoint after update check mode
  ansible.oci.oci_dns_resolver_endpoint_info:
    resolver_id: '{{ oci_network_vcn_integration_resolver_id }}'
    name: '{{ oci_network_vcn_integration_endpoint_name }}'
  register: oci_dns_resolver_endpoint_update_probe

- name: Assert endpoint update check mode did not change tags
  ansible.builtin.assert:
    that:
      - oci_dns_resolver_endpoint_update_probe.endpoints | length == 1
      - oci_dns_resolver_endpoint_update_probe.endpoints[0].freeform_tags.phase == "create"

- name: Update endpoint tags
  ansible.oci.oci_dns_resolver_endpoint:
    state: present
    resolver_id: '{{ oci_network_vcn_integration_resolver_id }}'
    name: '{{ oci_network_vcn_integration_endpoint_name }}'
    freeform_tags: '{{ oci_network_vcn_integration_update_tags }}'
  register: oci_dns_resolver_endpoint_update

- name: Assert endpoint update changed cloud state
  ansible.builtin.assert:
    that:
      - oci_dns_resolver_endpoint_update.changed | bool

- name: Read endpoint after update
  ansible.oci.oci_dns_resolver_endpoint_info:
    resolver_id: '{{ oci_network_vcn_integration_resolver_id }}'
    name: '{{ oci_network_vcn_integration_endpoint_name }}'
  register: oci_dns_resolver_endpoint_update_result

- name: Assert endpoint tags were updated
  ansible.builtin.assert:
    that:
      - oci_dns_resolver_endpoint_update_result.endpoints | length == 1
      - oci_dns_resolver_endpoint_update_result.endpoints[0].freeform_tags.phase == "update"

- name: Repeat endpoint update
  ansible.oci.oci_dns_resolver_endpoint:
    state: present
    resolver_id: '{{ oci_network_vcn_integration_resolver_id }}'
    name: '{{ oci_network_vcn_integration_endpoint_name }}'
    freeform_tags: '{{ oci_network_vcn_integration_update_tags }}'
  register: oci_dns_resolver_endpoint_update_repeat

- name: Assert repeated endpoint update is unchanged
  ansible.builtin.assert:
    that:
      - not oci_dns_resolver_endpoint_update_repeat.changed | bool

- name: Check repeated endpoint update
  ansible.oci.oci_dns_resolver_endpoint:
    state: present
    resolver_id: '{{ oci_network_vcn_integration_resolver_id }}'
    name: '{{ oci_network_vcn_integration_endpoint_name }}'
    freeform_tags: '{{ oci_network_vcn_integration_update_tags }}'
  check_mode: true
  register: oci_dns_resolver_endpoint_update_check_repeat

- name: Assert repeated endpoint update is unchanged in check mode
  ansible.builtin.assert:
    that:
      - not oci_dns_resolver_endpoint_update_check_repeat.changed | bool
