---
- name: Initialize resource identifiers
  ansible.builtin.set_fact:
    oci_vcn_dependency_subnet: {}
    oci_network_vcn_integration_subnet_id: ''
    oci_tests_completed: false

- name: Test oci_network_vcn
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: '{{ oci_integration_config_file_location }}'
      config_profile_name: '{{ oci_integration_config_profile_name }}'
  block:

    - name: Run oci_network_vcn tests
      ansible.builtin.include_tasks: oci_network_vcn.yml

    - name: Create the dependent subnet
      ansible.oci.oci_network_subnet:
        compartment_id: '{{ oci_integration_compartment_id }}'
        vcn_id: '{{ oci_network_vcn_id }}'
        cidr_block: '{{ oci_network_vcn_integration_subnet_cidr_block }}'
        name: vcn-dependency-{{ oci_integration_rpfx }}
      register: oci_vcn_dependency_subnet

    - name: Capture dependent subnet ID
      ansible.builtin.set_fact:
        oci_network_vcn_integration_subnet_id: '{{ oci_vcn_dependency_subnet.resource.id }}'

    - name: Assert delete fails cleanly while dependent subnet exists
      ansible.oci.oci_network_vcn:
        state: '{{ oci_network_vcn_delete_params.state }}'
        vcn_id: '{{ oci_network_vcn_delete_params.vcn_id }}'
      register: oci_network_vcn_delete_blocked
      ignore_errors: true

    - name: Verify blocked delete message
      ansible.builtin.assert:
        that:
          - oci_network_vcn_delete_blocked is failed
          - '''dependent resources'' in (oci_network_vcn_delete_blocked.msg | default(''''))'

    - name: Delete the dependent subnet
      ansible.oci.oci_network_subnet:
        state: absent
        subnet_id: '{{ oci_vcn_dependency_subnet.resource.id }}'

    - name: Mark tests as complete
      ansible.builtin.set_fact:
        oci_tests_completed: true
  always:

    - name: Clean up all test resources
      ansible.builtin.include_tasks: cleanup.yml
  vars:
    oci_shared_vcn: '{{ oci_network_vcn_create }}'
