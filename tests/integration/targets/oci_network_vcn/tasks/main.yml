---
- name: Initialize shared resources and ownership
  ansible.builtin.set_fact:
    oci_group_resources: {}
    oci_group_cleanup_failures: []
    oci_group_started_oci_network_vcn: false
    oci_group_started_oci_bastion: false
    oci_group_started_oci_network_subnet: false
    oci_group_started_oci_network_local_peering_gateway: false
    oci_group_started_oci_network_service_gateway: false
    oci_group_started_oci_network_security_group_rule: false
    oci_group_started_oci_network_security_group: false
    oci_group_started_oci_network_security_list: false
    oci_group_started_oci_network_route_table: false
    oci_group_started_oci_network_nat_gateway: false
    oci_group_started_oci_network_internet_gateway: false
    oci_group_started_oci_network_dhcp_options: false

- name: Test VCN and dependent modules
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: '{{ oci_integration_config_file_location }}'
      config_profile_name: '{{ oci_integration_config_profile_name }}'
  block:

    - name: Run oci_network_vcn tests
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_network_vcn/main.yml'

    - name: Test oci_network_dhcp_options
      ansible.builtin.include_tasks: oci_network_dhcp_options/main.yml
      vars:
        oci_shared_vcn: '{{ oci_network_vcn_create }}'

    - name: Run oci_network_internet_gateway tests
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_network_internet_gateway/main.yml'
      vars:
        oci_shared_vcn: '{{ oci_network_vcn_create }}'

    - name: Run oci_network_route_table tests
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_network_route_table/main.yml'
      vars:
        oci_shared_vcn: '{{ oci_network_vcn_create }}'

    - name: Run oci_network_internet_gateway remaining tests
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_network_internet_gateway/delete.yml'
      vars:
        oci_shared_vcn: '{{ oci_network_vcn_create }}'

    - name: Test oci_network_nat_gateway
      ansible.builtin.include_tasks: oci_network_nat_gateway/main.yml
      vars:
        oci_shared_vcn: '{{ oci_network_vcn_create }}'

    - name: Test oci_network_security_list
      ansible.builtin.include_tasks: oci_network_security_list/main.yml
      vars:
        oci_shared_vcn: '{{ oci_network_vcn_create }}'

    - name: Run oci_network_security_group tests
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_network_security_group/main.yml'
      vars:
        oci_shared_vcn: '{{ oci_network_vcn_create }}'

    - name: Run oci_network_security_group_rule tests
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_network_security_group_rule/main.yml'
      vars:
        oci_shared_vcn: '{{ oci_network_vcn_create }}'

    - name: Run oci_network_security_group remaining tests
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_network_security_group/delete.yml'
      vars:
        oci_shared_vcn: '{{ oci_network_vcn_create }}'

    - name: Test oci_network_service_gateway
      ansible.builtin.include_tasks: oci_network_service_gateway/main.yml
      vars:
        oci_shared_vcn: '{{ oci_network_vcn_create }}'

    - name: Test oci_network_local_peering_gateway
      ansible.builtin.include_tasks: oci_network_local_peering_gateway/main.yml
      vars:
        oci_shared_vcn: '{{ oci_network_vcn_create }}'

    - name: Run oci_network_subnet tests
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_network_subnet/main.yml'
      vars:
        oci_shared_vcn: '{{ oci_network_vcn_create }}'

    - name: Run oci_bastion tests
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_bastion/main.yml'
      vars:
        oci_shared_vcn: '{{ oci_network_vcn_create }}'

    - name: Run oci_network_subnet remaining tests
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_network_subnet/delete.yml'
      vars:
        oci_shared_vcn: '{{ oci_network_vcn_create }}'

    - name: Run oci_network_vcn remaining tests
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_network_vcn/delete.yml'
  always:

    - name: Clean up all group resources
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/cleanup.yml'
