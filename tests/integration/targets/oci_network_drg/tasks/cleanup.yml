---
- name: Run DRG cleanup with shared OCI auth defaults
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Delete leaked duplicate DRG during cleanup
      ansible.oci.oci_network_drg:
        state: absent
        drg_id: "{{ oci_drg_duplicate_id }}"
      when: oci_drg_duplicate_id | default('') | length > 0
      register: oci_cleanup_duplicate_drg
      retries: 3
      ignore_errors: true

    - name: Delete leaked DRG during cleanup
      ansible.oci.oci_network_drg:
        state: absent
        drg_id: "{{ oci_drg_id }}"
      when: oci_drg_id | default('') | length > 0
      register: oci_cleanup_drg
      retries: 3
      ignore_errors: true

    - name: Verify resource cleanup succeeded
      ansible.builtin.assert:
        that:
          - oci_cleanup_duplicate_drg is not failed
          - oci_cleanup_drg is not failed
        fail_msg: Resource cleanup failed after 3 retries; see the failed cleanup tasks above.
