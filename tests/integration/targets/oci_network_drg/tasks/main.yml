---
- name: Initialize shared resources and ownership
  ansible.builtin.set_fact:
    oci_group_resources: {}
    oci_group_cleanup_failures: []
    oci_group_started_oci_network_drg: false
    oci_group_started_oci_network_drg_attachment: false
    oci_group_started_oci_network_ipsec_connection: false

- name: Test oci_network_drg and dependent modules
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: '{{ oci_integration_config_file_location }}'
      config_profile_name: '{{ oci_integration_config_profile_name }}'
  block:

    - name: Run oci_network_drg tests
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_network_drg/main.yml'
      vars:
        oci_prerequisites: '{{ oci_group_resources }}'

    - name: Run oci_network_drg_attachment tests
      ansible.builtin.include_tasks: oci_network_drg_attachment/main.yml
      vars:
        oci_prerequisites: '{{ oci_group_resources }}'

    - name: Run oci_network_ipsec_connection tests
      ansible.builtin.include_tasks: oci_network_ipsec_connection/main.yml
      vars:
        oci_prerequisites: '{{ oci_group_resources }}'

    - name: Run oci_network_drg remaining tests
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_network_drg/delete.yml'
      vars:
        oci_prerequisites: '{{ oci_group_resources }}'
  always:

    - name: Clean up all group resources
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/cleanup.yml'
