---
- name: Initialize resource identifiers
  ansible.builtin.set_fact:
    oci_rpc_id: ''
    oci_tests_completed: false

- name: Test oci_network_drg
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: '{{ oci_integration_config_file_location }}'
      config_profile_name: '{{ oci_integration_config_profile_name }}'
  block:

    - name: Run oci_network_drg tests
      ansible.builtin.include_tasks: oci_network_drg.yml

    - name: Run oci_network_drg_attachment tests
      ansible.builtin.include_tasks: oci_network_drg_attachment.yml

    - name: Run remote peering connection tests with the shared DRG
      ansible.builtin.include_tasks: remote_peering_connection.yml

    - name: Mark tests as complete
      ansible.builtin.set_fact:
        oci_tests_completed: true
  always:

    - name: Clean up all test resources
      ansible.builtin.include_tasks: cleanup.yml
