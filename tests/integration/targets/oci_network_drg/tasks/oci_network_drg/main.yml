---
- name: Validate required OCI integration variables
  ansible.builtin.assert:
    that:
      - oci_integration_compartment_id | default('', true) | length > 0
    fail_msg: |-
      OCI DRG integration tests require oci_integration_compartment_id to be defined in
      tests/integration/integration_config.yml.

- name: Compute unique resource names for this run
  ansible.builtin.set_fact:
    oci_drg_integration_drg_name: '{{ oci_drg_integration_drg_name }}-{{ oci_integration_rpfx }}'
    oci_drg_integration_updated_drg_name: '{{ oci_drg_integration_updated_drg_name }}-{{ oci_integration_rpfx }}'

- name: Mark oci_network_drg as started
  ansible.builtin.set_fact:
    oci_group_started_oci_network_drg: true

- name: Exercise DRG module lifecycle
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: '{{ oci_integration_config_file_location }}'
      config_profile_name: '{{ oci_integration_config_profile_name }}'
  block:

    - name: Define DRG create and delete parameters
      ansible.builtin.set_fact:
        oci_drg_create_params:
          state: present
          compartment_id: '{{ oci_integration_compartment_id }}'
          name: '{{ oci_drg_integration_drg_name }}'
          freeform_tags: '{{ oci_drg_integration_create_tags }}'
        oci_drg_delete_params:
          state: absent
          drg_id: ''

    - name: Create DRG in check mode
      ansible.oci.oci_network_drg:
        state: '{{ oci_drg_create_params.state }}'
        compartment_id: '{{ oci_drg_create_params.compartment_id }}'
        name: '{{ oci_drg_create_params.name }}'
        freeform_tags: '{{ oci_drg_create_params.freeform_tags }}'
      check_mode: true
      register: oci_drg_create_check

    - name: Assert create check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_drg_create_check.changed | bool

    - name: Read DRG after create check mode
      ansible.oci.oci_network_drg_info:
        compartment_id: '{{ oci_integration_compartment_id }}'
        name: '{{ oci_drg_integration_drg_name }}'
      register: oci_drg_create_check_probe

    - name: Assert DRG is still absent after create check mode
      ansible.builtin.assert:
        that:
          - oci_drg_create_check_probe.drgs | length == 0

    - name: Create DRG
      ansible.oci.oci_network_drg:
        state: '{{ oci_drg_create_params.state }}'
        compartment_id: '{{ oci_drg_create_params.compartment_id }}'
        name: '{{ oci_drg_create_params.name }}'
        freeform_tags: '{{ oci_drg_create_params.freeform_tags }}'
      register: oci_drg_create

    - name: Save shared drg
      ansible.builtin.set_fact:
        oci_group_resources: '{{ oci_group_resources | combine({''drg'': oci_drg_create}) }}'

    - name: Capture DRG id and define update parameters
      ansible.builtin.set_fact:
        oci_drg_id: '{{ oci_drg_create.resource.id }}'
        oci_drg_update_params:
          state: present
          drg_id: '{{ oci_drg_create.resource.id }}'
          name: '{{ oci_drg_integration_updated_drg_name }}'
          freeform_tags: '{{ oci_drg_integration_update_tags }}'
        oci_drg_delete_params:
          state: absent
          drg_id: '{{ oci_drg_create.resource.id }}'

    - name: Assert create reported a change
      ansible.builtin.assert:
        that:
          - oci_drg_create.changed | bool

    - name: Read DRG by id
      ansible.oci.oci_network_drg_info:
        drg_id: '{{ oci_drg_id }}'
      register: oci_drg_info_by_id

    - name: Assert DRG info by id returned the created DRG
      ansible.builtin.assert:
        that:
          - oci_drg_info_by_id.drgs | length == 1
          - oci_drg_info_by_id.drgs[0].id == oci_drg_id
          - oci_drg_info_by_id.drgs[0].name == oci_drg_integration_drg_name
          - oci_drg_info_by_id.drgs[0].lifecycle_state == "AVAILABLE"

    - name: List DRG by name
      ansible.oci.oci_network_drg_info:
        compartment_id: '{{ oci_integration_compartment_id }}'
        name: '{{ oci_drg_integration_drg_name }}'
      register: oci_drg_info_list

    - name: Assert DRG info list returned the created DRG
      ansible.builtin.assert:
        that:
          - oci_drg_info_list.drgs | selectattr('id', 'equalto', oci_drg_id) | list | length == 1

    - name: Assert created DRG is a no-op on rerun with unique name
      ansible.oci.oci_network_drg:
        state: '{{ oci_drg_create_params.state }}'
        compartment_id: '{{ oci_drg_create_params.compartment_id }}'
        name: '{{ oci_drg_create_params.name }}'
        freeform_tags: '{{ oci_drg_create_params.freeform_tags }}'
      register: oci_drg_create_rerun_by_name

    - name: Verify DRG rerun with unique name is a no-op
      ansible.builtin.assert:
        that:
          - not oci_drg_create_rerun_by_name.changed | bool
          - oci_drg_create_rerun_by_name.resource.id == oci_drg_id

    - name: Intentionally create a second DRG with the same display name
      ansible.oci.oci_network_drg:
        state: '{{ oci_drg_create_params.state }}'
        compartment_id: '{{ oci_drg_create_params.compartment_id }}'
        name: '{{ oci_drg_create_params.name }}'
        freeform_tags: '{{ oci_drg_create_params.freeform_tags }}'
        allow_duplicate_name: true
      register: oci_drg_duplicate_create

    - name: Capture duplicate DRG id
      ansible.builtin.set_fact:
        oci_drg_duplicate_id: '{{ oci_drg_duplicate_create.resource.id }}'

    - name: Assert duplicate DRG create used a new resource
      ansible.builtin.assert:
        that:
          - oci_drg_duplicate_create.changed | bool
          - oci_drg_duplicate_id != oci_drg_id

    - name: Delete the duplicate DRG
      ansible.oci.oci_network_drg:
        state: absent
        drg_id: '{{ oci_drg_duplicate_id }}'

    - name: Clear duplicate DRG id after successful delete
      ansible.builtin.set_fact:
        oci_drg_duplicate_id: ''

    - name: Assert created DRG is a no-op on rerun with returned id
      ansible.oci.oci_network_drg:
        state: '{{ oci_drg_create_params.state }}'
        compartment_id: '{{ oci_drg_create_params.compartment_id }}'
        name: '{{ oci_drg_create_params.name }}'
        freeform_tags: '{{ oci_drg_create_params.freeform_tags }}'
        drg_id: '{{ oci_drg_id }}'
      register: oci_drg_create_rerun

    - name: Verify rerun with returned id is a no-op
      ansible.builtin.assert:
        that:
          - not oci_drg_create_rerun.changed | bool

    - name: Update DRG in check mode
      ansible.oci.oci_network_drg:
        state: '{{ oci_drg_update_params.state }}'
        drg_id: '{{ oci_drg_update_params.drg_id }}'
        name: '{{ oci_drg_update_params.name }}'
        freeform_tags: '{{ oci_drg_update_params.freeform_tags }}'
      check_mode: true
      register: oci_drg_update_check

    - name: Assert update check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_drg_update_check.changed | bool

    - name: Read DRG after update check mode
      ansible.oci.oci_network_drg_info:
        drg_id: '{{ oci_drg_id }}'
      register: oci_drg_update_check_probe

    - name: Assert update check mode did not mutate cloud state
      ansible.builtin.assert:
        that:
          - oci_drg_update_check_probe.drgs | length == 1
          - oci_drg_update_check_probe.drgs[0].name == oci_drg_integration_drg_name
          - oci_drg_update_check_probe.drgs[0].freeform_tags.phase == "create"

    - name: Update DRG
      ansible.oci.oci_network_drg:
        state: '{{ oci_drg_update_params.state }}'
        drg_id: '{{ oci_drg_update_params.drg_id }}'
        name: '{{ oci_drg_update_params.name }}'
        freeform_tags: '{{ oci_drg_update_params.freeform_tags }}'
      register: oci_drg_update

    - name: Assert update reported a change
      ansible.builtin.assert:
        that:
          - oci_drg_update.changed | bool

    - name: Read updated DRG by name
      ansible.oci.oci_network_drg_info:
        compartment_id: '{{ oci_integration_compartment_id }}'
        name: '{{ oci_drg_integration_updated_drg_name }}'
      register: oci_drg_info_updated

    - name: Assert DRG info reflects updated DRG
      ansible.builtin.assert:
        that:
          - oci_drg_info_updated.drgs | selectattr('id', 'equalto', oci_drg_id) | list | length == 1
          - oci_drg_info_updated.drgs[0].freeform_tags.phase == "update"

    - name: Assert update is idempotent on rerun
      ansible.oci.oci_network_drg:
        state: '{{ oci_drg_update_params.state }}'
        drg_id: '{{ oci_drg_update_params.drg_id }}'
        name: '{{ oci_drg_update_params.name }}'
        freeform_tags: '{{ oci_drg_update_params.freeform_tags }}'
      register: oci_drg_update_rerun

    - name: Verify update rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_drg_update_rerun.changed | bool
