---
- name: Exercise DRG module lifecycle
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: '{{ oci_integration_config_file_location }}'
      config_profile_name: '{{ oci_integration_config_profile_name }}'
  block:

    - name: Delete DRG in check mode
      ansible.oci.oci_network_drg:
        state: '{{ oci_drg_delete_params.state }}'
        drg_id: '{{ oci_drg_delete_params.drg_id }}'
      check_mode: true
      register: oci_drg_delete_check

    - name: Assert delete check mode reported a change
      ansible.builtin.assert:
        that:
          - oci_drg_delete_check.changed | bool

    - name: Read DRG after delete check mode
      ansible.oci.oci_network_drg_info:
        drg_id: '{{ oci_drg_id }}'
      register: oci_drg_delete_check_probe

    - name: Assert DRG still exists after delete check mode
      ansible.builtin.assert:
        that:
          - oci_drg_delete_check_probe.drgs | length == 1

    - name: Delete DRG
      ansible.oci.oci_network_drg:
        state: '{{ oci_drg_delete_params.state }}'
        drg_id: '{{ oci_drg_delete_params.drg_id }}'
      register: oci_drg_delete

    - name: Assert delete reported a change
      ansible.builtin.assert:
        that:
          - oci_drg_delete.changed | bool

    - name: Assert delete is idempotent on rerun
      ansible.oci.oci_network_drg:
        state: '{{ oci_drg_delete_params.state }}'
        drg_id: '{{ oci_drg_delete_params.drg_id }}'
      register: oci_drg_delete_rerun

    - name: Verify delete rerun is a no-op
      ansible.builtin.assert:
        that:
          - not oci_drg_delete_rerun.changed | bool
