---
- name: Initialize deletion test status
  ansible.builtin.set_fact:
    oci_cleanup_checks_failed: false

- name: Remove resolver rules that can reference the endpoint
  ansible.oci.oci_dns_resolver:
    resolver_id: '{{ oci_network_vcn_integration_resolver_id }}'
    forward_rules: []
  when:
    - oci_network_vcn_integration_resolver_id is defined
    - oci_network_vcn_integration_resolver_id | default('') | length > 0
    - oci_network_vcn_integration_endpoint_cleanup_needed | default(false) | bool
  register: oci_cleanup_remove_resolver_rules_that_can_reference_the_endpoint
  retries: 3
  ignore_errors: true

- name: Verify oci_dns_resolver_endpoint deletion
  when: oci_tests_completed | bool
  block:

    - name: Delete endpoint in check mode
      ansible.oci.oci_dns_resolver_endpoint:
        state: absent
        resolver_id: '{{ oci_network_vcn_integration_resolver_id }}'
        name: '{{ oci_network_vcn_integration_endpoint_name }}'
      check_mode: true
      register: oci_cleanup_delete_endpoint_in_check_mode

    - name: Assert endpoint delete check mode predicts a change
      ansible.builtin.assert:
        that:
          - oci_cleanup_delete_endpoint_in_check_mode.changed | bool

    - name: Read endpoint after delete check mode
      ansible.oci.oci_dns_resolver_endpoint_info:
        resolver_id: '{{ oci_network_vcn_integration_resolver_id }}'
        name: '{{ oci_network_vcn_integration_endpoint_name }}'
      register: oci_cleanup_read_endpoint_after_delete_check_mode

    - name: Assert endpoint still exists after delete check mode
      ansible.builtin.assert:
        that:
          - oci_cleanup_read_endpoint_after_delete_check_mode.endpoints | length == 1

    - name: Delete endpoint
      ansible.oci.oci_dns_resolver_endpoint:
        state: absent
        resolver_id: '{{ oci_network_vcn_integration_resolver_id }}'
        name: '{{ oci_network_vcn_integration_endpoint_name }}'
      register: oci_cleanup_delete_endpoint

    - name: Assert endpoint delete changed cloud state
      ansible.builtin.assert:
        that:
          - oci_cleanup_delete_endpoint.changed | bool

    - name: Mark resolver endpoint as deleted
      ansible.builtin.set_fact:
        oci_network_vcn_integration_endpoint_cleanup_needed: false

    - name: Repeat endpoint delete
      ansible.oci.oci_dns_resolver_endpoint:
        state: absent
        resolver_id: '{{ oci_network_vcn_integration_resolver_id }}'
        name: '{{ oci_network_vcn_integration_endpoint_name }}'
      register: oci_cleanup_repeat_endpoint_delete

    - name: Assert repeated endpoint delete is unchanged
      ansible.builtin.assert:
        that:
          - not oci_cleanup_repeat_endpoint_delete.changed | bool
  rescue:

    - name: Record a deletion test failure
      ansible.builtin.set_fact:
        oci_cleanup_checks_failed: true

- name: Delete leaked resolver endpoint
  ansible.oci.oci_dns_resolver_endpoint:
    state: absent
    resolver_id: '{{ oci_network_vcn_integration_resolver_id }}'
    name: '{{ oci_network_vcn_integration_endpoint_name }}'
  when:
    - oci_network_vcn_integration_resolver_id is defined
    - oci_network_vcn_integration_endpoint_name is defined
    - oci_network_vcn_integration_resolver_id | default('') | length > 0
    - oci_network_vcn_integration_endpoint_name | default('') | length > 0
    - oci_network_vcn_integration_endpoint_cleanup_needed | default(false) | bool
    - oci_integration_rpfx | string in oci_network_vcn_integration_endpoint_name | string
  register: oci_cleanup_delete_leaked_resolver_endpoint
  retries: 3
  ignore_errors: true

- name: Delete prerequisite oci_subnet_create
  ansible.oci.oci_network_subnet:
    state: absent
    subnet_id: '{{ oci_subnet_create.resource.id }}'
  when:
    - oci_subnet_create is defined
    - oci_subnet_create.resource.id | default('') | length > 0
  register: oci_cleanup_delete_prerequisite_oci_subnet_create
  retries: 3
  delay: 5
  until: oci_cleanup_delete_prerequisite_oci_subnet_create is not failed
  ignore_errors: true

- name: Delete prerequisite oci_network_vcn_create
  ansible.oci.oci_network_vcn:
    state: absent
    vcn_id: '{{ oci_network_vcn_create.resource.id }}'
  when:
    - oci_network_vcn_create is defined
    - oci_network_vcn_create.resource.id | default('') | length > 0
  register: oci_cleanup_delete_prerequisite_oci_network_vcn_create
  retries: 3
  delay: 5
  until: oci_cleanup_delete_prerequisite_oci_network_vcn_create is not failed
  ignore_errors: true

- name: Verify resource cleanup
  ansible.builtin.assert:
    that:
      - not oci_cleanup_checks_failed | bool
      - (oci_cleanup_remove_resolver_rules_that_can_reference_the_endpoint | default({})) is not failed
      - (oci_cleanup_delete_leaked_resolver_endpoint | default({})) is not failed
      - (oci_cleanup_delete_prerequisite_oci_subnet_create | default({})) is not failed
      - (oci_cleanup_delete_prerequisite_oci_network_vcn_create | default({})) is not failed
    fail_msg: Resource cleanup or deletion checks failed. See the failed tasks above.
