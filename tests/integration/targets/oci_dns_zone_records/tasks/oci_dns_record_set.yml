---
- name: Predict A RRset deletion for create coverage
  ansible.oci.oci_dns_record_set:
    state: absent
    zone_name_or_id: '{{ oci_dns_records_case.zone }}'
    scope: '{{ oci_dns_records_case.scope }}'
    view_id: '{{ oci_dns_records_case.view_id | default(omit, true) }}'
    domain: '{{ oci_dns_records_domain }}'
    rtype: a
  check_mode: true
  register: oci_dns_rrset_create_delete_check

- name: Probe A RRset after delete check
  ansible.oci.oci_dns_record_set_info:
    zone_name_or_id: '{{ oci_dns_records_case.zone }}'
    scope: '{{ oci_dns_records_case.scope }}'
    view_id: '{{ oci_dns_records_case.view_id | default(omit, true) }}'
    domain: '{{ oci_dns_records_domain }}'
    rtype: a
  register: oci_dns_rrset_create_delete_probe

- name: Assert RRset delete check predicts change and retains record
  ansible.builtin.assert:
    that:
      - oci_dns_rrset_create_delete_check.changed | bool
      - oci_dns_rrset_create_delete_probe.records | length == 1

- name: Delete A RRset before create test
  ansible.oci.oci_dns_record_set:
    state: absent
    zone_name_or_id: '{{ oci_dns_records_case.zone }}'
    scope: '{{ oci_dns_records_case.scope }}'
    view_id: '{{ oci_dns_records_case.view_id | default(omit, true) }}'
    domain: '{{ oci_dns_records_domain }}'
    rtype: a
  register: oci_dns_rrset_create_delete

- name: Predict A RRset creation
  ansible.oci.oci_dns_record_set:
    state: present
    zone_name_or_id: '{{ oci_dns_records_case.zone }}'
    scope: '{{ oci_dns_records_case.scope }}'
    view_id: '{{ oci_dns_records_case.view_id | default(omit, true) }}'
    domain: '{{ oci_dns_records_domain }}'
    rtype: a
    update_items: &id001
      - domain: '{{ oci_dns_records_domain }}'
        rtype: a
        rdata: 192.0.2.11
        ttl: 600
  check_mode: true
  register: oci_dns_rrset_create_check

- name: Probe RRset after create check mode
  ansible.oci.oci_dns_record_set_info:
    zone_name_or_id: '{{ oci_dns_records_case.zone }}'
    scope: '{{ oci_dns_records_case.scope }}'
    view_id: '{{ oci_dns_records_case.view_id | default(omit, true) }}'
    domain: '{{ oci_dns_records_domain }}'
    rtype: a
  register: oci_dns_rrset_create_probe

- name: Assert RRset create check predicts change and made no change
  ansible.builtin.assert:
    that:
      - oci_dns_rrset_create_check.changed | bool
      - oci_dns_rrset_create_probe.records | length == 0

- name: Create A RRset
  ansible.oci.oci_dns_record_set:
    state: present
    zone_name_or_id: '{{ oci_dns_records_case.zone }}'
    scope: '{{ oci_dns_records_case.scope }}'
    view_id: '{{ oci_dns_records_case.view_id | default(omit, true) }}'
    domain: '{{ oci_dns_records_domain }}'
    rtype: a
    update_items: *id001
  register: oci_dns_rrset_create

- name: Reapply RRset create
  ansible.oci.oci_dns_record_set:
    state: present
    zone_name_or_id: '{{ oci_dns_records_case.zone }}'
    scope: '{{ oci_dns_records_case.scope }}'
    view_id: '{{ oci_dns_records_case.view_id | default(omit, true) }}'
    domain: '{{ oci_dns_records_domain }}'
    rtype: a
    update_items: *id001
  register: oci_dns_rrset_create_repeat

- name: Recheck RRset create
  ansible.oci.oci_dns_record_set:
    state: present
    zone_name_or_id: '{{ oci_dns_records_case.zone }}'
    scope: '{{ oci_dns_records_case.scope }}'
    view_id: '{{ oci_dns_records_case.view_id | default(omit, true) }}'
    domain: '{{ oci_dns_records_domain }}'
    rtype: a
    update_items: *id001
  check_mode: true
  register: oci_dns_rrset_create_check_repeat

- name: Assert RRset create reruns are unchanged
  ansible.builtin.assert:
    that:
      - oci_dns_rrset_create.changed | bool
      - not oci_dns_rrset_create_repeat.changed | bool
      - not oci_dns_rrset_create_check_repeat.changed | bool

- name: Predict RRset replacement
  ansible.oci.oci_dns_record_set:
    state: present
    zone_name_or_id: '{{ oci_dns_records_case.zone }}'
    scope: '{{ oci_dns_records_case.scope }}'
    view_id: '{{ oci_dns_records_case.view_id | default(omit, true) }}'
    domain: '{{ oci_dns_records_domain }}'
    rtype: a
    update_items: &id002
      - domain: '{{ oci_dns_records_domain }}'
        rtype: a
        rdata: 192.0.2.12
        ttl: 900
  check_mode: true
  register: oci_dns_rrset_update_check

- name: Probe RRset after update check mode
  ansible.oci.oci_dns_record_set_info:
    zone_name_or_id: '{{ oci_dns_records_case.zone }}'
    scope: '{{ oci_dns_records_case.scope }}'
    view_id: '{{ oci_dns_records_case.view_id | default(omit, true) }}'
    domain: '{{ oci_dns_records_domain }}'
    rtype: a
  register: oci_dns_rrset_update_probe

- name: Verify RRset update check retained the old record
  ansible.builtin.assert:
    that:
      - oci_dns_rrset_update_probe.records | length == 1
      - oci_dns_rrset_update_probe.records[0].rdata == '192.0.2.11'

- name: Verify RRset update check predicts a change
  ansible.builtin.assert:
    that:
      - oci_dns_rrset_update_check.changed | bool

- name: Replace A record set
  ansible.oci.oci_dns_record_set:
    state: present
    zone_name_or_id: '{{ oci_dns_records_case.zone }}'
    scope: '{{ oci_dns_records_case.scope }}'
    view_id: '{{ oci_dns_records_case.view_id | default(omit, true) }}'
    domain: '{{ oci_dns_records_domain }}'
    rtype: a
    update_items: *id002
  register: oci_dns_rrset_update

- name: Verify RRset update result
  ansible.builtin.assert:
    that:
      - oci_dns_rrset_update.changed | bool
      - oci_dns_rrset_update.resource['items'] | length == 1

- name: Verify RRset update reruns are unchanged
  ansible.oci.oci_dns_record_set:
    state: present
    zone_name_or_id: '{{ oci_dns_records_case.zone }}'
    scope: '{{ oci_dns_records_case.scope }}'
    view_id: '{{ oci_dns_records_case.view_id | default(omit, true) }}'
    domain: '{{ oci_dns_records_domain }}'
    rtype: a
    update_items: *id002
  register: oci_dns_rrset_update_repeat

- name: Verify RRset update check reruns are unchanged
  ansible.oci.oci_dns_record_set:
    state: present
    zone_name_or_id: '{{ oci_dns_records_case.zone }}'
    scope: '{{ oci_dns_records_case.scope }}'
    view_id: '{{ oci_dns_records_case.view_id | default(omit, true) }}'
    domain: '{{ oci_dns_records_domain }}'
    rtype: a
    update_items: *id002
  check_mode: true
  register: oci_dns_rrset_update_check_repeat

- name: Assert RRset update reruns are unchanged
  ansible.builtin.assert:
    that:
      - not oci_dns_rrset_update_repeat.changed | bool
      - not oci_dns_rrset_update_check_repeat.changed | bool
