---
- name: Compute unique identity domain names for this run
  ansible.builtin.set_fact:
    oci_identity_domain_integration_name: '{{ oci_identity_domain_integration_name }}-{{ oci_integration_rpfx }}'
    oci_identity_domain_integration_updated_name: '{{ oci_identity_domain_integration_updated_name }}-{{ oci_integration_rpfx
      }}'

- name: Define identity domain create parameters
  ansible.builtin.set_fact:
    oci_identity_domain_create_params:
      state: present
      compartment_id: '{{ oci_integration_compartment_id }}'
      name: '{{ oci_identity_domain_integration_name }}'
      description: '{{ oci_identity_domain_integration_description }}'
      home_region: '{{ oci_identity_domain_integration_home_region }}'
      license_type: free
      freeform_tags: '{{ oci_identity_domain_integration_create_tags }}'

- name: Create identity domain
  ansible.oci.oci_identity_domain:
    state: '{{ oci_identity_domain_create_params.state }}'
    compartment_id: '{{ oci_identity_domain_create_params.compartment_id }}'
    name: '{{ oci_identity_domain_create_params.name }}'
    description: '{{ oci_identity_domain_create_params.description }}'
    home_region: '{{ oci_identity_domain_create_params.home_region }}'
    license_type: '{{ oci_identity_domain_create_params.license_type }}'
    freeform_tags: '{{ oci_identity_domain_create_params.freeform_tags }}'
  register: oci_identity_domain_create

- name: Compute unique domain and user names
  ansible.builtin.set_fact:
    oci_integration_domain_id: ''
    oci_integration_domain_url: ''
    oci_identity_user_integration_domain_name: '{{ oci_identity_user_integration_domain_name }}-{{ oci_integration_rpfx
      }}'
    oci_identity_user_integration_name: '{{ oci_identity_user_integration_name }}-{{ oci_integration_rpfx }}@example.com'
    oci_identity_user_cleanup_name: '{{ oci_identity_user_integration_name }}-{{ oci_integration_rpfx }}@example.com'

- name: Use the shared domain
  ansible.builtin.set_fact:
    oci_identity_user_domain_create: '{{ oci_identity_domain_create }}'

- name: Capture temporary identity domain endpoint
  ansible.builtin.set_fact:
    oci_integration_domain_id: '{{ oci_identity_user_domain_create.resource.id }}'
    oci_integration_domain_url: '{{ oci_identity_user_domain_create.resource.url }}'

- name: Wait for the temporary identity domain API
  block:

    - name: Poll temporary identity domain API
      ansible.oci.oci_identity_user_info:
        domain_url: '{{ oci_integration_domain_url }}'
        user_name: '{{ oci_identity_user_integration_name }}'
      register: oci_identity_domain_readiness
      until: oci_identity_domain_readiness is succeeded
      retries: 12
      delay: 5
  rescue:

    - name: Report temporary identity domain readiness failure
      ansible.builtin.fail:
        msg: 'Identity domain API readiness retry limit reached (12 retries, 5 seconds apart, excluding API
          request time). Last API result: {{ ansible_failed_result }}'

- name: Create user
  ansible.oci.oci_identity_user:
    domain_id: '{{ oci_integration_domain_id }}'
    user_name: '{{ oci_identity_user_integration_name }}'
    name: OCI User Integration
    given_name: OCI
    family_name: Integration
    email: '{{ oci_identity_user_integration_name }}'
    description: '{{ oci_identity_user_integration_description }}'
    active: true
    freeform_tags:
      phase: create
  register: user_create_result
