---
- name: Initialize deletion test status
  ansible.builtin.set_fact:
    oci_cleanup_checks_failed: false

- name: Remove lifecycle policy left by integration test
  ansible.oci.oci_object_lifecycle_policy:
    state: absent
    bucket_name: '{{ oci_object_lifecycle_policy_bucket_name }}'
  when:
    - oci_object_lifecycle_policy_bucket_name is defined
    - oci_object_lifecycle_policy_bucket_created | default(false)
  register: oci_cleanup_remove_lifecycle_policy_left_by_integration_test
  retries: 3
  ignore_errors: true

- name: Remove test object
  ansible.oci.oci_object_storage_object:
    bucket_name: '{{ oci_object_storage_object_bucket_name }}'
    object_name: '{{ oci_object_storage_object_name }}'
    state: absent
  when:
    - oci_object_storage_object_bucket_name is defined
    - oci_object_storage_object_name is defined
    - oci_object_storage_object_bucket_name | default('') | length > 0
  register: oci_cleanup_remove_test_object
  retries: 3
  ignore_errors: true

- name: Remove local test directory
  ansible.builtin.file:
    path: '{{ oci_object_storage_object_temp_dir.path }}'
    state: absent
  when:
    - oci_object_storage_object_temp_dir is defined
  register: oci_cleanup_remove_local_test_directory
  retries: 3
  ignore_errors: true

- name: Verify oci_object_storage_bucket deletion
  when: oci_tests_completed | bool
  block:

    - name: Exercise Object Storage bucket lifecycle
      module_defaults:
        group/ansible.oci.oci:
          config_file_location: '{{ oci_integration_config_file_location }}'
          config_profile_name: '{{ oci_integration_config_profile_name }}'
      block:

        - name: Check bucket deletion without changing OCI
          ansible.oci.oci_object_storage_bucket:
            state: absent
            name: '{{ oci_object_storage_bucket_name }}'
          check_mode: true
          register: oci_cleanup_check_bucket_deletion_without_changing_oci

        - name: Read bucket after delete check mode
          ansible.oci.oci_object_storage_bucket_info:
            bucket_name: '{{ oci_object_storage_bucket_name }}'
          register: oci_cleanup_read_bucket_after_delete_check_mode
          failed_when: not oci_cleanup_check_bucket_deletion_without_changing_oci.changed or oci_cleanup_read_bucket_after_delete_check_mode.buckets
            | length != 1

        - name: Delete bucket
          ansible.oci.oci_object_storage_bucket:
            state: absent
            name: '{{ oci_object_storage_bucket_name }}'
          register: oci_cleanup_delete_bucket

        - name: Read bucket after deletion
          ansible.oci.oci_object_storage_bucket_info:
            bucket_name: '{{ oci_object_storage_bucket_name }}'
          register: oci_cleanup_read_bucket_after_deletion

        - name: Verify bucket was deleted
          ansible.builtin.assert:
            that:
              - oci_cleanup_delete_bucket.changed | bool
              - oci_cleanup_read_bucket_after_deletion.buckets | length == 0

        - name: Check repeated bucket deletion
          ansible.oci.oci_object_storage_bucket:
            state: absent
            name: '{{ oci_object_storage_bucket_name }}'
          check_mode: true
          register: oci_cleanup_check_repeated_bucket_deletion

        - name: Repeat bucket deletion
          ansible.oci.oci_object_storage_bucket:
            state: absent
            name: '{{ oci_object_storage_bucket_name }}'
          register: oci_cleanup_repeat_bucket_deletion

        - name: Verify bucket deletion is idempotent
          ansible.builtin.assert:
            that:
              - not oci_cleanup_check_repeated_bucket_deletion.changed | bool
              - not oci_cleanup_repeat_bucket_deletion.changed | bool
  rescue:

    - name: Record a deletion test failure
      ansible.builtin.set_fact:
        oci_cleanup_checks_failed: true

- name: Delete bucket during cleanup
  ansible.oci.oci_object_storage_bucket:
    state: absent
    name: '{{ oci_object_storage_bucket_cleanup_name }}'
    force: true
  when:
    - oci_object_storage_bucket_cleanup_name is defined
    - oci_object_storage_bucket_cleanup_name | default('') | length > 0
    - oci_integration_rpfx | string in oci_object_storage_bucket_cleanup_name | string
  register: oci_cleanup_delete_bucket_during_cleanup
  retries: 3
  ignore_errors: true

- name: Verify resource cleanup
  ansible.builtin.assert:
    that:
      - not oci_cleanup_checks_failed | bool
      - (oci_cleanup_remove_lifecycle_policy_left_by_integration_test | default({})) is not failed
      - (oci_cleanup_remove_test_object | default({})) is not failed
      - (oci_cleanup_remove_local_test_directory | default({})) is not failed
      - (oci_cleanup_delete_bucket_during_cleanup | default({})) is not failed
    fail_msg: Resource cleanup or deletion checks failed. See the failed tasks above.
