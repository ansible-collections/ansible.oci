---
- name: Clean up Object Storage bucket integration resources
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Delete bucket during cleanup
      ansible.oci.oci_object_storage_bucket:
        state: absent
        name: "{{ oci_object_storage_bucket_cleanup_name }}"
      when: oci_object_storage_bucket_cleanup_name | default('') | length > 0
      register: oci_cleanup_storage_bucket
      retries: 3
      ignore_errors: true

    - name: Verify resource cleanup succeeded
      ansible.builtin.assert:
        that:
          - oci_cleanup_storage_bucket is not failed
        fail_msg: >-
          Resource cleanup failed after 3 retries;
          see the failed cleanup tasks above.
