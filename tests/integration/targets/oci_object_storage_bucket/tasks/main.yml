---
- name: Initialize shared resources and ownership
  ansible.builtin.set_fact:
    oci_group_resources: {}
    oci_group_cleanup_failures: []
    oci_group_started_oci_object_storage_bucket: false
    oci_group_started_oci_object_storage_object: false
    oci_group_started_oci_object_lifecycle_policy: false

- name: Test oci_object_storage_bucket and dependent modules
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: '{{ oci_integration_config_file_location }}'
      config_profile_name: '{{ oci_integration_config_profile_name }}'
  block:

    - name: Run oci_object_storage_bucket tests
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_object_storage_bucket/main.yml'
      vars:
        oci_prerequisites: '{{ oci_group_resources }}'

    - name: Run oci_object_storage_object tests
      ansible.builtin.include_tasks: oci_object_storage_object/main.yml
      vars:
        oci_prerequisites: '{{ oci_group_resources }}'

    - name: Run oci_object_storage_bucket intermediate tests
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_object_storage_bucket/update.yml'
      vars:
        oci_prerequisites: '{{ oci_group_resources }}'

    - name: Run oci_object_lifecycle_policy tests
      ansible.builtin.include_tasks: oci_object_lifecycle_policy/main.yml
      vars:
        oci_prerequisites: '{{ oci_group_resources }}'

    - name: Run oci_object_storage_bucket remaining tests
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/oci_object_storage_bucket/delete.yml'
      vars:
        oci_prerequisites: '{{ oci_group_resources }}'
  always:

    - name: Clean up all group resources
      ansible.builtin.include_tasks: '{{ role_path }}/tasks/cleanup.yml'
