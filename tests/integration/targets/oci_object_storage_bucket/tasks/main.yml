---
- name: Initialize resource identifiers
  ansible.builtin.set_fact:
    oci_tests_completed: false

- name: Test oci_object_storage_bucket
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: '{{ oci_integration_config_file_location }}'
      config_profile_name: '{{ oci_integration_config_profile_name }}'
  block:

    - name: Run oci_object_storage_bucket tests
      ansible.builtin.include_tasks: oci_object_storage_bucket.yml

    - name: Run oci_object_storage_object tests
      ansible.builtin.include_tasks: oci_object_storage_object.yml

    - name: Run oci_object_storage_bucket intermediate tests
      ansible.builtin.include_tasks: oci_object_storage_bucket_update.yml

    - name: Run oci_object_lifecycle_policy tests
      ansible.builtin.include_tasks: oci_object_lifecycle_policy.yml

    - name: Mark tests as complete
      ansible.builtin.set_fact:
        oci_tests_completed: true
  always:

    - name: Clean up all test resources
      ansible.builtin.include_tasks: cleanup.yml
