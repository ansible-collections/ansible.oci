---
- name: Remove lifecycle policy left by integration test
  ansible.oci.oci_object_lifecycle_policy:
    state: absent
    bucket_name: '{{ oci_object_lifecycle_policy_bucket_name }}'
  when:
    - oci_group_started_oci_object_lifecycle_policy | default(false)
    - oci_object_lifecycle_policy_bucket_created | default(false)
  register: oci_group_cleanup_0
  retries: 3
  ignore_errors: true

- name: Record cleanup failure
  ansible.builtin.set_fact:
    oci_group_cleanup_failures: '{{ oci_group_cleanup_failures + [''Remove lifecycle policy left by integration test''] }}'
  when: oci_group_cleanup_0 is failed

- name: Check module cleanup results
  ansible.builtin.assert:
    that:
      - oci_group_cleanup_failures | length == 0
    fail_msg: 'Cleanup failed for: {{ oci_group_cleanup_failures | join(", ") }}'
