---
- name: Test network load balancer health checker update
  block:
    - name: Prepare the parent network load balancer
      ansible.builtin.include_role:
        name: prepare_oci_network_loadbalancer_subresources
      vars:
        oci_nlb_test_suffix: health-checker

    - name: Create the prerequisite backend set
      ansible.oci.oci_network_loadbalancer_backend_set:
        network_load_balancer_id: "{{ oci_nlb_test_id }}"
        name: "{{ oci_nlb_test_backend_set }}"
        policy: five_tuple
        health_checker:
          protocol: tcp
          port: 80
          retries: 3
          interval_in_millis: 10000
          timeout_in_millis: 3000

    - name: Read health checker before update
      ansible.oci.oci_network_loadbalancer_health_checker_info: &oci_nlb_health_checker_probe
        network_load_balancer_id: "{{ oci_nlb_test_id }}"
        name: "{{ oci_nlb_test_backend_set }}"
      register: oci_nlb_health_checker_before

    - name: Predict health checker update
      ansible.oci.oci_network_loadbalancer_health_checker: &oci_nlb_health_checker_update
        network_load_balancer_id: "{{ oci_nlb_test_id }}"
        name: "{{ oci_nlb_test_backend_set }}"
        protocol: tcp
        port: 80
        retries: 4
        interval_in_millis: 12000
        timeout_in_millis: 3000
      check_mode: true
      register: oci_nlb_health_checker_prediction

    - name: Read health checker after check mode
      ansible.oci.oci_network_loadbalancer_health_checker_info:
        <<: *oci_nlb_health_checker_probe
      register: oci_nlb_health_checker_after_prediction

    - name: Check the predicted health checker update
      ansible.builtin.assert:
        that:
          - oci_nlb_health_checker_prediction.changed | bool
          - oci_nlb_health_checker_before.health_checkers == oci_nlb_health_checker_after_prediction.health_checkers

    - name: Apply health checker update
      ansible.oci.oci_network_loadbalancer_health_checker:
        <<: *oci_nlb_health_checker_update
      register: oci_nlb_health_checker_applied

    - name: Read health checker after update
      ansible.oci.oci_network_loadbalancer_health_checker_info:
        <<: *oci_nlb_health_checker_probe
      register: oci_nlb_health_checker_after

    - name: Check updated health checker settings
      ansible.builtin.assert:
        that:
          - oci_nlb_health_checker_applied.changed | bool
          - oci_nlb_health_checker_after.health_checkers | length == 1
          - oci_nlb_health_checker_after.health_checkers[0].protocol == 'TCP'
          - oci_nlb_health_checker_after.health_checkers[0].port == 80
          - oci_nlb_health_checker_after.health_checkers[0].retries == 4
          - oci_nlb_health_checker_after.health_checkers[0].interval_in_millis == 12000

    - name: Repeat health checker update in normal mode
      ansible.oci.oci_network_loadbalancer_health_checker:
        <<: *oci_nlb_health_checker_update
      register: oci_nlb_health_checker_repeat

    - name: Repeat health checker update in check mode
      ansible.oci.oci_network_loadbalancer_health_checker:
        <<: *oci_nlb_health_checker_update
      check_mode: true
      register: oci_nlb_health_checker_repeat_check

    - name: Check health checker idempotency
      ansible.builtin.assert:
        that:
          - not oci_nlb_health_checker_repeat.changed | bool
          - not oci_nlb_health_checker_repeat_check.changed | bool

    - name: Read backend set after health checker update
      ansible.oci.oci_network_loadbalancer_backend_set_info:
        network_load_balancer_id: "{{ oci_nlb_test_id }}"
        name: "{{ oci_nlb_test_backend_set }}"
      register: oci_nlb_updated_backend_set

    - name: Check backend set health checker values
      ansible.builtin.assert:
        that:
          - oci_nlb_updated_backend_set.backend_sets[0].health_checker.retries == 4
          - oci_nlb_updated_backend_set.backend_sets[0].health_checker.interval_in_millis == 12000
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  always:
    - name: Delete the prerequisite backend set
      ansible.oci.oci_network_loadbalancer_backend_set:
        network_load_balancer_id: "{{ oci_nlb_test_id }}"
        name: "{{ oci_nlb_test_backend_set }}"
        state: absent
      when: oci_nlb_test_id | default('', true) | length > 0
      ignore_errors: true

    - name: Clean up the parent network load balancer
      ansible.builtin.include_role:
        name: prepare_oci_network_loadbalancer_subresources
        tasks_from: cleanup
