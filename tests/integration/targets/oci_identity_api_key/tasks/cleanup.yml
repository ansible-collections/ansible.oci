---
- name: Clean up temporary identity API keys, user, and domain
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Delete leaked first API key
      ansible.oci.oci_identity_api_key:
        state: absent
        domain_id: "{{ oci_identity_api_key_domain_id }}"
        user_id: "{{ oci_identity_api_key_user_id }}"
        fingerprint: "{{ oci_identity_api_key_first_fingerprint }}"
      when:
        - oci_identity_api_key_domain_id | default('') | length > 0
        - oci_identity_api_key_user_id | default('') | length > 0
        - oci_identity_api_key_first_fingerprint | default('') | length > 0
      register: oci_cleanup_api_key_first
      retries: 3
      ignore_errors: true

    - name: Delete leaked second API key
      ansible.oci.oci_identity_api_key:
        state: absent
        domain_id: "{{ oci_identity_api_key_domain_id }}"
        user_id: "{{ oci_identity_api_key_user_id }}"
        fingerprint: "{{ oci_identity_api_key_second_fingerprint }}"
      when:
        - oci_identity_api_key_domain_id | default('') | length > 0
        - oci_identity_api_key_user_id | default('') | length > 0
        - oci_identity_api_key_second_fingerprint | default('') | length > 0
      register: oci_cleanup_api_key_second
      retries: 3
      ignore_errors: true

    - name: Delete leaked user by ID
      ansible.oci.oci_identity_user:
        state: absent
        domain_id: "{{ oci_identity_api_key_domain_id }}"
        user_id: "{{ oci_identity_api_key_user_id }}"
      when:
        - oci_identity_api_key_domain_id | default('') | length > 0
        - oci_identity_api_key_user_id | default('') | length > 0
      register: oci_cleanup_user_by_id
      retries: 3
      ignore_errors: true

    - name: Delete leaked user by name when no ID was captured
      ansible.oci.oci_identity_user:
        state: absent
        domain_id: "{{ oci_identity_api_key_domain_id }}"
        user_name: "{{ oci_identity_api_key_integration_user_name }}"
      when:
        - oci_identity_api_key_domain_id | default('') | length > 0
        - oci_identity_api_key_user_id | default('') | length == 0
        - oci_identity_api_key_integration_user_name | default('') | length > 0
      register: oci_cleanup_user_by_name
      retries: 3
      ignore_errors: true

    - name: Delete temporary identity domain by ID
      ansible.oci.oci_identity_domain:
        state: absent
        domain_id: "{{ oci_identity_api_key_domain_id }}"
      when: oci_identity_api_key_domain_id | default('') | length > 0
      register: oci_cleanup_identity_domain_by_id
      retries: 3
      ignore_errors: true

    - name: Delete temporary identity domain by name when no ID was captured
      ansible.oci.oci_identity_domain:
        state: absent
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_identity_api_key_integration_domain_name }}"
      when: oci_identity_api_key_domain_id | default('') | length == 0
      register: oci_cleanup_identity_domain_by_name
      retries: 3
      ignore_errors: true

    - name: Verify resource cleanup succeeded
      ansible.builtin.assert:
        that:
          - oci_cleanup_api_key_first is not failed
          - oci_cleanup_api_key_second is not failed
          - oci_cleanup_user_by_id is not failed
          - oci_cleanup_user_by_name is not failed
          - oci_cleanup_identity_domain_by_id is not failed
          - oci_cleanup_identity_domain_by_name is not failed
        fail_msg: Resource cleanup failed after 3 retries; see the failed cleanup tasks above.
