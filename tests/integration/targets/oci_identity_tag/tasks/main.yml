---
- name: Validate required OCI integration variables
  ansible.builtin.assert:
    that:
      - oci_integration_compartment_id | default('', true) | length > 0
    fail_msg: >-
      Tag integration tests require oci_integration_compartment_id
      in tests/integration/integration_config.yml.

- name: Set unique temporary tag namespace and tag names
  ansible.builtin.set_fact:
    oci_identity_tag_integration_namespace_name: >-
      {{ oci_identity_tag_integration_namespace_name }}-{{ oci_integration_rpfx }}
    oci_identity_tag_integration_enum_name: >-
      {{ oci_identity_tag_integration_enum_name }}-{{ oci_integration_rpfx }}
    oci_identity_tag_integration_default_name: >-
      {{ oci_identity_tag_integration_default_name }}-{{ oci_integration_rpfx }}
    oci_identity_tag_integration_namespace_id: ""

- name: Create and test tags in a temporary namespace
  module_defaults:
    group/ansible.oci.oci:
      config_file_location: "{{ oci_integration_config_file_location }}"
      config_profile_name: "{{ oci_integration_config_profile_name }}"
  block:
    - name: Create temporary identity tag namespace
      ansible.oci.oci_identity_tag_namespace:
        compartment_id: "{{ oci_integration_compartment_id }}"
        name: "{{ oci_identity_tag_integration_namespace_name }}"
        description: "{{ oci_identity_tag_integration_namespace_description }}"
      register: oci_identity_tag_namespace_create

    - name: Save temporary namespace ID
      ansible.builtin.set_fact:
        oci_identity_tag_integration_namespace_id: "{{ oci_identity_tag_namespace_create.resource.id }}"

    - name: Test tag create, update, validator, lifecycle, and info operations
      block:
        - name: Check create enum tag
          ansible.oci.oci_identity_tag: &enum_create
            tag_namespace_id: "{{ oci_identity_tag_integration_namespace_id }}"
            name: "{{ oci_identity_tag_integration_enum_name }}"
            description: "Initial enum tag"
            validator:
              validator_type: enum
              values: [development, production]
            is_cost_tracking: false
            freeform_tags:
              phase: create
          check_mode: true
          register: oci_tag_create_check

        - name: Verify enum tag create check leaves the tag absent
          ansible.oci.oci_identity_tag_info:
            tag_namespace_id: "{{ oci_identity_tag_integration_namespace_id }}"
            name: "{{ oci_identity_tag_integration_enum_name }}"
          register: oci_tag_create_probe
          failed_when: not oci_tag_create_check.changed or oci_tag_create_probe.tags | length != 0

        - name: Create enum tag
          ansible.oci.oci_identity_tag:
            <<: *enum_create
          register: oci_tag_create

        - name: Verify enum tag create is idempotent
          ansible.oci.oci_identity_tag:
            <<: *enum_create
          register: oci_tag_create_again
          failed_when: oci_tag_create_again.changed

        - name: Check enum tag create idempotency
          ansible.oci.oci_identity_tag:
            <<: *enum_create
          check_mode: true
          register: oci_tag_create_check_again
          failed_when: oci_tag_create_check_again.changed

        - name: Verify created enum tag fields
          ansible.builtin.assert:
            that:
              - oci_tag_create.changed
              - oci_tag_create.resource.name == oci_identity_tag_integration_enum_name
              - oci_tag_create.resource.description == 'Initial enum tag'
              - oci_tag_create.resource.validator.validator_type == 'ENUM'
              - oci_tag_create.resource.validator['values'] | sort == ['development', 'production']
              - oci_tag_create.resource.is_cost_tracking == false
              - oci_tag_create.resource.freeform_tags.phase == 'create'

        - name: Get full tag by name
          ansible.oci.oci_identity_tag_info:
            tag_namespace_id: "{{ oci_identity_tag_integration_namespace_id }}"
            name: "{{ oci_identity_tag_integration_enum_name }}"
          register: oci_tag_get
          failed_when: >-
            oci_tag_get.tags | length != 1 or
            oci_tag_get.tags[0].validator['values'] | sort != ['development', 'production']

        - name: List tags and filter active tags
          ansible.oci.oci_identity_tag_info:
            tag_namespace_id: "{{ oci_identity_tag_integration_namespace_id }}"
            lifecycle_state: active
          register: oci_tag_list_active
          failed_when: oci_tag_list_active.tags | length != 1

        - name: Check enum tag update
          ansible.oci.oci_identity_tag: &enum_update
            tag_namespace_id: "{{ oci_identity_tag_integration_namespace_id }}"
            name: "{{ oci_identity_tag_integration_enum_name }}"
            description: "Updated enum tag"
            validator:
              validator_type: enum
              values: [development, production, staging]
            is_cost_tracking: true
            freeform_tags:
              phase: update
          check_mode: true
          register: oci_tag_update_check

        - name: Verify enum tag update check preserves its fields
          ansible.oci.oci_identity_tag_info:
            tag_namespace_id: "{{ oci_identity_tag_integration_namespace_id }}"
            name: "{{ oci_identity_tag_integration_enum_name }}"
          register: oci_tag_update_probe
          failed_when: >-
            not oci_tag_update_check.changed or
            oci_tag_update_probe.tags[0].description != 'Initial enum tag' or
            oci_tag_update_probe.tags[0].validator['values'] | sort != ['development', 'production'] or
            oci_tag_update_probe.tags[0].is_cost_tracking != false or
            oci_tag_update_probe.tags[0].freeform_tags.phase != 'create'

        - name: Update enum tag fields
          ansible.oci.oci_identity_tag:
            <<: *enum_update
          register: oci_tag_update

        - name: Verify enum tag update result
          ansible.builtin.assert:
            that:
              - oci_tag_update.changed
              - oci_tag_update.resource.description == 'Updated enum tag'
              - oci_tag_update.resource.validator['values'] | sort == ['development', 'production', 'staging']
              - oci_tag_update.resource.is_cost_tracking == true
              - oci_tag_update.resource.freeform_tags.phase == 'update'

        - name: Verify enum tag update is idempotent
          ansible.oci.oci_identity_tag:
            <<: *enum_update
          register: oci_tag_update_again
          failed_when: oci_tag_update_again.changed

        - name: Check enum tag update idempotency
          ansible.oci.oci_identity_tag:
            <<: *enum_update
          check_mode: true
          register: oci_tag_update_check_again
          failed_when: oci_tag_update_check_again.changed

        - name: Check clearing enum validator with default validator
          ansible.oci.oci_identity_tag: &enum_default
            tag_namespace_id: "{{ oci_identity_tag_integration_namespace_id }}"
            name: "{{ oci_identity_tag_integration_enum_name }}"
            validator:
              validator_type: default
          check_mode: true
          register: oci_tag_default_check

        - name: Verify validator clear check preserves enum validator
          ansible.oci.oci_identity_tag_info:
            tag_namespace_id: "{{ oci_identity_tag_integration_namespace_id }}"
            name: "{{ oci_identity_tag_integration_enum_name }}"
          register: oci_tag_default_probe
          failed_when: >-
            not oci_tag_default_check.changed or
            oci_tag_default_probe.tags[0].validator.validator_type != 'ENUM' or
            oci_tag_default_probe.tags[0].description != 'Updated enum tag' or
            oci_tag_default_probe.tags[0].is_cost_tracking != true or
            oci_tag_default_probe.tags[0].freeform_tags.phase != 'update'

        - name: Clear enum validator with default validator
          ansible.oci.oci_identity_tag:
            <<: *enum_default
          register: oci_tag_default

        - name: Verify default validator update is idempotent
          ansible.oci.oci_identity_tag:
            <<: *enum_default
          register: oci_tag_default_again
          failed_when: oci_tag_default_again.changed

        - name: Check default validator update idempotency
          ansible.oci.oci_identity_tag:
            <<: *enum_default
          check_mode: true
          register: oci_tag_default_check_again
          failed_when: oci_tag_default_check_again.changed

        - name: Verify default validator was removed
          ansible.oci.oci_identity_tag_info:
            tag_namespace_id: "{{ oci_identity_tag_integration_namespace_id }}"
            name: "{{ oci_identity_tag_integration_enum_name }}"
          register: oci_tag_default_info
          failed_when: >-
            oci_tag_default_info.tags[0].validator is defined and
            oci_tag_default_info.tags[0].validator is not none and
            oci_tag_default_info.tags[0].validator.validator_type is defined and
            oci_tag_default_info.tags[0].validator.validator_type not in [none, 'DEFAULT']

        - name: Check enum tag retirement
          ansible.oci.oci_identity_tag: &enum_retired
            tag_namespace_id: "{{ oci_identity_tag_integration_namespace_id }}"
            name: "{{ oci_identity_tag_integration_enum_name }}"
            is_retired: true
          check_mode: true
          register: oci_tag_retire_check

        - name: Verify retirement check preserves active state
          ansible.oci.oci_identity_tag_info:
            tag_namespace_id: "{{ oci_identity_tag_integration_namespace_id }}"
            name: "{{ oci_identity_tag_integration_enum_name }}"
          register: oci_tag_retire_probe
          failed_when: >-
            not oci_tag_retire_check.changed or
            oci_tag_retire_probe.tags[0].lifecycle_state != 'ACTIVE' or
            oci_tag_retire_probe.tags[0].is_retired != false

        - name: Retire enum tag
          ansible.oci.oci_identity_tag:
            <<: *enum_retired
          register: oci_tag_retire

        - name: Verify enum tag retirement result
          ansible.builtin.assert:
            that:
              - oci_tag_retire.changed
              - oci_tag_retire.resource.is_retired == true

        - name: Verify enum tag retirement is idempotent
          ansible.oci.oci_identity_tag:
            <<: *enum_retired
          register: oci_tag_retire_again
          failed_when: oci_tag_retire_again.changed

        - name: Check retired tag idempotency
          ansible.oci.oci_identity_tag:
            <<: *enum_retired
          check_mode: true
          register: oci_tag_retire_check_again
          failed_when: oci_tag_retire_check_again.changed

        - name: List tags and filter inactive tags
          ansible.oci.oci_identity_tag_info:
            tag_namespace_id: "{{ oci_identity_tag_integration_namespace_id }}"
            lifecycle_state: inactive
          register: oci_tag_list_inactive
          failed_when: oci_tag_list_inactive.tags | length != 1

        - name: Check enum tag reactivation
          ansible.oci.oci_identity_tag: &enum_active
            tag_namespace_id: "{{ oci_identity_tag_integration_namespace_id }}"
            name: "{{ oci_identity_tag_integration_enum_name }}"
            is_retired: false
          check_mode: true
          register: oci_tag_reactivate_check

        - name: Verify reactivation check preserves retired state
          ansible.oci.oci_identity_tag_info:
            tag_namespace_id: "{{ oci_identity_tag_integration_namespace_id }}"
            name: "{{ oci_identity_tag_integration_enum_name }}"
          register: oci_tag_reactivate_probe
          failed_when: >-
            not oci_tag_reactivate_check.changed or
            oci_tag_reactivate_probe.tags[0].lifecycle_state != 'INACTIVE' or
            oci_tag_reactivate_probe.tags[0].is_retired != true

        - name: Reactivate enum tag
          ansible.oci.oci_identity_tag:
            <<: *enum_active
          register: oci_tag_reactivate

        - name: Verify enum tag reactivation result
          ansible.builtin.assert:
            that:
              - oci_tag_reactivate.changed
              - oci_tag_reactivate.resource.is_retired == false

        - name: Verify enum tag reactivation is idempotent
          ansible.oci.oci_identity_tag:
            <<: *enum_active
          register: oci_tag_reactivate_again
          failed_when: oci_tag_reactivate_again.changed

        - name: Check reactivated tag idempotency
          ansible.oci.oci_identity_tag:
            <<: *enum_active
          check_mode: true
          register: oci_tag_reactivate_check_again
          failed_when: oci_tag_reactivate_check_again.changed

        - name: Verify enum tag is active again
          ansible.oci.oci_identity_tag_info:
            tag_namespace_id: "{{ oci_identity_tag_integration_namespace_id }}"
            name: "{{ oci_identity_tag_integration_enum_name }}"
          register: oci_tag_reactivate_info
          failed_when: oci_tag_reactivate_info.tags[0].lifecycle_state != 'ACTIVE'

        - name: Check create tag with the default validator
          ansible.oci.oci_identity_tag: &default_create
            tag_namespace_id: "{{ oci_identity_tag_integration_namespace_id }}"
            name: "{{ oci_identity_tag_integration_default_name }}"
            description: "Tag with default validator"
            validator:
              validator_type: default
          check_mode: true
          register: oci_tag_default_create_check

        - name: Verify default validator tag create check leaves it absent
          ansible.oci.oci_identity_tag_info:
            tag_namespace_id: "{{ oci_identity_tag_integration_namespace_id }}"
            name: "{{ oci_identity_tag_integration_default_name }}"
          register: oci_tag_default_create_probe
          failed_when: >-
            not oci_tag_default_create_check.changed or
            oci_tag_default_create_probe.tags | length != 0

        - name: Create tag with the default validator
          ansible.oci.oci_identity_tag:
            <<: *default_create
          register: oci_tag_default_create

        - name: Verify default validator tag create result
          ansible.builtin.assert:
            that:
              - oci_tag_default_create.changed
              - oci_tag_default_create.resource.name == oci_identity_tag_integration_default_name
              - >-
                oci_tag_default_create.resource.validator is not defined or
                oci_tag_default_create.resource.validator is none or
                oci_tag_default_create.resource.validator.validator_type is not defined or
                oci_tag_default_create.resource.validator.validator_type in [none, 'DEFAULT']

        - name: Verify default validator tag create is idempotent
          ansible.oci.oci_identity_tag:
            <<: *default_create
          register: oci_tag_default_create_again
          failed_when: oci_tag_default_create_again.changed

        - name: Check default validator tag create idempotency
          ansible.oci.oci_identity_tag:
            <<: *default_create
          check_mode: true
          register: oci_tag_default_create_check_again
          failed_when: oci_tag_default_create_check_again.changed

        - name: Verify list returns summary rows without validators
          ansible.oci.oci_identity_tag_info:
            tag_namespace_id: "{{ oci_identity_tag_integration_namespace_id }}"
          register: oci_tag_list
          failed_when: >-
            oci_tag_list.tags | length != 2 or
            'validator' in oci_tag_list.tags[0] or
            'validator' in oci_tag_list.tags[1]

        - name: Check tag delete with automatic retirement
          ansible.oci.oci_identity_tag: &default_delete
            tag_namespace_id: "{{ oci_identity_tag_integration_namespace_id }}"
            name: "{{ oci_identity_tag_integration_default_name }}"
            state: absent
          check_mode: true
          register: oci_tag_delete_check

        - name: Verify tag delete check keeps tag active
          ansible.oci.oci_identity_tag_info:
            tag_namespace_id: "{{ oci_identity_tag_integration_namespace_id }}"
            name: "{{ oci_identity_tag_integration_default_name }}"
          register: oci_tag_delete_probe
          failed_when: >-
            not oci_tag_delete_check.changed or
            oci_tag_delete_probe.tags | length != 1 or
            oci_tag_delete_probe.tags[0].lifecycle_state != 'ACTIVE' or
            oci_tag_delete_probe.tags[0].is_retired != false

        - name: Delete tag and retire it automatically
          ansible.oci.oci_identity_tag:
            <<: *default_delete
          register: oci_tag_delete

        - name: Verify tag deletion result
          ansible.builtin.assert:
            that:
              - oci_tag_delete.changed

        - name: Verify deleted tag is absent
          ansible.oci.oci_identity_tag_info:
            tag_namespace_id: "{{ oci_identity_tag_integration_namespace_id }}"
            name: "{{ oci_identity_tag_integration_default_name }}"
          register: oci_tag_after_delete
          until: >-
            oci_tag_after_delete.tags | length == 0 or
            oci_tag_after_delete.tags | selectattr('lifecycle_state', 'equalto', 'DELETED') | list | length == oci_tag_after_delete.tags | length
          retries: 12
          delay: 5

        - name: Verify tag delete is idempotent
          ansible.oci.oci_identity_tag:
            <<: *default_delete
          register: oci_tag_delete_again
          failed_when: oci_tag_delete_again.changed

        - name: Check tag delete idempotency
          ansible.oci.oci_identity_tag:
            <<: *default_delete
          check_mode: true
          register: oci_tag_delete_check_again
          failed_when: oci_tag_delete_check_again.changed

        - name: Verify default tag remains absent after delete check mode
          ansible.oci.oci_identity_tag_info:
            tag_namespace_id: "{{ oci_identity_tag_integration_namespace_id }}"
            name: "{{ oci_identity_tag_integration_default_name }}"
          register: oci_tag_delete_final_info
          failed_when: >-
            oci_tag_delete_final_info.tags | length != 0 and
            oci_tag_delete_final_info.tags | selectattr('lifecycle_state', 'equalto', 'DELETED') | list | length != oci_tag_delete_final_info.tags | length

        - name: Check delete enum tag
          ansible.oci.oci_identity_tag: &enum_delete
            tag_namespace_id: "{{ oci_identity_tag_integration_namespace_id }}"
            name: "{{ oci_identity_tag_integration_enum_name }}"
            state: absent
          check_mode: true
          register: oci_tag_enum_delete_check

        - name: Verify enum delete check preserves active tag
          ansible.oci.oci_identity_tag_info:
            tag_namespace_id: "{{ oci_identity_tag_integration_namespace_id }}"
            name: "{{ oci_identity_tag_integration_enum_name }}"
          register: oci_tag_enum_delete_probe
          failed_when: >-
            not oci_tag_enum_delete_check.changed or
            oci_tag_enum_delete_probe.tags | length != 1 or
            oci_tag_enum_delete_probe.tags[0].lifecycle_state != 'ACTIVE' or
            oci_tag_enum_delete_probe.tags[0].is_retired != false

        - name: Delete enum tag and retire it automatically
          ansible.oci.oci_identity_tag:
            <<: *enum_delete
          register: oci_tag_enum_delete

        - name: Verify enum tag deletion result
          ansible.builtin.assert:
            that:
              - oci_tag_enum_delete.changed

        - name: Wait until deleted enum tag is absent
          ansible.oci.oci_identity_tag_info:
            tag_namespace_id: "{{ oci_identity_tag_integration_namespace_id }}"
            name: "{{ oci_identity_tag_integration_enum_name }}"
          register: oci_tag_enum_after_delete
          until: >-
            oci_tag_enum_after_delete.tags | length == 0 or
            oci_tag_enum_after_delete.tags | selectattr('lifecycle_state', 'equalto', 'DELETED') | list | length == oci_tag_enum_after_delete.tags | length
          retries: 12
          delay: 5

        - name: Verify enum tag delete is idempotent
          ansible.oci.oci_identity_tag:
            <<: *enum_delete
          register: oci_tag_enum_delete_again
          failed_when: oci_tag_enum_delete_again.changed

        - name: Check enum tag delete idempotency
          ansible.oci.oci_identity_tag:
            <<: *enum_delete
          check_mode: true
          register: oci_tag_enum_delete_check_again
          failed_when: oci_tag_enum_delete_check_again.changed

        - name: Verify enum tag remains absent after delete check mode
          ansible.oci.oci_identity_tag_info:
            tag_namespace_id: "{{ oci_identity_tag_integration_namespace_id }}"
            name: "{{ oci_identity_tag_integration_enum_name }}"
          register: oci_tag_enum_delete_final_info
          failed_when: >-
            oci_tag_enum_delete_final_info.tags | length != 0 and
            oci_tag_enum_delete_final_info.tags | selectattr('lifecycle_state', 'equalto', 'DELETED') | list | length != oci_tag_enum_delete_final_info.tags | length
  rescue:
    - name: Preserve the integration test failure
      ansible.builtin.fail:
        msg: >-
          Tag integration test failed:
          {{ ansible_failed_result.msg | default(ansible_failed_result) }}
  always:
    - name: Clean up tags and temporary namespace
      ansible.builtin.include_tasks: cleanup.yml
