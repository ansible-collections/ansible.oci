---
name: Changelog

on:
  pull_request:
    types:
      - opened
      - reopened
      - labeled
      - unlabeled
      - synchronize
    branches:
      - main
      - stable-*

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changelog:
    uses: eco-ansible-content/collections-standards/.github/workflows/changelog.yml@5180c4fa6396ddaedd7b5c3a5add16472557816a # 0.0.1
