---
name: Certification

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certification:
    uses: eco-ansible-content/collections-standards/.github/workflows/certification.yml@262daf453f9213ba9761dfa54624be8b9ed41555 # 0.0.2
