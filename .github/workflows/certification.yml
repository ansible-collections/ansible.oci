---
name: Certification

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  certification:
    uses: eco-ansible-content/collections-standards/.github/workflows/certification.yml@5180c4fa6396ddaedd7b5c3a5add16472557816a # 0.0.1
