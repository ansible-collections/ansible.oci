---
name: Units
on:
  push:
    branches:
      - main
      - stable-*
  pull_request:
  schedule:
    - cron: '0 6 * * *'

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.number || github.sha
    }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-galaxy:
    uses: ansible/ansible-content-actions/.github/workflows/unit.yaml@c105d6b8b887a36219224da17adc7518aab2401d # main
    with:
      extra_matrix_entries: >-
        [{"name":"unit-py3.11-2.16","python":"3.11"},
         {"name":"unit-py3.12-2.16","python":"3.12"},
         {"name":"unit-py3.11-2.18","python":"3.11"},
         {"name":"unit-py3.12-2.18","python":"3.12"},
         {"name":"unit-py3.13-2.18","python":"3.13"}]

  unit-check:
    if: always()
    needs:
      - unit-galaxy
    runs-on: ubuntu-latest
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          jobs: ${{ toJSON(needs) }}
