---
name: Integration PR

on:
  pull_request_target:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - 'plugins/**'
      - 'requirements.txt'
      - 'tests/integration/**'
      - 'Makefile'

concurrency:
  group: >-
    ${{ github.workflow }}-${{
      github.event.pull_request.number || github.sha
    }}
  cancel-in-progress: true

env:
  INTEGRATION_ANSIBLE_REF: stable-2.18
  INTEGRATION_PYTHON_VERSION: '3.12'

jobs:
  determine-integration-targets:
    name: Determine integration targets
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      run-integration: ${{ steps.determine.outputs.run-integration }}
      targets: ${{ steps.determine.outputs.targets }}
    steps:
      - name: Checkout base ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Checkout PR for target selection
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: ansible_collections/ansible/oci
          fetch-depth: 0
          persist-credentials: false
          allow-unsafe-pr-checkout: true

      - name: Set up Python ${{ env.INTEGRATION_PYTHON_VERSION }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.INTEGRATION_PYTHON_VERSION }}

      - name: Install Ansible ${{ env.INTEGRATION_ANSIBLE_REF }}
        run: python3 -m pip install "https://github.com/ansible/ansible/archive/${INTEGRATION_ANSIBLE_REF}.tar.gz" --disable-pip-version-check

      - name: Determine integration targets
        id: determine
        uses: ./.github/actions/determine-integration-targets
        with:
          collection-path: ${{ github.workspace }}/ansible_collections/ansible/oci
          base-sha: ${{ github.event.pull_request.base.sha }}

  integration-pr:
    name: Integration PR
    if: ${{ needs.determine-integration-targets.outputs.run-integration == 'true' }}
    needs:
      - determine-integration-targets
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
    environment:
      name: oci-integration
    env:
      OCI_TEST_COMPARTMENT_ID: ${{ secrets.OCI_TEST_COMPARTMENT_ID }}
      OCI_TENANCY_ID: ${{ secrets.OCI_TENANCY_ID }}
      OCI_USER_ID: ${{ secrets.OCI_USER_ID }}
      OCI_REGION: ${{ vars.OCI_REGION }}
      OCI_USER_FINGERPRINT: ${{ secrets.OCI_USER_FINGERPRINT }}
      OCI_USER_KEY_CONTENT: ${{ secrets.OCI_USER_KEY_CONTENT }}
      OCI_CONFIG_PROFILE: ${{ vars.OCI_CONFIG_PROFILE }}
    steps:
      - name: Validate selected integration targets
        id: validate-targets
        env:
          SELECTED_TARGETS: ${{ needs.determine-integration-targets.outputs.targets }}
        shell: bash
        run: |
          target_pattern='^[a-zA-Z0-9_][a-zA-Z0-9_.-]*( [a-zA-Z0-9_][a-zA-Z0-9_.-]*)*$'
          if [[ ! "${SELECTED_TARGETS}" =~ ${target_pattern} ]]; then
            echo "Invalid integration target list." >&2
            exit 1
          fi
          printf 'targets=%s\n' "${SELECTED_TARGETS}" >> "${GITHUB_OUTPUT}"

      - name: Checkout base ref
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Run OCI integration workflow
        uses: ./.github/actions/run-oci-integration
        with:
          ansible-ref: ${{ env.INTEGRATION_ANSIBLE_REF }}
          integration-targets: ${{ steps.validate-targets.outputs.targets }}
          python-version: ${{ env.INTEGRATION_PYTHON_VERSION }}

  integration-pr-check:
    if: always()
    needs:
      - determine-integration-targets
      - integration-pr
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@b5b5b37504aa4183270bd3d855c52a67f212be35 # release/v1
        with:
          allowed-skips: integration-pr
          jobs: ${{ toJSON(needs) }}
