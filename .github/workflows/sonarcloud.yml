---
name: SonarCloud

on:
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows:
      - Units
    types:
      - completed

permissions:
  contents: read # check out the analysed commit
  actions: read # download artifacts from the triggering run
  pull-requests: read # look up the pull request to decorate

jobs:
  sonarcloud:
    uses: eco-ansible-content/collections-standards/.github/workflows/sonarcloud.yml@262daf453f9213ba9761dfa54624be8b9ed41555 # 0.0.2
    secrets:
      SONAR_TOKEN: ${{ secrets.ANSIBLE_COLLECTIONS_ORG_SONAR_TOKEN_CICD_BOT }}
