## SonarCloud analysis
#
# FLOW: Units completes → workflow_run triggers this workflow on the default
# branch (so SONAR_TOKEN is available) → run unit tests with coverage → scan.
#
# Coverage XML is produced in this job so it does not need an artifact handoff.

---
name: SonarCloud

on:
  workflow_run:
    workflows:
      - Units
    types:
      - completed

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  sonarcloud:
    name: SonarCloud
    runs-on: ubuntu-latest
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event != 'schedule'

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          show-progress: false
          allow-unsafe-pr-checkout: true

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install test and coverage dependencies
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install ansible-core pytest pytest-cov pytest-ansible-units
          python3 -m pip install -r requirements.txt

      - name: Get PR number and info
        if: github.event.workflow_run.event == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PR_NUMBER=$(gh pr list --head "$HEAD_BRANCH" --repo "$REPO" --json number -q '.[0].number')
          echo "PR_NUMBER=${PR_NUMBER}" >> "$GITHUB_ENV"
          if [[ -n "${PR_NUMBER}" ]]; then
            PR_DATA=$(gh api "repos/${REPO}/pulls/${PR_NUMBER}")
            echo "PR_BASE=$(echo "$PR_DATA" | jq -r '.base.ref')" >> "$GITHUB_ENV"
            echo "PR_HEAD=$(echo "$PR_DATA" | jq -r '.head.ref')" >> "$GITHUB_ENV"
          fi

      - name: Prepare SonarCloud args
        env:
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_TYPE: ${{ github.event.workflow_run.event }}
        run: |
          SONAR_ARGS="-Dsonar.scm.revision=\"${COMMIT_SHA}\""
          SONAR_ARGS="${SONAR_ARGS} -Dsonar.python.coverage.reportPaths=coverage.xml"
          if [[ "${EVENT_TYPE}" == "pull_request" && -n "${PR_NUMBER:-}" ]]; then
            SONAR_ARGS="${SONAR_ARGS} -Dsonar.pullrequest.key=${PR_NUMBER}"
            SONAR_ARGS="${SONAR_ARGS} -Dsonar.pullrequest.branch=${PR_HEAD}"
            SONAR_ARGS="${SONAR_ARGS} -Dsonar.pullrequest.base=${PR_BASE}"
          fi
          echo "SONAR_ARGS=${SONAR_ARGS}" >> "$GITHUB_ENV"

      - name: Run unit tests with coverage
        run: pytest tests/unit -v --cov-report xml --cov=./

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f
        env:
          SONAR_TOKEN: ${{ secrets.ANSIBLE_COLLECTIONS_ORG_SONAR_TOKEN_CICD_BOT }}
        with:
          args: ${{ env.SONAR_ARGS }}
